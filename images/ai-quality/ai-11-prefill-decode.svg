<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Prefill 与 Decode 的计算、缓存和指标</title>
  <desc id="desc">Prefill 并行处理完整输入并建立 KV cache，Decode 依赖已有缓存逐步生成后续 token；时间线区分排队、首 token、token 间延迟和端到端延迟。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <style>
      .base { font-family: Arial, "Noto Sans SC", "Microsoft YaHei", sans-serif; }
      .title { font-size: 32px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 17px; fill: #475569; }
      .panel-title { font-size: 23px; font-weight: 700; fill: #0f172a; }
      .label { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .text { font-size: 16px; fill: #334155; }
      .small { font-size: 14px; fill: #475569; }
      .token { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .metric { font-size: 16px; font-weight: 700; fill: #ffffff; }
      .arrow { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1280" height="800" fill="#f8fafc"/>
  <rect x="0" y="0" width="1280" height="8" fill="#0f766e"/>

  <g class="base">
    <text x="56" y="58" class="title">Prefill 与 Decode：计算模式不同，测试指标也不同</text>
    <text x="56" y="88" class="subtitle">常见自回归基线；speculative decoding、稀疏注意力或分离式服务会增加其他路径</text>

    <g transform="translate(56,122)">
      <rect width="520" height="320" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
      <rect width="520" height="10" rx="6" fill="#2563eb"/>
      <text x="22" y="48" class="panel-title">Prefill：完整 Prompt 并行处理</text>
      <text x="22" y="78" class="text">目标：形成输入各位置的隐藏状态和每层 KV cache</text>

      <text x="22" y="116" class="label">输入 token</text>
      <g transform="translate(118,94)">
        <rect x="0" y="0" width="56" height="42" rx="4" fill="#dbeafe" stroke="#60a5fa"/>
        <rect x="66" y="0" width="56" height="42" rx="4" fill="#dbeafe" stroke="#60a5fa"/>
        <rect x="132" y="0" width="56" height="42" rx="4" fill="#dbeafe" stroke="#60a5fa"/>
        <rect x="198" y="0" width="56" height="42" rx="4" fill="#dbeafe" stroke="#60a5fa"/>
        <rect x="264" y="0" width="56" height="42" rx="4" fill="#dbeafe" stroke="#60a5fa"/>
        <text x="28" y="27" class="token" text-anchor="middle">T1</text>
        <text x="94" y="27" class="token" text-anchor="middle">T2</text>
        <text x="160" y="27" class="token" text-anchor="middle">T3</text>
        <text x="226" y="27" class="token" text-anchor="middle">...</text>
        <text x="292" y="27" class="token" text-anchor="middle">Tn</text>
      </g>

      <path d="M260 145 L260 171" class="arrow"/>
      <rect x="106" y="178" width="308" height="62" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
      <text x="260" y="204" class="label" text-anchor="middle">Transformer × L</text>
      <text x="260" y="228" class="small" text-anchor="middle">矩阵计算高度并行，建立各层 K / V</text>

      <path d="M260 242 L260 266" class="arrow"/>
      <rect x="40" y="272" width="324" height="46" rx="5" fill="#bfdbfe" stroke="#2563eb"/>
      <text x="202" y="301" class="label" text-anchor="middle">KV Cache：T1 ... Tn</text>
      <rect x="378" y="272" width="110" height="46" rx="5" fill="#0f766e"/>
      <text x="433" y="301" class="metric" text-anchor="middle">首 token</text>
    </g>

    <path d="M590 272 L620 272" class="arrow"/>

    <g transform="translate(624,122)">
      <rect width="600" height="320" rx="6" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
      <rect width="600" height="10" rx="6" fill="#0f766e"/>
      <text x="22" y="48" class="panel-title">Decode：依赖历史缓存逐步生成</text>
      <text x="22" y="78" class="text">目标：每步追加当前 K / V，并产生下一个 token</text>

      <g transform="translate(24,104)">
        <rect x="0" y="0" width="94" height="48" rx="5" fill="#ccfbf1" stroke="#14b8a6"/>
        <text x="47" y="29" class="token" text-anchor="middle">首 token</text>
        <path d="M102 24 L130 24" class="arrow"/>
        <rect x="138" y="0" width="94" height="48" rx="5" fill="#ccfbf1" stroke="#14b8a6"/>
        <text x="185" y="29" class="token" text-anchor="middle">token 2</text>
        <path d="M240 24 L268 24" class="arrow"/>
        <rect x="276" y="0" width="94" height="48" rx="5" fill="#ccfbf1" stroke="#14b8a6"/>
        <text x="323" y="29" class="token" text-anchor="middle">token 3</text>
        <path d="M378 24 L406 24" class="arrow"/>
        <rect x="414" y="0" width="94" height="48" rx="5" fill="#ccfbf1" stroke="#14b8a6"/>
        <text x="461" y="29" class="token" text-anchor="middle">...</text>
      </g>

      <text x="24" y="190" class="label">每一步</text>
      <text x="104" y="190" class="text">新 token -> Embedding -> Transformer -> Logits -> 选择</text>

      <text x="24" y="230" class="label">缓存增长</text>
      <rect x="116" y="210" width="130" height="26" rx="3" fill="#99f6e4"/>
      <rect x="250" y="210" width="62" height="26" rx="3" fill="#5eead4"/>
      <rect x="316" y="210" width="62" height="26" rx="3" fill="#2dd4bf"/>
      <rect x="382" y="210" width="62" height="26" rx="3" fill="#14b8a6"/>
      <text x="180" y="228" class="small" text-anchor="middle">Prompt KV</text>
      <text x="281" y="228" class="small" text-anchor="middle">+1</text>
      <text x="347" y="228" class="small" text-anchor="middle">+1</text>
      <text x="413" y="228" class="small" text-anchor="middle">+1</text>

      <rect x="22" y="256" width="556" height="28" rx="4" fill="#ffffff" stroke="#99f6e4"/>
      <text x="300" y="276" class="small" text-anchor="middle">时间维度有依赖；服务可跨请求批处理，优化实现也可能验证多个候选 token</text>
    </g>

    <text x="56" y="470" class="panel-title">端到端时间线与指标口径</text>
    <line x1="84" y1="526" x2="1196" y2="526" stroke="#cbd5e1" stroke-width="8"/>
    <rect x="84" y="508" width="150" height="36" rx="4" fill="#64748b"/>
    <rect x="234" y="508" width="180" height="36" rx="4" fill="#d97706"/>
    <rect x="414" y="508" width="270" height="36" rx="4" fill="#2563eb"/>
    <rect x="684" y="508" width="420" height="36" rx="4" fill="#0f766e"/>
    <rect x="1104" y="508" width="92" height="36" rx="4" fill="#7c3aed"/>

    <text x="159" y="532" class="metric" text-anchor="middle">网关/编排</text>
    <text x="324" y="532" class="metric" text-anchor="middle">排队</text>
    <text x="549" y="532" class="metric" text-anchor="middle">Prefill</text>
    <text x="894" y="532" class="metric" text-anchor="middle">Decode：逐步输出</text>
    <text x="1150" y="532" class="metric" text-anchor="middle">收尾</text>

    <line x1="84" y1="558" x2="684" y2="558" stroke="#2563eb" stroke-width="3"/>
    <line x1="84" y1="551" x2="84" y2="565" stroke="#2563eb" stroke-width="3"/>
    <line x1="684" y1="551" x2="684" y2="565" stroke="#2563eb" stroke-width="3"/>
    <text x="384" y="586" class="label" text-anchor="middle">TTFT：请求发出到首个有效输出</text>

    <line x1="84" y1="608" x2="1196" y2="608" stroke="#7c3aed" stroke-width="3"/>
    <line x1="84" y1="601" x2="84" y2="615" stroke="#7c3aed" stroke-width="3"/>
    <line x1="1196" y1="601" x2="1196" y2="615" stroke="#7c3aed" stroke-width="3"/>
    <text x="640" y="636" class="label" text-anchor="middle">E2E：请求发出到最终结果完成</text>

    <g transform="translate(56,670)">
      <rect x="0" y="0" width="270" height="82" rx="6" fill="#ffffff" stroke="#93c5fd"/>
      <text x="16" y="30" class="label">Prefill 观察</text>
      <text x="16" y="57" class="text">输入长度、缓存命中、TTFT</text>

      <rect x="290" y="0" width="270" height="82" rx="6" fill="#ffffff" stroke="#5eead4"/>
      <text x="306" y="30" class="label">Decode 观察</text>
      <text x="306" y="57" class="text">ITL、TPOT、输出 tokens/s</text>

      <rect x="580" y="0" width="270" height="82" rx="6" fill="#ffffff" stroke="#fcd34d"/>
      <text x="596" y="30" class="label">调度观察</text>
      <text x="596" y="57" class="text">队列、并发、长短请求干扰</text>

      <rect x="870" y="0" width="298" height="82" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
      <text x="886" y="30" class="label">联合门禁</text>
      <text x="886" y="57" class="text">质量 + 延迟 + 错误率 = Goodput</text>
    </g>
  </g>
</svg>
