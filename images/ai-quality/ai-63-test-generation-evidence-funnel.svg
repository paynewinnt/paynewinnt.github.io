<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 生成测试从风险需求到正式资产的证据漏斗</title>
  <desc id="desc">展示风险需求经可达性审查形成覆盖分母，候选测试经过结构行为语义去重、可执行性、断言敏感度、变异测试、数据独立性、稳定性与维护预算，先进入观察期，再晋级为正式资产或被隔离淘汰。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#354f5c"/></marker>
    <style>
      .bg{fill:#f5f7f8}.title{font:700 30px Arial,"PingFang SC",sans-serif;fill:#17272f}.sub{font:15px Arial,"PingFang SC",sans-serif;fill:#52646d}.h{font:700 17px Arial,"PingFang SC",sans-serif;fill:#1d2f38}.t{font:14px Arial,"PingFang SC",sans-serif;fill:#34464f}.tiny{font:13px Arial,"PingFang SC",sans-serif;fill:#596b74}.flow{fill:none;stroke:#354f5c;stroke-width:2.6;marker-end:url(#arrow)}.reject{fill:none;stroke:#c94e5b;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="48" y="50">AI 生成测试：数量先过漏斗，证据合格后才成为资产</text>
  <text class="sub" x="48" y="79">每层都保存输入分母、通过、拒绝与未知；删除重复候选不会减少已经确认的风险需求分母</text>

  <g aria-label="测试资产晋级漏斗">
    <polygon points="64,122 904,122 858,202 110,202" fill="#e6f3f1" stroke="#18847b" stroke-width="2"/>
    <text class="h" x="136" y="154">1. 风险需求与可达性登记</text>
    <text class="t" x="136" y="181">业务不变量、威胁、边界、oracle、风险权重；可达 / 已证不可达 / UNKNOWN 分列</text>

    <polygon points="110,220 858,220 812,300 156,300" fill="#fff3d8" stroke="#d18c17" stroke-width="2"/>
    <text class="h" x="182" y="252">2. 生成候选并冻结来源</text>
    <text class="t" x="182" y="279">候选源码、需求 ID、数据来源、生成配置、仓库与依赖摘要；生成数量只表示尝试量</text>

    <polygon points="156,318 812,318 766,398 202,398" fill="#f2ecf6" stroke="#785692" stroke-width="2"/>
    <text class="h" x="228" y="350">3. 三层去重与独立证据</text>
    <text class="t" x="228" y="377">结构指纹 + 行为轨迹 + 语义合同；同模板换数据、改名或换表面语法不能重复记覆盖</text>

    <polygon points="202,416 766,416 720,496 248,496" fill="#e8eef7" stroke="#4b709d" stroke-width="2"/>
    <text class="h" x="274" y="448">4. 质量验证</text>
    <text class="t" x="274" y="475">断言可失败、相关故障注入、变异杀伤、数据隔离、重复运行、维护预算</text>

    <polygon points="248,514 720,514 674,594 294,594" fill="#eaf3df" stroke="#638b42" stroke-width="2"/>
    <text class="h" x="320" y="546">5. 观察期与正式资产</text>
    <text class="t" x="320" y="573">owner、寿命、失败信号、变更触发、淘汰条件；晋级后仍可隔离、修复或退役</text>
  </g>

  <g aria-label="拒绝和未知去向">
    <rect x="948" y="122" width="282" height="112" rx="7" fill="#fde7e9" stroke="#c94e5b" stroke-width="2"/>
    <text class="h" x="968" y="154">REJECT：无效或重复</text>
    <text class="t" x="968" y="183">不可执行、空断言、越权数据</text>
    <text class="t" x="968" y="208">三层重复、错误 oracle</text>

    <rect x="948" y="264" width="282" height="112" rx="7" fill="#eef1f3" stroke="#667781" stroke-width="2"/>
    <text class="h" x="968" y="296">UNKNOWN：证据不足</text>
    <text class="t" x="968" y="325">可达性未证、环境未运行</text>
    <text class="t" x="968" y="350">变异超时、稳定性样本不足</text>

    <rect x="948" y="406" width="282" height="112" rx="7" fill="#fff4dc" stroke="#d18c17" stroke-width="2"/>
    <text class="h" x="968" y="438">QUARANTINE：信号有害</text>
    <text class="t" x="968" y="467">flaky、共享数据、维护超支</text>
    <text class="t" x="968" y="492">先移出门禁，再定位和修复</text>

    <rect x="948" y="548" width="282" height="92" rx="7" fill="#edf2f8" stroke="#4b709d" stroke-width="2"/>
    <text class="h" x="968" y="580">RETIRE：风险或接口已退出</text>
    <text class="t" x="968" y="609">保留决定、替代关系与历史证据</text>
  </g>

  <path class="reject" d="M836 260 C908 260 902 178 940 178"/>
  <path class="reject" d="M790 358 C914 358 896 320 940 320"/>
  <path class="reject" d="M744 456 C906 456 900 462 940 462"/>
  <path class="flow" d="M674 554 C830 554 844 594 940 594"/>
  <text class="tiny" x="64" y="659">覆盖声明 = 已有合格正式资产支撑的风险需求 / 经批准的可达风险需求；候选、重复和 UNKNOWN 不能进入分子</text>
  <text class="tiny" x="387" y="692">构造流程：正式资产仍需生产缺陷、需求变更和维护成本反馈</text>
</svg>
