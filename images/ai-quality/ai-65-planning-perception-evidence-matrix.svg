<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">UI Agent 规划感知与执行证据矩阵</title>
  <desc id="desc">用矩阵比较 DOM、无障碍树、截图视觉、浏览上下文、网络和业务事实在定位、许可、执行和判定阶段的作用，强调多源一致性和未知状态。</desc>
  <defs>
    <style>
      .bg{fill:#f5f7f8}.title{font:700 30px Arial,"PingFang SC",sans-serif;fill:#17262f}.sub{font:15px Arial,"PingFang SC",sans-serif;fill:#53646d}.h{font:700 16px Arial,"PingFang SC",sans-serif;fill:#1d2d35}.t{font:13px Arial,"PingFang SC",sans-serif;fill:#34454e}.tiny{font:12px Arial,"PingFang SC",sans-serif;fill:#596a73}.grid{stroke:#bac8cf;stroke-width:1.5}.strong{fill:#dff1eb}.support{fill:#e8eef8}.limited{fill:#fff4d8}.none{fill:#f0f2f3}.danger{fill:#fdebed}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="50" y="52">多源不是“多投一票”，而是为不同判断提供独立证据</text>
  <text class="sub" x="50" y="80">定位可以融合；动作许可与业务 Oracle 仍需各自的权威输入，来源冲突时进入 UNKNOWN 或停止</text>

  <g aria-label="证据矩阵">
    <rect x="48" y="122" width="1184" height="438" rx="8" fill="#fff" stroke="#bac8cf" stroke-width="2"/>
    <rect x="48" y="122" width="250" height="64" class="none grid"/>
    <text class="h" x="70" y="160">来源 / 判断</text>
    <rect x="298" y="122" width="180" height="64" class="support grid"/><text class="h" x="332" y="160">目标语义</text>
    <rect x="478" y="122" width="180" height="64" class="support grid"/><text class="h" x="512" y="160">屏幕坐标</text>
    <rect x="658" y="122" width="180" height="64" class="limited grid"/><text class="h" x="692" y="160">动作许可</text>
    <rect x="838" y="122" width="180" height="64" class="strong grid"/><text class="h" x="872" y="160">结果判定</text>
    <rect x="1018" y="122" width="214" height="64" class="danger grid"/><text class="h" x="1052" y="160">主要失效</text>

    <rect x="48" y="186" width="250" height="62" class="none grid"/><text class="h" x="70" y="223">DOM / WebDriver 元素</text>
    <rect x="298" y="186" width="180" height="62" class="strong grid"/><text class="t" x="318" y="223">属性、文本、关系</text>
    <rect x="478" y="186" width="180" height="62" class="support grid"/><text class="t" x="498" y="223">元素矩形与滚动</text>
    <rect x="658" y="186" width="180" height="62" class="limited grid"/><text class="t" x="678" y="223">可交互性输入之一</text>
    <rect x="838" y="186" width="180" height="62" class="limited grid"/><text class="t" x="858" y="223">只证 UI 状态</text>
    <rect x="1018" y="186" width="214" height="62" class="danger grid"/><text class="t" x="1038" y="223">重渲染、Shadow DOM</text>

    <rect x="48" y="248" width="250" height="62" class="none grid"/><text class="h" x="70" y="285">无障碍树 / ARIA</text>
    <rect x="298" y="248" width="180" height="62" class="strong grid"/><text class="t" x="318" y="285">role · name · state</text>
    <rect x="478" y="248" width="180" height="62" class="limited grid"/><text class="t" x="498" y="285">映射后边界框</text>
    <rect x="658" y="248" width="180" height="62" class="support grid"/><text class="t" x="678" y="285">禁用、展开等状态</text>
    <rect x="838" y="248" width="180" height="62" class="limited grid"/><text class="t" x="858" y="285">不等于业务成功</text>
    <rect x="1018" y="248" width="214" height="62" class="danger grid"/><text class="t" x="1038" y="285">错误或缺失语义</text>

    <rect x="48" y="310" width="250" height="62" class="none grid"/><text class="h" x="70" y="347">截图 / 视觉候选</text>
    <rect x="298" y="310" width="180" height="62" class="support grid"/><text class="t" x="318" y="347">可见文本与图标</text>
    <rect x="478" y="310" width="180" height="62" class="strong grid"/><text class="t" x="498" y="347">像素区域与遮挡</text>
    <rect x="658" y="310" width="180" height="62" class="limited grid"/><text class="t" x="678" y="347">不可单独授权</text>
    <rect x="838" y="310" width="180" height="62" class="limited grid"/><text class="t" x="858" y="347">只证可见外观</text>
    <rect x="1018" y="310" width="214" height="62" class="danger grid"/><text class="t" x="1038" y="347">缩放、主题、相似图标</text>

    <rect x="48" y="372" width="250" height="62" class="none grid"/><text class="h" x="70" y="409">窗口 / Frame / 视口</text>
    <rect x="298" y="372" width="180" height="62" class="limited grid"/><text class="t" x="318" y="409">限定搜索上下文</text>
    <rect x="478" y="372" width="180" height="62" class="strong grid"/><text class="t" x="498" y="409">坐标系与像素比</text>
    <rect x="658" y="372" width="180" height="62" class="strong grid"/><text class="t" x="678" y="409">域名与上下文绑定</text>
    <rect x="838" y="372" width="180" height="62" class="limited grid"/><text class="t" x="858" y="409">确认动作发生位置</text>
    <rect x="1018" y="372" width="214" height="62" class="danger grid"/><text class="t" x="1038" y="409">弹窗、跨窗、滚动漂移</text>

    <rect x="48" y="434" width="250" height="62" class="none grid"/><text class="h" x="70" y="471">网络事件 / BiDi</text>
    <rect x="298" y="434" width="180" height="62" class="limited grid"/><text class="t" x="318" y="471">辅助识别加载状态</text>
    <rect x="478" y="434" width="180" height="62" class="none grid"/><text class="t" x="498" y="471">不提供像素坐标</text>
    <rect x="658" y="434" width="180" height="62" class="support grid"/><text class="t" x="678" y="471">请求范围与目标域</text>
    <rect x="838" y="434" width="180" height="62" class="support grid"/><text class="t" x="858" y="471">请求/响应证据</text>
    <rect x="1018" y="434" width="214" height="62" class="danger grid"/><text class="t" x="1038" y="471">缓存、重试、异步提交</text>

    <rect x="48" y="496" width="250" height="64" class="none grid"/><text class="h" x="70" y="534">业务事实源 / Oracle</text>
    <rect x="298" y="496" width="180" height="64" class="none grid"/><text class="t" x="318" y="534">不承担定位</text>
    <rect x="478" y="496" width="180" height="64" class="none grid"/><text class="t" x="498" y="534">不承担坐标</text>
    <rect x="658" y="496" width="180" height="64" class="support grid"/><text class="t" x="678" y="534">高风险前置核对</text>
    <rect x="838" y="496" width="180" height="64" class="strong grid"/><text class="t" x="858" y="534">提交与后置条件真值</text>
    <rect x="1018" y="496" width="214" height="64" class="danger grid"/><text class="t" x="1038" y="534">延迟、权限、不可观测</text>
  </g>

  <g aria-label="判定图例">
    <rect x="48" y="604" width="1184" height="62" rx="8" fill="#fff" stroke="#bac8cf"/>
    <rect x="74" y="623" width="22" height="22" class="strong"/><text class="tiny" x="106" y="640">主要证据</text>
    <rect x="210" y="623" width="22" height="22" class="support"/><text class="tiny" x="242" y="640">支持证据</text>
    <rect x="346" y="623" width="22" height="22" class="limited"/><text class="tiny" x="378" y="640">有限作用</text>
    <rect x="482" y="623" width="22" height="22" class="none"/><text class="tiny" x="514" y="640">不承担该判断</text>
    <rect x="650" y="623" width="22" height="22" class="danger"/><text class="tiny" x="682" y="640">需故障注入验证</text>
    <text class="tiny" x="904" y="640">任一权威来源缺失：UNKNOWN / STOP</text>
  </g>
</svg>
