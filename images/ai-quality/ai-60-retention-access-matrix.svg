<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 审计日志保留、访问与证据导出决策矩阵</title>
  <desc id="desc">矩阵展示热存、冷存、法律冻结、待删除和已删除状态下，普通查询、调查访问、紧急访问和证据导出的控制要求及禁止条件。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0 L0 6 L9 3 Z" fill="#40535f"/>
    </marker>
    <style>
      .bg{fill:#f7f8f8}.title{font:700 29px Arial,"PingFang SC",sans-serif;fill:#18272f}.sub{font:15px Arial,"PingFang SC",sans-serif;fill:#53656f}.head{font:700 16px Arial,"PingFang SC",sans-serif;fill:#fff}.row{font:700 16px Arial,"PingFang SC",sans-serif;fill:#21313a}.cell{font:14px Arial,"PingFang SC",sans-serif;fill:#2d3c44}.small{font:13px Arial,"PingFang SC",sans-serif;fill:#566771}.grid{stroke:#c8d2d7;stroke-width:1}.arrow{fill:none;stroke:#40535f;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="46" y="50">保留状态 × 访问路径：控制不能相互抵消</text>
  <text class="sub" x="46" y="78">法律冻结只暂停已批准范围的删除；break-glass 只缩短审批路径，不扩大数据目的与导出范围</text>

  <g aria-label="决策矩阵">
    <rect x="46" y="112" width="1188" height="420" rx="7" fill="#fff" stroke="#aebbc2" stroke-width="2"/>
    <rect x="46" y="112" width="1188" height="58" rx="7" fill="#314b5b"/>
    <line class="grid" x1="238" y1="112" x2="238" y2="532"/>
    <line class="grid" x1="486" y1="112" x2="486" y2="532"/>
    <line class="grid" x1="734" y1="112" x2="734" y2="532"/>
    <line class="grid" x1="982" y1="112" x2="982" y2="532"/>
    <text class="head" x="95" y="148">保留状态</text>
    <text class="head" x="292" y="148">普通查询</text>
    <text class="head" x="535" y="148">调查访问</text>
    <text class="head" x="773" y="148">Break-glass</text>
    <text class="head" x="1045" y="148">证据导出</text>

    <rect x="46" y="170" width="1188" height="72" fill="#f0f7f6"/>
    <rect x="46" y="242" width="1188" height="72" fill="#fff9e9"/>
    <rect x="46" y="314" width="1188" height="72" fill="#f3eef7"/>
    <rect x="46" y="386" width="1188" height="72" fill="#fff0f1"/>
    <rect x="46" y="458" width="1188" height="74" fill="#eef1f3"/>
    <line class="grid" x1="46" y1="242" x2="1234" y2="242"/>
    <line class="grid" x1="46" y1="314" x2="1234" y2="314"/>
    <line class="grid" x1="46" y1="386" x2="1234" y2="386"/>
    <line class="grid" x1="46" y1="458" x2="1234" y2="458"/>

    <text class="row" x="68" y="201">HOT 热存</text><text class="small" x="68" y="224">活跃检索窗口</text>
    <text class="cell" x="258" y="201">角色 + 目的 + 字段掩码</text><text class="cell" x="258" y="222">查询也写审计事件</text>
    <text class="cell" x="506" y="201">案件号 + 审批 + 最小范围</text><text class="cell" x="506" y="222">高敏字段双人复核</text>
    <text class="cell" x="754" y="201">声明紧急影响与 TTL</text><text class="cell" x="754" y="222">事后强制复核</text>
    <text class="cell" x="1002" y="201">Manifest + 对象摘要</text><text class="cell" x="1002" y="222">导出策略固定</text>

    <text class="row" x="68" y="273">COLD 冷存</text><text class="small" x="68" y="296">低频、受限恢复</text>
    <text class="cell" x="258" y="273">默认不可交互扫描</text><text class="cell" x="258" y="294">按批准分区恢复</text>
    <text class="cell" x="506" y="273">恢复票据 + 时间窗</text><text class="cell" x="506" y="294">恢复副本限时销毁</text>
    <text class="cell" x="754" y="273">仅预注册紧急类型</text><text class="cell" x="754" y="294">不得绕过字段掩码</text>
    <text class="cell" x="1002" y="273">记录恢复链与工具版本</text><text class="cell" x="1002" y="294">声明不可用分区</text>

    <text class="row" x="68" y="345">HOLD 冻结</text><text class="small" x="68" y="368">删除暂停且定期复核</text>
    <text class="cell" x="258" y="345">不因冻结自动开放</text><text class="cell" x="258" y="366">原访问目的仍适用</text>
    <text class="cell" x="506" y="345">限定案件、主体、日期</text><text class="cell" x="506" y="366">范围变化需新授权</text>
    <text class="cell" x="754" y="345">紧急性独立判断</text><text class="cell" x="754" y="366">冻结不是万能通行证</text>
    <text class="cell" x="1002" y="345">Manifest 标记 hold ID</text><text class="cell" x="1002" y="366">避免误报全库完整</text>

    <text class="row" x="68" y="417">DELETE_DUE</text><text class="small" x="68" y="440">到期、等待删除</text>
    <text class="cell" x="258" y="417">停止普通检索</text><text class="cell" x="258" y="438">只允许删除核验</text>
    <text class="cell" x="506" y="417">新合法依据才可暂停</text><text class="cell" x="506" y="438">禁止口头无限延期</text>
    <text class="cell" x="754" y="417">不能以紧急为由复活</text><text class="cell" x="754" y="438">必要时走正式冻结</text>
    <text class="cell" x="1002" y="417">仅导出删除证明</text><text class="cell" x="1002" y="438">不再导出原记录</text>

    <text class="row" x="68" y="489">DELETED</text><text class="small" x="68" y="512">原记录不可恢复</text>
    <text class="cell" x="258" y="489">拒绝并记录请求</text><text class="cell" x="258" y="510">不得从缓存旁路读取</text>
    <text class="cell" x="506" y="489">只返回删除证明</text><text class="cell" x="506" y="510">说明证据边界</text>
    <text class="cell" x="754" y="489">拒绝；触发治理审查</text><text class="cell" x="754" y="510">不伪造“可恢复”</text>
    <text class="cell" x="1002" y="489">Tombstone + 摘要 + 时间</text><text class="cell" x="1002" y="510">不含已删内容</text>
  </g>

  <g aria-label="状态流转">
    <text class="row" x="52" y="588">允许的生命周期</text>
    <rect x="230" y="559" width="128" height="48" rx="6" fill="#dff1ee" stroke="#16827b"/>
    <text class="row" x="272" y="589">HOT</text>
    <rect x="424" y="559" width="128" height="48" rx="6" fill="#fff1c9" stroke="#d3911b"/>
    <text class="row" x="464" y="589">COLD</text>
    <rect x="618" y="559" width="148" height="48" rx="6" fill="#fde4e7" stroke="#d1495b"/>
    <text class="row" x="635" y="589">DELETE_DUE</text>
    <rect x="832" y="559" width="138" height="48" rx="6" fill="#e6ebee" stroke="#657781"/>
    <text class="row" x="863" y="589">DELETED</text>
    <path class="arrow" d="M358 583 H416"/><path class="arrow" d="M552 583 H610"/><path class="arrow" d="M766 583 H824"/>
    <rect x="524" y="638" width="160" height="46" rx="6" fill="#eee5f4" stroke="#7d5395"/>
    <text class="row" x="565" y="667">HOLD</text>
    <path class="arrow" d="M488 612 C488 645 510 658 516 658"/>
    <path class="arrow" d="M692 638 C692 620 684 614 668 608"/>
    <text class="small" x="718" y="666">解除冻结后回到按原规则计算的状态，不重置保留时钟</text>
  </g>
</svg>
