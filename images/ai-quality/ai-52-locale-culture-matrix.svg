<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Language、Script、Locale、Region 与 Culture 的测试矩阵</title>
  <desc id="desc">用五列区分语言、文字系统、Locale、地区和文化情境，并展示翻译等价、Unicode 分词、本地格式、方言混语、文化安全五类测试如何沿明确方向进入自动证据、母语复核和切片发布决策。</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.title{font:700 31px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#17324d}.sub{font:400 16px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#51697d}.head{font:700 16px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#fff}.h{font:700 16px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#17324d}.t{font:400 14px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#334f63}.small{font:600 14px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#496477}.grid{stroke:#c9d7e2;stroke-width:1.5}.arrow{fill:none;stroke:#647f91;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#647f91"/></marker>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <rect width="1280" height="101" fill="#fff"/>
  <rect y="99" width="1280" height="2" fill="#dce6ed"/>
  <text class="title" x="44" y="44">五个维度、五类风险：Culture 不能由 Locale 自动推导</text>
  <text class="sub" x="44" y="75">每个样本显式记录适用范围；矩阵格是测试假设，不是对群体的本质化画像；未知、混合与个体偏好允许存在。</text>

  <rect x="42" y="120" width="1196" height="47" rx="7" fill="#315d77"/>
  <text class="head" x="58" y="150">测试轴 ↓</text>
  <text class="head" x="193" y="150">Language</text>
  <text class="head" x="367" y="150">Script</text>
  <text class="head" x="531" y="150">Locale</text>
  <text class="head" x="708" y="150">Region</text>
  <text class="head" x="858" y="150">Culture / 情境</text>
  <text class="head" x="1081" y="150">证据 → 动作</text>

  <rect x="42" y="178" width="1196" height="82" rx="7" fill="#eaf4ff" class="grid"/>
  <rect x="42" y="178" width="130" height="82" rx="7" fill="#d5e9f7"/>
  <text class="h" x="58" y="208">翻译等价</text><text class="small" x="58" y="232">任务是否改变</text>
  <text class="t" x="189" y="204">源/目标语言</text><text class="t" x="189" y="228">方向、原生/翻译</text><text class="t" x="189" y="250">否定与实体不变</text>
  <text class="t" x="363" y="204">转写不是翻译</text><text class="t" x="363" y="228">同语多文字</text><text class="t" x="363" y="250">方向与标点</text>
  <text class="t" x="527" y="204">受众表达可变</text><text class="t" x="527" y="228">术语与敬语</text><text class="t" x="527" y="250">不可硬做逐字对齐</text>
  <text class="t" x="704" y="204">法律/商品边界</text><text class="t" x="704" y="228">不可从语言猜地区</text><text class="t" x="704" y="250">跨区须明示</text>
  <text class="t" x="854" y="204">语用等价</text><text class="t" x="854" y="228">称谓、隐含义</text><text class="t" x="854" y="250">保留不可译说明</text>
  <text class="t" x="1077" y="204">事实槽自动检查</text><text class="t" x="1077" y="228">母语语义复核</text><text class="small" x="1077" y="250">不等价 → 阻断</text>

  <rect x="42" y="270" width="1196" height="82" rx="7" fill="#f2edfa" class="grid"/>
  <rect x="42" y="270" width="130" height="82" rx="7" fill="#e4d9f1"/>
  <text class="h" x="58" y="300">Unicode/分词</text><text class="small" x="58" y="324">字符串是否保真</text>
  <text class="t" x="189" y="296">语言标签不决定</text><text class="t" x="189" y="320">码点或 Token</text><text class="t" x="189" y="342">同语差异很大</text>
  <text class="t" x="363" y="296">组合字符、字素簇</text><text class="t" x="363" y="320">连写、变体选择符</text><text class="t" x="363" y="342">双向文本</text>
  <text class="t" x="527" y="296">比较规则可裁剪</text><text class="t" x="527" y="320">原文不可被覆盖</text><text class="t" x="527" y="342">Tokenizer 要版本化</text>
  <text class="t" x="704" y="296">地区通常非主因</text><text class="t" x="704" y="320">键盘/输入法可相关</text><text class="t" x="704" y="342">只能作为待验证解释</text>
  <text class="t" x="854" y="296">昵称、数字混写</text><text class="t" x="854" y="320">身份标识敏感</text><text class="t" x="854" y="342">勿“清洗”掉差异</text>
  <text class="t" x="1077" y="296">raw + 派生键</text><text class="t" x="1077" y="320">截断/碰撞注入</text><text class="small" x="1077" y="342">碰撞 → 隔离</text>

  <rect x="42" y="362" width="1196" height="82" rx="7" fill="#fff5df" class="grid"/>
  <rect x="42" y="362" width="130" height="82" rx="7" fill="#f8e5bc"/>
  <text class="h" x="58" y="392">Locale 格式</text><text class="small" x="58" y="416">值与显示分离</text>
  <text class="t" x="189" y="388">语言仅是输入之一</text><text class="t" x="189" y="412">同语可多 Locale</text><text class="t" x="189" y="434">不要写死模板</text>
  <text class="t" x="363" y="388">数字字形与方向</text><text class="t" x="363" y="412">不是数值本身</text><text class="t" x="363" y="434">显示层验证</text>
  <text class="t" x="527" y="388">日期、货币、复数</text><text class="t" x="527" y="412">日历、单位、排序</text><text class="t" x="527" y="434">CLDR/规则版本</text>
  <text class="t" x="704" y="388">税法、时区、地址</text><text class="t" x="704" y="412">配送与行政层级</text><text class="t" x="704" y="434">须业务配置</text>
  <text class="t" x="854" y="388">偏好可覆盖默认</text><text class="t" x="854" y="412">名字/称谓顺序</text><text class="t" x="854" y="434">不推断个体身份</text>
  <text class="t" x="1077" y="388">结构值 Oracle</text><text class="t" x="1077" y="412">格式快照/性质测试</text><text class="small" x="1077" y="434">错币种 → 阻断</text>

  <rect x="42" y="454" width="1196" height="82" rx="7" fill="#eaf7ef" class="grid"/>
  <rect x="42" y="454" width="130" height="82" rx="7" fill="#d5ecdd"/>
  <text class="h" x="58" y="484">方言/混语</text><text class="small" x="58" y="508">真实输入变化</text>
  <text class="t" x="189" y="480">多语言片段级标签</text><text class="t" x="189" y="504">借词不等于切换</text><text class="t" x="189" y="526">检测可为 unknown</text>
  <text class="t" x="363" y="480">同句跨文字系统</text><text class="t" x="363" y="504">Romanization</text><text class="t" x="363" y="526">拼写非标准化</text>
  <text class="t" x="527" y="480">Locale 只是默认</text><text class="t" x="527" y="504">不能覆盖说话方式</text><text class="t" x="527" y="526">按任务记录</text>
  <text class="t" x="704" y="480">迁移/跨境常见</text><text class="t" x="704" y="504">地理不决定能力</text><text class="t" x="704" y="526">样本分布单列</text>
  <text class="t" x="854" y="480">身份与场景相关</text><text class="t" x="854" y="504">不把“标准语”当优越</text><text class="t" x="854" y="526">当地复核员覆盖</text>
  <text class="t" x="1077" y="480">片段/任务成功</text><text class="t" x="1077" y="504">噪声与切换注入</text><text class="small" x="1077" y="526">退化 → 回退</text>

  <rect x="42" y="546" width="1196" height="82" rx="7" fill="#fff0f0" class="grid"/>
  <rect x="42" y="546" width="130" height="82" rx="7" fill="#f5dada"/>
  <text class="h" x="58" y="576">文化/偏差/安全</text><text class="small" x="58" y="600">伤害是否变化</text>
  <text class="t" x="189" y="572">语言表现不等于</text><text class="t" x="189" y="596">文化适配或公平</text><text class="t" x="189" y="618">翻译可能增减伤害</text>
  <text class="t" x="363" y="572">文字选择可能有</text><text class="t" x="363" y="596">身份/政治含义</text><text class="t" x="363" y="618">按场景验证</text>
  <text class="t" x="527" y="572">默认资源入口</text><text class="t" x="527" y="596">不是文化标签</text><text class="t" x="527" y="618">允许用户覆盖</text>
  <text class="t" x="704" y="572">法规与服务可用性</text><text class="t" x="704" y="596">按当时规则取证</text><text class="t" x="704" y="618">不泛化人群</text>
  <text class="t" x="854" y="572">情境 ID + 来源</text><text class="t" x="854" y="596">群体内异质性</text><text class="t" x="854" y="618">异议与未知可保留</text>
  <text class="t" x="1077" y="572">双标/仲裁/伤害</text><text class="t" x="1077" y="596">反事实切片</text><text class="small" x="1077" y="618">高风险 → 人审</text>

  <path class="arrow" d="M110 648 L110 679 L362 679"/>
  <rect x="375" y="648" width="704" height="55" rx="7" fill="#17324d"/>
  <text x="397" y="672" style="font:700 14px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#fff">测试方向：任务契约 → 五维切片 → 自动可确定证据 → 母语语用/伤害复核 → 风险门禁</text>
  <text x="397" y="692" style="font:600 14px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#cbe8f7">一个格子通过只说明该格证据满足阈值；不能外推到所有地区、所有说话者或生产分布。</text>
  <path class="arrow" d="M1079 679 L1219 679 L1219 628"/>
</svg>
