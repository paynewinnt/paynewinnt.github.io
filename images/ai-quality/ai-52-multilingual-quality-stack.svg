<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">多语言本地化 AI 质量分层架构与证据数据流</title>
  <desc id="desc">从任务与风险契约开始，原生样本和翻译样本分别进入原文保全、Unicode 与分词观测、模型执行、语言与本地化断言、母语人工复核，最后由切片门禁决定发布；失败证据沿反馈箭头回到数据和规则版本。</desc>
  <defs>
    <style>
      .bg{fill:#f7fafc}.title{font:700 31px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#17324d}.sub{font:400 16px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#51697d}.h{font:700 18px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#17324d}.t{font:400 14px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#334f63}.small{font:600 14px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#496477}.box{fill:#fff;stroke:#c9d7e2;stroke-width:2}.arrow{fill:none;stroke:#657f91;stroke-width:2.5;marker-end:url(#arrow)}.feedback{fill:none;stroke:#ba6368;stroke-width:2.5;stroke-dasharray:7 6;marker-end:url(#red)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#657f91"/></marker>
    <marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#ba6368"/></marker>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <rect width="1280" height="102" fill="#fff"/>
  <rect y="100" width="1280" height="2" fill="#dce6ed"/>
  <text class="title" x="44" y="45">多语言质量栈：不要让翻译分数替代任务、Locale 与文化证据</text>
  <text class="sub" x="44" y="76">主链保存原文与版本；自动断言发现可确定错误；母语复核处理语用与伤害；切片门禁只对已定义的证据作发布决策。</text>

  <text class="h" x="44" y="135">控制面</text>
  <rect x="44" y="151" width="1192" height="78" rx="9" fill="#eaf4ff" stroke="#5791bb" stroke-width="2"/>
  <text class="h" x="66" y="181">任务与风险契约</text>
  <text class="t" x="66" y="201">task · language · script · locale</text>
  <text class="t" x="66" y="220">region · domain · audience · risk</text>
  <line x1="337" y1="165" x2="337" y2="216" stroke="#9bbbd1"/>
  <text class="h" x="361" y="181">版本与责任</text>
  <text class="t" x="361" y="201">dataset · translator · tokenizer</text>
  <text class="t" x="361" y="220">formatter · model · prompt · rubric</text>
  <line x1="790" y1="165" x2="790" y2="216" stroke="#9bbbd1"/>
  <text class="h" x="814" y="181">门禁定义</text>
  <text class="t" x="814" y="201">零容忍项 · 切片下限 · 人工容量</text>
  <text class="t" x="814" y="220">回滚条件 · 例外期限</text>

  <path class="arrow" d="M640 229 L640 255"/>
  <text class="h" x="44" y="274">数据面：两类样本不可静默合并</text>
  <rect x="44" y="290" width="170" height="118" rx="8" fill="#f2edfa" stroke="#8a72ae" stroke-width="2"/>
  <text class="h" x="62" y="321">A. 原生任务</text>
  <text class="t" x="62" y="348">当地作者直接创作</text>
  <text class="t" x="62" y="373">真实表达与业务意图</text>
  <text class="small" x="62" y="394">回答生产适配性</text>
  <rect x="44" y="424" width="170" height="118" rx="8" fill="#fff5df" stroke="#c58b35" stroke-width="2"/>
  <text class="h" x="62" y="455">B. 翻译/平行任务</text>
  <text class="t" x="62" y="482">方向与译者可追踪</text>
  <text class="t" x="62" y="507">等价、不变项、可变项</text>
  <text class="small" x="62" y="528">回答跨语言可比性</text>

  <path class="arrow" d="M214 349 L244 349"/>
  <path class="arrow" d="M214 483 L244 483"/>
  <rect x="248" y="290" width="196" height="252" rx="8" fill="#eaf7ef" stroke="#5b9671" stroke-width="2"/>
  <text class="h" x="268" y="321">输入保全与派生键</text>
  <text class="t" x="268" y="351">raw_text：逐字原文</text>
  <text class="t" x="268" y="378">NFC：明确比较用途</text>
  <text class="t" x="268" y="405">NFKC + casefold：有损候选键</text>
  <text class="t" x="268" y="432">字节 · 码点 · 字素簇</text>
  <text class="t" x="268" y="459">方向控制符与混淆字符</text>
  <text class="t" x="268" y="486">tokenizer 版本与实测数</text>
  <rect x="266" y="505" width="160" height="24" rx="5" fill="#d5ecdd"/>
  <text class="small" x="278" y="522">原文不被派生键覆盖</text>

  <path class="arrow" d="M444 416 L474 416"/>
  <rect x="478" y="290" width="180" height="252" rx="8" fill="#eaf4ff" stroke="#4e8fbe" stroke-width="2"/>
  <text class="h" x="498" y="321">被测执行链</text>
  <text class="t" x="498" y="351">语言/意图路由</text>
  <text class="t" x="498" y="378">检索与上下文组装</text>
  <text class="t" x="498" y="405">模型与 Prompt</text>
  <text class="t" x="498" y="432">工具/API 调用</text>
  <text class="t" x="498" y="459">Locale 格式化</text>
  <text class="t" x="498" y="486">安全策略与兜底</text>
  <text class="small" x="498" y="520">全链 trace + 外部后置条件</text>

  <path class="arrow" d="M658 416 L688 416"/>
  <rect x="692" y="290" width="220" height="252" rx="8" fill="#fff" stroke="#7b92a2" stroke-width="2"/>
  <text class="h" x="712" y="321">自动证据</text>
  <text class="t" x="712" y="351">语言/文字系统符合</text>
  <text class="t" x="712" y="378">实体、否定、数字不变项</text>
  <text class="t" x="712" y="405">日期 · 货币 · 单位 · 地址</text>
  <text class="t" x="712" y="432">Unicode/token 预算与截断</text>
  <text class="t" x="712" y="459">变形与差分测试</text>
  <text class="t" x="712" y="486">安全/偏差候选与分歧</text>
  <text class="small" x="712" y="520">规则命中是观测，不是根因</text>

  <path class="arrow" d="M912 416 L942 416"/>
  <rect x="946" y="290" width="174" height="252" rx="8" fill="#f2edfa" stroke="#8a72ae" stroke-width="2"/>
  <text class="h" x="966" y="321">母语人工复核</text>
  <text class="t" x="966" y="351">语义与语用</text>
  <text class="t" x="966" y="378">礼貌、禁忌、权力关系</text>
  <text class="t" x="966" y="405">方言与 code-switch</text>
  <text class="t" x="966" y="432">文化情境适配</text>
  <text class="t" x="966" y="459">伤害、刻板印象、偏差</text>
  <text class="t" x="966" y="486">双标、仲裁、异议保留</text>
  <text class="small" x="966" y="520">文化不是 locale 的常量</text>

  <path class="arrow" d="M1120 416 L1146 416"/>
  <rect x="1150" y="290" width="86" height="252" rx="8" fill="#fff0f0" stroke="#bd6669" stroke-width="2"/>
  <text class="h" x="1167" y="321">门禁</text>
  <text class="t" x="1167" y="355">通过</text>
  <text class="t" x="1167" y="385">限流</text>
  <text class="t" x="1167" y="415">回退</text>
  <text class="t" x="1167" y="445">阻断</text>
  <text class="t" x="1167" y="475">例外</text>
  <text class="small" x="1167" y="519">按切片</text>

  <text class="h" x="44" y="584">证据面</text>
  <rect x="44" y="600" width="1192" height="72" rx="8" fill="#eef4f6" stroke="#93a7b4" stroke-width="2"/>
  <text class="t" x="66" y="629">Observation：原始输出、事件、格式值、规则命中、复核意见</text>
  <text class="t" x="66" y="654">Inference：疑似首错层与贡献因素</text>
  <text class="t" x="499" y="629">Decision：门禁、责任人、期限、回滚</text>
  <text class="t" x="499" y="654">Slice：language × script × locale × domain × risk × input_mode</text>
  <path class="feedback" d="M1192 600 C1192 564 802 568 802 542"/>
  <path class="feedback" d="M550 600 C550 568 346 568 346 542"/>
  <text class="small" x="829" y="579" fill="#9b4f54">失败回流到样本、规则与版本，不能覆写历史证据</text>
  <rect x="44" y="688" width="1192" height="24" rx="6" fill="#17324d"/>
  <text x="60" y="705" style="font:700 14px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#fff">发布结论 = 任务正确性证据 + Locale 正确性证据 + 文化/伤害复核 + 高风险切片完整性；任一总体平均分都不能代替。</text>
</svg>
