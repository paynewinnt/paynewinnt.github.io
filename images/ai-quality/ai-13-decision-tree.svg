<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Prompt、RAG、微调、工具调用和 Agent 选型决策树</title>
  <desc id="desc">按照实时动作、外部动态事实、稳定行为适配和动态多步骤规划四个问题选择能力，并说明这些能力可以组合。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #475569; }
      .question { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #0f172a; }
      .detail { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #475569; }
      .result { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #ffffff; }
      .result-detail { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #ffffff; }
      .branch { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #334155; }
      .note { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #1e3a8a; }
    </style>
  </defs>

  <rect width="1280" height="800" fill="#f8fafc"/>
  <text x="50" y="56" class="title">五类方案怎么选：先识别问题，再增加能力</text>
  <text x="50" y="86" class="subtitle">Prompt、RAG、微调、工具调用不是互相替代；Agent 是动态编排方式，不是新的知识来源</text>

  <g filter="url(#shadow)">
    <rect x="420" y="112" width="440" height="72" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="455" y="143" class="question">起点：当前失败究竟缺什么？</text>
    <text x="455" y="168" class="detail">先写出事实新鲜度、动作副作用、行为差距和流程分支</text>
  </g>

  <line x1="640" y1="184" x2="640" y2="220" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="420" y="220" width="440" height="82" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="448" y="252" class="question">Q1 需要实时精确状态，或执行有副作用动作？</text>
    <text x="448" y="279" class="detail">例如查订单、读监控、创建工单、操作设备</text>
  </g>

  <line x1="420" y1="261" x2="280" y2="261" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="340" y="248" class="branch">是</text>
  <g filter="url(#shadow)">
    <rect x="60" y="217" width="220" height="88" rx="8" fill="#0369a1"/>
    <text x="88" y="252" class="result">工具调用</text>
    <text x="88" y="278" class="result-detail">确定性 API、权限和副作用</text>
  </g>

  <line x1="640" y1="302" x2="640" y2="338" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="653" y="325" class="branch">否</text>

  <g filter="url(#shadow)">
    <rect x="420" y="338" width="440" height="82" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="448" y="370" class="question">Q2 是否依赖外部、频繁变化且需要引用的事实？</text>
    <text x="448" y="397" class="detail">例如制度、产品文档、故障知识和私有资料</text>
  </g>

  <line x1="860" y1="379" x2="1000" y2="379" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="925" y="366" class="branch">是</text>
  <g filter="url(#shadow)">
    <rect x="1000" y="335" width="220" height="88" rx="8" fill="#15803d"/>
    <text x="1028" y="370" class="result">RAG</text>
    <text x="1028" y="396" class="result-detail">外部知识、更新与来源追踪</text>
  </g>

  <line x1="640" y1="420" x2="640" y2="456" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="653" y="443" class="branch">否</text>

  <g filter="url(#shadow)">
    <rect x="420" y="456" width="440" height="92" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="448" y="488" class="question">Q3 稳定行为仍不达标，且有高质量训练数据？</text>
    <text x="448" y="515" class="detail">例如固定分类边界、表达风格或结构遵循</text>
    <text x="448" y="537" class="detail">频繁变化事实不应依赖微调写入参数</text>
  </g>

  <line x1="420" y1="502" x2="280" y2="502" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="340" y="489" class="branch">是</text>
  <g filter="url(#shadow)">
    <rect x="60" y="458" width="220" height="88" rx="8" fill="#b45309"/>
    <text x="88" y="493" class="result">微调</text>
    <text x="88" y="519" class="result-detail">稳定行为适配与任务模式</text>
  </g>

  <line x1="860" y1="502" x2="1000" y2="502" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="925" y="489" class="branch">否</text>
  <g filter="url(#shadow)">
    <rect x="1000" y="458" width="220" height="88" rx="8" fill="#7c3aed"/>
    <text x="1028" y="493" class="result">Prompt</text>
    <text x="1028" y="519" class="result-detail">任务说明、示例与输出契约</text>
  </g>

  <path d="M170 305 L170 595 L480 595" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M1110 423 L1110 595 L800 595" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M170 546 L170 595 L480 595" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M1110 546 L1110 595 L800 595" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>

  <g filter="url(#shadow)">
    <rect x="420" y="575" width="440" height="92" rx="8" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
    <text x="448" y="607" class="question">Q4 步骤是否必须根据观察结果动态规划？</text>
    <text x="448" y="634" class="detail">分支不可预先穷举、需要多轮工具交互时再考虑 Agent</text>
    <text x="448" y="656" class="detail">固定流程优先使用确定性工作流</text>
  </g>

  <line x1="520" y1="667" x2="350" y2="711" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="422" y="695" class="branch">否</text>
  <rect x="160" y="702" width="190" height="54" rx="8" fill="#334155"/>
  <text x="193" y="736" class="result">固定工作流</text>

  <line x1="760" y1="667" x2="930" y2="711" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="838" y="695" class="branch">是</text>
  <rect x="930" y="702" width="190" height="54" rx="8" fill="#6d28d9"/>
  <text x="986" y="736" class="result">Agent</text>

  <rect x="420" y="698" width="440" height="62" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="448" y="723" class="note">组合是常态：Prompt 定契约，RAG 供证据，工具做动作；</text>
  <text x="448" y="747" class="note">Agent 只负责编排必须动态决策的部分。</text>
</svg>
