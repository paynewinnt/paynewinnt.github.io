<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 编码助手开发收益与质量联合记分卡</title>
  <desc id="desc">左侧展示按任务分层随机并交叉顺序的成对实验，中间列出时间、质量、返工和逃逸缺陷的成对差与置信区间，右侧展示只有质量不劣、安全通过且总周期改善时才判定有净收益。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#38515e"/></marker>
    <style>
      .bg{fill:#f6f8f8}.title{font:700 30px Arial,"PingFang SC",sans-serif;fill:#17272f}.sub{font:15px Arial,"PingFang SC",sans-serif;fill:#53646d}.h{font:700 17px Arial,"PingFang SC",sans-serif;fill:#1e3038}.t{font:14px Arial,"PingFang SC",sans-serif;fill:#34464e}.tiny{font:13px Arial,"PingFang SC",sans-serif;fill:#5a6a72}.head{font:700 15px Arial,"PingFang SC",sans-serif;fill:#fff}.flow{fill:none;stroke:#38515e;stroke-width:2.6;marker-end:url(#arrow)}.grid{stroke:#c8d2d7;stroke-width:1}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="48" y="50">开发收益不能只看“写得快”：用成对任务核对总交付成本</text>
  <text class="sub" x="48" y="79">所有数值均为构造示例；点估计必须与样本量、区间、失败任务和选择偏差一起解释</text>

  <g aria-label="成对实验设计">
    <rect x="42" y="116" width="330" height="474" rx="8" fill="#fff" stroke="#b8c6cd" stroke-width="2"/>
    <text class="h" x="66" y="151">A. 分层随机与成对比较</text>
    <rect x="66" y="178" width="280" height="70" rx="6" fill="#e7f3f1" stroke="#18847b"/>
    <text class="t" x="84" y="207">任务池：缺陷修复 / 重构 / 测试</text>
    <text class="tiny" x="84" y="231">按风险、规模、语言、熟悉度分层</text>
    <path class="flow" d="M206 248 V277"/>
    <rect x="66" y="286" width="128" height="90" rx="6" fill="#edf2f8" stroke="#4c709c"/>
    <text class="h" x="88" y="316">基线方式</text>
    <text class="t" x="88" y="342">人工 + 既有工具</text>
    <text class="tiny" x="88" y="362">顺序 AB / BA</text>
    <rect x="218" y="286" width="128" height="90" rx="6" fill="#f3edf6" stroke="#775792"/>
    <text class="h" x="240" y="316">助手方式</text>
    <text class="t" x="240" y="342">同合同与环境</text>
    <text class="tiny" x="240" y="362">保留失败与弃用</text>
    <path class="flow" d="M130 376 V410 H198"/><path class="flow" d="M282 376 V410 H214"/>
    <rect x="66" y="425" width="280" height="120" rx="6" fill="#fff6df" stroke="#d18c18"/>
    <text class="h" x="84" y="455">同一完成定义</text>
    <text class="t" x="84" y="482">通过独立门禁 + 评审接受</text>
    <text class="t" x="84" y="507">返工结束 + 缺陷观察窗完成</text>
    <text class="tiny" x="84" y="530">超时、放弃、切回人工仍进入分母</text>
  </g>

  <g aria-label="联合指标记分卡">
    <rect x="398" y="116" width="500" height="474" rx="8" fill="#fff" stroke="#b8c6cd" stroke-width="2"/>
    <text class="h" x="422" y="151">B. 每个任务记录四类成对差</text>
    <rect x="422" y="178" width="452" height="50" rx="5" fill="#314d5c"/>
    <text class="head" x="438" y="209">指标</text><text class="head" x="595" y="209">分子 / 分母</text><text class="head" x="762" y="209">判断</text>
    <line class="grid" x1="570" y1="178" x2="570" y2="536"/><line class="grid" x1="742" y1="178" x2="742" y2="536"/>

    <rect x="422" y="228" width="452" height="77" fill="#eef7f5"/>
    <text class="h" x="438" y="258">总周期</text><text class="tiny" x="438" y="281">Time to accepted</text>
    <text class="t" x="586" y="258">需求开始至评审接受</text><text class="tiny" x="586" y="281">全部已分配任务</text>
    <text class="t" x="758" y="258">成对中位数差</text><text class="tiny" x="758" y="281">bootstrap 区间</text>

    <rect x="422" y="305" width="452" height="77" fill="#fff7e4"/>
    <text class="h" x="438" y="335">评审与返工</text><text class="tiny" x="438" y="358">Review + rework</text>
    <text class="t" x="586" y="335">评审、修复、重跑分钟</text><text class="tiny" x="586" y="358">含被拒候选</text>
    <text class="t" x="758" y="335">均值与长尾</text><text class="tiny" x="758" y="358">P50 / P90 分列</text>

    <rect x="422" y="382" width="452" height="77" fill="#f6eef7"/>
    <text class="h" x="438" y="412">质量与缺陷</text><text class="tiny" x="438" y="435">Joint quality</text>
    <text class="t" x="586" y="412">门禁失败 + 逃逸缺陷</text><text class="tiny" x="586" y="435">所有进入观察窗任务</text>
    <text class="t" x="758" y="412">非劣界值</text><text class="tiny" x="758" y="435">稀有事件给区间</text>

    <rect x="422" y="459" width="452" height="77" fill="#edf2f8"/>
    <text class="h" x="438" y="489">开发者负担</text><text class="tiny" x="438" y="512">Intervention</text>
    <text class="t" x="586" y="489">提示、等待、上下文整理</text><text class="tiny" x="586" y="512">每个已分配任务</text>
    <text class="t" x="758" y="489">分布 + 失败原因</text><text class="tiny" x="758" y="512">不只算生成时长</text>
  </g>

  <g aria-label="联合决策">
    <rect x="924" y="116" width="314" height="474" rx="8" fill="#fff" stroke="#b8c6cd" stroke-width="2"/>
    <text class="h" x="948" y="151">C. 联合决策，不做加权遮蔽</text>
    <rect x="948" y="180" width="266" height="75" rx="6" fill="#e9f3df" stroke="#638b42"/>
    <text class="h" x="966" y="209">可声明净收益</text>
    <text class="t" x="966" y="232">安全通过，质量不劣，周期改善</text>
    <rect x="948" y="274" width="266" height="75" rx="6" fill="#fff3d8" stroke="#d18c18"/>
    <text class="h" x="966" y="303">继续实验</text>
    <text class="t" x="966" y="326">方向有利，但区间跨过决策界值</text>
    <rect x="948" y="368" width="266" height="75" rx="6" fill="#fde7e9" stroke="#c84d5b"/>
    <text class="h" x="966" y="397">停止或收窄</text>
    <text class="t" x="966" y="420">安全失败、质量变差或返工失控</text>
    <rect x="948" y="462" width="266" height="75" rx="6" fill="#eef1f3" stroke="#657680"/>
    <text class="h" x="966" y="491">无法判断</text>
    <text class="t" x="966" y="514">分母缺失、口径漂移或证据不可验</text>
  </g>

  <path class="flow" d="M372 352 H390"/><path class="flow" d="M898 352 H916"/>
  <text class="tiny" x="386" y="645">示例规则：任何安全硬门失败都不能被节省时间抵消；测试通过率也不能替代观察窗内的逃逸缺陷</text>
  <text class="tiny" x="451" y="684">结果只外推到抽样任务、参与者、工具版本和实验窗口</text>
</svg>
