<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">AI 可观测数据模型与隐私分层</title>
  <desc id="desc">展示 AI 服务遥测经过采集策略层后分别进入 Trace 索引、指标库和加密 Artifact 存储的架构</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#405c76"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#17324d" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 34px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #17324d; }
      .subtitle { font: 400 17px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #516679; }
      .h2 { font: 700 20px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #17324d; }
      .label { font: 600 16px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #243b52; }
      .text { font: 400 14px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #40566b; }
      .small { font: 400 12px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #5b6f81; }
      .mono { font: 600 13px 'SFMono-Regular', Consolas, monospace; fill: #17324d; }
      .white { fill: #ffffff; }
    </style>
  </defs>

  <rect width="1280" height="800" fill="#f7f9fc"/>
  <rect x="0" y="0" width="1280" height="92" fill="#ffffff"/>
  <rect x="0" y="90" width="1280" height="2" fill="#d8e3ec"/>
  <text x="56" y="49" class="title">AI 可观测数据模型：Trace 是索引，Artifact 才保存受控内容</text>
  <text x="56" y="77" class="subtitle">统一语义不等于记录一切；低基数元数据、高基数证据与聚合指标走不同存储和权限路径</text>

  <text x="56" y="130" class="h2">信号源</text>
  <g filter="url(#shadow)">
    <rect x="56" y="149" width="232" height="61" rx="7" fill="#eaf4ff" stroke="#70a4cf"/>
    <rect x="56" y="222" width="232" height="61" rx="7" fill="#eaf6ed" stroke="#70a77e"/>
    <rect x="56" y="295" width="232" height="61" rx="7" fill="#fff4e5" stroke="#d39a4c"/>
    <rect x="56" y="368" width="232" height="61" rx="7" fill="#f2edfa" stroke="#9177b4"/>
    <rect x="56" y="441" width="232" height="61" rx="7" fill="#e9f5f2" stroke="#579987"/>
    <rect x="56" y="514" width="232" height="61" rx="7" fill="#ffeded" stroke="#c87379"/>
  </g>
  <text x="172" y="177" text-anchor="middle" class="label">Gateway / API</text>
  <text x="172" y="198" text-anchor="middle" class="small">request、tenant、route</text>
  <text x="172" y="250" text-anchor="middle" class="label">Prompt Builder</text>
  <text x="172" y="271" text-anchor="middle" class="small">template、version、digest</text>
  <text x="172" y="323" text-anchor="middle" class="label">Retriever</text>
  <text x="172" y="344" text-anchor="middle" class="small">index、documents、rank</text>
  <text x="172" y="396" text-anchor="middle" class="label">Model Gateway</text>
  <text x="172" y="417" text-anchor="middle" class="small">model、TTFT、token、retry</text>
  <text x="172" y="469" text-anchor="middle" class="label">Tool Runtime</text>
  <text x="172" y="490" text-anchor="middle" class="small">schema、side effect、error</text>
  <text x="172" y="542" text-anchor="middle" class="label">Judge / Guardrail</text>
  <text x="172" y="563" text-anchor="middle" class="small">rubric、score、decision</text>

  <g filter="url(#shadow)">
    <rect x="352" y="149" width="322" height="426" rx="8" fill="#ffffff" stroke="#8097aa" stroke-width="2"/>
  </g>
  <rect x="352" y="149" width="322" height="59" rx="8" fill="#355f83"/>
  <rect x="352" y="190" width="322" height="18" fill="#355f83"/>
  <text x="513" y="185" text-anchor="middle" class="h2 white">采集策略与 OTel Collector</text>

  <rect x="378" y="230" width="270" height="58" rx="6" fill="#eef3f7"/>
  <text x="513" y="254" text-anchor="middle" class="label">语义映射</text>
  <text x="513" y="276" text-anchor="middle" class="small">统一 span 名称、属性、状态与事件</text>

  <rect x="378" y="303" width="270" height="58" rx="6" fill="#fff1e8"/>
  <text x="513" y="327" text-anchor="middle" class="label">隐私分类与脱敏</text>
  <text x="513" y="349" text-anchor="middle" class="small">allowlist、redact、HMAC、drop</text>

  <rect x="378" y="376" width="270" height="58" rx="6" fill="#f3eef9"/>
  <text x="513" y="400" text-anchor="middle" class="label">采样与路由</text>
  <text x="513" y="422" text-anchor="middle" class="small">head / tail sampling、错误保留</text>

  <rect x="378" y="449" width="270" height="58" rx="6" fill="#edf7f1"/>
  <text x="513" y="473" text-anchor="middle" class="label">完整性控制</text>
  <text x="513" y="495" text-anchor="middle" class="small">schema、大小限制、artifact digest</text>

  <text x="513" y="544" text-anchor="middle" class="mono">content recording: opt-in</text>

  <line x1="288" y1="362" x2="342" y2="362" stroke="#405c76" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="738" y="130" class="h2">分流存储</text>
  <g filter="url(#shadow)">
    <rect x="738" y="149" width="486" height="120" rx="8" fill="#eaf4ff" stroke="#70a4cf"/>
    <rect x="738" y="292" width="486" height="120" rx="8" fill="#eaf6ed" stroke="#70a77e"/>
    <rect x="738" y="435" width="486" height="140" rx="8" fill="#fff2e8" stroke="#d2984b"/>
  </g>

  <text x="766" y="180" class="h2">Trace / Log 索引</text>
  <text x="766" y="207" class="text">trace_id、span_id、operation、status、version、latency</text>
  <text x="766" y="232" class="text">低基数标签可检索；URI 与摘要指向受控证据</text>
  <text x="1190" y="252" text-anchor="end" class="small">不默认存 Prompt 原文</text>

  <text x="766" y="323" class="h2">Metrics 时序库</text>
  <text x="766" y="350" class="text">TTFT、总时延、token、错误率、检索与工具耗时</text>
  <text x="766" y="375" class="text">从完整计数聚合；不依赖 Trace 是否被采样保留</text>
  <text x="1190" y="395" text-anchor="end" class="small">禁止 user_id 等高基数标签</text>

  <text x="766" y="466" class="h2">加密 Artifact 存储</text>
  <text x="766" y="493" class="text">脱敏 Prompt、检索片段、工具参数、模型输出、Judge 理由</text>
  <text x="766" y="518" class="text">独立 ACL、KMS、保留期限、删除索引与访问审计</text>
  <text x="766" y="543" class="text">trace 只保存 artifact_uri、digest、classification</text>
  <text x="1190" y="559" text-anchor="end" class="small">内容采集必须显式授权</text>

  <line x1="674" y1="236" x2="728" y2="208" stroke="#405c76" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="674" y1="362" x2="728" y2="352" stroke="#405c76" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="674" y1="488" x2="728" y2="505" stroke="#405c76" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="56" y="628" class="h2">统一 Span 最小字段</text>
  <rect x="56" y="648" width="1168" height="76" rx="8" fill="#ffffff" stroke="#d6e1ea"/>
  <text x="82" y="677" class="mono">identity</text>
  <text x="82" y="703" class="small">trace_id / span_id / parent_id</text>
  <line x1="276" y1="661" x2="276" y2="711" stroke="#d3dde6"/>
  <text x="301" y="677" class="mono">operation</text>
  <text x="301" y="703" class="small">name / kind / attempt</text>
  <line x1="486" y1="661" x2="486" y2="711" stroke="#d3dde6"/>
  <text x="511" y="677" class="mono">version</text>
  <text x="511" y="703" class="small">prompt / model / tool / judge</text>
  <line x1="746" y1="661" x2="746" y2="711" stroke="#d3dde6"/>
  <text x="771" y="677" class="mono">result</text>
  <text x="771" y="703" class="small">status / error.type / usage</text>
  <line x1="952" y1="661" x2="952" y2="711" stroke="#d3dde6"/>
  <text x="977" y="677" class="mono">evidence</text>
  <text x="977" y="703" class="small">artifact URI / digest / class</text>

  <rect x="56" y="744" width="1168" height="34" rx="7" fill="#17324d"/>
  <text x="640" y="766" text-anchor="middle" class="label white">先分类再采集，先脱敏再导出；Trace Context 与 Baggage 中禁止放个人信息和秘密</text>
</svg>
