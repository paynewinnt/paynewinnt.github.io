<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 驱动 UI 自动化受控执行闭环</title>
  <desc id="desc">展示任务合同约束下，规划、感知、多源定位、动作许可、执行、业务判定与证据封装组成的控制闭环，并包含恢复预算、人工批准和安全停止。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#344f5e"/></marker>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#c94f5d"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1b2c35" flood-opacity="0.14"/></filter>
    <style>
      .bg{fill:#f5f7f8}.title{font:700 30px Arial,"PingFang SC",sans-serif;fill:#17262f}.sub{font:15px Arial,"PingFang SC",sans-serif;fill:#53646d}.h{font:700 17px Arial,"PingFang SC",sans-serif;fill:#1d2d35}.t{font:13px Arial,"PingFang SC",sans-serif;fill:#34454e}.tiny{font:12px Arial,"PingFang SC",sans-serif;fill:#596a73}.stage{stroke-width:2;filter:url(#shadow)}.flow{fill:none;stroke:#344f5e;stroke-width:2.7;marker-end:url(#arrow)}.stop{fill:none;stroke:#c94f5d;stroke-width:2.6;stroke-dasharray:8 6;marker-end:url(#redArrow)}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="50" y="52">UI Agent 控制闭环：每一步重新观察、许可、执行和判定</text>
  <text class="sub" x="50" y="80">Planner 不直接点击；自愈只产生候选；业务 Oracle 与原任务合同保持不可变绑定</text>

  <g aria-label="任务合同">
    <rect class="stage" x="48" y="124" width="1184" height="92" rx="8" fill="#fff4d8" stroke="#d3911b"/>
    <text class="h" x="70" y="157">不可变任务合同</text>
    <text class="t" x="70" y="186">起始状态 · 允许域名/窗口 · 动作与数据范围 · 业务后置条件 · 最大步骤/恢复预算 · 高风险人工批准 · 证据要求</text>
  </g>

  <g aria-label="执行闭环">
    <rect class="stage" x="60" y="288" width="164" height="128" rx="8" fill="#e8eef8" stroke="#4e709f"/>
    <text class="h" x="80" y="320">1. Planner</text><text class="t" x="80" y="350">输出意图与前置条件</text><text class="t" x="80" y="376">不输出未授权副作用</text>
    <rect class="stage" x="260" y="288" width="164" height="128" rx="8" fill="#e5f3f2" stroke="#19877f"/>
    <text class="h" x="280" y="320">2. Perception</text><text class="t" x="280" y="350">DOM / A11y / 视觉</text><text class="t" x="280" y="376">窗口、滚动、弹窗状态</text>
    <rect class="stage" x="460" y="288" width="164" height="128" rx="8" fill="#f2eaf7" stroke="#7b5794"/>
    <text class="h" x="480" y="320">3. Grounding</text><text class="t" x="480" y="350">多源候选与歧义度</text><text class="t" x="480" y="376">语义、坐标、新鲜度</text>
    <rect class="stage" x="660" y="288" width="164" height="128" rx="8" fill="#fdebed" stroke="#c94f5d"/>
    <text class="h" x="680" y="320">4. Permit</text><text class="t" x="680" y="350">动作许可与风险检查</text><text class="t" x="680" y="376">批准与上下文绑定</text>
    <rect class="stage" x="860" y="288" width="164" height="128" rx="8" fill="#eaf3df" stroke="#648e42"/>
    <text class="h" x="880" y="320">5. Action</text><text class="t" x="880" y="350">一次受控浏览器动作</text><text class="t" x="880" y="376">记录实际落点与结果</text>
    <rect class="stage" x="1060" y="288" width="164" height="128" rx="8" fill="#e7f3ea" stroke="#37815f"/>
    <text class="h" x="1080" y="320">6. Oracle</text><text class="t" x="1080" y="350">UI、网络、业务结果</text><text class="t" x="1080" y="376">三态结果与证据缺口</text>
    <path class="flow" d="M224 352 H252"/><path class="flow" d="M424 352 H452"/><path class="flow" d="M624 352 H652"/><path class="flow" d="M824 352 H852"/><path class="flow" d="M1024 352 H1052"/>
  </g>

  <g aria-label="恢复与证据">
    <rect x="48" y="492" width="790" height="142" rx="8" fill="#fff" stroke="#c8d3d9" stroke-width="2"/>
    <text class="h" x="70" y="524">证据封装与受限恢复</text>
    <text class="t" x="70" y="552">保存 before/after、DOM/A11y/截图摘要、窗口与滚动、候选和许可</text>
    <text class="t" x="70" y="578">另存实际落点、网络事件引用、动作结果和 Oracle 输入</text>
    <text class="t" x="70" y="604">定位失败可重新观察、滚动或切换已授权窗口；每次消耗恢复预算</text>
    <text class="tiny" x="70" y="626">证据缺失或副作用未知时返回 UNKNOWN；自愈候选不能改写业务预期</text>

    <rect x="884" y="492" width="340" height="142" rx="8" fill="#fdebed" stroke="#c94f5d" stroke-width="2"/>
    <text class="h" x="906" y="524">安全停止 / 转人工</text>
    <text class="t" x="906" y="554">预算耗尽、上下文漂移、歧义目标</text>
    <text class="t" x="906" y="582">高风险无批准、证据采集失败</text>
    <text class="tiny" x="906" y="610">停止后不继续尝试副作用动作</text>
  </g>

  <path class="flow" d="M1142 424 C1142 464 142 464 142 424"/>
  <path class="stop" d="M742 424 C742 462 1054 456 1054 484"/>
  <path class="stop" d="M1142 424 V484"/>
  <text class="tiny" x="50" y="683">受控自动化的通过条件是合同后置条件被独立证据支持，而不是 Agent 顺利走完计划</text>
</svg>
