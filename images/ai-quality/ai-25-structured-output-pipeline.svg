<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">大模型结构化输出的五层校验流水线</title>
  <desc id="desc">展示提供商终态、JSON 完整解析、JSON Schema 校验、业务事实校验和权限副作用校验五层，强调语法有效不等于业务有效。</desc>
  <style>
    .bg { fill: #f8fafc; }
    .title { font: 700 32px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
    .sub { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
    .h { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
    .t { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
    .small { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .provider { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.5; }
    .json { fill: #ecfeff; stroke: #0891b2; stroke-width: 2.5; }
    .schema { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2.5; }
    .business { fill: #fff7ed; stroke: #ea580c; stroke-width: 2.5; }
    .action { fill: #ecfdf5; stroke: #059669; stroke-width: 2.5; }
    .fail { fill: #fff1f2; stroke: #e11d48; stroke-width: 2; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
    .arrow { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    .down { stroke: #e11d48; stroke-width: 2; fill: none; stroke-dasharray: 6 5; marker-end: url(#red); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#e11d48"/></marker>
  </defs>
  <rect class="bg" width="1280" height="800"/>
  <text class="title" x="54" y="58">语法有效 ≠ Schema 有效 ≠ 业务有效</text>
  <text class="sub" x="54" y="90">约束解码提高生成成功率；接收端仍需先识别协议终态，再逐层验证结构、事实、权限和副作用。</text>

  <rect class="provider" x="54" y="156" width="208" height="146" rx="8"/>
  <text class="h" x="78" y="190">1. 提供商响应终态</text>
  <text class="t" x="78" y="220">completed / refusal</text>
  <text class="t" x="78" y="244">incomplete / error</text>
  <text class="t" x="78" y="268">文本或全部工具调用块</text>
  <text class="small" x="78" y="289" fill="#1d4ed8">先看 envelope</text>
  <path class="arrow" d="M262 229 L286 229"/>

  <rect class="json" x="290" y="156" width="208" height="146" rx="8"/>
  <text class="h" x="314" y="190">2. JSON 严格解析</text>
  <text class="t" x="314" y="220">完整单值 / 根对象</text>
  <text class="t" x="314" y="244">编码 / 尾随内容</text>
  <text class="t" x="314" y="268">拒绝重复键与半截对象</text>
  <text class="small" x="314" y="289" fill="#0e7490">syntax boundary</text>
  <path class="arrow" d="M498 229 L522 229"/>

  <rect class="schema" x="526" y="156" width="208" height="146" rx="8"/>
  <text class="h" x="550" y="190">3. JSON Schema</text>
  <text class="t" x="550" y="220">dialect / required / enum</text>
  <text class="t" x="550" y="244">additionalProperties</text>
  <text class="t" x="550" y="268">联合 / format 配置</text>
  <text class="small" x="550" y="289" fill="#6d28d9">structure contract</text>
  <path class="arrow" d="M734 229 L758 229"/>

  <rect class="business" x="762" y="156" width="208" height="146" rx="8"/>
  <text class="h" x="786" y="190">4. 业务二次校验</text>
  <text class="t" x="786" y="220">金额 / 币种 / 状态机</text>
  <text class="t" x="786" y="244">租户 / 证据归属</text>
  <text class="t" x="786" y="268">实时余额与事实新鲜度</text>
  <text class="small" x="786" y="289" fill="#c2410c">trusted state</text>
  <path class="arrow" d="M970 229 L994 229"/>

  <rect class="action" x="998" y="156" width="228" height="146" rx="8"/>
  <text class="h" x="1022" y="190">5. 权限与副作用</text>
  <text class="t" x="1022" y="220">身份 / 工具白名单</text>
  <text class="t" x="1022" y="244">审批 / 额度 / 幂等</text>
  <text class="t" x="1022" y="268">全部通过才允许执行</text>
  <text class="small" x="1022" y="289" fill="#047857">execution boundary</text>

  <path class="down" d="M158 302 L158 352"/>
  <path class="down" d="M394 302 L394 352"/>
  <path class="down" d="M630 302 L630 352"/>
  <path class="down" d="M866 302 L866 352"/>
  <path class="down" d="M1112 302 L1112 352"/>

  <rect class="fail" x="54" y="356" width="208" height="100" rx="8"/>
  <text class="h" x="78" y="388">协议失败</text>
  <text class="t" x="78" y="415">拒答、截断、限流、流中断</text>
  <text class="small" x="78" y="438" fill="#be123c">不进入 JSON 解析</text>
  <rect class="fail" x="290" y="356" width="208" height="100" rx="8"/>
  <text class="h" x="314" y="388">语法失败</text>
  <text class="t" x="314" y="415">无效 JSON / 重复键 / 尾随</text>
  <text class="small" x="314" y="438" fill="#be123c">不做正则补丁后执行</text>
  <rect class="fail" x="526" y="356" width="208" height="100" rx="8"/>
  <text class="h" x="550" y="388">契约失败</text>
  <text class="t" x="550" y="415">缺字段、额外字段、枚举越界</text>
  <text class="small" x="550" y="438" fill="#be123c">记录路径与关键字</text>
  <rect class="fail" x="762" y="356" width="208" height="100" rx="8"/>
  <text class="h" x="786" y="388">业务失败</text>
  <text class="t" x="786" y="415">超额 / 证据越界 / 非法状态</text>
  <text class="small" x="786" y="438" fill="#be123c">重读可信事实</text>
  <rect class="fail" x="998" y="356" width="228" height="100" rx="8"/>
  <text class="h" x="1022" y="388">执行阻断</text>
  <text class="t" x="1022" y="415">越权、未审批、重复幂等键</text>
  <text class="small" x="1022" y="438" fill="#be123c">阻断并审计</text>

  <rect class="panel" x="54" y="508" width="570" height="196" rx="8"/>
  <text class="h" x="82" y="544">完整领域 Schema 与提供商 profile 分工</text>
  <rect x="82" y="572" width="230" height="98" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text class="h" x="102" y="603">domain.schema.json</text>
  <text class="t" x="102" y="630">明确 Draft 2020-12</text>
  <text class="small" x="102" y="651" fill="#6d28d9">接收端最终结构合同</text>
  <path class="arrow" d="M312 621 L352 621"/>
  <rect x="356" y="572" width="240" height="98" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text class="h" x="376" y="603">provider profile</text>
  <text class="t" x="376" y="630">适配目标接口支持子集</text>
  <text class="small" x="376" y="651" fill="#1d4ed8">提高生成结构成功率</text>

  <rect class="panel" x="654" y="508" width="572" height="196" rx="8"/>
  <text class="h" x="682" y="544">一个可接受结果需要同时成立</text>
  <rect x="682" y="574" width="516" height="96" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text class="t" x="706" y="602">✓ 提供商正常完成，非 refusal、非 incomplete</text>
  <text class="t" x="706" y="626">✓ 实例通过记录版本的 Schema 与 format 配置</text>
  <text class="t" x="706" y="650">✓ 当前事实、租户、权限、状态和幂等校验全部通过</text>

  <rect x="54" y="734" width="1172" height="42" rx="8" fill="#0f172a"/>
  <text x="78" y="761" style="font: 600 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #ffffff;">约束解码不是信任授予：模型输出仍是外部输入，工具凭据和最终授权始终留在确定性执行边界。</text>
</svg>
