<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="cpm-title cpm-desc">
  <title id="cpm-title">长上下文位置与冲突联合测试矩阵</title>
  <desc id="cpm-desc">横轴为证据在上下文中的七个相对位置，纵轴为无冲突、新旧版本、权威倒置、同级矛盾、否定覆盖和压缩残留六类条件。每个单元同时检查选择、使用、引用和裁决；右侧显示失败签名，底部展示从单元观测到首错层和发布决策的方向。</desc>
  <defs>
    <linearGradient id="cpm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#fff9f2"/>
    </linearGradient>
    <filter id="cpm-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#29384b" flood-opacity="0.13"/>
    </filter>
    <marker id="cpm-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#51657e"/>
    </marker>
    <style>
      .t { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#203047; }
      .h1 { font-size:27px; font-weight:700; }
      .sub { font-size:14px; fill:#596a80; }
      .title { font-size:17px; font-weight:700; }
      .label { font-size:14px; font-weight:650; }
      .small { font-size:12px; fill:#465971; }
      .cell { font-size:12px; font-weight:700; text-anchor:middle; }
      .flow { stroke:#51657e; stroke-width:2.2; fill:none; marker-end:url(#cpm-arrow); }
    </style>
  </defs>
  <rect width="1280" height="720" rx="24" fill="url(#cpm-bg)"/>
  <text x="44" y="46" class="t h1">位置 × 冲突：42 个单元不是 42 次相同问答</text>
  <text x="44" y="71" class="t sub">每格同时断言 S=选择、U=使用、C=引用、R=裁决；以同一真值、同一 Token 总量和同一干扰集做配对比较。</text>

  <g filter="url(#cpm-shadow)">
    <rect x="40" y="102" width="930" height="462" rx="16" fill="#fff" stroke="#b8c6d6"/>
    <text x="60" y="132" class="t title">证据相对位置（按实际 Token 边界）</text>
    <path d="M270 145 L909 145" class="flow"/>
    <text x="202" y="150" class="t small">上下文开始</text><text x="908" y="150" class="t small" text-anchor="end">问题之前</text>

    <g class="t label" text-anchor="middle">
      <text x="298" y="178">0%</text><text x="388" y="178">10%</text><text x="478" y="178">25%</text>
      <text x="568" y="178">50%</text><text x="658" y="178">75%</text><text x="748" y="178">90%</text><text x="838" y="178">100%</text>
    </g>

    <g class="t label">
      <rect x="58" y="193" width="184" height="48" rx="8" fill="#e7f4ff" stroke="#91bfe8"/><text x="72" y="216">基线：唯一有效事实</text><text x="72" y="233" class="small">期待：答对 + 精确引用</text>
      <rect x="58" y="249" width="184" height="48" rx="8" fill="#fff0da" stroke="#e5b464"/><text x="72" y="272">新旧版本：旧后新前</text><text x="72" y="289" class="small">期待：按生效时间选新</text>
      <rect x="58" y="305" width="184" height="48" rx="8" fill="#ffe9ed" stroke="#d58b98"/><text x="72" y="328">权威倒置：低权在后</text><text x="72" y="345" class="small">期待：权威高者胜</text>
      <rect x="58" y="361" width="184" height="48" rx="8" fill="#f1eafd" stroke="#ac91d5"/><text x="72" y="384">同级矛盾：无 winner</text><text x="72" y="401" class="small">期待：显式未决/澄清</text>
      <rect x="58" y="417" width="184" height="48" rx="8" fill="#e9f8ef" stroke="#78bd92"/><text x="72" y="440">否定覆盖：允许→禁止</text><text x="72" y="457" class="small">期待：保留否定与范围</text>
      <rect x="58" y="473" width="184" height="48" rx="8" fill="#edf0f5" stroke="#9eacbd"/><text x="72" y="496">压缩残留：旧摘要在场</text><text x="72" y="513" class="small">期待：新原文胜 + 回源</text>
    </g>

    <g stroke="#d3dce7">
      <path d="M253 187 V529 M343 187 V529 M433 187 V529 M523 187 V529 M613 187 V529 M703 187 V529 M793 187 V529 M883 187 V529"/>
      <path d="M253 193 H883 M253 249 H883 M253 305 H883 M253 361 H883 M253 417 H883 M253 473 H883 M253 529 H883"/>
    </g>

    <g>
      <g fill="#dff1ff" stroke="#7db4e3">
        <rect x="261" y="201" width="74" height="32" rx="7"/><rect x="351" y="201" width="74" height="32" rx="7"/><rect x="441" y="201" width="74" height="32" rx="7"/><rect x="531" y="201" width="74" height="32" rx="7"/><rect x="621" y="201" width="74" height="32" rx="7"/><rect x="711" y="201" width="74" height="32" rx="7"/><rect x="801" y="201" width="74" height="32" rx="7"/>
      </g>
      <g fill="#ffedce" stroke="#dfa84c">
        <rect x="261" y="257" width="74" height="32" rx="7"/><rect x="351" y="257" width="74" height="32" rx="7"/><rect x="441" y="257" width="74" height="32" rx="7"/><rect x="531" y="257" width="74" height="32" rx="7"/><rect x="621" y="257" width="74" height="32" rx="7"/><rect x="711" y="257" width="74" height="32" rx="7"/><rect x="801" y="257" width="74" height="32" rx="7"/>
      </g>
      <g fill="#ffe3e8" stroke="#d17d8c">
        <rect x="261" y="313" width="74" height="32" rx="7"/><rect x="351" y="313" width="74" height="32" rx="7"/><rect x="441" y="313" width="74" height="32" rx="7"/><rect x="531" y="313" width="74" height="32" rx="7"/><rect x="621" y="313" width="74" height="32" rx="7"/><rect x="711" y="313" width="74" height="32" rx="7"/><rect x="801" y="313" width="74" height="32" rx="7"/>
      </g>
      <g fill="#eee5fb" stroke="#9d80cd">
        <rect x="261" y="369" width="74" height="32" rx="7"/><rect x="351" y="369" width="74" height="32" rx="7"/><rect x="441" y="369" width="74" height="32" rx="7"/><rect x="531" y="369" width="74" height="32" rx="7"/><rect x="621" y="369" width="74" height="32" rx="7"/><rect x="711" y="369" width="74" height="32" rx="7"/><rect x="801" y="369" width="74" height="32" rx="7"/>
      </g>
      <g fill="#e3f6eb" stroke="#6fb488">
        <rect x="261" y="425" width="74" height="32" rx="7"/><rect x="351" y="425" width="74" height="32" rx="7"/><rect x="441" y="425" width="74" height="32" rx="7"/><rect x="531" y="425" width="74" height="32" rx="7"/><rect x="621" y="425" width="74" height="32" rx="7"/><rect x="711" y="425" width="74" height="32" rx="7"/><rect x="801" y="425" width="74" height="32" rx="7"/>
      </g>
      <g fill="#e9edf3" stroke="#929fb1">
        <rect x="261" y="481" width="74" height="32" rx="7"/><rect x="351" y="481" width="74" height="32" rx="7"/><rect x="441" y="481" width="74" height="32" rx="7"/><rect x="531" y="481" width="74" height="32" rx="7"/><rect x="621" y="481" width="74" height="32" rx="7"/><rect x="711" y="481" width="74" height="32" rx="7"/><rect x="801" y="481" width="74" height="32" rx="7"/>
      </g>
      <g class="t cell">
        <text x="298" y="222">S·U·C</text><text x="388" y="222">S·U·C</text><text x="478" y="222">S·U·C</text><text x="568" y="222">S·U·C</text><text x="658" y="222">S·U·C</text><text x="748" y="222">S·U·C</text><text x="838" y="222">S·U·C</text>
        <text x="298" y="278">S·U·R</text><text x="388" y="278">S·U·R</text><text x="478" y="278">S·U·R</text><text x="568" y="278">S·U·R</text><text x="658" y="278">S·U·R</text><text x="748" y="278">S·U·R</text><text x="838" y="278">S·U·R</text>
        <text x="298" y="334">S·U·R</text><text x="388" y="334">S·U·R</text><text x="478" y="334">S·U·R</text><text x="568" y="334">S·U·R</text><text x="658" y="334">S·U·R</text><text x="748" y="334">S·U·R</text><text x="838" y="334">S·U·R</text>
        <text x="298" y="390">S·R·Ø</text><text x="388" y="390">S·R·Ø</text><text x="478" y="390">S·R·Ø</text><text x="568" y="390">S·R·Ø</text><text x="658" y="390">S·R·Ø</text><text x="748" y="390">S·R·Ø</text><text x="838" y="390">S·R·Ø</text>
        <text x="298" y="446">S·U·R</text><text x="388" y="446">S·U·R</text><text x="478" y="446">S·U·R</text><text x="568" y="446">S·U·R</text><text x="658" y="446">S·U·R</text><text x="748" y="446">S·U·R</text><text x="838" y="446">S·U·R</text>
        <text x="298" y="502">S·U·C</text><text x="388" y="502">S·U·C</text><text x="478" y="502">S·U·C</text><text x="568" y="502">S·U·C</text><text x="658" y="502">S·U·C</text><text x="748" y="502">S·U·C</text><text x="838" y="502">S·U·C</text>
      </g>
    </g>
    <text x="58" y="548" class="t small">Ø = 正确拒绝唯一答案；位置配对差异与绝对失败率同时报告，禁止只挑最好位置。</text>
  </g>

  <g filter="url(#cpm-shadow)">
    <rect x="994" y="102" width="246" height="462" rx="16" fill="#f8f4fd" stroke="#b6a3d4"/>
    <text x="1012" y="132" class="t title">失败签名 → 首查层</text>
    <rect x="1010" y="153" width="214" height="58" rx="9" fill="#fff" stroke="#a9c9e9"/>
    <text x="1024" y="176" class="t label">整列下陷</text><text x="1024" y="196" class="t small">位置/截断/序列化边界</text>
    <rect x="1010" y="222" width="214" height="58" rx="9" fill="#fff" stroke="#e4bd76"/>
    <text x="1024" y="245" class="t label">随长度单调恶化</text><text x="1024" y="265" class="t small">有效上下文或密度瓶颈</text>
    <rect x="1010" y="291" width="214" height="58" rx="9" fill="#fff" stroke="#d99aa4"/>
    <text x="1024" y="314" class="t label">只在冲突行失败</text><text x="1024" y="334" class="t small">时效/权威/否定裁决</text>
    <rect x="1010" y="360" width="214" height="58" rx="9" fill="#fff" stroke="#94c5a6"/>
    <text x="1024" y="383" class="t label">答案对、引用错</text><text x="1024" y="403" class="t small">参数知识猜中或引用映射错</text>
    <rect x="1010" y="429" width="214" height="58" rx="9" fill="#fff" stroke="#b6a2d4"/>
    <text x="1024" y="452" class="t label">压缩后才失败</text><text x="1024" y="472" class="t small">摘要遗漏/代际漂移/未回源</text>
    <rect x="1010" y="498" width="214" height="48" rx="9" fill="#203047"/>
    <text x="1024" y="527" class="t label" fill="#fff">先复现，后归因</text>
  </g>

  <g filter="url(#cpm-shadow)">
    <rect x="64" y="598" width="1152" height="86" rx="16" fill="#fff" stroke="#b8c6d6"/>
    <rect x="84" y="617" width="188" height="48" rx="10" fill="#e7f4ff" stroke="#8cb9e3"/><text x="178" y="638" class="t label" text-anchor="middle">单元观测</text><text x="178" y="656" class="t small" text-anchor="middle">输出 + item/span trace</text>
    <path d="M275 641 L350 641" class="flow"/>
    <rect x="354" y="617" width="188" height="48" rx="10" fill="#fff0da" stroke="#deb266"/><text x="448" y="638" class="t label" text-anchor="middle">配对差异</text><text x="448" y="656" class="t small" text-anchor="middle">仅位置/冲突轴变化</text>
    <path d="M545 641 L620 641" class="flow"/>
    <rect x="624" y="617" width="188" height="48" rx="10" fill="#f0e9fb" stroke="#a58bce"/><text x="718" y="638" class="t label" text-anchor="middle">首错层推断</text><text x="718" y="656" class="t small" text-anchor="middle">带替代解释与证据</text>
    <path d="M815 641 L890 641" class="flow"/>
    <rect x="894" y="617" width="298" height="48" rx="10" fill="#e8f7ee" stroke="#78b98e"/><text x="1043" y="638" class="t label" text-anchor="middle">发布决策</text><text x="1043" y="656" class="t small" text-anchor="middle">放行 / 限长 / 回退 / 阻断</text>
  </g>
</svg>
