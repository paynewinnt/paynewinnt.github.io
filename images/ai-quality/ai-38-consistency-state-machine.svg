<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">知识索引投影的一致性状态机</title>
  <desc id="desc">展示文档投影从不存在到活动、迁移、撤权或删除的状态变化。每次转换先比较源纪元和单调版本；重复事件保持原状态，低版本事件被忽略，失败进入可重试状态，对账发现差异后进入修复再复验。</desc>
  <style>
    .bg { fill: #f8fafc; }
    .title { font: 700 31px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #172033; }
    .sub { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #526077; }
    .h { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #172033; }
    .t { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #344258; }
    .small { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .neutral { fill: #ffffff; stroke: #94a3b8; stroke-width: 2.5; }
    .active { fill: #ecfdf5; stroke: #059669; stroke-width: 2.5; }
    .migrate { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.5; }
    .revoke { fill: #fff1f2; stroke: #e11d48; stroke-width: 2.5; }
    .delete { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2.5; }
    .repair { fill: #fffbeb; stroke: #d97706; stroke-width: 2.5; }
    .arrow { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
    .danger { fill: none; stroke: #e11d48; stroke-width: 3; marker-end: url(#danger); }
    .retry { fill: none; stroke: #d97706; stroke-width: 2.5; stroke-dasharray: 7 6; marker-end: url(#retry); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#64748b"/></marker>
    <marker id="danger" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#e11d48"/></marker>
    <marker id="retry" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#d97706"/></marker>
  </defs>

  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="42" y="50">版本先行的投影状态机：乱序、重复和部分失败都必须收敛</text>
  <text class="sub" x="42" y="80">比较键为 (source_epoch, entity_version)；事件时间只用于延迟度量，不用于裁决新旧。</text>

  <rect class="neutral" x="48" y="148" width="174" height="112" rx="7"/>
  <text class="h" x="79" y="187">ABSENT</text>
  <text class="t" x="69" y="218">无可见投影</text>
  <text class="small" x="69" y="244" fill="#64748b">ledger 可为空</text>
  <path class="arrow" d="M222 204 L305 204"/>
  <text class="small" x="237" y="185" fill="#475569">UPSERT v1</text>

  <rect class="active" x="309" y="132" width="218" height="144" rx="7"/>
  <text class="h" x="374" y="171">ACTIVE vN</text>
  <text class="t" x="333" y="202">内容、ACL、分片均带版本</text>
  <text class="t" x="333" y="229">缓存键包含投影版本</text>
  <text class="small" x="333" y="256" fill="#047857">仅版本更大才能改写</text>

  <path class="arrow" d="M527 174 L610 174"/>
  <text class="small" x="545" y="154" fill="#475569">迁移开始</text>
  <rect class="migrate" x="614" y="116" width="238" height="176" rx="7"/>
  <text class="h" x="672" y="154">MIGRATING vN</text>
  <text class="t" x="638" y="185">旧索引继续服务</text>
  <text class="t" x="638" y="212">新索引回填 + 双写</text>
  <text class="t" x="638" y="239">按版本和内容哈希对账</text>
  <text class="small" x="638" y="269" fill="#1d4ed8">切换读别名后保留回滚窗</text>
  <path class="arrow" d="M733 292 C733 343 421 343 421 280"/>
  <text class="small" x="634" y="322" fill="#1d4ed8">验收通过：切换新代</text>

  <path class="danger" d="M418 276 L418 382"/>
  <text class="small" x="438" y="365" fill="#be123c">ACL_REVOKE vN+1</text>
  <rect class="revoke" x="294" y="386" width="248" height="136" rx="7"/>
  <text class="h" x="352" y="425">REVOKED vR</text>
  <text class="t" x="318" y="456">守卫立即拒绝被撤主体</text>
  <text class="t" x="318" y="483">异步清理索引与缓存副本</text>
  <text class="small" x="318" y="508" fill="#be123c">授权恢复必须使用更高版本</text>

  <path class="danger" d="M309 230 C252 230 252 444 184 444"/>
  <text class="small" x="176" y="323" fill="#be123c">DELETE vD</text>
  <rect class="delete" x="48" y="386" width="218" height="136" rx="7"/>
  <text class="h" x="93" y="425">TOMBSTONED vD</text>
  <text class="t" x="72" y="456">查询不可见，保留墓碑</text>
  <text class="t" x="72" y="483">拒绝所有低版本复活</text>
  <text class="small" x="72" y="508" fill="#6d28d9">到期前不得物理遗忘版本</text>

  <rect class="repair" x="914" y="132" width="314" height="144" rx="7"/>
  <text class="h" x="978" y="171">RETRY / REPAIR</text>
  <text class="t" x="938" y="202">副作用成功但账本失败</text>
  <text class="t" x="938" y="229">对账发现缺片、残片或错 ACL</text>
  <text class="small" x="938" y="256" fill="#b45309">按同一目标版本幂等重放</text>
  <path class="retry" d="M852 204 L910 204"/>
  <text class="small" x="855" y="185" fill="#b45309">失败</text>
  <path class="retry" d="M1068 132 C1068 91 733 91 733 112"/>
  <text class="small" x="846" y="101" fill="#b45309">复验通过返回目标状态</text>

  <text class="h" x="594" y="390">任何状态都先执行版本裁决</text>
  <rect class="neutral" x="594" y="410" width="634" height="112" rx="7"/>
  <text class="t" x="618" y="441">event.version &lt; ledger.version：STALE，记录后忽略，不触碰索引</text>
  <text class="t" x="618" y="470">event.version = ledger.version：DUPLICATE，校验结果哈希后幂等返回</text>
  <text class="t" x="618" y="499">event.version &gt; ledger.version：APPLY；删除与撤权先阻断读取，再清理派生副本</text>

  <text class="h" x="48" y="576">必须持续验证的四条不变量</text>
  <rect class="active" x="48" y="596" width="270" height="78" rx="7"/>
  <text class="t" x="68" y="626">可见版本不倒退</text>
  <text class="small" x="68" y="654" fill="#047857">乱序到达不能覆盖新状态</text>
  <rect class="revoke" x="340" y="596" width="270" height="78" rx="7"/>
  <text class="t" x="360" y="626">撤权优先于内容新鲜</text>
  <text class="small" x="360" y="654" fill="#be123c">安全暴露窗口独立计时</text>
  <rect class="delete" x="632" y="596" width="270" height="78" rx="7"/>
  <text class="t" x="652" y="626">墓碑阻止旧事件复活</text>
  <text class="small" x="652" y="654" fill="#6d28d9">所有索引代都必须删除</text>
  <rect class="repair" x="924" y="596" width="304" height="78" rx="7"/>
  <text class="t" x="944" y="626">账本与副作用最终一致</text>
  <text class="small" x="944" y="654" fill="#b45309">差异可分类、可重放、可复验</text>
</svg>
