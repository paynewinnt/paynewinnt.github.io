<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">从请求到生成结果的大模型推理流水线</title>
  <desc id="desc">请求依次经过接入与编排、tokenization、调度、embedding、Transformer、logits 和采样，再经停止判断、detokenization 和流式协议返回。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <style>
      .base { font-family: Arial, "Noto Sans SC", "Microsoft YaHei", sans-serif; }
      .title { font-size: 32px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 17px; fill: #475569; }
      .stage-title { font-size: 21px; font-weight: 700; fill: #0f172a; }
      .stage-text { font-size: 16px; fill: #334155; }
      .small { font-size: 15px; fill: #475569; }
      .lane { font-size: 18px; font-weight: 700; fill: #ffffff; }
      .arrow { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1280" height="800" fill="#f8fafc"/>
  <rect x="0" y="0" width="1280" height="8" fill="#0891b2"/>

  <g class="base">
    <text x="56" y="58" class="title">从请求到生成结果：一条可测试的推理流水线</text>
    <text x="56" y="88" class="subtitle">最终文本只是输出面；每个阶段都有独立版本、指标、失败模式和证据</text>

    <g transform="translate(940,35)">
      <rect width="284" height="62" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <circle cx="20" cy="20" r="6" fill="#2563eb"/>
      <text x="34" y="25" class="small">接入与输入</text>
      <circle cx="142" cy="20" r="6" fill="#7c3aed"/>
      <text x="156" y="25" class="small">模型计算</text>
      <circle cx="20" cy="45" r="6" fill="#0f766e"/>
      <text x="34" y="50" class="small">生成控制</text>
      <circle cx="142" cy="45" r="6" fill="#d97706"/>
      <text x="156" y="50" class="small">返回协议</text>
    </g>

    <rect x="38" y="126" width="34" height="166" rx="5" fill="#2563eb"/>
    <text x="54" y="224" class="lane" text-anchor="middle" transform="rotate(-90 54 224)">接入与输入</text>

    <path d="M330 208 L360 208" class="arrow"/>
    <path d="M630 208 L660 208" class="arrow"/>
    <path d="M930 208 L960 208" class="arrow"/>
    <path d="M1095 292 L1095 326 L195 326 L195 356" class="arrow"/>

    <g transform="translate(90,132)">
      <rect width="240" height="160" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
      <rect width="240" height="9" rx="6" fill="#2563eb"/>
      <text x="18" y="42" class="stage-title">1. 请求接入</text>
      <text x="18" y="73" class="stage-text">认证、限流、Schema</text>
      <text x="18" y="101" class="stage-text">request_id、租户、配额</text>
      <text x="18" y="136" class="small">观察：网关耗时、拒绝原因</text>
    </g>

    <g transform="translate(360,132)">
      <rect width="270" height="160" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
      <rect width="270" height="9" rx="6" fill="#2563eb"/>
      <text x="18" y="42" class="stage-title">2. 上下文编排</text>
      <text x="18" y="73" class="stage-text">模板、历史、RAG、工具</text>
      <text x="18" y="101" class="stage-text">长度预算与截断策略</text>
      <text x="18" y="136" class="small">观察：各类 token、版本、截断</text>
    </g>

    <g transform="translate(660,132)">
      <rect width="270" height="160" rx="6" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
      <rect width="270" height="9" rx="6" fill="#0891b2"/>
      <text x="18" y="42" class="stage-title">3. Tokenization</text>
      <text x="18" y="73" class="stage-text">规范化、子词、特殊 token</text>
      <text x="18" y="101" class="stage-text">文本映射为 token ID</text>
      <text x="18" y="136" class="small">观察：哈希、ID、边界、长度</text>
    </g>

    <g transform="translate(960,132)">
      <rect width="270" height="160" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
      <rect width="270" height="9" rx="6" fill="#7c3aed"/>
      <text x="18" y="42" class="stage-title">4. 调度与批处理</text>
      <text x="18" y="73" class="stage-text">排队、路由、连续批处理</text>
      <text x="18" y="101" class="stage-text">缓存与计算资源分配</text>
      <text x="18" y="136" class="small">观察：队列、并发、缓存压力</text>
    </g>

    <rect x="38" y="350" width="34" height="166" rx="5" fill="#7c3aed"/>
    <text x="54" y="449" class="lane" text-anchor="middle" transform="rotate(-90 54 449)">模型计算</text>

    <path d="M330 432 L360 432" class="arrow"/>
    <path d="M630 432 L660 432" class="arrow"/>
    <path d="M930 432 L960 432" class="arrow"/>
    <path d="M1095 516 L1095 550 L195 550 L195 580" class="arrow"/>

    <g transform="translate(90,356)">
      <rect width="240" height="160" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
      <rect width="240" height="9" rx="6" fill="#7c3aed"/>
      <text x="18" y="42" class="stage-title">5. Embedding</text>
      <text x="18" y="73" class="stage-text">ID 查表得到初始向量</text>
      <text x="18" y="101" class="stage-text">加入或应用位置信息</text>
      <text x="18" y="136" class="small">变体：绝对位置、RoPE 等</text>
    </g>

    <g transform="translate(360,356)">
      <rect width="270" height="160" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
      <rect width="270" height="9" rx="6" fill="#7c3aed"/>
      <text x="18" y="42" class="stage-title">6. Transformer × L</text>
      <text x="18" y="73" class="stage-text">Norm、Attention、MLP</text>
      <text x="18" y="101" class="stage-text">Residual、KV cache</text>
      <text x="18" y="136" class="small">观察：prefill、decode、数值</text>
    </g>

    <g transform="translate(660,356)">
      <rect width="270" height="160" rx="6" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
      <rect width="270" height="9" rx="6" fill="#0f766e"/>
      <text x="18" y="42" class="stage-title">7. Logits 处理</text>
      <text x="18" y="73" class="stage-text">词表投影、惩罚、约束</text>
      <text x="18" y="101" class="stage-text">temperature、top-k、top-p</text>
      <text x="18" y="136" class="small">观察：生效配置、候选分布</text>
    </g>

    <g transform="translate(960,356)">
      <rect width="270" height="160" rx="6" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
      <rect width="270" height="9" rx="6" fill="#0f766e"/>
      <text x="18" y="42" class="stage-title">8. Token 选择</text>
      <text x="18" y="73" class="stage-text">Greedy 或采样</text>
      <text x="18" y="101" class="stage-text">追加缓存并检查停止</text>
      <text x="18" y="136" class="small">未结束则回到模型继续 decode</text>
    </g>

    <rect x="38" y="574" width="34" height="166" rx="5" fill="#d97706"/>
    <text x="54" y="672" class="lane" text-anchor="middle" transform="rotate(-90 54 672)">输出与协议</text>

    <path d="M330 656 L360 656" class="arrow"/>
    <path d="M630 656 L660 656" class="arrow"/>
    <path d="M930 656 L960 656" class="arrow"/>

    <g transform="translate(90,580)">
      <rect width="240" height="160" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
      <rect width="240" height="9" rx="6" fill="#d97706"/>
      <text x="18" y="42" class="stage-title">9. Detokenize</text>
      <text x="18" y="73" class="stage-text">ID 还原文本片段</text>
      <text x="18" y="101" class="stage-text">Unicode 与子词拼接</text>
      <text x="18" y="136" class="small">观察：原始 ID、解码文本</text>
    </g>

    <g transform="translate(360,580)">
      <rect width="270" height="160" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
      <rect width="270" height="9" rx="6" fill="#d97706"/>
      <text x="18" y="42" class="stage-title">10. 输出后处理</text>
      <text x="18" y="73" class="stage-text">过滤、Schema、工具结构</text>
      <text x="18" y="101" class="stage-text">引用绑定与 finish reason</text>
      <text x="18" y="136" class="small">观察：raw 与 final 差异</text>
    </g>

    <g transform="translate(660,580)">
      <rect width="270" height="160" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
      <rect width="270" height="9" rx="6" fill="#d97706"/>
      <text x="18" y="42" class="stage-title">11. 流式组帧</text>
      <text x="18" y="73" class="stage-text">SSE / HTTP 增量事件</text>
      <text x="18" y="101" class="stage-text">chunk 不等于 token</text>
      <text x="18" y="136" class="small">观察：首有效内容、断连</text>
    </g>

    <g transform="translate(960,580)">
      <rect width="270" height="160" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
      <rect width="270" height="9" rx="6" fill="#ca8a04"/>
      <text x="18" y="42" class="stage-title">12. 客户端结果</text>
      <text x="18" y="73" class="stage-text">拼装文本或 tool call</text>
      <text x="18" y="101" class="stage-text">usage、状态、用户体验</text>
      <text x="18" y="136" class="small">指标：TTFT、ITL、E2E</text>
    </g>
  </g>
</svg>
