<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">知识库变更传播、权限优先与一致性证据架构</title>
  <desc id="desc">源系统在同一事务中写业务数据和 Outbox，CDC 将带单调版本的事件交给幂等投影器。删除和 ACL 撤销走高优先级通道，投影器更新双索引、墓碑与缓存，并以水位、账本和查询守卫提供新鲜度及权限证据。</desc>
  <style>
    .bg { fill: #f8fafc; }
    .title { font: 700 31px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #172033; }
    .sub { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #526077; }
    .h { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #172033; }
    .t { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #344258; }
    .label { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
    .green { fill: #ecfdf5; stroke: #059669; stroke-width: 2.5; }
    .blue { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.5; }
    .cyan { fill: #ecfeff; stroke: #0891b2; stroke-width: 2.5; }
    .violet { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2.5; }
    .amber { fill: #fffbeb; stroke: #d97706; stroke-width: 2.5; }
    .red { fill: #fff1f2; stroke: #e11d48; stroke-width: 2.5; }
    .arrow { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
    .priority { fill: none; stroke: #e11d48; stroke-width: 3; marker-end: url(#redArrow); }
    .evidence { fill: none; stroke: #7c3aed; stroke-width: 2.5; stroke-dasharray: 7 6; marker-end: url(#violetArrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#64748b"/></marker>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#e11d48"/></marker>
    <marker id="violetArrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#7c3aed"/></marker>
  </defs>

  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="42" y="50">索引是可重建投影：源真值、版本顺序和撤权时限共同定义正确性</text>
  <text class="sub" x="42" y="80">写入成功只证明源事务提交；可搜索、不可再见、权限生效和缓存收敛必须分别观测。</text>

  <text class="h" x="42" y="118">普通更新通道</text>
  <path class="arrow" d="M232 205 L276 205"/>
  <path class="arrow" d="M466 205 L510 205"/>
  <path class="arrow" d="M700 205 L744 205"/>
  <path class="arrow" d="M934 205 L978 205"/>

  <rect class="green" x="42" y="140" width="190" height="154" rx="7"/>
  <text class="h" x="62" y="174">源系统真值</text>
  <text class="t" x="62" y="204">文档 · ACL · 删除状态</text>
  <text class="t" x="62" y="231">同一事务分配版本</text>
  <text class="t" x="62" y="258">业务表 + Outbox</text>
  <text class="label" x="62" y="282" fill="#047857">唯一裁决来源</text>

  <rect class="blue" x="276" y="140" width="190" height="154" rx="7"/>
  <text class="h" x="296" y="174">CDC / Outbox</text>
  <text class="t" x="296" y="204">event_id · entity_key</text>
  <text class="t" x="296" y="231">source_epoch · version</text>
  <text class="t" x="296" y="258">commit_time · operation</text>
  <text class="label" x="296" y="282" fill="#1d4ed8">可重放事实日志</text>

  <rect class="cyan" x="510" y="140" width="190" height="154" rx="7"/>
  <text class="h" x="530" y="174">分区与水位</text>
  <text class="t" x="530" y="204">同实体进入同一分区</text>
  <text class="t" x="530" y="231">记录已见与连续水位</text>
  <text class="t" x="530" y="258">暴露缺口和积压年龄</text>
  <text class="label" x="530" y="282" fill="#0e7490">不依赖墙上时钟排序</text>

  <rect class="violet" x="744" y="140" width="190" height="154" rx="7"/>
  <text class="h" x="764" y="174">幂等投影器</text>
  <text class="t" x="764" y="204">比较单调版本</text>
  <text class="t" x="764" y="231">重复重放结果不变</text>
  <text class="t" x="764" y="258">账本 · 墓碑 · 修复任务</text>
  <text class="label" x="764" y="282" fill="#6d28d9">失败后安全重试</text>

  <rect class="amber" x="978" y="140" width="260" height="154" rx="7"/>
  <text class="h" x="998" y="174">派生读取面</text>
  <text class="t" x="998" y="204">当前索引 + 迁移索引</text>
  <text class="t" x="998" y="231">元数据过滤 + 查询守卫</text>
  <text class="t" x="998" y="258">答案缓存 + 检索缓存</text>
  <text class="label" x="998" y="282" fill="#b45309">命中不等于业务正确</text>

  <text class="h" x="42" y="350">删除与 ACL 撤销高优先级通道</text>
  <rect class="red" x="42" y="372" width="272" height="108" rx="7"/>
  <text class="h" x="62" y="405">安全关键事件</text>
  <text class="t" x="62" y="434">DELETE · ACL_REVOKE · 租户冻结</text>
  <text class="label" x="62" y="462" fill="#be123c">单独 SLO、队列和告警</text>
  <path class="priority" d="M314 426 L390 426"/>
  <rect class="red" x="394" y="372" width="272" height="108" rx="7"/>
  <text class="h" x="414" y="405">先阻断，再清理</text>
  <text class="t" x="414" y="434">权威守卫拒绝 + 写墓碑</text>
  <text class="label" x="414" y="462" fill="#be123c">异步删除所有副本与缓存</text>
  <path class="priority" d="M666 426 L742 426"/>
  <rect class="red" x="746" y="372" width="492" height="108" rx="7"/>
  <text class="h" x="766" y="405">暴露窗口的终点必须可证明</text>
  <text class="t" x="766" y="434">源提交 → 守卫生效 → 索引删除可见 → 缓存失效 → 对账确认</text>
  <text class="label" x="766" y="462" fill="#be123c">HTTP 200、删除请求成功或过滤表达式合法都不是证明</text>

  <text class="h" x="42" y="532">一致性证据面</text>
  <rect class="box" x="42" y="552" width="1196" height="112" rx="7"/>
  <text class="h" x="66" y="586">事件账本</text>
  <text class="t" x="66" y="615">event_id、实体版本、结果哈希</text>
  <text class="t" x="66" y="641">重试次数、失败阶段</text>
  <path class="evidence" d="M274 608 L340 608"/>
  <text class="h" x="356" y="586">新鲜度水位</text>
  <text class="t" x="356" y="615">源提交到可搜索的延迟分布</text>
  <text class="t" x="356" y="641">连续水位、缺口、最老积压</text>
  <path class="evidence" d="M590 608 L656 608"/>
  <text class="h" x="672" y="586">对账与修复</text>
  <text class="t" x="672" y="615">源清单、索引清单、墓碑清单</text>
  <text class="t" x="672" y="641">差异分类、限速回放、复验</text>
  <path class="evidence" d="M904 608 L970 608"/>
  <text class="h" x="986" y="586">审计结论</text>
  <text class="t" x="986" y="615">按租户、操作、版本切片</text>
  <text class="t" x="986" y="641">分子分母与原始证据可追溯</text>

  <rect x="42" y="681" width="1196" height="25" rx="6" fill="#172033"/>
  <text x="640" y="699" text-anchor="middle" style="font: 700 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #ffffff;">核心不变量：任何可见投影的版本不得落后于同实体已经生效的删除或撤权版本。</text>
</svg>
