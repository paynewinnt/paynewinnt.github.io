<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">在线评测抽样总体与影子流量证据矩阵</title>
  <desc id="desc">上半部分展示目标总体经过生产抽样框、分层随机抽样、可评测证据和成熟真值逐层收缩，要求分别记录每层分母；下半部分比较遥测、用户反馈、人工标注、影子流量和随机灰度能支持的结论，强调影子流量处理真实数据且不能直接证明用户结果。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#64748b"/></marker>
    <style>
      .bg{fill:#f8fafc}.title{font:700 31px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.sub{font:400 17px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}.h{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.t{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#334155}.small{font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}.arrow{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}.grid{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.yes{fill:#dcfce7}.partial{fill:#fef3c7}.no{fill:#fee2e2}.risk{fill:#f3e8ff}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="48" y="46">先看样本从哪里消失，再判断每种在线证据能证明什么</text>
  <text class="sub" x="48" y="77">“收集了很多反馈”和“影子候选胜率更高”都不是总体业务改进的同义词。</text>

  <text class="h" x="48" y="119">抽样漏斗：每一层都保留独立计数和排除原因</text>
  <rect x="48" y="140" width="208" height="116" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text class="h" x="68" y="171">目标总体 U</text>
  <text class="t" x="68" y="199">要支持决策的任务</text><text class="small" x="68" y="223">含未登录、失败、低频分层</text><text class="small" x="68" y="244">定义时间窗与评测单位</text>
  <path class="arrow" d="M256 198 L286 198"/>
  <rect x="290" y="140" width="208" height="116" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text class="h" x="310" y="171">生产抽样框 F</text>
  <text class="t" x="310" y="199">已记录且可去重</text><text class="small" x="310" y="223">日志缺失 · opt-out 单列</text><text class="small" x="310" y="244">coverage = |F| / |U|</text>
  <path class="arrow" d="M498 198 L528 198"/>
  <rect x="532" y="140" width="208" height="116" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text class="h" x="552" y="171">概率样本 S</text>
  <text class="t" x="552" y="199">分层、保留、随机</text><text class="small" x="552" y="223">每项保存 πᵢ 与 policy</text><text class="small" x="552" y="244">强制事故样本另报</text>
  <path class="arrow" d="M740 198 L770 198"/>
  <rect x="774" y="140" width="208" height="116" rx="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text class="h" x="794" y="171">可评测样本 E</text>
  <text class="t" x="794" y="199">证据完整且可裁决</text><text class="small" x="794" y="223">遮蔽、冲突、损坏单列</text><text class="small" x="794" y="244">不能把缺失自动记失败</text>
  <path class="arrow" d="M982 198 L1012 198"/>
  <rect x="1016" y="140" width="216" height="116" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text class="h" x="1036" y="171">成熟真值 L</text>
  <text class="t" x="1036" y="199">due_at ≤ as_of</text><text class="small" x="1036" y="223">到达、修订、申诉留版本</text><text class="small" x="1036" y="244">完整率 = observed / due</text>

  <text class="h" x="48" y="302">证据矩阵：绿色可直接支持，黄色只能辅助，红色不支持该结论</text>
  <rect class="grid" x="48" y="322" width="226" height="48"/><text class="h" x="66" y="352">证据来源</text>
  <rect class="grid" x="274" y="322" width="184" height="48"/><text class="t" x="296" y="352">系统行为 / 回归</text>
  <rect class="grid" x="458" y="322" width="184" height="48"/><text class="t" x="487" y="352">总体质量估计</text>
  <rect class="grid" x="642" y="322" width="184" height="48"/><text class="t" x="671" y="352">用户结果因果效应</text>
  <rect class="grid" x="826" y="322" width="184" height="48"/><text class="t" x="854" y="352">真实数据 / 下游风险</text>
  <rect class="grid" x="1010" y="322" width="222" height="48"/><text class="t" x="1032" y="352">正确用法</text>

  <rect class="grid" x="48" y="370" width="226" height="54"/><text class="t" x="66" y="402">全量遥测与规则</text>
  <rect class="yes" x="274" y="370" width="184" height="54"/><text class="t" x="344" y="402">是</text>
  <rect class="partial" x="458" y="370" width="184" height="54"/><text class="t" x="509" y="402">仅代理指标</text>
  <rect class="no" x="642" y="370" width="184" height="54"/><text class="t" x="711" y="402">否</text>
  <rect class="partial" x="826" y="370" width="184" height="54"/><text class="t" x="877" y="402">按日志字段</text>
  <rect class="grid" x="1010" y="370" width="222" height="54"/><text class="small" x="1028" y="395">故障发现、分层计数</text><text class="small" x="1028" y="414">不替代标签</text>

  <rect class="grid" x="48" y="424" width="226" height="54"/><text class="t" x="66" y="456">自愿用户反馈</text>
  <rect class="partial" x="274" y="424" width="184" height="54"/><text class="t" x="325" y="456">可定位个案</text>
  <rect class="partial" x="458" y="424" width="184" height="54"/><text class="t" x="501" y="456">需响应校正</text>
  <rect class="no" x="642" y="424" width="184" height="54"/><text class="t" x="711" y="456">通常否</text>
  <rect class="risk" x="826" y="424" width="184" height="54"/><text class="t" x="869" y="456">内容与身份</text>
  <rect class="grid" x="1010" y="424" width="222" height="54"/><text class="small" x="1028" y="449">申诉入口、风险发现</text><text class="small" x="1028" y="468">报告 response rate</text>

  <rect class="grid" x="48" y="478" width="226" height="54"/><text class="t" x="66" y="510">概率抽样 + 盲审/真值</text>
  <rect class="yes" x="274" y="478" width="184" height="54"/><text class="t" x="344" y="510">是</text>
  <rect class="yes" x="458" y="478" width="184" height="54"/><text class="t" x="493" y="510">有权重与误差</text>
  <rect class="no" x="642" y="478" width="184" height="54"/><text class="t" x="711" y="510">否</text>
  <rect class="risk" x="826" y="478" width="184" height="54"/><text class="t" x="869" y="510">评审可见内容</text>
  <rect class="grid" x="1010" y="478" width="222" height="54"/><text class="small" x="1028" y="503">估计质量与分层差异</text><text class="small" x="1028" y="522">保留 πᵢ、盲审版本</text>

  <rect class="grid" x="48" y="532" width="226" height="64"/><text class="t" x="66" y="560">影子流量：候选不展示</text><text class="small" x="66" y="582">同输入配对比较</text>
  <rect class="yes" x="274" y="532" width="184" height="64"/><text class="t" x="311" y="570">候选回归：是</text>
  <rect class="partial" x="458" y="532" width="184" height="64"/><text class="t" x="486" y="570">仅输出代理质量</text>
  <rect class="no" x="642" y="532" width="184" height="64"/><text class="t" x="688" y="560">不能直接证明</text><text class="small" x="688" y="582">用户未被暴露</text>
  <rect x="826" y="532" width="184" height="64" fill="#fecdd3"/><text class="t" x="849" y="560">真实数据 + 算力</text><text class="small" x="849" y="582">工具/下游仍可能有副作用</text>
  <rect class="grid" x="1010" y="532" width="222" height="64"/><text class="small" x="1028" y="557">隔离写操作、配额、TTL</text><text class="small" x="1028" y="578">作为灰度前置证据</text>

  <rect class="grid" x="48" y="596" width="226" height="54"/><text class="t" x="66" y="628">随机灰度 / 对照实验</text>
  <rect class="yes" x="274" y="596" width="184" height="54"/><text class="t" x="344" y="628">是</text>
  <rect class="yes" x="458" y="596" width="184" height="54"/><text class="t" x="493" y="628">按实验总体</text>
  <rect class="yes" x="642" y="596" width="184" height="54"/><text class="t" x="678" y="628">满足设计时可估</text>
  <rect class="risk" x="826" y="596" width="184" height="54"/><text class="t" x="861" y="628">真实用户暴露</text>
  <rect class="grid" x="1010" y="596" width="222" height="54"/><text class="small" x="1028" y="621">低风险、稳定分流</text><text class="small" x="1028" y="640">护栏与停止规则</text>

  <rect x="48" y="670" width="1184" height="30" rx="6" fill="#0f172a"/>
  <text x="68" y="691" style="font:600 14px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#fff">结论强度必须跟随设计：影子流量证明候选“会怎样输出”，随机暴露与成熟结果才可能估计“用户会怎样变化”。</text>
</svg>
