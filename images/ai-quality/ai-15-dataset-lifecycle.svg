<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">AI 评测集治理生命周期</title>
  <desc id="desc">从评测决策、样本采集、清洗去重、分层抽样、标注仲裁、版本切分、数据卡到发布门禁和线上反馈的闭环。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .step { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .detail { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .gate { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #7f1d1d; }
      .legend { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect width="1280" height="800" fill="#f8fafc"/>
  <rect x="32" y="28" width="1216" height="744" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="64" y="78" class="title">AI 评测集治理生命周期</text>
  <text x="64" y="109" class="subtitle">每个版本都必须回答：测什么、代表谁、从哪来、怎样标、如何隔离、能否发布</text>

  <g filter="url(#shadow)">
    <rect x="70" y="158" width="236" height="124" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <rect x="350" y="158" width="236" height="124" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <rect x="630" y="158" width="236" height="124" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <rect x="910" y="158" width="236" height="124" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>

    <rect x="70" y="374" width="236" height="124" rx="8" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
    <rect x="350" y="374" width="236" height="124" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <rect x="630" y="374" width="236" height="124" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
    <rect x="910" y="374" width="236" height="124" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  </g>

  <text x="188" y="194" text-anchor="middle" class="step">1 评测目标</text>
  <text x="188" y="226" text-anchor="middle" class="detail">发布决策与风险边界</text>
  <text x="188" y="251" text-anchor="middle" class="detail">任务单元、指标、切片</text>

  <text x="468" y="194" text-anchor="middle" class="step">2 样本采集</text>
  <text x="468" y="226" text-anchor="middle" class="detail">生产、专家、事故、合成</text>
  <text x="468" y="251" text-anchor="middle" class="detail">授权、来源、时间与血缘</text>

  <text x="748" y="194" text-anchor="middle" class="step">3 清洗去重</text>
  <text x="748" y="226" text-anchor="middle" class="detail">结构、隐私、精确与近似重复</text>
  <text x="748" y="251" text-anchor="middle" class="detail">污染、泄漏和有效期</text>

  <text x="1028" y="194" text-anchor="middle" class="step">4 分层抽样</text>
  <text x="1028" y="226" text-anchor="middle" class="detail">场景、风险、难度、语言</text>
  <text x="1028" y="251" text-anchor="middle" class="detail">自然分布与最低配额</text>

  <text x="188" y="410" text-anchor="middle" class="step">5 标注仲裁</text>
  <text x="188" y="442" text-anchor="middle" class="detail">量表、证据、双标与盲标</text>
  <text x="188" y="467" text-anchor="middle" class="detail">一致性、分歧和专家仲裁</text>

  <text x="468" y="410" text-anchor="middle" class="step">6 版本与切分</text>
  <text x="468" y="442" text-anchor="middle" class="detail">不可变清单、内容哈希</text>
  <text x="468" y="467" text-anchor="middle" class="detail">实体、时间和重复簇隔离</text>

  <text x="748" y="410" text-anchor="middle" class="step">7 数据卡</text>
  <text x="748" y="442" text-anchor="middle" class="detail">范围、组成、限制与责任人</text>
  <text x="748" y="467" text-anchor="middle" class="detail">变更记录与预期用途</text>

  <text x="1028" y="410" text-anchor="middle" class="step">8 发布门禁</text>
  <text x="1028" y="442" text-anchor="middle" class="detail">结构、覆盖、一致性与泄漏</text>
  <text x="1028" y="467" text-anchor="middle" class="detail">签名、审批和可重现性</text>

  <line x1="306" y1="220" x2="346" y2="220" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="586" y1="220" x2="626" y2="220" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="866" y1="220" x2="906" y2="220" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 1146 220 C 1194 220, 1194 328, 1028 328 C 862 328, 188 328, 188 370" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="306" y1="436" x2="346" y2="436" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="586" y1="436" x2="626" y2="436" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="866" y1="436" x2="906" y2="436" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="70" y="568" width="1076" height="112" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="96" y="606" class="step">9 运行反馈与受控演进</text>
  <text x="96" y="639" class="detail">线上失败、低置信样本、分布漂移和新风险进入候选池；原版本保持不可变，新样本经同一治理链产生下一版本。</text>
  <text x="96" y="663" class="detail">反馈样本不得直接覆盖密封集，也不得因为“模型已经见过”就继续作为无污染回归证据。</text>

  <line x1="1028" y1="498" x2="1028" y2="564" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M 70 624 C 44 624, 44 220, 66 220" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-blue)"/>

  <rect x="70" y="704" width="1076" height="42" rx="7" fill="#fff7ed" stroke="#fdba74"/>
  <text x="92" y="731" class="gate">门禁原则：来源不清、授权不明、切分泄漏、标签无证据或版本不可重现，任何一项失败都不得发布。</text>

  <circle cx="928" cy="92" r="7" fill="#334155"/>
  <text x="942" y="97" class="legend">实线：构建主流程</text>
  <line x1="1063" y1="92" x2="1097" y2="92" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="1107" y="97" class="legend">虚线：反馈演进</text>
</svg>
