<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">推理服务容量、尾延迟与 Goodput 的权衡</title>
  <desc id="desc">展示随到达率和并发增加，吞吐先增长后趋于饱和，队列与尾延迟在拐点后快速上升，而满足 TTFT 和 TPOT 门槛的 Goodput 可能下降；右侧列出需要共同记录的容量证据。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#475569"/></marker>
    <style>
      .bg{fill:#f8fafc}.title{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.sub{font:400 18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}.h{font:700 21px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.t{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#334155}.small{font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}.axis{stroke:#475569;stroke-width:3;marker-end:url(#arrow)}.grid{stroke:#e2e8f0;stroke-width:1.5}.curve{fill:none;stroke-width:5;stroke-linecap:round}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="48" y="54">最大吞吐不是可交付容量，饱和拐点之后尾延迟会吞掉 Goodput</text>
  <text class="sub" x="48" y="86">曲线为关系示意，不代表任何 GPU 实测；真实结论必须绑定模型、硬件、引擎版本、ISL/OSL 与负载模型。</text>

  <line class="grid" x1="94" y1="170" x2="810" y2="170"/><line class="grid" x1="94" y1="280" x2="810" y2="280"/>
  <line class="grid" x1="94" y1="390" x2="810" y2="390"/><line class="grid" x1="94" y1="500" x2="810" y2="500"/>
  <line class="axis" x1="94" y1="580" x2="824" y2="580"/><line class="axis" x1="94" y1="580" x2="94" y2="125"/>
  <text class="h" x="342" y="624">到达率 / 并发 / 在途序列</text>
  <text class="h" x="22" y="122">相对值</text>

  <path class="curve" d="M110 540 C250 500 382 400 500 292 C590 214 688 194 795 190" stroke="#2563eb"/>
  <text class="h" x="632" y="178" fill="#1d4ed8">完成吞吐</text>
  <path class="curve" d="M110 548 C244 508 374 410 493 310 C566 249 624 260 680 320 C728 372 755 447 795 522" stroke="#16a34a"/>
  <text class="h" x="640" y="300" fill="#15803d">Goodput</text>
  <path class="curve" d="M110 528 C330 520 450 506 525 472 C590 442 634 361 680 260 C715 184 752 148 795 132" stroke="#e11d48"/>
  <text class="h" x="588" y="435" fill="#be123c">Queue / P99 TTFT</text>

  <line x1="612" y1="124" x2="612" y2="580" stroke="#d97706" stroke-width="3" stroke-dasharray="9 8"/>
  <circle cx="612" cy="271" r="9" fill="#d97706"/>
  <text class="h" x="526" y="112" fill="#b45309">饱和拐点</text>
  <text class="small" x="500" y="650">继续加压：吞吐增益变小，排队和超时快速放大</text>

  <rect class="card" x="858" y="126" width="374" height="150" rx="7"/>
  <rect x="858" y="126" width="11" height="150" fill="#2563eb"/>
  <text class="h" x="892" y="161">工作负载证据</text>
  <text class="t" x="892" y="196">开放 / 闭环到达模型</text><text class="t" x="892" y="226">ISL、OSL、并发与突发分布</text><text class="t" x="892" y="256">流式、停止条件、超时策略</text>
  <rect class="card" x="858" y="294" width="374" height="150" rx="7"/>
  <rect x="858" y="294" width="11" height="150" fill="#7c3aed"/>
  <text class="h" x="892" y="329">引擎与容量证据</text>
  <text class="t" x="892" y="364">批策略、KV 块与碎片</text><text class="t" x="892" y="394">量化、投机解码、并行方式</text><text class="t" x="892" y="424">GPU、驱动、容器与版本摘要</text>
  <rect class="card" x="858" y="462" width="374" height="150" rx="7"/>
  <rect x="858" y="462" width="11" height="150" fill="#16a34a"/>
  <text class="h" x="892" y="497">验收必须同时成立</text>
  <text class="t" x="892" y="532">P99 TTFT 与 P99 ITL 达标</text><text class="t" x="892" y="562">成功、质量和输出长度合格</text><text class="t" x="892" y="592">Goodput 稳定且资源留有余量</text>
</svg>
