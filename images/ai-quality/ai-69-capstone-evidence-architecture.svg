<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 质量工程 Capstone 的运行与证据架构</title>
  <desc id="desc">上层是 Dataset、候选 Adapter、Runner 与故障注入、Trace、Evaluator 和 Gate 的运行链，下层是 README、ADR、报告、runbook、复盘和外部 manifest 的证据链，二者通过版本身份与分母对账连接。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-12%" width="120%" height="136%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#17212b" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/>
    </marker>
    <style>
      .title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#17212b}
      .subtitle{font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#52606d}
      .head{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#17212b}
      .body{font:400 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#334155}
      .small{font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#334155}
      .white{fill:#fff}
    </style>
  </defs>
  <rect width="1280" height="720" fill="#f8fafb"/>
  <rect x="0" y="0" width="1280" height="8" fill="#7b5f91"/>
  <text x="60" y="57" class="title">运行链给出结果，证据链限制结论</text>
  <text x="60" y="87" class="subtitle">每个 claim 都能回到 dataset、candidate、runner、attempt、分子/分母和受信 manifest</text>

  <text x="60" y="137" class="head">运行与判定链</text>
  <g filter="url(#shadow)">
    <rect x="60" y="158" width="170" height="112" rx="8" fill="#fff" stroke="#82a6b8"/>
    <rect x="60" y="158" width="170" height="34" rx="8" fill="#dcebf2"/>
    <rect x="60" y="184" width="170" height="8" fill="#dcebf2"/>
    <text x="145" y="181" text-anchor="middle" class="head">Dataset Registry</text>
    <text x="145" y="218" text-anchor="middle" class="body">case / slice / oracle</text>
    <text x="145" y="242" text-anchor="middle" class="body">expected IDs / digest</text>

    <rect x="260" y="158" width="170" height="112" rx="8" fill="#fff" stroke="#9d8bb0"/>
    <rect x="260" y="158" width="170" height="34" rx="8" fill="#ece4f2"/>
    <rect x="260" y="184" width="170" height="8" fill="#ece4f2"/>
    <text x="345" y="181" text-anchor="middle" class="head">Candidate Adapter</text>
    <text x="345" y="218" text-anchor="middle" class="body">fixture / baseline / candidate</text>
    <text x="345" y="242" text-anchor="middle" class="body">固定版本与输出契约</text>

    <rect x="460" y="142" width="190" height="144" rx="8" fill="#263844" stroke="#263844"/>
    <text x="555" y="174" text-anchor="middle" class="head white">Runner</text>
    <text x="555" y="202" text-anchor="middle" class="body white">run → case → attempt</text>
    <rect x="482" y="222" width="146" height="42" rx="6" fill="#ffd37a"/>
    <text x="555" y="248" text-anchor="middle" class="small">Fault Injector</text>

    <rect x="680" y="158" width="170" height="112" rx="8" fill="#fff" stroke="#72a08b"/>
    <rect x="680" y="158" width="170" height="34" rx="8" fill="#deeee7"/>
    <rect x="680" y="184" width="170" height="8" fill="#deeee7"/>
    <text x="765" y="181" text-anchor="middle" class="head">Trace</text>
    <text x="765" y="218" text-anchor="middle" class="body">版本 / fault / outcome</text>
    <text x="765" y="242" text-anchor="middle" class="body">attempt 与 terminal 对账</text>

    <rect x="880" y="158" width="150" height="112" rx="8" fill="#fff" stroke="#c49a70"/>
    <rect x="880" y="158" width="150" height="34" rx="8" fill="#f5e9dd"/>
    <rect x="880" y="184" width="150" height="8" fill="#f5e9dd"/>
    <text x="955" y="181" text-anchor="middle" class="head">Evaluator</text>
    <text x="955" y="218" text-anchor="middle" class="body">结构 / 类别 / 证据</text>
    <text x="955" y="242" text-anchor="middle" class="body">引用 / 动作 / 安全</text>

    <rect x="1060" y="142" width="160" height="144" rx="8" fill="#a34d3e" stroke="#a34d3e"/>
    <text x="1140" y="174" text-anchor="middle" class="head white">Gate</text>
    <text x="1140" y="203" text-anchor="middle" class="body white">overall / slice</text>
    <text x="1140" y="228" text-anchor="middle" class="body white">critical / recovery</text>
    <text x="1140" y="253" text-anchor="middle" class="body white">trace / evidence</text>
  </g>
  <path d="M230 214 H250" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M430 214 H450" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M650 214 H670" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M850 214 H870" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1030 214 H1050" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M640 300 V344" stroke="#52606d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="402" y="314" width="476" height="48" rx="24" fill="#e7edf2" stroke="#a3b0ba"/>
  <text x="640" y="344" text-anchor="middle" class="head">统一身份：run + dataset + candidate + runner + policy</text>

  <text x="60" y="404" class="head">交付与复核证据链</text>
  <g filter="url(#shadow)">
    <rect x="60" y="426" width="175" height="118" rx="8" fill="#fff" stroke="#8fa3b8"/>
    <text x="147" y="460" text-anchor="middle" class="head">README</text>
    <text x="147" y="488" text-anchor="middle" class="body">入口 / 快速运行</text>
    <text x="147" y="512" text-anchor="middle" class="body">能证明 / 不能证明</text>

    <rect x="255" y="426" width="175" height="118" rx="8" fill="#fff" stroke="#9d8bb0"/>
    <text x="342" y="460" text-anchor="middle" class="head">ADR</text>
    <text x="342" y="488" text-anchor="middle" class="body">context / decision</text>
    <text x="342" y="512" text-anchor="middle" class="body">alternative / consequence</text>

    <rect x="450" y="426" width="175" height="118" rx="8" fill="#fff" stroke="#72a08b"/>
    <text x="537" y="460" text-anchor="middle" class="head">Run + Eval Report</text>
    <text x="537" y="488" text-anchor="middle" class="body">分子 / 分母 / case</text>
    <text x="537" y="512" text-anchor="middle" class="body">版本 / 失败原因</text>

    <rect x="645" y="426" width="175" height="118" rx="8" fill="#fff" stroke="#c49a70"/>
    <text x="732" y="460" text-anchor="middle" class="head">Runbook</text>
    <text x="732" y="488" text-anchor="middle" class="body">判断顺序 / 止损</text>
    <text x="732" y="512" text-anchor="middle" class="body">恢复 / 复测 / 证据</text>

    <rect x="840" y="426" width="175" height="118" rx="8" fill="#fff" stroke="#b87c7c"/>
    <text x="927" y="460" text-anchor="middle" class="head">Drill Postmortem</text>
    <text x="927" y="488" text-anchor="middle" class="body">时间线 / 误判 / 根因</text>
    <text x="927" y="512" text-anchor="middle" class="body">action 与完成证据</text>

    <rect x="1035" y="410" width="185" height="150" rx="8" fill="#203b4d"/>
    <text x="1127" y="448" text-anchor="middle" class="head white">Trusted Manifest</text>
    <text x="1127" y="478" text-anchor="middle" class="body white">path / bytes / SHA-256</text>
    <text x="1127" y="503" text-anchor="middle" class="body white">精确文件集合</text>
    <text x="1127" y="528" text-anchor="middle" class="body white">包外来源与签发边界</text>
  </g>
  <path d="M235 485 H245" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M430 485 H440" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M625 485 H635" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M820 485 H830" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1015 485 H1025" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="60" y="586" width="1160" height="86" rx="8" fill="#fff4df" stroke="#c69a45"/>
    <text x="84" y="618" class="head">结论边界</text>
    <text x="198" y="618" class="body">摘要能发现相对受信 manifest 的变化；它不证明标签正确、数据有权使用、候选来自真实模型或结果适用于生产。</text>
    <text x="84" y="648" class="head">最小复核</text>
    <text x="198" y="648" class="body">clean checkout → 运行测试与 fault plan → 对账 case/attempt/Trace → 验 Gate → 验证证据包 → 阅读限制。</text>
  </g>
  <text x="60" y="706" class="subtitle">构造示意：证据包完整性、运行真实性和业务结论有效性是三个不同问题，不能压成一个绿色图标。</text>
</svg>
