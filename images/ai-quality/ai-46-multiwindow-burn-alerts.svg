<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 服务多窗口 Burn Rate 告警与分级响应</title>
  <desc id="desc">展示从 SLO 目标、周期、预算比例推导候选燃烧率，分别用长窗口确认预算消耗、短窗口确认问题仍持续，通过 AND 产生快速 Page、慢速 Page 或工单，并在通知前检查数据新鲜度、低流量和告警抑制。Google 示例数字被明确标注为 99.9% 与 30 天条件下的文档示例而非通用标准。</desc>
  <defs>
    <marker id="arrow46b" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#64748b"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}.title{font:700 32px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.sub{font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}.head{font:700 19px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.text{font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#334155}.small{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.arrow{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow46b)}.thin{fill:none;stroke:#94a3b8;stroke-width:2;marker-end:url(#arrow46b)}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="38" y="45">长窗确认“花了多少”，短窗确认“现在还在烧”</text>
  <text class="sub" x="38" y="73">Burn rate 是预算速度，不是错误根因；Page 还必须满足数据可信、需要立即响应且值班人有动作。</text>

  <rect x="38" y="105" width="270" height="172" rx="7" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text class="head" x="58" y="135">1. 从本服务契约推导</text>
  <text class="text" x="58" y="166">S = SLO target</text>
  <text class="text" x="58" y="191">P = SLO period</text>
  <text class="text" x="58" y="216">q = 希望通知时的预算份额</text>
  <text class="text" x="58" y="241">w = 观察窗口</text>
  <rect x="58" y="252" width="230" height="45" rx="6" fill="#ffffff" stroke="#06b6d4" stroke-width="2"/>
  <text class="head" x="103" y="281">候选 R = q × P / w</text>

  <path class="arrow" d="M308 191 L354 191"/>
  <rect class="box" x="354" y="105" width="536" height="172" rx="7"/>
  <text class="head" x="374" y="135">2. 同一阈值同时检查长窗与短窗</text>
  <rect x="374" y="153" width="205" height="92" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text class="head" x="392" y="183">Long window</text>
  <text class="text" x="392" y="207">burn_long ≥ R</text>
  <text class="small" x="392" y="230">确认已消耗显著预算</text>
  <circle cx="622" cy="199" r="29" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text class="head" x="604" y="206">AND</text>
  <rect x="665" y="153" width="205" height="92" rx="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text class="head" x="683" y="183">Short window</text>
  <text class="text" x="683" y="207">burn_short ≥ R</text>
  <text class="small" x="683" y="230">确认问题仍然持续</text>
  <path class="thin" d="M579 199 L592 199"/><path class="thin" d="M651 199 L665 199"/>

  <path class="arrow" d="M890 191 L936 191"/>
  <rect x="936" y="105" width="306" height="172" rx="7" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text class="head" x="956" y="135">3. 通知前的可信度门</text>
  <text class="text" x="956" y="166">✓ metric freshness 达标</text>
  <text class="text" x="956" y="191">✓ long/short 有足够 known events</text>
  <text class="text" x="956" y="216">✓ Unknown 未超过数据契约</text>
  <text class="text" x="956" y="241">✓ 同事故高级别告警未抑制</text>
  <text class="small" x="956" y="263">不满足时：data invalid / low traffic</text>

  <text class="head" x="38" y="328">多级路径：数值需按本服务重新推导并通过历史回放</text>
  <rect x="38" y="348" width="1204" height="216" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="58" y="370" width="220" height="70" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text class="head" x="76" y="399">快速燃烧路径</text>
  <text class="small" x="76" y="423">短周期内威胁大量预算</text>
  <rect x="318" y="370" width="214" height="70" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text class="text" x="338" y="399">长窗 L1 ≥ R_fast</text>
  <text class="small" x="338" y="423">预算消耗确认</text>
  <circle cx="573" cy="405" r="26" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text class="text" x="558" y="411">AND</text>
  <rect x="614" y="370" width="214" height="70" rx="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text class="text" x="634" y="399">短窗 S1 ≥ R_fast</text>
  <text class="small" x="634" y="423">异常仍在发生</text>
  <rect x="874" y="370" width="348" height="70" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text class="head" x="894" y="399">SEV-1 Page → Service On-call</text>
  <text class="small" x="894" y="423">止损 / 回滚 / 限流；附 SLO 而非根因猜测</text>
  <path class="thin" d="M278 405 L318 405"/><path class="thin" d="M532 405 L547 405"/><path class="thin" d="M599 405 L614 405"/><path class="thin" d="M828 405 L874 405"/>

  <rect x="58" y="462" width="220" height="70" rx="7" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text class="head" x="76" y="491">慢速累积路径</text>
  <text class="small" x="76" y="515">仍有时间在工作时段处理</text>
  <rect x="318" y="462" width="214" height="70" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text class="text" x="338" y="491">长窗 L2 ≥ R_slow</text>
  <text class="small" x="338" y="515">趋势持续且有规模</text>
  <circle cx="573" cy="497" r="26" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text class="text" x="558" y="503">AND</text>
  <rect x="614" y="462" width="214" height="70" rx="7" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text class="text" x="634" y="491">短窗 S2 ≥ R_slow</text>
  <text class="small" x="634" y="515">排除已恢复的旧影响</text>
  <rect x="874" y="462" width="348" height="70" rx="7" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text class="head" x="894" y="491">SEV-2 Ticket → Quality / Service</text>
  <text class="small" x="894" y="515">切片分析 / 补标 / 修复排期；通常不叫醒值班</text>
  <path class="thin" d="M278 497 L318 497"/><path class="thin" d="M532 497 L547 497"/><path class="thin" d="M599 497 L614 497"/><path class="thin" d="M828 497 L874 497"/>

  <rect x="38" y="588" width="734" height="96" rx="7" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text class="head" x="58" y="618">Google SRE Workbook 文档示例，不能复制为行业标准</text>
  <text class="text" x="58" y="646">条件：99.9% SLO、30 天；Page 1h/5m @14.4，Page 6h/30m @6，Ticket 3d/6h @1</text>
  <text class="small" x="58" y="670">原文称其为起始参数；目标、周期、流量、值班能力、质量标签时延变化后必须重算与回放。</text>
  <rect x="794" y="588" width="448" height="96" rx="7" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text class="head" x="814" y="618">恢复状态也要分开</text>
  <text class="text" x="814" y="646">短窗恢复 → incident signal cleared</text>
  <text class="small" x="814" y="670">预算回正与发布解冻由独立条件和 Release Authority 决定</text>
</svg>
