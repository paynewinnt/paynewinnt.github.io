<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">AI 评测集分层抽样矩阵与切分防火墙</title>
  <desc id="desc">展示场景风险矩阵的自然分布和最低配额策略，以及按重复簇、实体和时间切分来阻止数据泄漏。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .section { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .axis { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .cell { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .detail { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .box-title { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .legend { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect width="1280" height="800" fill="#f8fafc"/>
  <rect x="32" y="28" width="1216" height="744" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="64" y="78" class="title">分层抽样矩阵与切分防火墙</text>
  <text x="64" y="109" class="subtitle">自然流量保证代表性，风险最低配额保证稀有但严重的失败不会被平均数淹没</text>

  <text x="64" y="158" class="section">A. 场景 × 风险分层矩阵</text>
  <text x="135" y="222" class="axis">风险等级</text>
  <text x="363" y="190" text-anchor="middle" class="axis">知识问答</text>
  <text x="495" y="190" text-anchor="middle" class="axis">结构生成</text>
  <text x="627" y="190" text-anchor="middle" class="axis">工具调用</text>
  <text x="759" y="190" text-anchor="middle" class="axis">多步任务</text>

  <text x="220" y="259" text-anchor="end" class="axis">关键</text>
  <text x="220" y="337" text-anchor="end" class="axis">高</text>
  <text x="220" y="415" text-anchor="end" class="axis">中</text>
  <text x="220" y="493" text-anchor="end" class="axis">低</text>

  <g filter="url(#shadow)">
    <rect x="244" y="216" width="112" height="62" rx="6" fill="#fecaca" stroke="#dc2626"/>
    <rect x="376" y="216" width="112" height="62" rx="6" fill="#fecaca" stroke="#dc2626"/>
    <rect x="508" y="216" width="112" height="62" rx="6" fill="#fecaca" stroke="#dc2626"/>
    <rect x="640" y="216" width="112" height="62" rx="6" fill="#fecaca" stroke="#dc2626"/>

    <rect x="244" y="294" width="112" height="62" rx="6" fill="#fed7aa" stroke="#ea580c"/>
    <rect x="376" y="294" width="112" height="62" rx="6" fill="#fed7aa" stroke="#ea580c"/>
    <rect x="508" y="294" width="112" height="62" rx="6" fill="#fed7aa" stroke="#ea580c"/>
    <rect x="640" y="294" width="112" height="62" rx="6" fill="#fed7aa" stroke="#ea580c"/>

    <rect x="244" y="372" width="112" height="62" rx="6" fill="#fef3c7" stroke="#d97706"/>
    <rect x="376" y="372" width="112" height="62" rx="6" fill="#fef3c7" stroke="#d97706"/>
    <rect x="508" y="372" width="112" height="62" rx="6" fill="#fef3c7" stroke="#d97706"/>
    <rect x="640" y="372" width="112" height="62" rx="6" fill="#fef3c7" stroke="#d97706"/>

    <rect x="244" y="450" width="112" height="62" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="376" y="450" width="112" height="62" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="508" y="450" width="112" height="62" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="640" y="450" width="112" height="62" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  </g>

  <text x="300" y="242" text-anchor="middle" class="cell">最低 40</text><text x="300" y="264" text-anchor="middle" class="detail">事实误导</text>
  <text x="432" y="242" text-anchor="middle" class="cell">最低 40</text><text x="432" y="264" text-anchor="middle" class="detail">合规输出</text>
  <text x="564" y="242" text-anchor="middle" class="cell">最低 80</text><text x="564" y="264" text-anchor="middle" class="detail">不可逆动作</text>
  <text x="696" y="242" text-anchor="middle" class="cell">最低 80</text><text x="696" y="264" text-anchor="middle" class="detail">组合风险</text>

  <text x="300" y="320" text-anchor="middle" class="cell">最低 60</text><text x="300" y="342" text-anchor="middle" class="detail">关键引用</text>
  <text x="432" y="320" text-anchor="middle" class="cell">最低 60</text><text x="432" y="342" text-anchor="middle" class="detail">业务约束</text>
  <text x="564" y="320" text-anchor="middle" class="cell">最低 80</text><text x="564" y="342" text-anchor="middle" class="detail">权限边界</text>
  <text x="696" y="320" text-anchor="middle" class="cell">最低 80</text><text x="696" y="342" text-anchor="middle" class="detail">恢复能力</text>

  <text x="300" y="398" text-anchor="middle" class="cell">按分布</text><text x="300" y="420" text-anchor="middle" class="detail">常规问答</text>
  <text x="432" y="398" text-anchor="middle" class="cell">按分布</text><text x="432" y="420" text-anchor="middle" class="detail">格式生成</text>
  <text x="564" y="398" text-anchor="middle" class="cell">最低 40</text><text x="564" y="420" text-anchor="middle" class="detail">可逆动作</text>
  <text x="696" y="398" text-anchor="middle" class="cell">最低 40</text><text x="696" y="420" text-anchor="middle" class="detail">状态推进</text>

  <text x="300" y="476" text-anchor="middle" class="cell">按分布</text><text x="300" y="498" text-anchor="middle" class="detail">高频简单</text>
  <text x="432" y="476" text-anchor="middle" class="cell">按分布</text><text x="432" y="498" text-anchor="middle" class="detail">模板输出</text>
  <text x="564" y="476" text-anchor="middle" class="cell">按分布</text><text x="564" y="498" text-anchor="middle" class="detail">只读工具</text>
  <text x="696" y="476" text-anchor="middle" class="cell">按分布</text><text x="696" y="498" text-anchor="middle" class="detail">短链任务</text>

  <rect x="64" y="552" width="720" height="144" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="88" y="586" class="box-title">配额不是最终权重</text>
  <text x="88" y="616" class="detail">评测集可以提高关键风险样本占比，但总体指标必须按目标流量或业务损失重新加权。</text>
  <text x="88" y="644" class="detail">每个格子还应继续按语言、租户、难度、输入长度、工具类型和时间窗口切片。</text>
  <text x="88" y="672" class="detail">稀有关键风险用最低样本数守底线；高频普通流量用分层随机抽样保持代表性。</text>

  <text x="830" y="158" class="section">B. 切分防火墙</text>
  <g filter="url(#shadow)">
    <rect x="840" y="206" width="330" height="90" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <rect x="840" y="350" width="330" height="90" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <rect x="840" y="494" width="330" height="90" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  </g>

  <text x="1005" y="238" text-anchor="middle" class="box-title">开发集 / 调优集</text>
  <text x="1005" y="266" text-anchor="middle" class="detail">允许开发者查看，支持提示词和规则迭代</text>

  <text x="1005" y="382" text-anchor="middle" class="box-title">回归集 / 发布集</text>
  <text x="1005" y="410" text-anchor="middle" class="detail">稳定版本，可见标签受控，记录每次运行</text>

  <text x="1005" y="526" text-anchor="middle" class="box-title">密封集 / 审计集</text>
  <text x="1005" y="554" text-anchor="middle" class="detail">限制访问，只在约定门禁或独立审计中使用</text>

  <line x1="1005" y1="296" x2="1005" y2="346" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1005" y1="440" x2="1005" y2="490" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="818" y="622" width="374" height="106" rx="8" fill="#fff1f2" stroke="#fda4af"/>
  <text x="840" y="654" class="box-title">同组只进入一个切分</text>
  <text x="840" y="682" class="detail">近重复簇、同一会话、同一文档、同一客户</text>
  <text x="840" y="706" class="detail">或同一事故族不得跨集合泄漏。</text>

  <circle cx="942" cy="92" r="7" fill="#dc2626"/>
  <text x="956" y="97" class="legend">关键风险：强制最低配额</text>
  <circle cx="1134" cy="92" r="7" fill="#16a34a"/>
  <text x="1148" y="97" class="legend">普通流量：按分布</text>
</svg>
