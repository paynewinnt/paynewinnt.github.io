<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="matrix-title matrix-desc">
  <title id="matrix-title">模态、能力层、扰动、缺失冲突与指标测试矩阵</title>
  <desc id="matrix-desc">矩阵以图片、音频、文档和跨模态配对为行，以接入、感知、结构、对齐推理和业务安全为列；右侧列出扰动、缺失与冲突测试，底部以指标和发布门禁闭环，箭头表示测试向量进入矩阵并汇总到决策。</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfdff"/>
      <stop offset="1" stop-color="#fff8f2"/>
    </linearGradient>
    <filter id="s2" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#293850" flood-opacity="0.13"/>
    </filter>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#3f5878"/>
    </marker>
    <marker id="ao" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#d26936"/>
    </marker>
    <style>
      .title{font:700 28px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#16243b}
      .sub{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#52627a}
      .hh{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#17253d}
      .h{font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#1c2e49}
      .t{font:500 12px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#30425e}
      .s{font:500 11px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#506079}
      .w{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#fff}
      .arrow{fill:none;stroke:#3f5878;stroke-width:2;marker-end:url(#a2)}
      .inject{fill:none;stroke:#d26936;stroke-width:2;stroke-dasharray:5 4;marker-end:url(#ao)}
    </style>
  </defs>
  <rect width="1280" height="720" fill="url(#bg2)"/>
  <text x="34" y="44" class="title">多模态测试矩阵：不要让一个总分折叠五个正交维度</text>
  <text x="34" y="70" class="sub">每个格子至少绑定样本、可控变量、独立 Oracle、指标分母与失败证据；空格就是待补覆盖，不是默认通过</text>

  <g filter="url(#s2)">
    <rect x="32" y="94" width="900" height="442" rx="8" fill="#fff" stroke="#8fa6c3"/>
    <rect x="950" y="94" width="298" height="442" rx="8" fill="#fff7ee" stroke="#e4a06e"/>
  </g>

  <rect x="32" y="94" width="900" height="52" rx="8" fill="#304f73"/>
  <rect x="32" y="130" width="900" height="16" fill="#304f73"/>
  <text x="91" y="126" text-anchor="middle" class="w">模态 × 对象</text>
  <text x="245" y="117" text-anchor="middle" class="w">L1 接入</text><text x="245" y="134" text-anchor="middle" class="s" fill="#eaf3ff">解码 / 规范化</text>
  <text x="407" y="117" text-anchor="middle" class="w">L2 感知</text><text x="407" y="134" text-anchor="middle" class="s" fill="#eaf3ff">检测 / 转写</text>
  <text x="569" y="117" text-anchor="middle" class="w">L3 结构</text><text x="569" y="134" text-anchor="middle" class="s" fill="#eaf3ff">空间 / 时间</text>
  <text x="731" y="117" text-anchor="middle" class="w">L4 对齐与推理</text><text x="731" y="134" text-anchor="middle" class="s" fill="#eaf3ff">证据 / 反事实</text>
  <text x="863" y="117" text-anchor="middle" class="w">L5 业务安全</text><text x="863" y="134" text-anchor="middle" class="s" fill="#eaf3ff">决策 / 降级</text>

  <path d="M150 94 V536 M326 94 V536 M488 94 V536 M650 94 V536 M812 94 V536" stroke="#b6c3d3"/>
  <path d="M32 146 H932 M32 242 H932 M32 338 H932 M32 434 H932" stroke="#b6c3d3"/>
  <rect x="33" y="147" width="116" height="94" fill="#e8f3ff"/>
  <rect x="33" y="243" width="116" height="94" fill="#e7fbf3"/>
  <rect x="33" y="339" width="116" height="94" fill="#fff6dc"/>
  <rect x="33" y="435" width="116" height="100" fill="#f1ecff"/>

  <text x="91" y="178" text-anchor="middle" class="hh">图片</text><text x="91" y="200" text-anchor="middle" class="t">场景 / OCR</text><text x="91" y="220" text-anchor="middle" class="t">图表 / 区域</text>
  <text x="91" y="274" text-anchor="middle" class="hh">音频</text><text x="91" y="296" text-anchor="middle" class="t">语音 / 声道</text><text x="91" y="316" text-anchor="middle" class="t">事件 / 时间线</text>
  <text x="91" y="370" text-anchor="middle" class="hh">文档</text><text x="91" y="392" text-anchor="middle" class="t">页 / 版面</text><text x="91" y="412" text-anchor="middle" class="t">表格 / 表单</text>
  <text x="91" y="466" text-anchor="middle" class="hh">跨模态配对</text><text x="91" y="489" text-anchor="middle" class="t">一致 / 补充</text><text x="91" y="510" text-anchor="middle" class="t">冲突 / 无关</text>

  <g>
    <rect x="165" y="158" width="146" height="72" rx="8" fill="#f4f8fd" stroke="#d1dce9"/><text x="176" y="180" class="h">尺寸・方向・色彩</text><text x="176" y="200" class="t">错 MIME / 坏 JPEG</text><text x="176" y="219" class="s">有效解码率、属性差</text>
    <rect x="341" y="158" width="132" height="72" rx="8" fill="#f4f8fd" stroke="#d1dce9"/><text x="352" y="180" class="h">文字・框・元素</text><text x="352" y="200" class="t">OCR / 目标 / 图例</text><text x="352" y="219" class="s">CER、Box IoU、F1</text>
    <rect x="503" y="158" width="132" height="72" rx="8" fill="#f4f8fd" stroke="#d1dce9"/><text x="514" y="180" class="h">区域与关系</text><text x="514" y="200" class="t">标题—图例—数据点</text><text x="514" y="219" class="s">关系 F1、区域召回</text>
    <rect x="665" y="158" width="132" height="72" rx="8" fill="#f4f8fd" stroke="#d1dce9"/><text x="676" y="180" class="h">视觉反事实</text><text x="676" y="200" class="t">换数字答案应变化</text><text x="676" y="219" class="s">证据定位、答案正确</text>
    <text x="827" y="177" class="h">拒猜 / 人审</text><text x="827" y="199" class="t">敏感图像边界</text><text x="827" y="219" class="s">风险违例率</text>

    <rect x="165" y="254" width="146" height="72" rx="8" fill="#f3fbf7" stroke="#cce5d8"/><text x="176" y="276" class="h">容器・编解码・声道</text><text x="176" y="296" class="t">时长 / 采样率 / 截断</text><text x="176" y="315" class="s">解码率、时长差</text>
    <rect x="341" y="254" width="132" height="72" rx="8" fill="#f3fbf7" stroke="#cce5d8"/><text x="352" y="276" class="h">ASR・事件・说话人</text><text x="352" y="296" class="t">词 / 音响 / diarization</text><text x="352" y="315" class="s">WER、Event F1</text>
    <rect x="503" y="254" width="132" height="72" rx="8" fill="#f3fbf7" stroke="#cce5d8"/><text x="514" y="276" class="h">时序与重叠</text><text x="514" y="296" class="t">先后 / 静音 / overlap</text><text x="514" y="315" class="s">Segment IoU、边界误差</text>
    <rect x="665" y="254" width="132" height="72" rx="8" fill="#f3fbf7" stroke="#cce5d8"/><text x="676" y="276" class="h">音文定位</text><text x="676" y="296" class="t">声明落在哪个时间段</text><text x="676" y="315" class="s">证据召回、冲突召回</text>
    <text x="827" y="273" class="h">静音降级</text><text x="827" y="295" class="t">不可听时不编造</text><text x="827" y="315" class="s">幻觉 / 升级率</text>

    <rect x="165" y="350" width="146" height="72" rx="8" fill="#fffaf0" stroke="#ebdcaf"/><text x="176" y="372" class="h">页数・层・字体资源</text><text x="176" y="392" class="t">文本层 / 扫描层 / 旋转</text><text x="176" y="411" class="s">页完整率、层一致率</text>
    <rect x="341" y="350" width="132" height="72" rx="8" fill="#fffaf0" stroke="#ebdcaf"/><text x="352" y="372" class="h">词与区域</text><text x="352" y="392" class="t">OCR / 版块 / 单元格</text><text x="352" y="411" class="s">CER、IoU、检测 F1</text>
    <rect x="503" y="350" width="132" height="72" rx="8" fill="#fffaf0" stroke="#ebdcaf"/><text x="514" y="372" class="h">阅读顺序与关系</text><text x="514" y="392" class="t">跨页 / 表格 / 键值</text><text x="514" y="411" class="s">Order、Cell、Link F1</text>
    <rect x="665" y="350" width="132" height="72" rx="8" fill="#fffaf0" stroke="#ebdcaf"/><text x="676" y="372" class="h">文档问答</text><text x="676" y="392" class="t">页、框、行支持答案</text><text x="676" y="411" class="s">ANLS/EM + Evidence</text>
    <text x="827" y="369" class="h">权限与注入</text><text x="827" y="391" class="t">隐藏层不越权</text><text x="827" y="411" class="s">泄漏 / 指令遵循</text>

    <rect x="165" y="446" width="146" height="77" rx="8" fill="#f8f5ff" stroke="#d8ceef"/><text x="176" y="468" class="h">配对身份</text><text x="176" y="488" class="t">pair_id / 时间 / 版本</text><text x="176" y="508" class="s">错配率、过期率</text>
    <rect x="341" y="446" width="132" height="77" rx="8" fill="#f8f5ff" stroke="#d8ceef"/><text x="352" y="468" class="h">实体规范化</text><text x="352" y="488" class="t">单位 / 数值 / 否定</text><text x="352" y="508" class="s">Entity F1、数值差</text>
    <rect x="503" y="446" width="132" height="77" rx="8" fill="#f8f5ff" stroke="#d8ceef"/><text x="514" y="468" class="h">时间空间映射</text><text x="514" y="488" class="t">页框 ↔ 声音区间</text><text x="514" y="508" class="s">Alignment IoU</text>
    <rect x="665" y="446" width="132" height="77" rx="8" fill="#f8f5ff" stroke="#d8ceef"/><text x="676" y="468" class="h">关系四分类</text><text x="676" y="488" class="t">C / S / X / U</text><text x="676" y="508" class="s">Macro-F1、冲突召回</text>
    <text x="827" y="465" class="h">缺失与冲突策略</text><text x="827" y="487" class="t">回答 / 保留 / 阻断</text><text x="827" y="508" class="s">策略准确率</text>
  </g>

  <rect x="950" y="94" width="298" height="52" rx="8" fill="#b75b2c"/>
  <rect x="950" y="130" width="298" height="16" fill="#b75b2c"/>
  <text x="1099" y="126" text-anchor="middle" class="w">扰动 × 缺失 × 冲突向量</text>
  <g>
    <rect x="968" y="161" width="262" height="69" rx="8" fill="#fff" stroke="#edc09f"/>
    <text x="983" y="184" class="h">图片：像素与几何</text><text x="983" y="204" class="t">缩放、裁切、旋转、模糊、压缩、遮挡</text><text x="983" y="221" class="s">保持语义 / 改变语义必须分别标记</text>
    <rect x="968" y="242" width="262" height="69" rx="8" fill="#fff" stroke="#edc09f"/>
    <text x="983" y="265" class="h">音频：信号与时间</text><text x="983" y="285" class="t">噪声、增益、重采样、重叠、静音、截断</text><text x="983" y="302" class="s">时间平移后证据区间应同步移动</text>
    <rect x="968" y="323" width="262" height="69" rx="8" fill="#fff" stroke="#edc09f"/>
    <text x="983" y="346" class="h">文档：页与表示层</text><text x="983" y="366" class="t">缺页、乱页、坏字体、OCR 层与扫描冲突</text><text x="983" y="383" class="s">表格合并、页码偏移、隐藏指令注入</text>
    <rect x="968" y="404" width="262" height="112" rx="8" fill="#fff" stroke="#edc09f"/>
    <text x="983" y="427" class="h">跨模态：可控关系变换</text>
    <text x="983" y="449" class="t">完整 → 缺图片 / 缺音频 / 缺文档</text>
    <text x="983" y="470" class="t">一致 → 补充 → 冲突 → 无关</text>
    <text x="983" y="491" class="t">正确配对 → 错配 / 旧版本 / 时间错位</text>
    <text x="983" y="509" class="s">冲突不自动选“更可信”模态；规则先定义</text>
  </g>
  <path d="M950 195 H936" class="inject"/><path d="M950 276 H936" class="inject"/><path d="M950 357 H936" class="inject"/><path d="M950 460 H936" class="inject"/>

  <g filter="url(#s2)">
    <rect x="32" y="568" width="1216" height="115" rx="8" fill="#edf4fc" stroke="#7e9fc6"/>
  </g>
  <text x="51" y="596" class="hh">汇总但不折叠：配对对照 → 切片指标 → 硬门禁 → 发布结论</text>
  <rect x="51" y="611" width="258" height="52" rx="8" fill="#fff" stroke="#9cb4cf"/><text x="66" y="632" class="h">成对鲁棒性</text><text x="66" y="652" class="t">clean vs perturbed；full vs ablated</text>
  <rect x="331" y="611" width="258" height="52" rx="8" fill="#fff" stroke="#9cb4cf"/><text x="346" y="632" class="h">分层诊断</text><text x="346" y="652" class="t">CER / IoU / Order / Align / Task</text>
  <rect x="611" y="611" width="258" height="52" rx="8" fill="#fff" stroke="#9cb4cf"/><text x="626" y="632" class="h">最差风险切片</text><text x="626" y="652" class="t">损坏、缺失、冲突、安全违规不可平均</text>
  <rect x="891" y="611" width="337" height="52" rx="8" fill="#304f73"/><text x="906" y="632" class="w">PASS / REVIEW / FAIL / INVALID</text><text x="906" y="652" class="s" fill="#eaf3ff">保存分子、分母、阈值、版本与证据定位</text>
  <path d="M309 637 H329 M589 637 H609 M869 637 H889" class="arrow"/>
  <path d="M482 536 V566" class="arrow"/><path d="M1099 536 V566" class="inject"/>
  <text x="1048" y="704" class="s">橙色虚线：故障向量注入；蓝灰实线：证据汇总</text>
</svg>
