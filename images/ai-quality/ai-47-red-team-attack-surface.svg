<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 红队资产、信任边界与攻击面</title>
  <desc id="desc">从攻击者与外部内容进入应用，经解析检索、模型编排、确定性策略、工具执行到业务资产的能力流。虚线表示身份、内容、租户、授权、执行和提交信任边界；上下两层列出攻击面与独立安全 Oracle，箭头明确数据和能力从左向右传播。</desc>
  <defs>
    <marker id="arrow47a" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#64748b"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}.title{font:700 32px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.sub{font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}.head{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.text{font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#334155}.small{font:500 12px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.arrow{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow47a)}.dash{fill:none;stroke:#ef4444;stroke-width:2;stroke-dasharray:7 5}.oracle{fill:none;stroke:#0f766e;stroke-width:2;marker-end:url(#arrow47a)}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="38" y="45">红队不是测试一句话，而是验证不可信数据能否获得现实能力</text>
  <text class="sub" x="38" y="73">先定义资产和授权，再追踪 proposed → authorized → executed → committed；模型拒答与业务副作用分别取证。</text>

  <text class="head" x="38" y="111">攻击面与输入</text>
  <rect x="38" y="128" width="184" height="64" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text class="head" x="54" y="155">主体与直接输入</text><text class="small" x="54" y="178">匿名 · 用户 · 协作者 · 内部</text>
  <rect x="238" y="128" width="184" height="64" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text class="head" x="254" y="155">外部内容</text><text class="small" x="254" y="178">邮件 · 网页 · PDF · OCR</text>
  <rect x="438" y="128" width="184" height="64" rx="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text class="head" x="454" y="155">数据与模型面</text><text class="small" x="454" y="178">索引 · 记忆 · Prompt · 路由</text>
  <rect x="638" y="128" width="184" height="64" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text class="head" x="654" y="155">能力控制面</text><text class="small" x="654" y="178">registry · policy · approval</text>
  <rect x="838" y="128" width="184" height="64" rx="7" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text class="head" x="854" y="155">执行与供应链</text><text class="small" x="854" y="178">工具 · SDK · callback · 网络</text>
  <rect x="1038" y="128" width="204" height="64" rx="7" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/>
  <text class="head" x="1054" y="155">资产与证据面</text><text class="small" x="1054" y="178">数据 · 副作用 · 日志 · 控制面</text>

  <text class="head" x="38" y="235">数据与能力主链路</text>
  <rect class="box" x="38" y="255" width="184" height="160" rx="7"/>
  <text class="head" x="54" y="286">Actor / Entry</text>
  <text class="text" x="54" y="316">身份与会话</text><text class="text" x="54" y="342">用户任务</text><text class="text" x="54" y="368">上传与 API</text><text class="small" x="54" y="395">前提：位置、知识、预算</text>
  <rect x="238" y="255" width="184" height="160" rx="7" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text class="head" x="254" y="286">Parse / Retrieve</text>
  <text class="text" x="254" y="316">解析与 OCR</text><text class="text" x="254" y="342">知识检索</text><text class="text" x="254" y="368">摘要与记忆</text><text class="small" x="254" y="395">来源、租户、血缘、TTL</text>
  <rect x="438" y="255" width="184" height="160" rx="7" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text class="head" x="454" y="286">Model / Orchestrator</text>
  <text class="text" x="454" y="316">上下文组装</text><text class="text" x="454" y="342">计划与 Tool Intent</text><text class="text" x="454" y="368">重试、恢复、记忆</text><text class="small" x="454" y="395">输出是建议，不是授权</text>
  <rect x="638" y="255" width="184" height="160" rx="7" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text class="head" x="654" y="286">Policy / Approval</text>
  <text class="text" x="654" y="316">主体 × 动作</text><text class="text" x="654" y="342">资源 × 字段 × 额度</text><text class="text" x="654" y="368">参数绑定与一次性审批</text><text class="small" x="654" y="395">超时、未知字段、重放</text>
  <rect x="838" y="255" width="184" height="160" rx="7" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text class="head" x="854" y="286">Executor / Target</text>
  <text class="text" x="854" y="316">短期凭据</text><text class="text" x="854" y="342">参数再校验</text><text class="text" x="854" y="368">accepted → committed</text><text class="small" x="854" y="395">幂等、事务、网络边界</text>
  <rect x="1038" y="255" width="204" height="160" rx="7" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
  <text class="head" x="1054" y="286">Protected Assets</text>
  <text class="text" x="1054" y="316">跨租户数据与秘密</text><text class="text" x="1054" y="342">付款 · 发信 · 删除 · 执行</text><text class="text" x="1054" y="368">Prompt · 配置 · 审计</text><text class="small" x="1054" y="395">范围、持久性、可逆性</text>

  <path class="arrow" d="M222 335 L238 335"/><path class="arrow" d="M422 335 L438 335"/><path class="arrow" d="M622 335 L638 335"/><path class="arrow" d="M822 335 L838 335"/><path class="arrow" d="M1022 335 L1038 335"/>

  <line class="dash" x1="230" y1="216" x2="230" y2="435"/>
  <line class="dash" x1="430" y1="216" x2="430" y2="435"/>
  <line class="dash" x1="630" y1="216" x2="630" y2="435"/>
  <line class="dash" x1="830" y1="216" x2="830" y2="435"/>
  <line class="dash" x1="1030" y1="216" x2="1030" y2="435"/>
  <text class="small" x="202" y="448">身份边界</text><text class="small" x="401" y="448">内容/租户</text><text class="small" x="601" y="448">意图/授权</text><text class="small" x="801" y="448">授权/执行</text><text class="small" x="1000" y="448">接受/提交</text>

  <text class="head" x="38" y="493">独立 Oracle 与纵深控制</text>
  <rect x="38" y="511" width="184" height="90" rx="7" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text class="head" x="54" y="539">身份 Oracle</text><text class="small" x="54" y="563">认证主体 · role · tenant</text><text class="small" x="54" y="584">合法任务效用对照</text>
  <rect x="238" y="511" width="184" height="90" rx="7" fill="#ecfdf5" stroke="#22c55e" stroke-width="2"/>
  <text class="head" x="254" y="539">数据 Oracle</text><text class="small" x="254" y="563">canary · provenance · DLP</text><text class="small" x="254" y="584">删除与持久化检查</text>
  <rect x="438" y="511" width="184" height="90" rx="7" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text class="head" x="454" y="539">Intent Oracle</text><text class="small" x="454" y="563">proposed action 与参数</text><text class="small" x="454" y="584">模型自评不能代替</text>
  <rect x="638" y="511" width="184" height="90" rx="7" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
  <text class="head" x="654" y="539">Policy Oracle</text><text class="small" x="654" y="563">decision · rule · binding</text><text class="small" x="654" y="584">超时必须显式</text>
  <rect x="838" y="511" width="184" height="90" rx="7" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text class="head" x="854" y="539">Effect Oracle</text><text class="small" x="854" y="563">before / after · transaction</text><text class="small" x="854" y="584">模拟 sink · cleanup</text>
  <rect x="1038" y="511" width="204" height="90" rx="7" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
  <text class="head" x="1054" y="539">Evidence Oracle</text><text class="small" x="1054" y="563">Trace · audit · manifest</text><text class="small" x="1054" y="584">跨信任域相互印证</text>
  <path class="oracle" d="M130 511 L130 418"/><path class="oracle" d="M330 511 L330 418"/><path class="oracle" d="M530 511 L530 418"/><path class="oracle" d="M730 511 L730 418"/><path class="oracle" d="M930 511 L930 418"/><path class="oracle" d="M1140 511 L1140 418"/>

  <rect x="38" y="628" width="1204" height="58" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text class="head" x="58" y="655">贯穿控制：</text>
  <text class="text" x="176" y="655">RoE 与停止条件</text><text class="text" x="352" y="655">隔离租户与最小权限</text><text class="text" x="568" y="655">场景/环境版本</text><text class="text" x="738" y="655">故障注入与合法对照</text><text class="text" x="966" y="655">证据最小化与访问审计</text>
  <text class="small" x="176" y="676">授权先于执行</text><text class="small" x="352" y="676">危险能力由 Broker 发放</text><text class="small" x="568" y="676">固定 profile 才能复测</text><text class="small" x="738" y="676">安全与效用同时验收</text><text class="small" x="966" y="676">语料和 finding 都是敏感资产</text>
</svg>
