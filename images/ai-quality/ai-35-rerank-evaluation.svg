<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">混合检索与重排的质量延迟联合评测</title>
  <desc id="desc">左侧展示从单路召回、候选并集、融合到不同重排深度的消融阶梯；中间展示候选深度和重排深度组成的实验矩阵；右侧展示质量、延迟、资源和安全四组发布证据。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#64748b"/></marker>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.green{fill:#ecfdf5;stroke:#059669;stroke-width:2}.amber{fill:#fffbeb;stroke:#d97706;stroke-width:2}.rose{fill:#fff1f2;stroke:#e11d48;stroke-width:2}.violet{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.cyan{fill:#ecfeff;stroke:#0891b2;stroke-width:2}.arrow{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}
      .title{font:700 29px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.sub{font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}.h{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.t{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#334155}.small{font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}.white{fill:#fff}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="48" y="50">重排深度不是越大越好：用配对消融找到质量增益与尾延迟的拐点</text>
  <text class="sub" x="48" y="80">所有数字均来自同一查询集、同一权限快照和同一候选日志；图中深度仅为实验设计示例，不是通用推荐值。</text>

  <rect class="panel" x="48" y="116" width="360" height="476" rx="8"/>
  <text class="h" x="72" y="151">A · 配对消融阶梯</text>
  <rect class="blue" x="72" y="176" width="312" height="58" rx="7"/><text class="h" x="92" y="211">BM25-only · Ls</text>
  <path class="arrow" d="M228 234 V256"/>
  <rect class="violet" x="72" y="260" width="312" height="58" rx="7"/><text class="h" x="92" y="295">Dense-only · Ld</text>
  <path class="arrow" d="M228 318 V340"/>
  <rect class="green" x="72" y="344" width="312" height="58" rx="7"/><text class="h" x="92" y="379">Union + 去重 + 权限</text>
  <path class="arrow" d="M228 402 V424"/>
  <rect class="amber" x="72" y="428" width="312" height="58" rx="7"/><text class="h" x="92" y="463">RRF / calibrated weighted</text>
  <path class="arrow" d="M228 486 V508"/>
  <rect class="rose" x="72" y="512" width="312" height="58" rx="7"/><text class="h" x="92" y="547">Rerank@R → final Top-k</text>

  <rect class="panel" x="432" y="116" width="430" height="476" rx="8"/>
  <text class="h" x="456" y="151">B · 深度与预算实验矩阵</text>
  <text class="small" x="474" y="190">融合候选 M</text>
  <text class="small" x="472" y="228">20</text><text class="small" x="472" y="300">50</text><text class="small" x="466" y="372">100</text><text class="small" x="466" y="444">200</text>
  <text class="small" x="550" y="190">R=10</text><text class="small" x="650" y="190">R=30</text><text class="small" x="750" y="190">R=80</text>
  <rect class="green" x="536" y="204" width="78" height="50" rx="6"/><text class="small" x="555" y="235">测量</text>
  <rect class="green" x="636" y="204" width="78" height="50" rx="6"/><text class="small" x="655" y="235">测量</text>
  <rect class="amber" x="736" y="204" width="78" height="50" rx="6"/><text class="small" x="755" y="235">越界</text>
  <rect class="green" x="536" y="276" width="78" height="50" rx="6"/><text class="small" x="555" y="307">测量</text>
  <rect class="green" x="636" y="276" width="78" height="50" rx="6"/><text class="small" x="655" y="307">候选</text>
  <rect class="amber" x="736" y="276" width="78" height="50" rx="6"/><text class="small" x="755" y="307">候选</text>
  <rect class="blue" x="536" y="348" width="78" height="50" rx="6"/><text class="small" x="555" y="379">低耗</text>
  <rect class="green" x="636" y="348" width="78" height="50" rx="6"/><text class="small" x="655" y="379">候选</text>
  <rect class="rose" x="736" y="348" width="78" height="50" rx="6"/><text class="small" x="755" y="379">超时</text>
  <rect class="blue" x="536" y="420" width="78" height="50" rx="6"/><text class="small" x="555" y="451">低耗</text>
  <rect class="amber" x="636" y="420" width="78" height="50" rx="6"/><text class="small" x="655" y="451">越界</text>
  <rect class="rose" x="736" y="420" width="78" height="50" rx="6"/><text class="small" x="755" y="451">超时</text>
  <text class="t" x="456" y="510">每格同时记录：</text><text class="small" x="456" y="538">ΔnDCG / ΔMRR · union Recall</text><text class="small" x="456" y="562">p50/p95 · pairs/s · timeout rate</text>

  <rect class="panel" x="886" y="116" width="346" height="476" rx="8"/>
  <text class="h" x="910" y="151">C · 发布证据，而非单一总分</text>
  <rect class="blue" x="910" y="176" width="298" height="82" rx="7"/>
  <text class="h" x="930" y="207">质量</text><text class="t" x="930" y="233">候选覆盖 · 排序增益 · 关键切片</text>
  <rect class="green" x="910" y="276" width="298" height="82" rx="7"/>
  <text class="h" x="930" y="307">延迟</text><text class="t" x="930" y="333">端到端 p95 · 各阶段 p95 · 超时</text>
  <rect class="amber" x="910" y="376" width="298" height="82" rx="7"/>
  <text class="h" x="930" y="407">资源</text><text class="t" x="930" y="433">CPU/GPU · 内存 · batch · 单查询成本</text>
  <rect class="rose" x="910" y="476" width="298" height="82" rx="7"/>
  <text class="h" x="930" y="507">硬门禁</text><text class="t" x="930" y="533">跨租户 = 0 · 删除项 = 0 · 可复现</text>

  <rect x="48" y="620" width="1184" height="52" rx="8" fill="#0f172a"/>
  <text class="h white" x="72" y="653">选择 Pareto 前沿上的配置：任何额外质量增益都必须说明新增延迟、资源与失败面；构造数据不得冒充生产结论。</text>
</svg>
