<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">BM25、Dense、融合与重排流水线</title>
  <desc id="desc">展示查询经过权限范围和双路分析后，BM25 与稠密向量独立召回，各自保留原始分数和排名，经统一文档标识、去重、权限校验、RRF 或校准加权融合形成候选池，再由重排器在延迟预算内输出最终结果。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#64748b"/></marker>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.green{fill:#ecfdf5;stroke:#059669;stroke-width:2}.amber{fill:#fffbeb;stroke:#d97706;stroke-width:2}.rose{fill:#fff1f2;stroke:#e11d48;stroke-width:2}.violet{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.cyan{fill:#ecfeff;stroke:#0891b2;stroke-width:2}.arrow{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}
      .title{font:700 29px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.sub{font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}.h{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.t{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#334155}.small{font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}.white{fill:#fff}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="48" y="50">混合检索的关键是保留两路差异，再用可解释的候选漏斗控制成本</text>
  <text class="sub" x="48" y="80">BM25 分数与 dense 相似度不在同一量尺；先独立排序，再做秩融合或经过验证的分数校准。</text>

  <rect class="panel" x="48" y="126" width="176" height="114" rx="8"/>
  <text class="h" x="70" y="160">查询与范围</text><text class="t" x="70" y="188">query · locale</text><text class="t" x="70" y="212">tenant · ACL · as_of</text>
  <path class="arrow" d="M224 183 H270"/>
  <rect class="blue" x="270" y="108" width="218" height="118" rx="8"/>
  <text class="h" x="292" y="142">BM25 召回 · Ls</text><text class="t" x="292" y="170">分词 · 字段 · 词频 · 文长</text><text class="small" x="292" y="200">保留 rank_s 与 raw_bm25</text>
  <rect class="violet" x="270" y="246" width="218" height="118" rx="8"/>
  <text class="h" x="292" y="280">Dense 召回 · Ld</text><text class="t" x="292" y="308">模型版本 · 距离 · ANN 参数</text><text class="small" x="292" y="338">保留 rank_d 与 raw_dense</text>
  <path class="arrow" d="M488 167 H536"/><path class="arrow" d="M488 305 H536"/>
  <rect class="green" x="536" y="152" width="214" height="168" rx="8"/>
  <text class="h" x="558" y="186">候选规范化</text><text class="t" x="558" y="216">canonical_doc_id</text><text class="t" x="558" y="242">父子 chunk 去重</text><text class="t" x="558" y="268">权限重新校验</text><text class="small" x="558" y="298">拒绝项进入审计证据</text>
  <path class="arrow" d="M750 236 H798"/>
  <rect class="amber" x="798" y="126" width="208" height="114" rx="8"/>
  <text class="h" x="820" y="160">融合 · M</text><text class="t" x="820" y="188">RRF(k0) 或校准加权</text><text class="small" x="820" y="214">输出 fused_rank 与来源</text>
  <path class="arrow" d="M1006 183 H1052"/>
  <rect class="rose" x="1052" y="126" width="180" height="114" rx="8"/>
  <text class="h" x="1074" y="160">重排 · R</text><text class="t" x="1074" y="188">Cross-Encoder</text><text class="t" x="1074" y="212">或 Late Interaction</text>
  <path class="arrow" d="M1142 240 V286"/>
  <rect class="cyan" x="1052" y="286" width="180" height="92" rx="8"/>
  <text class="h" x="1074" y="320">最终 Top-k</text><text class="t" x="1074" y="348">稳定排序 · 证据包</text>

  <rect class="panel" x="48" y="414" width="1184" height="242" rx="8"/>
  <text class="h" x="72" y="449">控制面：每一段都有独立契约、预算和失败语义</text>
  <rect class="blue" x="72" y="472" width="260" height="146" rx="7"/>
  <text class="h" x="92" y="503">候选完整性</text><text class="t" x="92" y="531">BM25-only / dense-only 切片</text><text class="t" x="92" y="557">union recall 与来源覆盖</text><text class="small" x="92" y="588">候选没有进入，重排无法救回</text>
  <rect class="green" x="356" y="472" width="260" height="146" rx="7"/>
  <text class="h" x="376" y="503">融合可解释性</text><text class="t" x="376" y="531">两路独立窗口与稳定 tie-break</text><text class="t" x="376" y="557">RRF 贡献或校准版本</text><text class="small" x="376" y="588">禁止直接相加未校准原始分数</text>
  <rect class="amber" x="640" y="472" width="260" height="146" rx="7"/>
  <text class="h" x="660" y="503">重排成本</text><text class="t" x="660" y="531">深度 R · batch · 序列长度</text><text class="t" x="660" y="557">超时保留已校验融合结果</text><text class="small" x="660" y="588">回退状态必须显式记录</text>
  <rect class="rose" x="924" y="472" width="284" height="146" rx="7"/>
  <text class="h" x="944" y="503">安全与证据</text><text class="t" x="944" y="531">权限在召回前约束、融合后复核</text><text class="t" x="944" y="557">raw ranks · scores · model_id</text><text class="small" x="944" y="588">协议成功与业务相关性分开</text>
</svg>
