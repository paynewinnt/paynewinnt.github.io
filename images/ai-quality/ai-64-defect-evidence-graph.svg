<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 辅助缺陷归因的证据图</title>
  <desc id="desc">展示缺陷事件、追踪、构建、部署、遥测与人工记录如何形成带类型的证据关系，并支持候选根因、反证、未知和人工确认。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0 L0 6 L9 3 Z" fill="#38515d"/>
    </marker>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0 L0 6 L9 3 Z" fill="#c94f5d"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#17252f" flood-opacity="0.14"/>
    </filter>
    <style>
      .bg{fill:#f5f7f8}.title{font:700 30px Arial,"PingFang SC",sans-serif;fill:#18272f}.sub{font:15px Arial,"PingFang SC",sans-serif;fill:#53656e}.h{font:700 17px Arial,"PingFang SC",sans-serif;fill:#1d2d35}.t{font:14px Arial,"PingFang SC",sans-serif;fill:#34464f}.tiny{font:12px Arial,"PingFang SC",sans-serif;fill:#5a6c75}.node{stroke-width:2;filter:url(#shadow)}.edge{fill:none;stroke:#38515d;stroke-width:2.4;marker-end:url(#arrow)}.contra{fill:none;stroke:#c94f5d;stroke-width:2.4;stroke-dasharray:8 6;marker-end:url(#redArrow)}.unknown{fill:none;stroke:#d3911b;stroke-width:2.4;stroke-dasharray:5 5}.label{font:12px Arial,"PingFang SC",sans-serif;fill:#425761}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="52" y="52">缺陷证据图：保留关系语义，不把相邻时间点写成因果</text>
  <text class="sub" x="52" y="80">实线表示已验证的来源或关联；红色虚线表示反证；黄色虚线表示证据缺口，所有节点绑定版本、摘要和时间质量</text>

  <g aria-label="来源证据层">
    <rect x="44" y="118" width="1192" height="190" rx="8" fill="#fff" stroke="#cad4da" stroke-width="2"/>
    <text class="h" x="66" y="149">来源证据：Entity / Activity / Agent</text>

    <rect class="node" x="66" y="172" width="188" height="102" rx="7" fill="#e7f4f2" stroke="#19877f"/>
    <text class="h" x="84" y="202">缺陷事件 D-1042</text>
    <text class="t" x="84" y="229">规范化症状 + 复现摘要</text>
    <text class="tiny" x="84" y="252">event / source / digest</text>

    <rect class="node" x="286" y="172" width="188" height="102" rx="7" fill="#e8eef8" stroke="#4e709f"/>
    <text class="h" x="304" y="202">Trace T-88</text>
    <text class="t" x="304" y="229">Span / Attempt</text>
    <text class="tiny" x="304" y="252">Error / 采样 / 缺口</text>

    <rect class="node" x="506" y="172" width="188" height="102" rx="7" fill="#fff4d9" stroke="#d3911b"/>
    <text class="h" x="524" y="202">构建 B-317</text>
    <text class="t" x="524" y="229">commit / image</text>
    <text class="tiny" x="524" y="252">config digest；锁定版本</text>

    <rect class="node" x="726" y="172" width="188" height="102" rx="7" fill="#f2eaf7" stroke="#7b5794"/>
    <text class="h" x="744" y="202">部署 DEP-42</text>
    <text class="t" x="744" y="229">cohort / region</text>
    <text class="tiny" x="744" y="252">时间窗、实例与流量映射</text>

    <rect class="node" x="946" y="172" width="264" height="102" rx="7" fill="#eaf3df" stroke="#648e42"/>
    <text class="h" x="964" y="202">遥测与业务事实</text>
    <text class="t" x="964" y="229">日志 / 指标 / DB 提交 / 用户结果</text>
    <text class="tiny" x="964" y="252">发生时间、观察时间、时钟质量</text>

    <path class="edge" d="M254 222 H278"/><path class="edge" d="M474 222 H498"/>
    <path class="edge" d="M694 222 H718"/><path class="edge" d="M914 222 H938"/>
  </g>

  <g aria-label="推理与决策层">
    <rect x="44" y="344" width="1192" height="282" rx="8" fill="#fff" stroke="#cad4da" stroke-width="2"/>
    <text class="h" x="66" y="378">候选解释、反证与人工责任</text>

    <rect class="node" x="74" y="416" width="242" height="154" rx="7" fill="#edf2f8" stroke="#4e709f"/>
    <text class="h" x="94" y="448">候选 H1：版本回归</text>
    <text class="t" x="94" y="478">支持：故障组均为 B-317</text>
    <text class="t" x="94" y="504">反事实：回退 B-316 症状消失</text>
    <text class="tiny" x="94" y="534">状态：SUPPORTED，尚未确认</text>

    <rect class="node" x="364" y="416" width="242" height="154" rx="7" fill="#fdebed" stroke="#c94f5d"/>
    <text class="h" x="384" y="448">反证 E-91</text>
    <text class="t" x="384" y="478">B-317 的另一 cohort 未失败</text>
    <text class="t" x="384" y="504">提示还需要配置条件 C-9</text>
    <text class="tiny" x="384" y="534">不能删除或降权到不可见</text>

    <rect class="node" x="654" y="416" width="242" height="154" rx="7" fill="#fff5df" stroke="#d3911b"/>
    <text class="h" x="674" y="448">未知 U-17</text>
    <text class="t" x="674" y="478">12% Trace 未采样且无业务对账</text>
    <text class="t" x="674" y="504">时间偏差上界未校准</text>
    <text class="tiny" x="674" y="534">结论范围必须显式缩小</text>

    <rect class="node" x="944" y="400" width="266" height="186" rx="7" fill="#e5f3e9" stroke="#37815f"/>
    <text class="h" x="964" y="434">人工确认 Decision R-12</text>
    <text class="t" x="964" y="464">已审阅支持证据与反证</text>
    <text class="t" x="964" y="490">确认：B-317 + C-9 共同条件</text>
    <text class="t" x="964" y="516">责任人、范围、置信度、签名</text>
    <text class="tiny" x="964" y="548">可重开；不宣称唯一根因</text>

    <path class="contra" d="M364 472 H324"/>
    <path class="unknown" d="M896 493 H936"/>
    <path class="edge" d="M606 493 H646"/>
    <path class="edge" d="M316 548 C500 622 824 622 936 552"/>
  </g>

  <path class="edge" d="M1078 308 V390"/>
  <text class="label" x="840" y="338">wasDerivedFrom / wasGeneratedBy</text>
  <text class="tiny" x="52" y="677">证据图只保存可验证声明及其来源；聚类是调查入口，人工签名的决定才改变缺陷与发布状态</text>
</svg>
