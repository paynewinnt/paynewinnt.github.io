<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" role="img" aria-labelledby="title desc">
  <title id="title">MCP Host、Client、Server 与策略执行架构</title>
  <desc id="desc">展示 Host 内的用户同意、模型编排、策略执行、审计以及每个 Server 对应的 Client 会话，并区分 JSON-RPC 互操作契约、业务授权和 Server 沙箱三层责任</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#486579"/>
    </marker>
    <marker id="riskArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b75a59"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#27465b" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 34px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #17354d; }
      .subtitle { font: 400 17px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #536b7d; }
      .h2 { font: 700 21px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #17354d; }
      .h3 { font: 700 17px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #284a61; }
      .text { font: 400 15px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #3b596d; }
      .small { font: 400 14px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #5b7283; }
      .mono { font: 600 14px 'SFMono-Regular', Consolas, monospace; fill: #31546b; }
      .white { fill: #ffffff; }
      .line { fill: none; stroke: #486579; stroke-width: 2.4; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #6f8797; stroke-width: 2; stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect width="1280" height="960" fill="#f7fafc"/>
  <rect width="1280" height="100" fill="#ffffff"/>
  <rect y="98" width="1280" height="2" fill="#d8e4eb"/>
  <text x="48" y="49" class="title">MCP 负责互操作，Host 负责决策，沙箱约束真实副作用</text>
  <text x="48" y="79" class="subtitle">能力发现不是授权；Tool、Resource、Prompt 与返回内容都必须经过 Host 的独立策略和来源治理</text>

  <rect x="42" y="122" width="1196" height="458" rx="8" fill="#ffffff" stroke="#7590a2" stroke-width="2"/>
  <rect x="42" y="122" width="1196" height="44" rx="8" fill="#eaf2f7"/>
  <rect x="42" y="158" width="1196" height="8" fill="#eaf2f7"/>
  <text x="64" y="151" class="h2">Host 信任边界</text>
  <text x="1210" y="150" text-anchor="end" class="small">拥有用户交互、模型编排、授权策略和全链路审计</text>

  <g filter="url(#shadow)">
    <rect x="70" y="188" width="230" height="136" rx="8" fill="#e9f4ff" stroke="#6e9fc7"/>
    <rect x="70" y="350" width="230" height="136" rx="8" fill="#f2edfa" stroke="#927eb0"/>
  </g>
  <text x="185" y="220" text-anchor="middle" class="h2">用户与 UI</text>
  <text x="185" y="250" text-anchor="middle" class="text">选择 Prompt / Resource</text>
  <text x="185" y="276" text-anchor="middle" class="text">查看最终参数与副作用</text>
  <rect x="99" y="291" width="172" height="22" rx="5" fill="#3479a8"/>
  <text x="185" y="307" text-anchor="middle" class="small white">同意 · 拒绝 · 撤销</text>

  <text x="185" y="382" text-anchor="middle" class="h2">LLM / Agent</text>
  <text x="185" y="412" text-anchor="middle" class="text">读取上下文并提出 Tool 调用</text>
  <text x="185" y="438" text-anchor="middle" class="text">输出可能错误或受注入影响</text>
  <text x="185" y="467" text-anchor="middle" class="small">不是授权主体，不直接持有凭据</text>

  <path d="M300 256 H337" class="line"/>
  <path d="M300 418 H337" class="line"/>

  <g filter="url(#shadow)">
    <rect x="347" y="188" width="310" height="298" rx="8" fill="#fff6e7" stroke="#d3a04f"/>
  </g>
  <text x="502" y="220" text-anchor="middle" class="h2">编排与策略执行点</text>
  <rect x="373" y="244" width="258" height="53" rx="6" fill="#ffffff" stroke="#dab46f"/>
  <rect x="373" y="311" width="258" height="53" rx="6" fill="#ffffff" stroke="#dab46f"/>
  <rect x="373" y="378" width="258" height="78" rx="6" fill="#ffffff" stroke="#dab46f"/>
  <text x="502" y="266" text-anchor="middle" class="h3">发现与契约校验</text>
  <text x="502" y="286" text-anchor="middle" class="small">版本 · 能力 · Manifest · Schema</text>
  <text x="502" y="333" text-anchor="middle" class="h3">身份与最小权限</text>
  <text x="502" y="353" text-anchor="middle" class="small">用户 / 租户 / 对象 ACL / Scope</text>
  <text x="502" y="400" text-anchor="middle" class="h3">动作前 Gate</text>
  <text x="502" y="423" text-anchor="middle" class="small">规范化参数 · 用户同意 · DLP</text>
  <text x="502" y="445" text-anchor="middle" class="small">幂等键 · 预算 · 跨 Server 降权</text>
  <text x="502" y="476" text-anchor="middle" class="small">拒绝时：不发送 tools/call，外部副作用为零</text>

  <path d="M657 337 H687" class="line"/>
  <g filter="url(#shadow)">
    <rect x="697" y="188" width="164" height="298" rx="8" fill="#e9f7ef" stroke="#6ca17c"/>
  </g>
  <text x="779" y="220" text-anchor="middle" class="h2">审计与真值</text>
  <text x="779" y="254" text-anchor="middle" class="text">原始 JSON-RPC 帧</text>
  <text x="779" y="282" text-anchor="middle" class="text">能力 / Manifest 摘要</text>
  <text x="779" y="310" text-anchor="middle" class="text">策略与同意记录</text>
  <text x="779" y="338" text-anchor="middle" class="text">取消 / 超时 / 重试</text>
  <text x="779" y="366" text-anchor="middle" class="text">网络 · 文件 · 进程</text>
  <text x="779" y="394" text-anchor="middle" class="text">数据库与业务终态</text>
  <rect x="720" y="420" width="118" height="38" rx="6" fill="#3f8661"/>
  <text x="779" y="444" text-anchor="middle" class="small white">脱敏 · 留存 · 删除</text>

  <path d="M861 269 H897" class="line"/>
  <path d="M861 407 H897" class="line"/>
  <g filter="url(#shadow)">
    <rect x="907" y="188" width="301" height="129" rx="8" fill="#e9f3ff" stroke="#6b9cc4"/>
    <rect x="907" y="357" width="301" height="129" rx="8" fill="#f4eef9" stroke="#917caf"/>
  </g>
  <text x="1057" y="219" text-anchor="middle" class="h2">MCP Client A</text>
  <text x="1057" y="247" text-anchor="middle" class="text">Server A 专属会话与能力快照</text>
  <text x="1057" y="273" text-anchor="middle" class="mono">initialize → initialized</text>
  <text x="1057" y="298" text-anchor="middle" class="small">ID、分页、取消、Progress 状态</text>

  <text x="1057" y="388" text-anchor="middle" class="h2">MCP Client B</text>
  <text x="1057" y="416" text-anchor="middle" class="text">Server B 专属会话与能力快照</text>
  <text x="1057" y="442" text-anchor="middle" class="mono">initialize → initialized</text>
  <text x="1057" y="467" text-anchor="middle" class="small">不继承 A 的身份、同意或结果信任</text>

  <line x1="42" y1="616" x2="1238" y2="616" class="dash"/>
  <rect x="420" y="598" width="440" height="36" rx="18" fill="#ffffff" stroke="#71899a"/>
  <text x="640" y="622" text-anchor="middle" class="h3">JSON-RPC 2.0 over stdio / Streamable HTTP</text>
  <text x="70" y="655" class="small">协议边界：协商方法、消息形状和生命周期</text>
  <text x="1210" y="655" text-anchor="end" class="small">信任边界：Server 元数据、内容与结果均视为外部输入</text>

  <path d="M1208 252 H1220 V668 H245 V687" class="line"/>
  <path d="M1057 486 V676 H640 V687" class="line"/>
  <path d="M1165 486 V684 H1035 V687" fill="none" stroke="#b75a59" stroke-width="2.4" marker-end="url(#riskArrow)"/>

  <g filter="url(#shadow)">
    <rect x="70" y="697" width="350" height="157" rx="8" fill="#eaf7ef" stroke="#67a079"/>
    <rect x="465" y="697" width="350" height="157" rx="8" fill="#eef2fb" stroke="#7a8fbd"/>
    <rect x="860" y="697" width="350" height="157" rx="8" fill="#fff0ef" stroke="#bf6b69"/>
  </g>
  <text x="245" y="730" text-anchor="middle" class="h2">MCP Server A</text>
  <text x="245" y="759" text-anchor="middle" class="text">tools · resources · prompts</text>
  <text x="245" y="786" text-anchor="middle" class="text">本地文件 / 构建系统</text>
  <text x="245" y="816" text-anchor="middle" class="small">进程、文件和网络由独立沙箱收敛</text>
  <text x="245" y="840" text-anchor="middle" class="small">返回成功不证明业务事实成功</text>

  <text x="640" y="730" text-anchor="middle" class="h2">MCP Server B</text>
  <text x="640" y="759" text-anchor="middle" class="text">tools · resources · prompts</text>
  <text x="640" y="786" text-anchor="middle" class="text">远程 SaaS / 企业数据</text>
  <text x="640" y="816" text-anchor="middle" class="small">OAuth 约束 Token 受众与 Scope</text>
  <text x="640" y="840" text-anchor="middle" class="small">对象 ACL 与租户隔离仍由业务执行</text>

  <text x="1035" y="730" text-anchor="middle" class="h2">替换或恶意 Server</text>
  <text x="1035" y="759" text-anchor="middle" class="text">名称碰撞 · Tool Poisoning</text>
  <text x="1035" y="786" text-anchor="middle" class="text">Rug Pull · Result Injection</text>
  <text x="1035" y="816" text-anchor="middle" class="small">身份或 Manifest 变化即冻结旧授权</text>
  <text x="1035" y="840" text-anchor="middle" class="small">不得借可信 Server 放大权限</text>

  <rect x="42" y="884" width="1196" height="50" rx="8" fill="#ffffff" stroke="#d1dee6"/>
  <rect x="42" y="884" width="382" height="50" rx="8" fill="#e8f2fa"/>
  <rect x="449" y="884" width="382" height="50" fill="#fff3df"/>
  <rect x="856" y="884" width="382" height="50" rx="8" fill="#e9f6ee"/>
  <text x="233" y="915" text-anchor="middle" class="h3">协议：互操作契约</text>
  <text x="640" y="915" text-anchor="middle" class="h3">Host：业务授权与用户同意</text>
  <text x="1047" y="915" text-anchor="middle" class="h3">运行环境：最小权限与沙箱</text>
</svg>
