<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">从单次调用到自治 Agent 的复杂度与控制权谱系</title>
  <desc id="desc">展示单次调用、Prompt Chaining、Routing、Parallelization、Orchestrator-Workers、Evaluator-Optimizer 和自治 Agent 的复杂度阶梯，并标出始终留在确定性控制层的权限、副作用、预算和终态判断。</desc>
  <style>
    .bg { fill: #f8fafc; }
    .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
    .sub { font: 400 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
    .group { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
    .h { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
    .t { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
    .small { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .workflow { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .route { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; }
    .parallel { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .bounded { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
    .agent { fill: #fff7ed; stroke: #ea580c; stroke-width: 2.5; }
    .control { fill: #ffffff; stroke: #334155; stroke-width: 2; }
    .arrow { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    .axis { stroke: #94a3b8; stroke-width: 2; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="bg" width="1280" height="820"/>
  <text class="title" x="54" y="56">复杂度升级的是动态决策范围，不是安全控制权</text>
  <text class="sub" x="54" y="89">从最低复杂度开始；只有冻结评测证明简单方案不足，才扩大模型对过程和工具的决定范围。</text>

  <text class="group" x="54" y="139">预定义代码路径</text>
  <rect class="workflow" x="54" y="160" width="258" height="112" rx="8"/>
  <text class="h" x="78" y="193">L0  单次调用</text>
  <text class="t" x="78" y="220">一次理解或生成</text>
  <text class="t" x="78" y="246">Schema / 规则验收</text>

  <rect class="workflow" x="54" y="292" width="258" height="112" rx="8"/>
  <text class="h" x="78" y="325">L1  Prompt Chaining</text>
  <text class="t" x="78" y="352">固定阶段逐步处理</text>
  <text class="t" x="78" y="378">中间门禁定位失败</text>

  <rect class="route" x="54" y="424" width="258" height="112" rx="8"/>
  <text class="h" x="78" y="457">L2  Routing</text>
  <text class="t" x="78" y="484">受限类别进入专用流程</text>
  <text class="t" x="78" y="510">未知类别安全降级</text>

  <rect class="parallel" x="54" y="556" width="258" height="112" rx="8"/>
  <text class="h" x="78" y="589">L3  Parallelization</text>
  <text class="t" x="78" y="616">预定义独立子任务并行</text>
  <text class="t" x="78" y="642">程序化聚合或投票</text>

  <path class="arrow" d="M332 414 L392 414"/>

  <text class="group" x="398" y="139">受控的动态区域</text>
  <rect class="bounded" x="398" y="184" width="340" height="178" rx="8"/>
  <text class="h" x="424" y="220">L4  Orchestrator-Workers</text>
  <text class="t" x="424" y="251">模型动态拆分子任务</text>
  <text class="t" x="424" y="279">外层拓扑、数量和合同固定</text>
  <text class="small" x="424" y="320" fill="#6d28d9">动态：怎么拆、查什么</text>
  <text class="small" x="424" y="344" fill="#334155">固定：权限、预算、聚合门禁</text>

  <rect class="bounded" x="398" y="394" width="340" height="178" rx="8"/>
  <text class="h" x="424" y="430">L5  Evaluator-Optimizer</text>
  <text class="t" x="424" y="461">生成、反馈、修正形成循环</text>
  <text class="t" x="424" y="489">循环次数与通过条件有界</text>
  <text class="small" x="424" y="530" fill="#6d28d9">动态：候选与改进方案</text>
  <text class="small" x="424" y="554" fill="#334155">固定：Rubric、进展、终止</text>

  <path class="arrow" d="M760 414 L820 414"/>

  <text class="group" x="826" y="139">开放过程决策</text>
  <rect class="agent" x="826" y="184" width="400" height="388" rx="8"/>
  <text class="h" x="854" y="222">L6  自治 Agent</text>
  <text class="t" x="854" y="256">目标 -> 观察 -> 计划 -> 工具 -> 再观察</text>
  <text class="t" x="854" y="286">步骤、分支和工具序列无法提前枚举</text>
  <rect x="854" y="318" width="344" height="96" rx="8" fill="#fff" stroke="#fdba74"/>
  <text class="h" x="878" y="349">适合开放调查与候选生成</text>
  <text class="t" x="878" y="377">环境证据持续改变下一步计划</text>
  <text class="t" x="878" y="399">任务价值覆盖更高成本与时延</text>
  <rect x="854" y="438" width="344" height="96" rx="8" fill="#fff1f2" stroke="#fb7185"/>
  <text class="h" x="878" y="469">不等于获得无限控制权</text>
  <text class="t" x="878" y="497">不可自行扩权、扩大预算或宣布成功</text>
  <text class="t" x="878" y="519">高风险副作用仍由控制器提交</text>

  <line class="axis" x1="54" y1="708" x2="1226" y2="708"/>
  <path class="arrow" d="M54 708 L1226 708"/>
  <text class="small" x="54" y="695" fill="#475569">路径可预测、成本低、易回放</text>
  <text class="small" x="1011" y="695" fill="#c2410c">灵活性高、组合故障更多</text>

  <rect class="control" x="54" y="734" width="1172" height="58" rx="8"/>
  <text class="h" x="78" y="769">始终留在确定性控制层：</text>
  <text class="t" x="302" y="769">身份与权限  ·  参数边界  ·  幂等与副作用  ·  状态转换  ·  超时与预算  ·  审批  ·  最终 Oracle</text>
</svg>
