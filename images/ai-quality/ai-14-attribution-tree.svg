<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">AI 故障归因树与证据闭环</title>
  <desc id="desc">从用户影响向上回溯传播链、首错和触发条件，再用复现、对照与干预证据识别根因和放大因素。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .node-title { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .node-detail { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .label { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .evidence { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #14532d; }
      .legend { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect width="1280" height="800" fill="#f8fafc"/>
  <rect x="32" y="28" width="1216" height="744" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="64" y="78" class="title">AI 故障归因树：结论必须由反事实证据收口</text>
  <text x="64" y="109" class="subtitle">时间先后只能产生候选；复现、对照和干预才能提升因果置信度</text>

  <g filter="url(#shadow)">
    <rect x="492" y="142" width="296" height="82" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <rect x="492" y="278" width="296" height="82" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <rect x="492" y="414" width="296" height="82" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <rect x="492" y="550" width="296" height="82" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  </g>

  <text x="640" y="174" text-anchor="middle" class="node-title">用户影响 / 可见症状</text>
  <text x="640" y="201" text-anchor="middle" class="node-detail">错误答案、错误动作、漏报、延迟或不可用</text>

  <text x="640" y="310" text-anchor="middle" class="node-title">错误传播链</text>
  <text x="640" y="337" text-anchor="middle" class="node-detail">下游事件解释影响如何被制造和放大</text>

  <text x="640" y="446" text-anchor="middle" class="node-title">首错事件</text>
  <text x="640" y="473" text-anchor="middle" class="node-detail">时间线上第一个违反明确不变量的事件</text>

  <text x="640" y="582" text-anchor="middle" class="node-title">根因候选</text>
  <text x="640" y="609" text-anchor="middle" class="node-detail">修复后可阻断同类故障复发的系统条件</text>

  <line x1="640" y1="224" x2="640" y2="274" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="640" y1="360" x2="640" y2="410" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="640" y1="496" x2="640" y2="546" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="654" y="256" class="label">向上回溯</text>
  <text x="654" y="392" class="label">定位最早违约</text>
  <text x="654" y="528" class="label">提出可证伪假设</text>

  <g filter="url(#shadow)">
    <rect x="72" y="278" width="300" height="108" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <rect x="72" y="430" width="300" height="108" rx="8" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
    <rect x="908" y="278" width="300" height="108" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
    <rect x="908" y="430" width="300" height="108" rx="8" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
  </g>

  <text x="222" y="310" text-anchor="middle" class="node-title">触发条件</text>
  <text x="222" y="338" text-anchor="middle" class="node-detail">让潜在缺陷进入活跃路径</text>
  <text x="222" y="362" text-anchor="middle" class="node-detail">例如：超长会话、特定租户、峰值流量</text>

  <text x="222" y="462" text-anchor="middle" class="node-title">逃逸控制</text>
  <text x="222" y="490" text-anchor="middle" class="node-detail">本应发现或阻断错误却未生效</text>
  <text x="222" y="514" text-anchor="middle" class="node-detail">例如：契约校验缺失、质量门禁失真</text>

  <text x="1058" y="310" text-anchor="middle" class="node-title">放大因素</text>
  <text x="1058" y="338" text-anchor="middle" class="node-detail">不一定制造首错，但扩大范围或损害</text>
  <text x="1058" y="362" text-anchor="middle" class="node-detail">例如：无限重试、共享缓存、危险默认值</text>

  <text x="1058" y="462" text-anchor="middle" class="node-title">恢复与缓解因素</text>
  <text x="1058" y="490" text-anchor="middle" class="node-detail">限制影响或缩短恢复时间</text>
  <text x="1058" y="514" text-anchor="middle" class="node-detail">例如：熔断、只读降级、人工审批</text>

  <path d="M 372 332 C 420 332, 430 435, 488 449" fill="none" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 372 484 C 420 484, 440 466, 488 458" fill="none" stroke="#9333ea" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 908 332 C 860 332, 850 307, 792 315" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 908 484 C 860 484, 836 355, 792 333" fill="none" stroke="#be185d" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="72" y="665" width="1136" height="72" rx="8" fill="#ecfdf5" stroke="#86efac"/>
  <text x="94" y="694" class="evidence">证据闭环</text>
  <text x="214" y="694" class="node-detail">同输入复现</text>
  <text x="342" y="694" class="node-detail">版本对照</text>
  <text x="462" y="694" class="node-detail">替换单一变量</text>
  <text x="614" y="694" class="node-detail">故障注入</text>
  <text x="734" y="694" class="node-detail">修复后回放</text>
  <text x="870" y="694" class="node-detail">跨样本验证</text>
  <text x="1010" y="694" class="node-detail">人工复核</text>
  <text x="1142" y="694" text-anchor="end" class="node-detail">残余风险</text>
  <line x1="214" y1="716" x2="1128" y2="716" stroke="#15803d" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <circle cx="932" cy="92" r="7" fill="#334155"/>
  <text x="946" y="97" class="legend">黑线：时间与传播</text>
  <circle cx="1084" cy="92" r="7" fill="#15803d"/>
  <text x="1098" y="97" class="legend">绿线：验证闭环</text>
</svg>
