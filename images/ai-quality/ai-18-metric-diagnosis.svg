<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">RAG 指标诊断与反事实归因</title>
  <desc id="desc">通过正常检索、金标准上下文和移除上下文三组实验，区分语料、检索、生成和引用问题。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 30px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .head { font: 700 18px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .body { font: 400 15px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .small { font: 500 13px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .metric { font: 600 14px "JetBrains Mono", "Noto Sans SC", monospace; fill: #1e293b; }
    </style>
  </defs>
  <rect width="1280" height="800" fill="#f8fafc"/>
  <rect x="0" y="0" width="1280" height="8" fill="#7c3aed"/>
  <text x="64" y="58" class="title">RAG 指标诊断：用反事实实验定位责任层</text>
  <text x="64" y="87" class="subtitle">不要从“答案错了”直接跳到“换模型”；先替换上下文，再观察错误是否消失。</text>

  <rect x="64" y="132" width="1152" height="96" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="92" y="166" class="head">固定输入契约</text>
  <text x="92" y="198" class="body">同一 query、同一 prompt、同一模型参数、同一答案判定器；只改变供给模型的上下文。</text>
  <rect x="840" y="153" width="330" height="48" rx="6" fill="#f1f5f9"/>
  <text x="1005" y="182" text-anchor="middle" class="metric">control one variable at a time</text>

  <g>
    <rect x="64" y="272" width="328" height="224" rx="8" fill="#eff6ff" stroke="#0284c7" stroke-width="2"/>
    <text x="228" y="312" text-anchor="middle" class="head">A. 生产检索上下文</text>
    <text x="88" y="354" class="body">真实检索器 + 重排 + 截断</text>
    <text x="88" y="390" class="body">回答错误时仍无法直接归因</text>
    <rect x="88" y="423" width="280" height="46" rx="6" fill="#dbeafe"/>
    <text x="228" y="452" text-anchor="middle" class="metric">E2E = retrieval + generation</text>

    <rect x="476" y="272" width="328" height="224" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="640" y="312" text-anchor="middle" class="head">B. 金标准上下文</text>
    <text x="500" y="354" class="body">人工确认的最小充分证据</text>
    <text x="500" y="390" class="body">隔离检索，直接测试生成器</text>
    <rect x="500" y="423" width="280" height="46" rx="6" fill="#d1fae5"/>
    <text x="640" y="452" text-anchor="middle" class="metric">Oracle-context experiment</text>

    <rect x="888" y="272" width="328" height="224" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="1052" y="312" text-anchor="middle" class="head">C. 无关或空上下文</text>
    <text x="912" y="354" class="body">移除证据或注入可识别噪声</text>
    <text x="912" y="390" class="body">测试拒答与参数记忆泄漏</text>
    <rect x="912" y="423" width="280" height="46" rx="6" fill="#ffedd5"/>
    <text x="1052" y="452" text-anchor="middle" class="metric">No-context control</text>
  </g>

  <path d="M228 228 V268" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M640 228 V268" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1052 228 V268" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="64" y="550" width="1152" height="184" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="92" y="588" class="head">诊断规则</text>
  <circle cx="104" cy="626" r="7" fill="#0284c7"/>
  <text x="126" y="632" class="body">A 失败、B 通过：优先修检索、重排、过滤或上下文预算。</text>
  <circle cx="104" cy="664" r="7" fill="#059669"/>
  <text x="126" y="670" class="body">A 与 B 都失败：正确证据已经给出，优先修提示约束、生成器或答案解析。</text>
  <circle cx="650" cy="626" r="7" fill="#ea580c"/>
  <text x="672" y="632" class="body">C 仍给出确定答案：检查拒答策略、参数记忆和证据门禁。</text>
  <circle cx="650" cy="664" r="7" fill="#dc2626"/>
  <text x="672" y="670" class="body">答案正确但引文错误：引用层与端到端失败，检索层仍独立判定。</text>
  <text x="92" y="712" class="small">每条规则都要按查询切片统计，并保留 trace_id、语料版本、检索结果、最终上下文和原子陈述判定。</text>
</svg>
