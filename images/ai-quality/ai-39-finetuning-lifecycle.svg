<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">微调实验合同、训练产物、候选验收与回滚生命周期</title>
  <desc id="desc">从先验证 Prompt、RAG 和工具约束是否足够开始，建立冻结的实验合同和基线，审计数据并生成指纹，训练候选及完整产物清单，经过离线分切片门禁、影子和灰度后提升稳定模型。任何硬门禁或线上信号失败都将路由指针回滚，并隔离模型与数据版本。</desc>
  <style>
    .bg { fill: #f8fafc; }
    .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #172033; }
    .sub { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #526077; }
    .h { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #172033; }
    .t { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #344258; }
    .small { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .neutral { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; }
    .green { fill: #ecfdf5; stroke: #059669; stroke-width: 2.5; }
    .blue { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.5; }
    .cyan { fill: #ecfeff; stroke: #0891b2; stroke-width: 2.5; }
    .violet { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2.5; }
    .amber { fill: #fffbeb; stroke: #d97706; stroke-width: 2.5; }
    .red { fill: #fff1f2; stroke: #e11d48; stroke-width: 2.5; }
    .arrow { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
    .rollback { fill: none; stroke: #e11d48; stroke-width: 3; stroke-dasharray: 8 6; marker-end: url(#redArrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#64748b"/></marker>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#e11d48"/></marker>
  </defs>

  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="42" y="49">微调不是一次训练任务，而是一份可验收、可复现、可撤销的实验合同</text>
  <text class="sub" x="42" y="79">每个候选都必须回答：比哪个基线好、在哪些切片退化、由哪些数据与代码产生、失败时切回什么。</text>

  <rect class="amber" x="42" y="118" width="216" height="130" rx="7"/>
  <text class="h" x="62" y="151">0. 必要性门</text>
  <text class="t" x="62" y="180">Prompt / RAG / 工具基线</text>
  <text class="t" x="62" y="205">稳定行为缺口是否存在</text>
  <text class="small" x="62" y="231" fill="#b45309">证据不足则不训练</text>
  <path class="arrow" d="M258 183 L290 183"/>

  <rect class="blue" x="294" y="118" width="216" height="130" rx="7"/>
  <text class="h" x="314" y="151">1. 实验合同</text>
  <text class="t" x="314" y="180">任务、基线、切片、门槛</text>
  <text class="t" x="314" y="205">成本预算与停止条件</text>
  <text class="small" x="314" y="231" fill="#1d4ed8">训练前冻结并签署</text>
  <path class="arrow" d="M510 183 L542 183"/>

  <rect class="cyan" x="546" y="118" width="216" height="130" rx="7"/>
  <text class="h" x="566" y="151">2. 数据审计</text>
  <text class="t" x="566" y="180">许可、隐私、用途、隔离</text>
  <text class="t" x="566" y="205">数据清单与 split 指纹</text>
  <text class="small" x="566" y="231" fill="#0e7490">不合格样本先隔离</text>
  <path class="arrow" d="M762 183 L794 183"/>

  <rect class="violet" x="798" y="118" width="216" height="130" rx="7"/>
  <text class="h" x="818" y="151">3. 训练运行</text>
  <text class="t" x="818" y="180">基座快照、方法、超参数</text>
  <text class="t" x="818" y="205">seed、环境、逐步指标</text>
  <text class="small" x="818" y="231" fill="#6d28d9">检查点不等于候选通过</text>
  <path class="arrow" d="M1014 183 L1046 183"/>

  <rect class="green" x="1050" y="118" width="188" height="130" rx="7"/>
  <text class="h" x="1070" y="151">4. 产物包</text>
  <text class="t" x="1070" y="180">模型 / Adapter 哈希</text>
  <text class="t" x="1070" y="205">数据、代码、环境血缘</text>
  <text class="small" x="1070" y="231" fill="#047857">不可变 manifest</text>

  <text class="h" x="42" y="305">候选发布链</text>
  <rect class="neutral" x="42" y="328" width="226" height="128" rx="7"/>
  <text class="h" x="62" y="361">冻结基线重跑</text>
  <text class="t" x="62" y="390">同测试集、评测器与参数</text>
  <text class="small" x="62" y="428" fill="#475569">先证明比较可复现</text>
  <path class="arrow" d="M268 392 L304 392"/>

  <rect class="blue" x="308" y="328" width="226" height="128" rx="7"/>
  <text class="h" x="328" y="361">离线分切片门禁</text>
  <text class="t" x="328" y="390">任务增益 + 退化上限</text>
  <text class="small" x="328" y="428" fill="#1d4ed8">安全红线不可平均</text>
  <path class="arrow" d="M534 392 L570 392"/>

  <rect class="cyan" x="574" y="328" width="226" height="128" rx="7"/>
  <text class="h" x="594" y="361">影子与成对比较</text>
  <text class="t" x="594" y="390">真实输入，不交付候选</text>
  <text class="small" x="594" y="428" fill="#0e7490">检查分布与运行成本</text>
  <path class="arrow" d="M800 392 L836 392"/>

  <rect class="violet" x="840" y="328" width="226" height="128" rx="7"/>
  <text class="h" x="860" y="361">受控灰度</text>
  <text class="t" x="860" y="390">租户白名单 · 小流量</text>
  <text class="small" x="860" y="428" fill="#6d28d9">连续窗口与人工复核</text>
  <path class="arrow" d="M1066 392 L1098 392"/>

  <rect class="green" x="1102" y="328" width="136" height="128" rx="7"/>
  <text class="h" x="1122" y="361">提升</text>
  <text class="t" x="1122" y="390">稳定指针</text>
  <text class="small" x="1122" y="428" fill="#047857">保留旧版本</text>

  <path class="rollback" d="M1170 456 C1170 520 954 520 954 460"/>
  <path class="rollback" d="M954 456 C954 548 421 548 421 460"/>
  <text class="small" x="685" y="531" fill="#be123c">任一硬门禁、灰度安全或业务底线失败：立即停止扩大并切回稳定指针</text>

  <text class="h" x="42" y="578">回滚控制面</text>
  <rect class="red" x="42" y="598" width="368" height="82" rx="7"/>
  <text class="h" x="62" y="630">模型回滚</text>
  <text class="t" x="62" y="657">路由指针切回已验证基线；检查 Prompt 与缓存兼容</text>
  <rect class="amber" x="430" y="598" width="368" height="82" rx="7"/>
  <text class="h" x="450" y="630">数据回滚</text>
  <text class="t" x="450" y="657">撤销数据版本；需要时从干净父版本重新训练</text>
  <rect class="neutral" x="818" y="598" width="420" height="82" rx="7"/>
  <text class="h" x="838" y="630">证据与隔离</text>
  <text class="t" x="838" y="657">冻结候选、训练 manifest、逐样本结果、线上 trace 与审批记录</text>
</svg>
