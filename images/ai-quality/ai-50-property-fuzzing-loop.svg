<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 接口属性测试与 Fuzzing 闭环及证据流</title>
  <desc id="desc">展示契约、生成器、三层有效性验证、沙箱状态机、Oracle、覆盖反馈、失败收缩和回归语料库之间的闭环。实线表示执行数据流，蓝色虚线表示覆盖反馈，红色虚线表示失败证据与收缩回流。</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.title{font:700 31px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#17324d}.sub{font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#51697d}.h{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#17324d}.t{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#334f63}.small{font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}.box{fill:#fff;stroke:#cbd8e2;stroke-width:2}.arrow{fill:none;stroke:#647b8c;stroke-width:2.5;marker-end:url(#arrow)}.feedback{fill:none;stroke:#397cb3;stroke-width:2.5;stroke-dasharray:7 6;marker-end:url(#blue-arrow)}.failure{fill:none;stroke:#bd6268;stroke-width:2.5;stroke-dasharray:7 6;marker-end:url(#red-arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#647b8c"/></marker>
    <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#397cb3"/></marker>
    <marker id="red-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#bd6268"/></marker>
  </defs>

  <rect class="bg" width="1280" height="720"/>
  <rect width="1280" height="102" fill="#ffffff"/>
  <rect y="100" width="1280" height="2" fill="#dce6ed"/>
  <text class="title" x="46" y="44">属性测试 / Fuzzing 闭环：随机输入必须变成可归因、可重放的证据</text>
  <text class="sub" x="46" y="76">先声明三层有效性与失败谓词，再生成、执行、观测、收缩；覆盖只负责导航，发布仍由业务 Oracle 与风险门禁决定。</text>

  <text class="h" x="46" y="133">执行数据流</text>
  <rect x="46" y="151" width="176" height="138" rx="8" fill="#e6f2ff" stroke="#4d8fbe" stroke-width="2"/>
  <text class="h" x="64" y="183">1. 版本化契约</text>
  <text class="t" x="64" y="212">Schema / 业务规则</text>
  <text class="t" x="64" y="236">状态图 / 副作用策略</text>
  <text class="t" x="64" y="260">属性 / 失败分类</text>

  <path class="arrow" d="M222 220 L248 220"/>
  <rect x="252" y="151" width="176" height="138" rx="8" fill="#f1eafa" stroke="#8c70ae" stroke-width="2"/>
  <text class="h" x="270" y="183">2. 生成与变异</text>
  <text class="t" x="270" y="212">valid / 单缺陷 invalid</text>
  <text class="t" x="270" y="236">边界值 / 序列 / mutation</text>
  <text class="t" x="270" y="260">seed + path 可重放</text>

  <path class="arrow" d="M428 220 L454 220"/>
  <rect x="458" y="151" width="218" height="138" rx="8" fill="#fff4dc" stroke="#c28a36" stroke-width="2"/>
  <text class="h" x="476" y="183">3. 三层有效性门</text>
  <text class="t" x="476" y="212">schema-valid：结构契约</text>
  <text class="t" x="476" y="236">business-valid：快照规则</text>
  <text class="t" x="476" y="260">transition-valid：状态前缀</text>

  <path class="arrow" d="M676 220 L702 220"/>
  <rect x="706" y="151" width="206" height="138" rx="8" fill="#e5f6eb" stroke="#56946d" stroke-width="2"/>
  <text class="h" x="724" y="183">4. 沙箱状态机</text>
  <text class="t" x="724" y="212">幂等执行器 / mock</text>
  <text class="t" x="724" y="236">超时、截断、重复注入</text>
  <text class="t" x="724" y="260">禁止真实不可逆副作用</text>

  <path class="arrow" d="M912 220 L938 220"/>
  <rect x="942" y="151" width="292" height="138" rx="8" fill="#ffecee" stroke="#bd6268" stroke-width="2"/>
  <text class="h" x="960" y="183">5. Oracle 与运行证据</text>
  <text class="t" x="960" y="212">后置条件 · 不变量 · metamorphic</text>
  <text class="t" x="960" y="236">输出、状态、调用、资源与覆盖事件</text>
  <text class="t" x="960" y="260">观测 ≠ 推断 ≠ 发布决策</text>

  <text class="h" x="46" y="337">反馈、最小化与资产化</text>
  <rect class="box" x="46" y="358" width="258" height="174" rx="8"/>
  <rect x="46" y="358" width="258" height="42" rx="8" fill="#ddecfa"/>
  <text class="h" x="64" y="385">覆盖与调度器</text>
  <text class="t" x="64" y="428">代码边 / Schema 关键字结果</text>
  <text class="t" x="64" y="453">业务规则 / 状态转移 / Oracle</text>
  <text class="t" x="64" y="478">新颖信号提高能量，不证明正确</text>
  <text class="small" x="64" y="510">输出：下一轮种子与预算权重</text>

  <rect class="box" x="336" y="358" width="258" height="174" rx="8"/>
  <rect x="336" y="358" width="258" height="42" rx="8" fill="#f7dddd"/>
  <text class="h" x="354" y="385">失败分类与 Shrinker</text>
  <text class="t" x="354" y="428">固定失败签名与环境快照</text>
  <text class="t" x="354" y="453">保持前置条件 + 失败谓词</text>
  <text class="t" x="354" y="478">删步骤、简字段、缩边界、再重放</text>
  <text class="small" x="354" y="510">输出：最小反例 + 收缩轨迹</text>

  <rect class="box" x="626" y="358" width="258" height="174" rx="8"/>
  <rect x="626" y="358" width="258" height="42" rx="8" fill="#dfefdf"/>
  <text class="h" x="644" y="385">Corpus 与回归套件</text>
  <text class="t" x="644" y="428">人工种子 / 历史事故 / 最小反例</text>
  <text class="t" x="644" y="453">覆盖新颖样本 / 版本与血缘</text>
  <text class="t" x="644" y="478">去重但保留语义与状态多样性</text>
  <text class="small" x="644" y="510">输出：每次提交必跑 + 长跑种子</text>

  <rect class="box" x="916" y="358" width="318" height="174" rx="8"/>
  <rect x="916" y="358" width="318" height="42" rx="8" fill="#f8e9c7"/>
  <text class="h" x="934" y="385">门禁、修复与重新建模</text>
  <text class="t" x="934" y="428">复现率、严重度、预算与覆盖缺口</text>
  <text class="t" x="934" y="453">修实现 / 修属性 / 修生成器 / 接受风险</text>
  <text class="t" x="934" y="478">决策绑定版本，不覆盖原始观测</text>
  <text class="small" x="934" y="510">输出：发布 / 阻断 / 降级 / 人工复核</text>

  <path class="feedback" d="M1088 289 C1088 323 175 315 175 354"/>
  <path class="feedback" d="M175 358 C175 316 340 316 340 293"/>
  <text class="small" x="218" y="326" fill="#397cb3">覆盖反馈：只改变探索优先级</text>
  <path class="failure" d="M1115 289 C1115 335 465 326 465 354"/>
  <path class="failure" d="M594 445 L622 445"/>
  <path class="arrow" d="M884 445 L912 445"/>
  <path class="arrow" d="M754 532 C754 569 340 569 340 293"/>
  <text class="small" x="407" y="561">回归与进化种子回流</text>

  <rect x="46" y="586" width="1188" height="92" rx="8" fill="#17324d"/>
  <text x="68" y="616" style="font:700 16px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#ffffff">证据记录 = 输入与序列 + generator/shrinker 版本 + seed/path + 契约与快照 + 实际观测 + 失败签名 + 资源消耗</text>
  <text x="68" y="646" style="font:600 15px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#cfe9ff">覆盖增长是观测；“更可能触达新行为”是推断；发布、阻断或接受剩余风险才是决策。三者必须分栏保存。</text>
</svg>
