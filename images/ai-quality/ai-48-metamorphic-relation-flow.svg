<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 蜕变测试从关系合同到发布门禁的数据流</title>
  <desc id="desc">展示源输入先通过前置条件，按蜕变关系生成跟随输入；源输出与跟随输出经过重复采样、结构化测量和关系判定，分别形成通过、不确定与违反证据，再进入人工复核、关系校准和发布门禁。所有连接线都有明确方向。</desc>
  <defs>
    <style>
      .bg{fill:#f7fafc}.title{font:700 32px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#17324d}.sub{font:400 17px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#526b7d}.h{font:700 19px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#17324d}.t{font:400 16px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#334f63}.s{font:600 14px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#526b7d}.box{fill:#fff;stroke:#c8d7e2;stroke-width:2}.blue{fill:#e8f3ff;stroke:#4b89b7;stroke-width:2}.green{fill:#e8f7ee;stroke:#57956d;stroke-width:2}.amber{fill:#fff4dc;stroke:#c38a34;stroke-width:2}.violet{fill:#f1ecfa;stroke:#8970ad;stroke-width:2}.rose{fill:#fff0f1;stroke:#bd676b;stroke-width:2}.arrow{fill:none;stroke:#617b8d;stroke-width:2.6;marker-end:url(#arrow)}.dash{fill:none;stroke:#bd676b;stroke-width:2.5;stroke-dasharray:7 6;marker-end:url(#red)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#617b8d"/></marker>
    <marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#bd676b"/></marker>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <rect width="1280" height="104" fill="#fff"/>
  <rect y="102" width="1280" height="2" fill="#dce6ed"/>
  <text class="title" x="46" y="45">蜕变测试：验证输入输出之间的必要关系，不伪造唯一答案</text>
  <text class="sub" x="46" y="77">关系成立需要前置条件、允许变化、重复采样与不确定区；单次措辞不同既不是失败，也不是正确性证明。</text>

  <rect class="violet" x="42" y="132" width="236" height="144" rx="7"/>
  <text class="h" x="64" y="164">MR 关系合同</text>
  <text class="t" x="64" y="194">P(x)：变换前置条件</text>
  <text class="t" x="64" y="220">T(x)：输入变换与参数</text>
  <text class="t" x="64" y="246">R(M(x), M(T(x)))</text>
  <text class="s" x="64" y="267">禁止变化 · 允许变化 · α · K</text>

  <rect class="blue" x="42" y="316" width="236" height="120" rx="7"/>
  <text class="h" x="64" y="349">源测试资产</text>
  <text class="t" x="64" y="379">输入 x · 上下文快照</text>
  <text class="t" x="64" y="405">风险切片 · 证据 ID · seed</text>
  <path class="arrow" d="M160 316 L160 284"/>

  <path class="arrow" d="M278 204 L320 204"/>
  <rect class="amber" x="324" y="132" width="224" height="144" rx="7"/>
  <text class="h" x="346" y="164">前置条件检查</text>
  <text class="t" x="346" y="194">可逆性 / 语义适用域</text>
  <text class="t" x="346" y="220">权限、时间、政策版本</text>
  <text class="t" x="346" y="246">不满足则 SKIP，不判失败</text>
  <path class="arrow" d="M278 376 L304 376 L304 244 L324 244"/>

  <path class="arrow" d="M548 204 L584 204"/>
  <rect class="green" x="588" y="132" width="226" height="144" rx="7"/>
  <text class="h" x="610" y="164">生成跟随输入</text>
  <text class="t" x="610" y="194">x' = T(x; θ)</text>
  <text class="t" x="610" y="220">保存 diff 与可逆证明</text>
  <text class="t" x="610" y="246">变换失败进入 INVALID</text>

  <rect class="box" x="324" y="316" width="490" height="120" rx="7"/>
  <text class="h" x="346" y="348">受控执行：同一系统快照、配对 seed、K 次重复</text>
  <rect class="blue" x="346" y="366" width="202" height="50" rx="6"/>
  <text class="t" x="365" y="397">源输出 Y = {M(x)}</text>
  <rect class="green" x="588" y="366" width="202" height="50" rx="6"/>
  <text class="t" x="607" y="397">跟随输出 Y' = {M(x')}</text>
  <path class="arrow" d="M436 276 L436 316"/>
  <path class="arrow" d="M701 276 L701 316"/>

  <path class="arrow" d="M814 376 L850 376"/>
  <rect class="blue" x="854" y="306" width="384" height="140" rx="7"/>
  <text class="h" x="876" y="338">关系 Oracle：先结构化测量，再统计判定</text>
  <text class="t" x="876" y="368">硬不变量：权限、事实集合、Schema</text>
  <text class="t" x="876" y="394">允许变化：措辞、顺序、长度容差</text>
  <text class="t" x="876" y="420">概率关系：违例率差、区间、最低样本量</text>

  <path class="arrow" d="M1046 446 L1046 478"/>
  <rect class="box" x="324" y="482" width="914" height="102" rx="7"/>
  <rect class="green" x="346" y="504" width="244" height="58" rx="6"/>
  <text class="h" x="366" y="530">PASS：关系证据成立</text>
  <text class="s" x="366" y="551">仅支持该 MR，不证明答案唯一</text>
  <rect class="amber" x="620" y="504" width="270" height="58" rx="6"/>
  <text class="h" x="640" y="530">INCONCLUSIVE：证据不足</text>
  <text class="s" x="640" y="551">样本少、边界重叠或前提不清</text>
  <rect class="rose" x="920" y="504" width="294" height="58" rx="6"/>
  <text class="h" x="940" y="530">VIOLATION：关系被破坏</text>
  <text class="s" x="940" y="551">冻结证据，按严重度复核与阻断</text>

  <path class="arrow" d="M468 584 L468 620"/>
  <path class="arrow" d="M755 584 L755 620"/>
  <path class="arrow" d="M1067 584 L1067 620"/>
  <rect class="green" x="324" y="624" width="286" height="62" rx="7"/>
  <text class="h" x="346" y="652">发布证据：纳入关系覆盖</text>
  <text class="s" x="346" y="675">记录适用域与未覆盖风险</text>
  <rect class="amber" x="624" y="624" width="268" height="62" rx="7"/>
  <text class="h" x="646" y="652">校准关系或追加样本</text>
  <text class="s" x="646" y="675">不得事后只删失败样本</text>
  <rect class="rose" x="906" y="624" width="332" height="62" rx="7"/>
  <text class="h" x="928" y="652">人工归因 / 修复 / 发布门禁</text>
  <text class="s" x="928" y="675">告警是观测，根因需要独立证据</text>
  <path class="dash" d="M1072 624 C1072 604 1220 610 1220 284 C1220 244 862 244 818 244"/>
</svg>
