<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">上下文失败诊断矩阵</title>
  <desc id="desc">将四类可观察症状映射到单变量对照实验、判定证据和工程修复。</desc>
  <defs>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #475569; }
      .head { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #ffffff; }
      .row-title { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #0f172a; }
      .text { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #334155; }
      .tag { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #ffffff; }
      .foot { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #1e3a8a; }
    </style>
  </defs>

  <rect width="1280" height="800" fill="#f8fafc"/>
  <text x="50" y="56" class="title">上下文失败诊断矩阵：先证伪，再归因</text>
  <text x="50" y="86" class="subtitle">一次失败不能直接归因于“模型能力”；保持其他变量不变，只移动、替换或删减一个因素</text>

  <rect x="50" y="125" width="220" height="64" rx="6" fill="#334155"/>
  <rect x="280" y="125" width="300" height="64" rx="6" fill="#2563eb"/>
  <rect x="590" y="125" width="280" height="64" rx="6" fill="#0f766e"/>
  <rect x="880" y="125" width="350" height="64" rx="6" fill="#7c3aed"/>
  <text x="70" y="164" class="head">可观察症状</text>
  <text x="300" y="164" class="head">最小对照实验</text>
  <text x="610" y="164" class="head">支持该归因的证据</text>
  <text x="900" y="164" class="head">优先工程修复</text>

  <rect x="50" y="199" width="1180" height="112" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="66" y="216" width="82" height="26" rx="4" fill="#ea580c"/>
  <text x="79" y="234" class="tag">Token</text>
  <text x="66" y="268" class="row-title">格式微调后结果突变</text>
  <text x="66" y="293" class="text">空格、标点、ID 写法敏感</text>
  <text x="300" y="235" class="text">固定语义，只替换分隔符、大小写、</text>
  <text x="300" y="261" class="text">全半角和中英文混排方式；记录用量</text>
  <text x="300" y="287" class="text">并对照 Token ID 或服务端统计</text>
  <text x="610" y="235" class="text">切分或 Token 数明显变化，且错误与</text>
  <text x="610" y="261" class="text">特定边界稳定相关；重复试验可复现</text>
  <text x="610" y="287" class="text">不是单次采样波动</text>
  <text x="900" y="235" class="text">输入规范化、结构化字段、稳定分隔符</text>
  <text x="900" y="261" class="text">精确 ID 走程序校验；预算按目标模型</text>
  <text x="900" y="287" class="text">Tokenizer 实测而非按字符估算</text>

  <rect x="50" y="321" width="1180" height="112" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="66" y="338" width="82" height="26" rx="4" fill="#dc2626"/>
  <text x="79" y="356" class="tag">截断</text>
  <text x="66" y="390" class="row-title">尾部证据完全不起作用</text>
  <text x="66" y="415" class="text">输出也可能突然中止</text>
  <text x="300" y="357" class="text">在输入边界插入唯一哨兵；逐步增加</text>
  <text x="300" y="383" class="text">填充并核对最终请求、服务端用量、</text>
  <text x="300" y="409" class="text">结束原因和实际纳入文档哈希</text>
  <text x="610" y="357" class="text">哨兵在某一长度后不可恢复，或请求</text>
  <text x="610" y="383" class="text">记录显示客户端、网关进行了裁剪；</text>
  <text x="610" y="409" class="text">结束原因显示输出预算耗尽</text>
  <text x="900" y="357" class="text">显式预算器、输出预留、拒绝超限请求</text>
  <text x="900" y="383" class="text">保留纳入与排除清单；禁止静默截断</text>
  <text x="900" y="409" class="text">必要时先检索、压缩或分阶段处理</text>

  <rect x="50" y="443" width="1180" height="112" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="66" y="460" width="98" height="26" rx="4" fill="#ca8a04"/>
  <text x="79" y="478" class="tag">位置利用</text>
  <text x="66" y="512" class="row-title">同一证据换位置就失效</text>
  <text x="66" y="537" class="text">中段准确率显著下降</text>
  <text x="300" y="479" class="text">证据内容与干扰项完全不变，仅把</text>
  <text x="300" y="505" class="text">证据放在前、中、后多个分位；每个</text>
  <text x="300" y="531" class="text">位置重复运行并报告置信区间</text>
  <text x="610" y="479" class="text">位置准确率曲线存在稳定差异，且在</text>
  <text x="610" y="505" class="text">交换文档顺序后错误随证据位置迁移</text>
  <text x="610" y="531" class="text">不能只凭一次“中间丢失”下结论</text>
  <text x="900" y="479" class="text">减少无关上下文；证据抽取后再回答</text>
  <text x="900" y="505" class="text">关键信息靠近任务指令并显式引用</text>
  <text x="900" y="531" class="text">模型更换后重跑完整位置扫描</text>

  <rect x="50" y="565" width="1180" height="112" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="66" y="582" width="98" height="26" rx="4" fill="#9333ea"/>
  <text x="79" y="600" class="tag">上下文污染</text>
  <text x="66" y="634" class="row-title">加入资料后反而变差</text>
  <text x="66" y="659" class="text">答案引用过期或低权威内容</text>
  <text x="300" y="601" class="text">从干净基线开始，依次注入重复、</text>
  <text x="300" y="627" class="text">过期、矛盾和恶意指令；控制 Token</text>
  <text x="300" y="653" class="text">总量，区分“更长”与“更脏”</text>
  <text x="610" y="601" class="text">错误类型随污染源出现，移除后恢复；</text>
  <text x="610" y="627" class="text">输出引用能定位到错误来源或冲突未</text>
  <text x="610" y="653" class="text">被检测，形成完整因果证据链</text>
  <text x="900" y="601" class="text">来源分级、版本与有效期、冲突检测</text>
  <text x="900" y="627" class="text">检索去重、指令与资料隔离、引用校验</text>
  <text x="900" y="653" class="text">高风险答案在证据冲突时拒绝输出</text>

  <rect x="50" y="711" width="1180" height="52" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="70" y="743" class="foot">归因成立的最低条件：单变量变化可重复触发差异 + 原始请求与响应可追溯 + 已排除采样、模型版本和环境波动。</text>
</svg>
