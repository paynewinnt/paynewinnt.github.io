<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 工件信任门禁与证据分层</title>
  <desc id="desc">候选发布集依次通过身份、来源、构建、清单、风险、审批、运行时一致性七道门禁，失败进入隔离或人工处置，运行后持续验证 served digest。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#365f70"/></marker>
    <marker id="denyArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#b84632"/></marker>
    <style>
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #18333e; }
      .subtitle { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #506a74; }
      .gateN { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .gateT { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #18333e; }
      .gateD { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #48616b; }
      .label { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #365f70; }
      .small { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b646e; }
      .pass { fill: none; stroke: #365f70; stroke-width: 2.4; marker-end: url(#arrow); }
      .deny { fill: none; stroke: #b84632; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#denyArrow); }
    </style>
  </defs>
  <rect width="1280" height="720" fill="#f7faf9"/>
  <rect x="36" y="28" width="1208" height="76" rx="6" fill="#e8f1ee"/>
  <text class="title" x="64" y="62">工件信任不是一次扫描，而是一组可解释的门禁</text>
  <text class="subtitle" x="64" y="88">每道门只回答一个问题；未知、过期、无法验证和策略不匹配均保留为独立状态</text>

  <rect x="46" y="150" width="144" height="104" rx="6" fill="#ffffff" stroke="#8aa99b"/>
  <circle cx="72" cy="176" r="16" fill="#2f7762"/><text class="gateN" x="68" y="181">0</text>
  <text class="gateT" x="62" y="211">候选发布集</text><text class="gateD" x="62" y="234">release manifest</text>

  <g>
    <rect x="226" y="140" width="134" height="124" rx="6" fill="#eef5f2" stroke="#71a18c"/>
    <circle cx="250" cy="165" r="15" fill="#2f7762"/><text class="gateN" x="246" y="170">1</text>
    <text class="gateT" x="244" y="201">身份门</text><text class="gateD" x="244" y="224">digest 与 media type</text><text class="gateD" x="244" y="244">禁止浮动引用</text>
    <rect x="396" y="140" width="134" height="124" rx="6" fill="#eef2f8" stroke="#8295bb"/>
    <circle cx="420" cy="165" r="15" fill="#5f74a2"/><text class="gateN" x="416" y="170">2</text>
    <text class="gateT" x="414" y="201">来源门</text><text class="gateD" x="414" y="224">签名者、证明主体</text><text class="gateD" x="414" y="244">吊销与时效</text>
    <rect x="566" y="140" width="134" height="124" rx="6" fill="#eef2f8" stroke="#8295bb"/>
    <circle cx="590" cy="165" r="15" fill="#5f74a2"/><text class="gateN" x="586" y="170">3</text>
    <text class="gateT" x="584" y="201">构建门</text><text class="gateD" x="584" y="224">builder / materials</text><text class="gateD" x="584" y="244">SLSA 与 in-toto</text>
    <rect x="736" y="140" width="134" height="124" rx="6" fill="#fff6e7" stroke="#c19645"/>
    <circle cx="760" cy="165" r="15" fill="#b17d1c"/><text class="gateN" x="756" y="170">4</text>
    <text class="gateT" x="754" y="201">清单门</text><text class="gateD" x="754" y="224">组件、模型、数据</text><text class="gateD" x="754" y="244">完整度可声明</text>
    <rect x="906" y="140" width="134" height="124" rx="6" fill="#fff4e9" stroke="#c58d50"/>
    <circle cx="930" cy="165" r="15" fill="#b96d29"/><text class="gateN" x="926" y="170">5</text>
    <text class="gateT" x="924" y="201">风险门</text><text class="gateD" x="924" y="224">扫描 + 行为测试</text><text class="gateD" x="924" y="244">例外与剩余风险</text>
    <rect x="1076" y="140" width="134" height="124" rx="6" fill="#f8eeee" stroke="#bd6e5f"/>
    <circle cx="1100" cy="165" r="15" fill="#a94f3e"/><text class="gateN" x="1096" y="170">6</text>
    <text class="gateT" x="1094" y="201">审批门</text><text class="gateD" x="1094" y="224">职责分离、证据摘要</text><text class="gateD" x="1094" y="244">范围与到期日</text>
  </g>
  <path class="pass" d="M190 202 H226"/><path class="pass" d="M360 202 H396"/><path class="pass" d="M530 202 H566"/><path class="pass" d="M700 202 H736"/><path class="pass" d="M870 202 H906"/><path class="pass" d="M1040 202 H1076"/>

  <rect x="946" y="326" width="264" height="108" rx="6" fill="#eaf4f7" stroke="#6e9fb1"/>
  <circle cx="974" cy="354" r="16" fill="#397a92"/><text class="gateN" x="970" y="359">7</text>
  <text class="gateT" x="1000" y="360">运行时一致性门</text>
  <text class="gateD" x="966" y="388">served digest == approved digest</text>
  <text class="gateD" x="966" y="410">模型、Prompt、插件、MCP schema 全覆盖</text>
  <path class="pass" d="M1143 264 V300 H1078 V326"/>

  <rect x="946" y="492" width="264" height="110" rx="6" fill="#eaf4f7" stroke="#6e9fb1"/>
  <text class="gateT" x="966" y="524">受控流量与持续核验</text>
  <text class="gateD" x="966" y="550">按 release_id 记录请求、响应和 served digest</text>
  <text class="gateD" x="966" y="572">漂移、吊销或未知工件立即收缩流量</text>
  <path class="pass" d="M1078 434 V492"/>

  <rect x="52" y="352" width="708" height="250" rx="6" fill="#fff8f6" stroke="#d7a69c"/>
  <text class="gateT" x="76" y="386">HOLD / DENY 处置池</text>
  <text class="small" x="76" y="414">HOLD：证据缺失、无法验证、扫描超时、审批过期。不得被自动改写为通过。</text>
  <text class="small" x="76" y="441">DENY：digest 不匹配、签名者不在信任策略、attestation subject 错位、工件已吊销、served digest 漂移。</text>
  <rect x="76" y="470" width="198" height="94" rx="5" fill="#ffffff" stroke="#bf6b59"/>
  <text class="gateT" x="94" y="500">隔离</text><text class="gateD" x="94" y="524">阻止进入 registry</text><text class="gateD" x="94" y="544">保留原始证据</text>
  <rect x="304" y="470" width="198" height="94" rx="5" fill="#ffffff" stroke="#bf6b59"/>
  <text class="gateT" x="322" y="500">调查</text><text class="gateD" x="322" y="524">定位首个不一致步骤</text><text class="gateD" x="322" y="544">评估影响闭包</text>
  <rect x="532" y="470" width="198" height="94" rx="5" fill="#ffffff" stroke="#bf6b59"/>
  <text class="gateT" x="550" y="500">恢复</text><text class="gateD" x="550" y="524">重建或回滚</text><text class="gateD" x="550" y="544">生成新 release_id</text>

  <path class="deny" d="M293 264 V318 H170 V352"/><path class="deny" d="M463 264 V324 H282 V352"/><path class="deny" d="M633 264 V330 H394 V352"/>
  <path class="deny" d="M803 264 V336 H506 V352"/><path class="deny" d="M973 264 V342 H618 V352"/><path class="deny" d="M1143 264 V312 H730 V352"/>
  <path class="deny" d="M946 380 H790 V452 H730"/>

  <rect x="52" y="630" width="1158" height="54" rx="5" fill="#ffffff" stroke="#c7d4cf"/>
  <text class="label" x="74" y="662">允许条件 = 所有硬门通过 ∧ 未知率为零 ∧ 例外仍有效；扫描无告警只是一条观测，不是安全证明。</text>
</svg>
