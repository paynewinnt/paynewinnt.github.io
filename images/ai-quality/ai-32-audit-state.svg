<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">Human-in-the-loop 审批状态机与审计证据</title>
  <desc id="desc">展示待审批、已批准、已拒绝、已过期、已取消和已执行六个状态，审批快照绑定、执行前再校验、防重放以及追加式审计事件之间的关系。</desc>
  <style>
    .bg { fill: #f8fafc; }
    .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
    .sub { font: 400 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
    .h { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
    .t { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
    .small { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .pending { fill: #fffbeb; stroke: #d97706; stroke-width: 3; }
    .approved { fill: #eff6ff; stroke: #2563eb; stroke-width: 3; }
    .executed { fill: #ecfdf5; stroke: #059669; stroke-width: 3; }
    .terminal { fill: #fff1f2; stroke: #e11d48; stroke-width: 2.5; }
    .cancel { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2.5; }
    .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
    .arrow { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
    .event { fill: none; stroke: #0f766e; stroke-width: 2.5; stroke-dasharray: 8 6; marker-end: url(#teal); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="3.5" orient="auto"><path d="M0,0 L0,7 L10,3.5 z" fill="#64748b"/></marker>
    <marker id="teal" markerWidth="11" markerHeight="11" refX="10" refY="3.5" orient="auto"><path d="M0,0 L0,7 L10,3.5 z" fill="#0f766e"/></marker>
  </defs>
  <rect class="bg" width="1280" height="900"/>
  <text class="title" x="54" y="58">审批是一台一次性状态机，也是一条可重建的证据链</text>
  <text class="sub" x="54" y="91">批准只允许尝试执行绑定快照；过期、取消、拒绝和执行后都不能恢复成可用授权。</text>

  <rect class="box" x="54" y="138" width="260" height="184" rx="8"/>
  <text class="h" x="80" y="176">动作快照</text>
  <text class="t" x="80" y="210">工具与 Schema 版本</text>
  <text class="t" x="80" y="240">规范化参数与租户</text>
  <text class="t" x="80" y="270">资源版本与证据摘要</text>
  <text class="t" x="80" y="300">策略版本、有效期、nonce</text>
  <path class="arrow" d="M314 230 L382 230"/>

  <rect class="pending" x="386" y="158" width="202" height="144" rx="8"/>
  <text class="h" x="424" y="199">PENDING</text>
  <text class="t" x="414" y="235">等待有效决定</text>
  <text class="small" x="414" y="270" fill="#b45309">同一 action_digest</text>

  <path class="arrow" d="M588 198 L674 198"/>
  <text class="small" x="608" y="183" fill="#475569">达到人数与职责要求</text>
  <rect class="approved" x="678" y="138" width="230" height="184" rx="8"/>
  <text class="h" x="724" y="178">APPROVED</text>
  <text class="t" x="704" y="214">尚未产生副作用</text>
  <text class="t" x="704" y="244">等待一次性领取</text>
  <text class="small" x="704" y="282" fill="#1d4ed8">不是永久授权</text>

  <path class="arrow" d="M908 230 L990 230"/>
  <text class="small" x="924" y="213" fill="#475569">最终检查通过</text>
  <rect class="executed" x="994" y="158" width="230" height="144" rx="8"/>
  <text class="h" x="1039" y="199">EXECUTED</text>
  <text class="t" x="1020" y="235">已绑定执行结果</text>
  <text class="small" x="1020" y="270" fill="#047857">终态 · 不可重放</text>

  <path class="arrow" d="M450 302 C450 352 232 352 232 402"/>
  <rect class="terminal" x="54" y="406" width="244" height="116" rx="8"/>
  <text class="h" x="105" y="447">REJECTED</text>
  <text class="t" x="80" y="480">明确拒绝与原因码</text>
  <text class="small" x="80" y="505" fill="#be123c">终态</text>

  <path class="arrow" d="M486 302 L486 402"/>
  <path class="arrow" d="M760 322 C760 364 486 364 486 402"/>
  <rect class="terminal" x="362" y="406" width="244" height="116" rx="8"/>
  <text class="h" x="421" y="447">EXPIRED</text>
  <text class="t" x="388" y="480">超时后重新取数审批</text>
  <text class="small" x="388" y="505" fill="#be123c">终态</text>

  <path class="arrow" d="M540 302 C540 364 784 364 784 402"/>
  <path class="arrow" d="M820 322 L820 402"/>
  <rect class="cancel" x="670" y="406" width="244" height="116" rx="8"/>
  <text class="h" x="723" y="447">CANCELLED</text>
  <text class="t" x="696" y="480">请求撤销或紧急停用</text>
  <text class="small" x="696" y="505" fill="#6d28d9">终态，不代表已回滚</text>

  <rect class="box" x="970" y="386" width="254" height="158" rx="8"/>
  <text class="h" x="996" y="424">执行前再校验</text>
  <text class="t" x="996" y="458">重新鉴权与读取策略</text>
  <text class="t" x="996" y="488">比较摘要与资源版本</text>
  <text class="t" x="996" y="518">幂等键与后置条件</text>
  <path class="arrow" d="M1096 386 L1096 306"/>

  <text class="h" x="54" y="594">每次迁移都追加审计事件</text>
  <rect x="54" y="620" width="1170" height="150" rx="8" fill="#ecfeff" stroke="#0f766e" stroke-width="2"/>
  <rect class="box" x="78" y="648" width="192" height="94" rx="8"/>
  <text class="h" x="99" y="683">请求事件</text><text class="t" x="99" y="718">主体 · 任务 · Trace</text>
  <rect class="box" x="300" y="648" width="192" height="94" rx="8"/>
  <text class="h" x="321" y="683">策略事件</text><text class="t" x="321" y="718">规则 · 阈值 · 版本</text>
  <rect class="box" x="522" y="648" width="192" height="94" rx="8"/>
  <text class="h" x="543" y="683">决定事件</text><text class="t" x="543" y="718">审核人 · 摘要 · 原因</text>
  <rect class="box" x="744" y="648" width="192" height="94" rx="8"/>
  <text class="h" x="765" y="683">执行事件</text><text class="t" x="765" y="718">幂等键 · 下游请求</text>
  <rect class="box" x="966" y="648" width="232" height="94" rx="8"/>
  <text class="h" x="987" y="683">结果事件</text><text class="t" x="987" y="718">业务对象 · 后置校验</text>
  <path class="event" d="M270 695 L296 695"/><path class="event" d="M492 695 L518 695"/><path class="event" d="M714 695 L740 695"/><path class="event" d="M936 695 L962 695"/>

  <rect x="54" y="802" width="1170" height="58" rx="8" fill="#0f172a"/>
  <text x="80" y="838" style="font: 700 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #ffffff;">审计结论 = 审核人看到了什么 + 为什么决定 + 执行时世界是否变化 + 下游最终发生了什么</text>
</svg>
