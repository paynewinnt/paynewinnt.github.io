<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">LLMOps 七类组件版本图与兼容性合同</title>
  <desc id="desc">展示模型、Prompt、数据、检索器、工具、策略和评测版本的依赖关系，以及签名发布包如何冻结完整组合。</desc>
  <defs>
    <style>
      .bg { fill: #f7f9fb; }
      .node-blue { fill: #e7f0ff; stroke: #3569a8; stroke-width: 2; }
      .node-green { fill: #e7f6ee; stroke: #287654; stroke-width: 2; }
      .node-amber { fill: #fff3d8; stroke: #a56a00; stroke-width: 2; }
      .node-red { fill: #fde9e8; stroke: #a54139; stroke-width: 2; }
      .bundle { fill: #ffffff; stroke: #4f5f70; stroke-width: 2.5; stroke-dasharray: 8 6; }
      .contract { fill: #eef0f3; stroke: #596574; stroke-width: 2; }
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17202a; }
      .subtitle { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b5563; }
      .box-title { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17202a; }
      .text { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #344054; }
      .label { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #596574; }
      .arrow { stroke: #566576; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#566576"/>
    </marker>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="52" y="52">LLMOps 版本图：发布的是兼容组合，不是一个“模型版本”</text>
  <text class="subtitle" x="52" y="82">每个节点内容寻址；依赖边有语义；兼容性合同和完整评测共同约束发布包</text>

  <rect class="bundle" x="44" y="112" width="1192" height="488" rx="10"/>
  <text class="label" x="64" y="140">Release Bundle rb_204 / tenant-retail / profile release-v4</text>

  <rect class="node-blue" x="88" y="188" width="190" height="104" rx="7"/>
  <text class="box-title" x="110" y="220">Model m@12</text>
  <text class="text" x="110" y="246">能力 / revision / 区域</text>
  <text class="text" x="110" y="270">content sha256:…</text>

  <rect class="node-blue" x="352" y="188" width="210" height="104" rx="7"/>
  <text class="box-title" x="374" y="220">Prompt p@31</text>
  <text class="text" x="374" y="246">变量 / 输出 Schema</text>
  <text class="text" x="374" y="270">工具与检索合同</text>

  <rect class="node-green" x="636" y="188" width="210" height="104" rx="7"/>
  <text class="box-title" x="658" y="220">Retriever r@9</text>
  <text class="text" x="658" y="246">切片 / Embedding / ACL</text>
  <text class="text" x="658" y="270">索引 Schema chunks-v3</text>

  <rect class="node-green" x="920" y="188" width="230" height="104" rx="7"/>
  <text class="box-title" x="942" y="220">Data d@20260627</text>
  <text class="text" x="942" y="246">Snapshot / 删除 / 时效</text>
  <text class="text" x="942" y="270">ACL epoch 7</text>

  <rect class="node-amber" x="88" y="386" width="190" height="104" rx="7"/>
  <text class="box-title" x="110" y="418">Tool t@18</text>
  <text class="text" x="110" y="444">输入 Schema payment-v2</text>
  <text class="text" x="110" y="468">幂等与权限合同</text>

  <rect class="node-red" x="352" y="386" width="210" height="104" rx="7"/>
  <text class="box-title" x="374" y="418">Policy y@22</text>
  <text class="text" x="374" y="444">动作 / 风险 / 地域</text>
  <text class="text" x="374" y="468">缺特征默认行为</text>

  <rect class="node-amber" x="636" y="386" width="210" height="104" rx="7"/>
  <text class="box-title" x="658" y="418">Eval e@14</text>
  <text class="text" x="658" y="444">Snapshot / Judge / Gate</text>
  <text class="text" x="658" y="468">profile release-v4</text>

  <rect class="contract" x="920" y="386" width="230" height="104" rx="7"/>
  <text class="box-title" x="942" y="418">Compatibility c@4</text>
  <text class="text" x="942" y="444">能力、Schema、ACL</text>
  <text class="text" x="942" y="468">依赖闭包与重建规则</text>

  <path class="arrow" d="M352 225 H284"/>
  <text class="label" x="292" y="213">需要能力</text>
  <path class="arrow" d="M562 242 H630"/>
  <text class="label" x="570" y="230">检索合同</text>
  <path class="arrow" d="M846 242 H914"/>
  <text class="label" x="854" y="230">索引来源</text>
  <path class="arrow" d="M410 292 C370 330 278 346 214 380"/>
  <text class="label" x="268" y="334">工具 Schema</text>
  <path class="arrow" d="M352 438 H284"/>
  <text class="label" x="291" y="426">约束动作</text>
  <path class="arrow" d="M636 438 H568"/>
  <text class="label" x="574" y="426">验证策略</text>
  <path class="arrow" d="M846 438 H914"/>
  <text class="label" x="854" y="426">合同校验</text>
  <path class="arrow" d="M1035 386 V302"/>
  <text class="label" x="1048" y="348">ACL 一致</text>

  <rect class="contract" x="220" y="626" width="840" height="54" rx="7"/>
  <text class="box-title" x="244" y="660">签名 Manifest = 7 个组件摘要 + 图摘要 + 合同摘要 + Runner 摘要 + Builder 身份</text>
  <path class="arrow" d="M640 600 V620"/>
  <text class="subtitle" x="52" y="704">Alias 可以移动；已签名 Bundle 不跟随 Alias。回滚时恢复整个 Manifest，而不是只切回 Model。</text>
</svg>
