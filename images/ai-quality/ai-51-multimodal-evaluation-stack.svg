<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="stack-title stack-desc">
  <title id="stack-title">多模态 AI 分层评测栈与可定位证据流</title>
  <desc id="stack-desc">从图片、音频和文档资产，经接入解码、感知转写、结构理解、跨模态对齐、推理与业务决策逐层评测；底部证据总线连接金标准、扰动、追踪和发布门禁，箭头展示数据流与反向定位路径。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="145%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#27364f" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#40516f"/>
    </marker>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2667b8"/>
    </marker>
    <style>
      .title{font:700 29px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#16233a}
      .sub{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#51617a}
      .h{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#17253c}
      .t{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#263650}
      .s{font:500 12.5px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#455672}
      .chip{font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#fff}
      .flow{fill:none;stroke:#40516f;stroke-width:2.2;marker-end:url(#arrow)}
      .evidence{fill:none;stroke:#2667b8;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#arrowBlue)}
    </style>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="40" y="48" class="title">多模态 AI 分层评测栈：先定位错误层，再做发布决策</text>
  <text x="40" y="75" class="sub">每层保存 observation；跨层形成 inference；只有业务规则与风险门禁可以产生 decision</text>

  <g filter="url(#shadow)">
    <rect x="35" y="105" width="190" height="220" rx="8" fill="#e9f3ff" stroke="#78aee9"/>
    <rect x="245" y="105" width="190" height="220" rx="8" fill="#e9fbf4" stroke="#72c8a3"/>
    <rect x="455" y="105" width="190" height="220" rx="8" fill="#fff7df" stroke="#e7ba51"/>
    <rect x="665" y="105" width="190" height="220" rx="8" fill="#fff0ec" stroke="#eb927d"/>
    <rect x="875" y="105" width="180" height="220" rx="8" fill="#f1edff" stroke="#a28be5"/>
    <rect x="1075" y="105" width="170" height="220" rx="8" fill="#edf2f8" stroke="#8296b3"/>
  </g>

  <g>
    <rect x="50" y="119" width="60" height="22" rx="8" fill="#438bd2"/><text x="80" y="135" text-anchor="middle" class="chip">L0 资产</text>
    <text x="50" y="169" class="h">模态与真值</text>
    <text x="50" y="197" class="t">图片：像素、区域、OCR</text>
    <text x="50" y="222" class="t">音频：波形、声道、时间线</text>
    <text x="50" y="247" class="t">文档：页、文本层、扫描层</text>
    <text x="50" y="272" class="t">配对：一致 / 补充 / 冲突</text>
    <text x="50" y="300" class="s">版本、哈希、许可、来源</text>

    <rect x="260" y="119" width="60" height="22" rx="8" fill="#24986c"/><text x="290" y="135" text-anchor="middle" class="chip">L1 接入</text>
    <text x="260" y="169" class="h">解码与规范化</text>
    <text x="260" y="197" class="t">MIME / 容器 / 编码</text>
    <text x="260" y="222" class="t">尺寸、方向、页数、采样率</text>
    <text x="260" y="247" class="t">声道、时长、文本层存在性</text>
    <text x="260" y="272" class="t">缺失、截断、损坏显式化</text>
    <text x="260" y="300" class="s">不得把解码失败记成模型幻觉</text>

    <rect x="470" y="119" width="60" height="22" rx="8" fill="#c28b16"/><text x="500" y="135" text-anchor="middle" class="chip">L2 感知</text>
    <text x="470" y="169" class="h">检测与转写</text>
    <text x="470" y="197" class="t">OCR / ASR / 声音事件</text>
    <text x="470" y="222" class="t">框、段、说话人、置信度</text>
    <text x="470" y="247" class="t">图表元素、表格单元格</text>
    <text x="470" y="272" class="t">CER / WER / IoU / F1</text>
    <text x="470" y="300" class="s">观察输入与中间产物，不猜根因</text>

    <rect x="680" y="119" width="60" height="22" rx="8" fill="#d8674d"/><text x="710" y="135" text-anchor="middle" class="chip">L3 结构</text>
    <text x="680" y="169" class="h">布局与时间关系</text>
    <text x="680" y="197" class="t">页码、阅读顺序、跨页关系</text>
    <text x="680" y="222" class="t">表格、表单键值、图表区域</text>
    <text x="680" y="247" class="t">重叠、静音、事件先后</text>
    <text x="680" y="272" class="t">关系 F1 / 顺序距离 / Cell F1</text>
    <text x="680" y="300" class="s">文本正确不等于结构正确</text>

    <rect x="890" y="119" width="60" height="22" rx="8" fill="#7656c8"/><text x="920" y="135" text-anchor="middle" class="chip">L4 对齐</text>
    <text x="890" y="169" class="h">跨模态证据</text>
    <text x="890" y="197" class="t">实体、数值、时间、否定</text>
    <text x="890" y="222" class="t">支持 / 补充 / 冲突 / 无关</text>
    <text x="890" y="247" class="t">页 + 框 / 时间段定位</text>
    <text x="890" y="272" class="t">一致率、冲突召回、证据 IoU</text>
    <text x="890" y="300" class="s">只答对但证据错仍不通过</text>

    <rect x="1090" y="119" width="60" height="22" rx="8" fill="#536985"/><text x="1120" y="135" text-anchor="middle" class="chip">L5 决策</text>
    <text x="1090" y="169" class="h">推理与业务</text>
    <text x="1090" y="197" class="t">问题答案与不确定性</text>
    <text x="1090" y="222" class="t">拒答、降级、人工复核</text>
    <text x="1090" y="247" class="t">安全、权限、后置条件</text>
    <text x="1090" y="272" class="t">任务成功 / 风险违例</text>
    <text x="1090" y="300" class="s">硬门禁不可被均分抵消</text>
  </g>

  <path d="M225 215 H245" class="flow"/>
  <path d="M435 215 H455" class="flow"/>
  <path d="M645 215 H665" class="flow"/>
  <path d="M855 215 H875" class="flow"/>
  <path d="M1055 215 H1075" class="flow"/>

  <g filter="url(#shadow)">
    <rect x="35" y="355" width="390" height="115" rx="8" fill="#ffffff" stroke="#9ab4d5"/>
    <rect x="445" y="355" width="390" height="115" rx="8" fill="#ffffff" stroke="#9ab4d5"/>
    <rect x="855" y="355" width="390" height="115" rx="8" fill="#ffffff" stroke="#9ab4d5"/>
  </g>
  <text x="55" y="384" class="h">独立 Oracle 与反事实</text>
  <text x="55" y="411" class="t">人工标注原始像素/波形/页面，不复制模型转写</text>
  <text x="55" y="435" class="t">同题换图、同音换字幕、同文档换版面；答案应变化</text>
  <text x="55" y="458" class="s">基准分数是能力样本，不是产品质量证明</text>

  <text x="465" y="384" class="h">扰动与故障注入</text>
  <text x="465" y="411" class="t">旋转/模糊/压缩｜噪声/重叠/静音｜页缺失/文本层冲突</text>
  <text x="465" y="435" class="t">损坏容器、错 MIME、模态延迟、模态缺失、证据互相矛盾</text>
  <text x="465" y="458" class="s">预期：正确恢复、受控降级、安全失败、可定位告警</text>

  <text x="875" y="384" class="h">分层门禁与诊断</text>
  <text x="875" y="411" class="t">接入 → 感知 → 结构 → 对齐 → 推理 → 业务，逐层保存分母</text>
  <text x="875" y="435" class="t">比较 clean/perturbed、full/ablated、正确/错误中间产物</text>
  <text x="875" y="458" class="s">最终结论：PASS / REVIEW / FAIL / INVALID</text>

  <rect x="35" y="505" width="1210" height="170" rx="8" fill="#eaf3ff" stroke="#6e9bd2" stroke-width="1.5"/>
  <text x="55" y="537" class="h">可定位证据总线（append-only）</text>
  <g>
    <rect x="55" y="555" width="180" height="82" rx="8" fill="#fff" stroke="#7fa7d5"/>
    <text x="72" y="580" class="t">身份与输入</text><text x="72" y="604" class="s">sample / asset / pair / hash</text><text x="72" y="624" class="s">解码器、模型、Prompt 版本</text>
    <rect x="252" y="555" width="205" height="82" rx="8" fill="#fff" stroke="#7fa7d5"/>
    <text x="269" y="580" class="t">空间与时间锚点</text><text x="269" y="604" class="s">page + bbox + char span</text><text x="269" y="624" class="s">start/end + channel + speaker</text>
    <rect x="474" y="555" width="205" height="82" rx="8" fill="#fff" stroke="#7fa7d5"/>
    <text x="491" y="580" class="t">观察与推断分离</text><text x="491" y="604" class="s">raw observation 不可改写</text><text x="491" y="624" class="s">claim + relation + uncertainty</text>
    <rect x="696" y="555" width="205" height="82" rx="8" fill="#fff" stroke="#7fa7d5"/>
    <text x="713" y="580" class="t">指标明细</text><text x="713" y="604" class="s">numerator / denominator / slice</text><text x="713" y="624" class="s">threshold / CI / invalid reason</text>
    <rect x="918" y="555" width="305" height="82" rx="8" fill="#fff" stroke="#7fa7d5"/>
    <text x="935" y="580" class="t">发布与事故包</text><text x="935" y="604" class="s">证据定位 → 失败层 → 责任服务 → 回放入口</text><text x="935" y="624" class="s">规则版本、门禁理由、审批、回滚与人工结论</text>
  </g>

  <path d="M130 505 V478 H245" class="evidence"/>
  <path d="M355 505 V485 H535 V326" class="evidence"/>
  <path d="M575 505 V486 H755 V326" class="evidence"/>
  <path d="M797 505 V486 H965 V326" class="evidence"/>
  <path d="M1068 505 V486 H1160 V326" class="evidence"/>
  <text x="1042" y="696" class="s">蓝色虚线：证据回写与反向定位</text>
</svg>
