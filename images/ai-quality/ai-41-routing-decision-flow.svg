<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">多模型路由的硬约束优先决策流</title>
  <desc id="desc">展示请求进入后先执行数据驻留、权限安全、上下文和工具能力等硬约束，形成可行候选集，再按质量下界、延迟与成本优化；校准不足或分布外请求升级到保守路径，失败时重新执行全部约束。</desc>
  <defs>
    <style>
      .bg { fill: #f7fafc; }
      .title { font: 700 31px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #17324d; }
      .sub { font: 400 16px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #51697d; }
      .h { font: 700 18px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #17324d; }
      .t { font: 400 14px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334f63; }
      .small { font: 600 13px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .box { fill: #ffffff; stroke: #c9d7e2; stroke-width: 2; }
      .blue { fill: #eaf4ff; stroke: #4e8fbe; stroke-width: 2; }
      .green { fill: #eaf7ef; stroke: #5b9671; stroke-width: 2; }
      .amber { fill: #fff5df; stroke: #c58b35; stroke-width: 2; }
      .violet { fill: #f2edfa; stroke: #8a72ae; stroke-width: 2; }
      .rose { fill: #fff0f0; stroke: #bd6669; stroke-width: 2; }
      .arrow { fill: none; stroke: #667f91; stroke-width: 2.5; marker-end: url(#arrow); }
      .retry { fill: none; stroke: #bd6669; stroke-width: 2.5; stroke-dasharray: 7 6; marker-end: url(#red); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#667f91"/></marker>
    <marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#bd6669"/></marker>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <rect width="1280" height="104" fill="#ffffff"/>
  <rect y="102" width="1280" height="2" fill="#dce6ed"/>
  <text class="title" x="48" y="46">多模型路由：先证明“允许调用”，再比较“调用谁更划算”</text>
  <text class="sub" x="48" y="77">安全、驻留、权限和能力是不可交易的约束；质量、延迟与成本只在可行候选集内部优化。</text>

  <rect class="blue" x="48" y="138" width="160" height="104" rx="8"/>
  <text class="h" x="69" y="173">请求契约</text>
  <text class="t" x="69" y="201">主体 · 租户 · 风险</text>
  <text class="t" x="69" y="224">数据 · 工具 · Deadline</text>
  <path class="arrow" d="M208 190 L240 190"/>

  <rect class="box" x="244" y="128" width="988" height="124" rx="8"/>
  <text class="h" x="266" y="158">第一阶段：硬约束过滤，任一不满足即淘汰候选</text>
  <rect class="violet" x="266" y="174" width="168" height="58" rx="7"/>
  <text class="t" x="284" y="198">数据驻留与外发</text><text class="small" x="284" y="219" fill="#6f5891">region · egress</text>
  <rect class="rose" x="450" y="174" width="168" height="58" rx="7"/>
  <text class="t" x="468" y="198">权限与安全策略</text><text class="small" x="468" y="219" fill="#985052">ACL · safety profile</text>
  <rect class="amber" x="634" y="174" width="168" height="58" rx="7"/>
  <text class="t" x="652" y="198">上下文容量</text><text class="small" x="652" y="219" fill="#946620">input + output reserve</text>
  <rect class="green" x="818" y="174" width="168" height="58" rx="7"/>
  <text class="t" x="836" y="198">工具与模态能力</text><text class="small" x="836" y="219" fill="#3f7956">tools · modality</text>
  <rect class="blue" x="1002" y="174" width="208" height="58" rx="7"/>
  <text class="t" x="1020" y="198">可用状态与故障域</text><text class="small" x="1020" y="219" fill="#356e99">circuit · quota · domain</text>

  <path class="arrow" d="M738 252 L738 286"/>
  <rect class="green" x="486" y="290" width="504" height="70" rx="8"/>
  <text class="h" x="510" y="319">可行候选集 F(x)</text>
  <text class="t" x="510" y="344">每个保留候选都带通过证据；空集直接拒绝、人工处理或使用确定性工作流</text>
  <path class="arrow" d="M738 360 L738 394"/>

  <rect class="box" x="48" y="398" width="1184" height="148" rx="8"/>
  <text class="h" x="70" y="430">第二阶段：在 F(x) 内做多目标选择</text>
  <rect class="amber" x="70" y="450" width="240" height="72" rx="8"/>
  <text class="h" x="90" y="478">质量约束</text>
  <text class="t" x="90" y="504">使用校准后的质量下界</text>
  <path class="arrow" d="M310 486 L338 486"/>
  <rect class="blue" x="342" y="450" width="240" height="72" rx="8"/>
  <text class="h" x="362" y="478">延迟约束</text>
  <text class="t" x="362" y="504">预测 P95 不超过剩余预算</text>
  <path class="arrow" d="M582 486 L610 486"/>
  <rect class="green" x="614" y="450" width="240" height="72" rx="8"/>
  <text class="h" x="634" y="478">成本最小化</text>
  <text class="t" x="634" y="504">满足质量后比较期望成本</text>
  <path class="arrow" d="M854 486 L882 486"/>
  <rect class="violet" x="886" y="450" width="324" height="72" rx="8"/>
  <text class="h" x="906" y="478">校准、OOD 与探索修正</text>
  <text class="t" x="906" y="504">不确定时保守升级；仅在低风险可行集探索</text>

  <path class="arrow" d="M738 546 L738 578"/>
  <rect class="green" x="476" y="582" width="262" height="78" rx="8"/>
  <text class="h" x="500" y="612">主路由与审计记录</text>
  <text class="t" x="500" y="638">候选、淘汰原因、分数、概率</text>
  <path class="arrow" d="M738 621 L770 621"/>
  <rect class="amber" x="774" y="582" width="218" height="78" rx="8"/>
  <text class="h" x="798" y="612">执行与后置校验</text>
  <text class="t" x="798" y="638">真实任务结果，不只看 200</text>
  <path class="arrow" d="M992 621 L1024 621"/>
  <rect class="rose" x="1028" y="582" width="204" height="78" rx="8"/>
  <text class="h" x="1052" y="612">失败 / Fallback</text>
  <text class="t" x="1052" y="638">换故障域，重新过硬约束</text>

  <path class="retry" d="M1130 582 C1130 558 1160 558 1160 368 C1160 326 1020 326 994 326"/>
  <rect x="48" y="680" width="1184" height="24" rx="7" fill="#17324d"/>
  <text x="68" y="697" style="font: 700 13px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #ffffff;">Schema 合法、相似度高、模型置信度高、协议成功或 HTTP 200，都不能把已被硬约束淘汰的候选重新变成业务可行候选。</text>
</svg>
