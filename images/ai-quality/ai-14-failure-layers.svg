<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">AI 应用九层故障模型</title>
  <desc id="desc">展示输入、上下文、检索、模型、工具、执行六层主调用链，以及策略、基础设施、评测器三个横切层及证据流。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .layer { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .detail { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .band-title { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .band-detail { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .legend { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect width="1280" height="800" fill="#f8fafc"/>
  <rect x="32" y="28" width="1216" height="744" rx="16" fill="#ffffff" stroke="#cbd5e1"/>

  <text x="64" y="78" class="title">AI 应用九层故障模型</text>
  <text x="64" y="109" class="subtitle">先定位首个违反不变量的事件，再分析触发条件、根因与放大因素</text>

  <rect x="64" y="144" width="1152" height="252" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="7 6"/>
  <text x="84" y="177" class="band-title">主调用链：请求、决策与动作沿链路传播</text>

  <g filter="url(#shadow)">
    <rect x="84" y="207" width="160" height="142" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <rect x="274" y="207" width="160" height="142" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <rect x="464" y="207" width="160" height="142" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <rect x="654" y="207" width="160" height="142" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <rect x="844" y="207" width="160" height="142" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <rect x="1034" y="207" width="160" height="142" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  </g>

  <text x="164" y="244" text-anchor="middle" class="layer">1 输入层</text>
  <text x="164" y="278" text-anchor="middle" class="detail">格式与语义</text>
  <text x="164" y="302" text-anchor="middle" class="detail">分布漂移</text>
  <text x="164" y="326" text-anchor="middle" class="detail">恶意内容</text>

  <text x="354" y="244" text-anchor="middle" class="layer">2 上下文层</text>
  <text x="354" y="278" text-anchor="middle" class="detail">系统指令与记忆</text>
  <text x="354" y="302" text-anchor="middle" class="detail">截断与顺序</text>
  <text x="354" y="326" text-anchor="middle" class="detail">版本与隔离</text>

  <text x="544" y="244" text-anchor="middle" class="layer">3 检索层</text>
  <text x="544" y="278" text-anchor="middle" class="detail">查询改写与过滤</text>
  <text x="544" y="302" text-anchor="middle" class="detail">召回与重排</text>
  <text x="544" y="326" text-anchor="middle" class="detail">新鲜度与权限</text>

  <text x="734" y="244" text-anchor="middle" class="layer">4 模型层</text>
  <text x="734" y="278" text-anchor="middle" class="detail">推理与生成</text>
  <text x="734" y="302" text-anchor="middle" class="detail">拒答与幻觉</text>
  <text x="734" y="326" text-anchor="middle" class="detail">路由与采样</text>

  <text x="924" y="244" text-anchor="middle" class="layer">5 工具层</text>
  <text x="924" y="278" text-anchor="middle" class="detail">选择与参数</text>
  <text x="924" y="302" text-anchor="middle" class="detail">契约与权限</text>
  <text x="924" y="326" text-anchor="middle" class="detail">结果可信度</text>

  <text x="1114" y="244" text-anchor="middle" class="layer">6 执行层</text>
  <text x="1114" y="278" text-anchor="middle" class="detail">状态与事务</text>
  <text x="1114" y="302" text-anchor="middle" class="detail">重试与补偿</text>
  <text x="1114" y="326" text-anchor="middle" class="detail">并发与幂等</text>

  <line x1="244" y1="278" x2="270" y2="278" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="434" y1="278" x2="460" y2="278" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="624" y1="278" x2="650" y2="278" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="814" y1="278" x2="840" y2="278" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1004" y1="278" x2="1030" y2="278" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="64" y="438" class="band-title">横切层：它们不只在链路末端工作，而是影响每一个决策点</text>

  <g filter="url(#shadow)">
    <rect x="64" y="466" width="356" height="148" rx="8" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
    <rect x="462" y="466" width="356" height="148" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
    <rect x="860" y="466" width="356" height="148" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  </g>

  <text x="242" y="505" text-anchor="middle" class="layer">7 策略层</text>
  <text x="242" y="538" text-anchor="middle" class="detail">权限、阈值、审批、路由与安全护栏</text>
  <text x="242" y="565" text-anchor="middle" class="detail">典型故障：错放、误拦、规则冲突、默认值危险</text>
  <text x="242" y="592" text-anchor="middle" class="detail">关键证据：命中规则、策略版本、决策理由</text>

  <text x="640" y="505" text-anchor="middle" class="layer">8 基础设施层</text>
  <text x="640" y="538" text-anchor="middle" class="detail">网络、队列、缓存、配额、模型服务与存储</text>
  <text x="640" y="565" text-anchor="middle" class="detail">典型故障：超时、拥塞、陈旧缓存、资源耗尽</text>
  <text x="640" y="592" text-anchor="middle" class="detail">关键证据：时延分解、错误码、资源与依赖状态</text>

  <text x="1038" y="505" text-anchor="middle" class="layer">9 评测器层</text>
  <text x="1038" y="538" text-anchor="middle" class="detail">断言、规则、裁判模型、人工复核与报告</text>
  <text x="1038" y="565" text-anchor="middle" class="detail">典型故障：漏报、误报、量表偏差、解析失败</text>
  <text x="1038" y="592" text-anchor="middle" class="detail">关键证据：评分明细、裁判版本、重复评测结果</text>

  <line x1="242" y1="466" x2="242" y2="398" stroke="#9333ea" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <line x1="640" y1="466" x2="640" y2="398" stroke="#475569" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <line x1="1038" y1="466" x2="1038" y2="398" stroke="#0f766e" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/>

  <rect x="64" y="652" width="1152" height="82" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="84" y="683" class="band-title">统一证据流</text>
  <text x="242" y="714" text-anchor="middle" class="detail">trace_id / span_id</text>
  <text x="455" y="714" text-anchor="middle" class="detail">输入与配置摘要</text>
  <text x="668" y="714" text-anchor="middle" class="detail">状态转移与外部副作用</text>
  <text x="881" y="714" text-anchor="middle" class="detail">规则命中与模型版本</text>
  <text x="1094" y="714" text-anchor="middle" class="detail">输出、评分与人工结论</text>
  <line x1="332" y1="707" x2="366" y2="707" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="545" y1="707" x2="579" y2="707" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="758" y1="707" x2="792" y2="707" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="971" y1="707" x2="1005" y2="707" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <circle cx="936" cy="92" r="7" fill="#334155"/>
  <text x="950" y="97" class="legend">实线：执行传播</text>
  <line x1="1062" y1="92" x2="1094" y2="92" stroke="#475569" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="1104" y="97" class="legend">虚线：横切影响</text>
</svg>
