<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">RAG 查询规划与路由的故障注入测试矩阵</title>
  <desc id="desc">以约束保留、子问题依赖、数据源权限、预算去重、无答案和证据归因为行，展示注入方式、确定性断言、观测证据与失败分类。</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.sub{font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}.head{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#fff}.rowh{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.t{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#334155}.code{font:700 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#7f1d1d}.grid{stroke:#cbd5e1;stroke-width:1.5}.note{font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="40" y="48">评测 Planner，要把故障注入到决策边界</text>
  <text class="sub" x="40" y="76">离线语义集判断“计划是否有用”，确定性测试判断“错误计划是否会被合同与预算拦住”。</text>

  <rect x="40" y="108" width="1200" height="52" rx="8" fill="#334155"/>
  <text class="head" x="60" y="140">被测风险</text>
  <text class="head" x="268" y="140">失败注入</text>
  <text class="head" x="532" y="140">确定性 Oracle</text>
  <text class="head" x="820" y="140">必须保存的证据</text>
  <text class="head" x="1080" y="140">失败分类</text>

  <rect x="40" y="160" width="1200" height="84" fill="#eff6ff" class="grid"/>
  <text class="rowh" x="60" y="191">意图与约束保留</text><text class="t" x="60" y="217">实体、时间、否定词</text>
  <text class="t" x="268" y="190">改写删除“不”、替换实体</text><text class="t" x="268" y="216">把“2025 年”扩成“近期”</text>
  <text class="t" x="532" y="190">invariants 必须是原集合超集</text><text class="t" x="532" y="216">不满足时计划不得执行</text>
  <text class="t" x="820" y="190">raw / rewritten / diff</text><text class="t" x="820" y="216">planner 与 prompt 版本</text>
  <text class="code" x="1080" y="204">INTENT_DRIFT</text>

  <rect x="40" y="244" width="1200" height="84" fill="#ecfdf5" class="grid"/>
  <text class="rowh" x="60" y="275">子问题依赖</text><text class="t" x="60" y="301">串行、并行与聚合</text>
  <text class="t" x="268" y="274">制造环、悬空 dependency</text><text class="t" x="268" y="300">先执行需要上游答案的步骤</text>
  <text class="t" x="532" y="274">DAG 可拓扑排序</text><text class="t" x="532" y="300">依赖未完成时步骤不可就绪</text>
  <text class="t" x="820" y="274">step_id / depends_on</text><text class="t" x="820" y="300">resolved_inputs / status</text>
  <text class="code" x="1080" y="288">DEPENDENCY</text>

  <rect x="40" y="328" width="1200" height="84" fill="#fffbeb" class="grid"/>
  <text class="rowh" x="60" y="359">数据源与权限路由</text><text class="t" x="60" y="385">租户、主体、索引</text>
  <text class="t" x="268" y="358">伪造源、移除 allowed_sources</text><text class="t" x="268" y="384">让空结果旁路到全局索引</text>
  <text class="t" x="532" y="358">目标源必须属于允许交集</text><text class="t" x="532" y="384">空交集返回 DENIED</text>
  <text class="t" x="820" y="358">policy_version / principal</text><text class="t" x="820" y="384">requested / allowed / selected</text>
  <text class="code" x="1080" y="372">ROUTING_DENIED</text>

  <rect x="40" y="412" width="1200" height="84" fill="#f5f3ff" class="grid"/>
  <text class="rowh" x="60" y="443">预算与重复召回</text><text class="t" x="60" y="469">分支数、候选、Token</text>
  <text class="t" x="268" y="442">多查询返回同一 canonical_id</text><text class="t" x="268" y="468">每个子问题继续裂变</text>
  <text class="t" x="532" y="442">计费先预留再执行</text><text class="t" x="532" y="468">合并后 ID 唯一且保留贡献</text>
  <text class="t" x="820" y="442">budget before / after</text><text class="t" x="820" y="468">dedup map / stop_reason</text>
  <text class="code" x="1080" y="456">BUDGET_EXCEEDED</text>

  <rect x="40" y="496" width="1200" height="84" fill="#fff1f2" class="grid"/>
  <text class="rowh" x="60" y="527">无答案与澄清</text><text class="t" x="60" y="553">证据缺失、问题欠定</text>
  <text class="t" x="268" y="526">所有路由返回空结果</text><text class="t" x="268" y="552">比较问题缺一个时间范围</text>
  <text class="t" x="532" y="526">禁止伪造事实型 answer</text><text class="t" x="532" y="552">返回缺失槽位或 NO_ANSWER</text>
  <text class="t" x="820" y="526">route attempts / empty reason</text><text class="t" x="820" y="552">clarification_fields</text>
  <text class="code" x="1080" y="540">NO_ANSWER</text>

  <rect x="40" y="580" width="1200" height="84" fill="#ecfeff" class="grid"/>
  <text class="rowh" x="60" y="611">证据归因</text><text class="t" x="60" y="637">结论到来源与步骤</text>
  <text class="t" x="268" y="610">丢弃 origin_step_id</text><text class="t" x="268" y="636">HyDE 文本混入真实证据</text>
  <text class="t" x="532" y="610">每个候选有真实 source_id</text><text class="t" x="532" y="636">synthetic 内容不可作为引用</text>
  <text class="t" x="820" y="610">claim / source / chunk</text><text class="t" x="820" y="636">origin steps / merge rank</text>
  <text class="code" x="1080" y="624">ATTRIBUTION</text>

  <rect x="40" y="682" width="1200" height="24" rx="6" fill="#0f172a"/>
  <text class="note" x="60" y="699" fill="#fff">通过合同测试只说明控制面按约束工作；语义质量仍需带标注样本、反事实切片和人工复核。</text>
</svg>
