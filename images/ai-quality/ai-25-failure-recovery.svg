<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840" role="img" aria-labelledby="title desc">
  <title id="title">结构化输出失败分类、重试与人工升级状态机</title>
  <desc id="desc">展示配置错误、传输错误、拒答、截断、Schema 错误、业务安全错误和副作用未知状态分别对应修复、重试、降级、阻断或人工升级。</desc>
  <style>
    .bg { fill: #f8fafc; }
    .title { font: 700 32px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
    .sub { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
    .h { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
    .t { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
    .small { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .start { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.5; }
    .classify { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2.5; }
    .config { fill: #fefce8; stroke: #ca8a04; stroke-width: 2; }
    .retry { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; }
    .degrade { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
    .block { fill: #fff1f2; stroke: #e11d48; stroke-width: 2; }
    .pass { fill: #ecfdf5; stroke: #059669; stroke-width: 2.5; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
    .arrow { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    .retryline { stroke: #0891b2; stroke-width: 2.5; fill: none; stroke-dasharray: 7 5; marker-end: url(#cyan); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <marker id="cyan" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0891b2"/></marker>
  </defs>
  <rect class="bg" width="1280" height="840"/>
  <text class="title" x="54" y="58">失败恢复不是统一 retry(3)：先分类，再看幂等与副作用</text>
  <text class="sub" x="54" y="90">每次 attempt 都保留原始终态、失败层和预算；无法证明安全恢复时，停止自动化并交给人工。</text>

  <rect class="start" x="54" y="140" width="250" height="104" rx="8"/>
  <text class="h" x="80" y="176">接收原始响应与上下文</text>
  <text class="t" x="80" y="205">request / attempt / idempotency</text>
  <text class="small" x="80" y="227" fill="#1d4ed8">原始证据不可变</text>
  <path class="arrow" d="M304 192 L352 192"/>
  <rect class="classify" x="356" y="140" width="260" height="104" rx="8"/>
  <text class="h" x="382" y="176">定位第一个失效边界</text>
  <text class="t" x="382" y="205">协议 → JSON → Schema → 业务</text>
  <text class="small" x="382" y="227" fill="#6d28d9">不要先修补输出文本</text>
  <path class="arrow" d="M616 192 L664 192"/>
  <rect class="pass" x="668" y="140" width="250" height="104" rx="8"/>
  <text class="h" x="694" y="176">全部验证通过</text>
  <text class="t" x="694" y="205">接受结果，执行前再查权限</text>
  <text class="small" x="694" y="227" fill="#047857">ACCEPTED</text>
  <path class="arrow" d="M918 192 L966 192"/>
  <rect class="panel" x="970" y="140" width="256" height="104" rx="8"/>
  <text class="h" x="996" y="176">否则进入分类恢复</text>
  <text class="t" x="996" y="205">错误类别决定动作与停止条件</text>
  <text class="small" x="996" y="227" fill="#475569">不是所有失败都可重试</text>

  <rect class="config" x="54" y="310" width="348" height="142" rx="8"/>
  <text class="h" x="80" y="346">A. 配置与兼容错误</text>
  <text class="t" x="80" y="376">Schema 子集不支持 / 模型能力不匹配</text>
  <text class="t" x="80" y="400">同样请求重试不会改变结果</text>
  <rect x="80" y="416" width="296" height="24" rx="6" fill="#fef3c7"/>
  <text class="small" x="94" y="433" fill="#92400e">动作：阻断发布，修复 provider profile</text>

  <rect class="retry" x="466" y="310" width="348" height="142" rx="8"/>
  <text class="h" x="492" y="346">B. 瞬时传输错误</text>
  <text class="t" x="492" y="376">限流 / 断连 / 暂时服务不可用</text>
  <text class="t" x="492" y="400">先确认副作用状态和剩余预算</text>
  <rect x="492" y="416" width="296" height="24" rx="6" fill="#cffafe"/>
  <text class="small" x="506" y="433" fill="#155e75">动作：退避、有界重试、熔断</text>

  <rect class="degrade" x="878" y="310" width="348" height="142" rx="8"/>
  <text class="h" x="904" y="346">C. refusal 或内容策略</text>
  <text class="t" x="904" y="376">提供商明确拒答，不符合业务 Schema</text>
  <text class="t" x="904" y="400">原样重试通常只会重复拒答</text>
  <rect x="904" y="416" width="296" height="24" rx="6" fill="#ffedd5"/>
  <text class="small" x="918" y="433" fill="#9a3412">动作：安全展示、改范围或人工复核</text>

  <rect class="retry" x="54" y="486" width="348" height="142" rx="8"/>
  <text class="h" x="80" y="522">D. 截断与不完整响应</text>
  <text class="t" x="80" y="552">max output / 流中断 / 块缺失</text>
  <text class="t" x="80" y="576">部分 JSON 永远不进入执行层</text>
  <rect x="80" y="592" width="296" height="24" rx="6" fill="#cffafe"/>
  <text class="small" x="94" y="609" fill="#155e75">动作：调预算或拆任务后有限重试</text>

  <rect class="degrade" x="466" y="486" width="348" height="142" rx="8"/>
  <text class="h" x="492" y="522">E. JSON / Schema 错误</text>
  <text class="t" x="492" y="552">语法、required、enum、额外字段</text>
  <text class="t" x="492" y="576">只反馈裁剪后的路径与关键字</text>
  <rect x="492" y="592" width="296" height="24" rx="6" fill="#ffedd5"/>
  <text class="small" x="506" y="609" fill="#9a3412">动作：最多一次受控修正，仍错则升级</text>

  <rect class="block" x="878" y="486" width="348" height="142" rx="8"/>
  <text class="h" x="904" y="522">F. 业务、安全或未知副作用</text>
  <text class="t" x="904" y="552">越权 / 跨租户 / 金额超限 / 状态未知</text>
  <text class="t" x="904" y="576">不能通过放宽 Schema 消除错误</text>
  <rect x="904" y="592" width="296" height="24" rx="6" fill="#ffe4e6"/>
  <text class="small" x="918" y="609" fill="#be123c">动作：阻断、查幂等、审计或人工接管</text>

  <path class="retryline" d="M640 310 C640 270 486 270 486 250"/>
  <path class="retryline" d="M228 486 C228 276 440 276 440 250"/>
  <path class="retryline" d="M640 486 C640 466 836 466 836 260 C836 252 820 248 812 248"/>

  <rect class="panel" x="54" y="678" width="1172" height="104" rx="8"/>
  <text class="h" x="80" y="714">所有自动恢复共享四个停止条件</text>
  <rect x="80" y="734" width="254" height="30" rx="6" fill="#eff6ff"/><text class="small" x="94" y="754" fill="#1d4ed8">次数 / 时间 / Token / 费用预算</text>
  <rect x="354" y="734" width="254" height="30" rx="6" fill="#ecfeff"/><text class="small" x="368" y="754" fill="#0e7490">幂等状态已知且允许重放</text>
  <rect x="628" y="734" width="254" height="30" rx="6" fill="#fff7ed"/><text class="small" x="642" y="754" fill="#c2410c">连续同类失败触发熔断</text>
  <rect x="902" y="734" width="296" height="30" rx="6" fill="#fff1f2"/><text class="small" x="916" y="754" fill="#be123c">无法证明安全恢复时转人工</text>

  <text class="sub" x="54" y="817">报告保留每个物理 attempt；最后一次成功不能覆盖前面的失败、成本和潜在副作用。</text>
</svg>
