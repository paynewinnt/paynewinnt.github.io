<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">多模型路由器的离线、影子与在线评测闭环</title>
  <desc id="desc">展示完整候选矩阵上的离线路由评测、真实流量影子比较、带探索概率的在线观测和延迟业务真值回填，最终按硬约束违规、质量、成本、延迟、后悔值、校准和故障域集中度发布。</desc>
  <defs>
    <style>
      .bg { fill: #f7fafc; }
      .title { font: 700 31px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #17324d; }
      .sub { font: 400 16px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #51697d; }
      .h { font: 700 18px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #17324d; }
      .t { font: 400 14px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334f63; }
      .small { font: 600 13px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .box { fill: #ffffff; stroke: #c9d7e2; stroke-width: 2; }
      .blue { fill: #eaf4ff; stroke: #4e8fbe; stroke-width: 2; }
      .green { fill: #eaf7ef; stroke: #5b9671; stroke-width: 2; }
      .amber { fill: #fff5df; stroke: #c58b35; stroke-width: 2; }
      .violet { fill: #f2edfa; stroke: #8a72ae; stroke-width: 2; }
      .rose { fill: #fff0f0; stroke: #bd6669; stroke-width: 2; }
      .arrow { fill: none; stroke: #667f91; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#667f91"/></marker>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <rect width="1280" height="104" fill="#ffffff"/>
  <rect y="102" width="1280" height="2" fill="#dce6ed"/>
  <text class="title" x="48" y="46">路由器评测：同时测选择质量、候选能力和策略代价</text>
  <text class="sub" x="48" y="77">离线矩阵建立可比反事实；影子与在线流量发现漂移；延迟真值负责纠正代理分数和自信但错误的路由。</text>

  <text class="h" x="48" y="138">四条证据轨并行采集</text>
  <rect class="blue" x="48" y="158" width="272" height="150" rx="8"/>
  <text class="h" x="70" y="190">A. 离线全候选矩阵</text>
  <text class="t" x="70" y="220">固定请求、Prompt 与模型快照</text>
  <text class="t" x="70" y="246">每个可行模型都执行并独立评分</text>
  <text class="t" x="70" y="272">计算 Oracle、成本前沿与后悔值</text>
  <text class="small" x="70" y="294" fill="#356e99">避免只看旧策略选中的结果</text>

  <rect class="violet" x="352" y="158" width="272" height="150" rx="8"/>
  <text class="h" x="374" y="190">B. 真实流量影子</text>
  <text class="t" x="374" y="220">复制合规输入，不交付影子输出</text>
  <text class="t" x="374" y="246">比较分布、能力、延迟和费用</text>
  <text class="t" x="374" y="272">敏感数据仍执行最小化与驻留</text>
  <text class="small" x="374" y="294" fill="#6f5891">影子成功不等于线上业务成功</text>

  <rect class="amber" x="656" y="158" width="272" height="150" rx="8"/>
  <text class="h" x="678" y="190">C. 在线受控探索</text>
  <text class="t" x="678" y="220">仅在低风险可行候选中探索</text>
  <text class="t" x="678" y="246">记录 action 与选择 propensity</text>
  <text class="t" x="678" y="272">止损、配额、样本量和到期时间</text>
  <text class="small" x="678" y="294" fill="#946620">无概率日志无法可靠离线重估</text>

  <rect class="green" x="960" y="158" width="272" height="150" rx="8"/>
  <text class="h" x="982" y="190">D. 延迟业务真值</text>
  <text class="t" x="982" y="220">任务完成、纠正、申诉与损失</text>
  <text class="t" x="982" y="246">按 route_id 回填原决策与候选</text>
  <text class="t" x="982" y="272">区分模型失败与路由选择失败</text>
  <text class="small" x="982" y="294" fill="#3f7956">代理 Judge 不能覆盖真实后置条件</text>

  <path class="arrow" d="M184 308 L184 352"/>
  <path class="arrow" d="M488 308 L488 352"/>
  <path class="arrow" d="M792 308 L792 352"/>
  <path class="arrow" d="M1096 308 L1096 352"/>
  <rect class="box" x="48" y="356" width="1184" height="96" rx="8"/>
  <text class="h" x="70" y="388">统一决策日志与版本关联</text>
  <text class="t" x="70" y="416">request_contract · feasible_candidates · rejected_reasons · router_score · selected_model · propensity · fallback_chain · actual_outcome</text>
  <text class="small" x="70" y="438" fill="#51697d">模型、价格、能力注册表、校准器、策略、Prompt、故障状态和评测器均保存不可变版本</text>
  <path class="arrow" d="M640 452 L640 486"/>

  <text class="h" x="48" y="500">发布看板不压成一个总分</text>
  <rect class="rose" x="48" y="520" width="218" height="110" rx="8"/>
  <text class="h" x="68" y="550">硬约束</text>
  <text class="t" x="68" y="578">违规率必须为零</text>
  <text class="t" x="68" y="604">空集与拒绝原因可解释</text>

  <rect class="green" x="286" y="520" width="218" height="110" rx="8"/>
  <text class="h" x="306" y="550">质量</text>
  <text class="t" x="306" y="578">质量约束违例率</text>
  <text class="t" x="306" y="604">关键切片与任务完成率</text>

  <rect class="amber" x="524" y="520" width="218" height="110" rx="8"/>
  <text class="h" x="544" y="550">效率</text>
  <text class="t" x="544" y="578">条件成本 · P95 延迟</text>
  <text class="t" x="544" y="604">路由开销与级联放大</text>

  <rect class="blue" x="762" y="520" width="218" height="110" rx="8"/>
  <text class="h" x="782" y="550">策略</text>
  <text class="t" x="782" y="578">Oracle 后悔值 · 覆盖率</text>
  <text class="t" x="782" y="604">探索收益与 Fallback 成功</text>

  <rect class="violet" x="1000" y="520" width="232" height="110" rx="8"/>
  <text class="h" x="1020" y="550">可信度</text>
  <text class="t" x="1020" y="578">校准误差 · OOD 分层</text>
  <text class="t" x="1020" y="604">供应商故障域集中度</text>

  <rect x="48" y="656" width="1184" height="40" rx="8" fill="#17324d"/>
  <text x="68" y="682" style="font: 700 15px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #ffffff;">通过条件：硬约束零违规，关键质量下界达标，并在同一候选、价格和流量快照上证明成本与延迟收益；路由器置信度本身不是业务正确性证据。</text>
</svg>
