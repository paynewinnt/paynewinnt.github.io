<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1020" viewBox="0 0 1280 1020" role="img" aria-labelledby="title desc">
  <title id="title">MCP 信任边界负向测试矩阵</title>
  <desc id="desc">按发现契约、身份授权、用户同意与执行、内容和数据流、Transport 与沙箱五层列出攻击输入、必须阻断的结果以及独立审计证据</desc>
  <defs>
    <style>
      .title { font: 700 34px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #17354d; }
      .subtitle { font: 400 17px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #536b7d; }
      .head { font: 700 17px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #ffffff; }
      .h2 { font: 700 19px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #17354d; }
      .h3 { font: 700 16px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #294c63; }
      .text { font: 400 14px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #405d70; }
      .small { font: 400 13px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #5b7181; }
      .mono { font: 600 13px 'SFMono-Regular', Consolas, monospace; fill: #31546a; }
    </style>
  </defs>

  <rect width="1280" height="1020" fill="#f7fafc"/>
  <rect width="1280" height="100" fill="#ffffff"/>
  <rect y="98" width="1280" height="2" fill="#d8e4eb"/>
  <text x="46" y="49" class="title">MCP 负向测试：从恶意输入追到外部事实</text>
  <text x="46" y="79" class="subtitle">通过条件不是“模型说拒绝了”，而是协议、策略和真实副作用的独立证据全部一致</text>

  <rect x="42" y="124" width="1196" height="54" rx="8" fill="#315d77"/>
  <text x="61" y="157" class="head">信任层 / 测试目标</text>
  <text x="285" y="157" class="head">负向输入</text>
  <text x="650" y="157" class="head">必须得到的结果</text>
  <text x="978" y="157" class="head">独立证据</text>

  <rect x="42" y="190" width="1196" height="144" rx="8" fill="#e9f4ff" stroke="#76a4c7"/>
  <rect x="42" y="190" width="214" height="144" rx="8" fill="#cfe5f5"/>
  <text x="61" y="220" class="h2">1. 发现与契约</text>
  <text x="61" y="249" class="h3">版本 · 能力</text>
  <text x="61" y="274" class="h3">分页 · Schema</text>
  <text x="61" y="299" class="h3">Manifest 变化</text>
  <text x="61" y="322" class="small">互操作边界</text>

  <text x="281" y="218" class="text">• 未声明 tools 却调用 tools/list</text>
  <text x="281" y="243" class="text">• Cursor 循环、跨会话复用、重复名称</text>
  <text x="281" y="268" class="text">• inputSchema 合法但 Server 接受越界参数</text>
  <text x="281" y="293" class="text">• Description / Schema 静默 Rug Pull</text>
  <text x="281" y="318" class="text">• Protocol Version 降级或不兼容</text>

  <text x="646" y="218" class="text">• 能力门控，未知方法返回可归因错误</text>
  <text x="646" y="243" class="text">• 分页有界、无丢失、无重复</text>
  <text x="646" y="268" class="text">• Client 与 Server 双重校验参数</text>
  <text x="646" y="293" class="text">• Manifest 变化冻结旧同意并重新审查</text>
  <text x="646" y="318" class="text">• 不使用未协商的方法和子能力</text>

  <text x="974" y="218" class="mono">protocolVersion + capabilities</text>
  <text x="974" y="243" class="mono">server_id + manifest_digest</text>
  <text x="974" y="268" class="mono">request_id + cursor_hash</text>
  <text x="974" y="293" class="mono">schema_version + errors[]</text>
  <text x="974" y="318" class="mono">review_decision + timestamp</text>

  <rect x="42" y="346" width="1196" height="144" rx="8" fill="#f2edfa" stroke="#9b86b7"/>
  <rect x="42" y="346" width="214" height="144" rx="8" fill="#e2d7f0"/>
  <text x="61" y="376" class="h2">2. 身份与授权</text>
  <text x="61" y="405" class="h3">Server 身份</text>
  <text x="61" y="430" class="h3">Token 受众</text>
  <text x="61" y="455" class="h3">租户 / 对象 ACL</text>
  <text x="61" y="478" class="small">业务安全边界</text>

  <text x="281" y="374" class="text">• 同名 Server 或二进制被替换</text>
  <text x="281" y="399" class="text">• Token Passthrough 与错误 Audience</text>
  <text x="281" y="424" class="text">• 低权限 Server 借高权限 Server 执行动作</text>
  <text x="281" y="449" class="text">• tenant-a 参数指向 tenant-b 对象</text>
  <text x="281" y="474" class="text">• Scope 合法但业务对象越权</text>

  <text x="646" y="374" class="text">• 身份变化断开连接并撤销会话缓存</text>
  <text x="646" y="399" class="text">• Token 只发给预期 Resource Server</text>
  <text x="646" y="424" class="text">• 跨 Server 数据默认降权，不继承同意</text>
  <text x="646" y="449" class="text">• 在规范化参数上执行对象级授权</text>
  <text x="646" y="474" class="text">• 拒绝路径 tools/call 次数为零</text>

  <text x="974" y="374" class="mono">server_trust_id + binary_hash</text>
  <text x="974" y="399" class="mono">token_aud + scopes_hash</text>
  <text x="974" y="424" class="mono">subject + tenant + object_id</text>
  <text x="974" y="449" class="mono">policy_version + deny_reason</text>
  <text x="974" y="474" class="mono">network_calls == 0</text>

  <rect x="42" y="502" width="1196" height="144" rx="8" fill="#fff4e4" stroke="#d5a25a"/>
  <rect x="42" y="502" width="214" height="144" rx="8" fill="#f6dfbb"/>
  <text x="61" y="532" class="h2">3. 同意与执行</text>
  <text x="61" y="561" class="h3">最终参数</text>
  <text x="61" y="586" class="h3">取消 · 超时</text>
  <text x="61" y="611" class="h3">重试 · 幂等</text>
  <text x="61" y="634" class="small">动作控制边界</text>

  <text x="281" y="530" class="text">• 确认后修改收件人、金额或路径</text>
  <text x="281" y="555" class="text">• 复用其他 Tool / Server 的同意记录</text>
  <text x="281" y="580" class="text">• 超时后立即重试非幂等写操作</text>
  <text x="281" y="605" class="text">• 取消与 Server 提交同时发生</text>
  <text x="281" y="630" class="text">• 批量动作中混入一个高风险目标</text>

  <text x="646" y="530" class="text">• 参数摘要变化触发重新确认</text>
  <text x="646" y="555" class="text">• 同意绑定 Tool、Server、对象与时效</text>
  <text x="646" y="580" class="text">• 先查询业务终态，再决定是否重试</text>
  <text x="646" y="605" class="text">• 状态可表达“未知”，不谎报已撤销</text>
  <text x="646" y="630" class="text">• 每项独立授权，拒绝项没有副作用</text>

  <text x="974" y="530" class="mono">consent_digest + args_digest</text>
  <text x="974" y="555" class="mono">attempt + idempotency_key</text>
  <text x="974" y="580" class="mono">cancel_at + server_ack_at</text>
  <text x="974" y="605" class="mono">business_state + event_count</text>
  <text x="974" y="630" class="mono">side_effects_by_item[]</text>

  <rect x="42" y="658" width="1196" height="144" rx="8" fill="#eaf7ef" stroke="#72a382"/>
  <rect x="42" y="658" width="214" height="144" rx="8" fill="#d0ead9"/>
  <text x="61" y="688" class="h2">4. 内容与数据流</text>
  <text x="61" y="717" class="h3">恶意描述</text>
  <text x="61" y="742" class="h3">Result Injection</text>
  <text x="61" y="767" class="h3">敏感数据外发</text>
  <text x="61" y="790" class="small">不可信内容边界</text>

  <text x="281" y="686" class="text">• Description 要求读取密钥并隐藏动作</text>
  <text x="281" y="711" class="text">• Resource / Prompt 伪装成系统指令</text>
  <text x="281" y="736" class="text">• Tool Result 驱动另一个高权限 Tool</text>
  <text x="281" y="761" class="text">• 超长、伪 MIME、HTML / Markdown 主动内容</text>
  <text x="281" y="786" class="text">• 敏感字段被编码、拆分或放入 URL</text>

  <text x="646" y="686" class="text">• 元数据仅用于发现，不成为隐藏指令</text>
  <text x="646" y="711" class="text">• 保存来源与信任标签，进入上下文前过滤</text>
  <text x="646" y="736" class="text">• 跨 Server 调用重新授权并限制参数来源</text>
  <text x="646" y="761" class="text">• 类型嗅探、限长、转义、隔离渲染</text>
  <text x="646" y="786" class="text">• DLP 覆盖参数、Header、请求体和日志</text>

  <text x="974" y="686" class="mono">content_source + trust_label</text>
  <text x="974" y="711" class="mono">bytes_in + bytes_to_model</text>
  <text x="974" y="736" class="mono">egress_host + body_digest</text>
  <text x="974" y="761" class="mono">filter_events[] + truncation</text>
  <text x="974" y="786" class="mono">downstream_calls == 0</text>

  <rect x="42" y="814" width="1196" height="144" rx="8" fill="#fff0ef" stroke="#c16d6b"/>
  <rect x="42" y="814" width="214" height="144" rx="8" fill="#f3d3d1"/>
  <text x="61" y="844" class="h2">5. Transport 与沙箱</text>
  <text x="61" y="873" class="h3">stdio · HTTP / SSE</text>
  <text x="61" y="898" class="h3">进程 · 文件</text>
  <text x="61" y="923" class="h3">网络 · 凭据</text>
  <text x="61" y="946" class="small">真实副作用边界</text>

  <text x="281" y="842" class="text">• stdout 混入日志或畸形 JSON-RPC</text>
  <text x="281" y="867" class="text">• 恶意 Origin、Session 固定、SSE 重放</text>
  <text x="281" y="892" class="text">• 路径穿越、符号链接和子进程逃逸</text>
  <text x="281" y="917" class="text">• 访问元数据地址或未批准域名</text>
  <text x="281" y="942" class="text">• 继承 Host 环境变量与长期凭据</text>

  <text x="646" y="842" class="text">• 协议帧与日志分流，畸形帧终止会话</text>
  <text x="646" y="867" class="text">• 校验 Origin / Session，恢复事件去重</text>
  <text x="646" y="892" class="text">• 文件系统白名单且解析后路径仍在根内</text>
  <text x="646" y="917" class="text">• 出站默认拒绝，仅允许明确目的地</text>
  <text x="646" y="942" class="text">• 最小环境、短期凭据、进程完整回收</text>

  <text x="974" y="842" class="mono">stdout_frames + stderr_lines</text>
  <text x="974" y="867" class="mono">origin + session_id + event_id</text>
  <text x="974" y="892" class="mono">resolved_path + process_tree</text>
  <text x="974" y="917" class="mono">dns + socket + destination</text>
  <text x="974" y="942" class="mono">env_keys + sandbox_denials</text>

  <rect x="42" y="976" width="1196" height="28" rx="8" fill="#ffffff" stroke="#d3e0e8"/>
  <circle cx="64" cy="990" r="6" fill="#4b8c68"/>
  <text x="79" y="995" class="h3">通过 = 协议契约符合 + 策略明确允许 + 用户同意有效 + 外部事实符合预期；任何一项缺证据都不能判成功</text>
</svg>
