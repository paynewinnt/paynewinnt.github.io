<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Agent 故障注入与恢复评测回路</title>
  <desc id="desc">展示故障计划经过工具代理注入到状态环境，并通过轨迹和状态断言评价 Agent 恢复能力。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/>
    </marker>
    <style>
      .title { font: 700 30px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .head { font: 700 18px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .body { font: 400 15px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .small { font: 500 13px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .metric { font: 600 14px "JetBrains Mono", "Noto Sans SC", monospace; fill: #1e293b; }
    </style>
  </defs>
  <rect width="1280" height="800" fill="#f8fafc"/>
  <rect x="0" y="0" width="1280" height="8" fill="#dc2626"/>
  <text x="64" y="58" class="title">Agent 故障注入：测“恢复正确”，不是测“会重试”</text>
  <text x="64" y="87" class="subtitle">故障点必须区分副作用发生前与发生后；否则重试可能制造重复写入。</text>

  <rect x="64" y="132" width="252" height="398" rx="8" fill="#ffffff" stroke="#dc2626"/>
  <rect x="64" y="132" width="252" height="58" rx="8" fill="#fee2e2"/>
  <text x="190" y="169" text-anchor="middle" class="head">故障计划</text>
  <text x="88" y="229" class="body">调用前超时</text>
  <text x="88" y="263" class="body">提交后响应丢失</text>
  <text x="88" y="297" class="body">限流与暂时不可用</text>
  <text x="88" y="331" class="body">陈旧读取与乱序事件</text>
  <text x="88" y="365" class="body">畸形响应与字段缺失</text>
  <text x="88" y="399" class="body">权限拒绝与策略冲突</text>
  <rect x="88" y="442" width="204" height="56" rx="6" fill="#fef2f2"/>
  <text x="190" y="476" text-anchor="middle" class="metric">seed + trigger + count</text>

  <rect x="390" y="132" width="500" height="398" rx="8" fill="#ffffff" stroke="#7c3aed"/>
  <rect x="390" y="132" width="500" height="58" rx="8" fill="#ede9fe"/>
  <text x="640" y="169" text-anchor="middle" class="head">确定性工具代理与状态机</text>
  <rect x="426" y="224" width="180" height="76" rx="6" fill="#f5f3ff" stroke="#a78bfa"/>
  <text x="516" y="254" text-anchor="middle" class="body">Agent 动作</text>
  <text x="516" y="278" text-anchor="middle" class="small">tool + arguments</text>
  <rect x="674" y="224" width="180" height="76" rx="6" fill="#fff7ed" stroke="#fb923c"/>
  <text x="764" y="254" text-anchor="middle" class="body">故障拦截器</text>
  <text x="764" y="278" text-anchor="middle" class="small">before / after commit</text>
  <rect x="426" y="358" width="180" height="76" rx="6" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="516" y="388" text-anchor="middle" class="body">工具结果</text>
  <text x="516" y="412" text-anchor="middle" class="small">observation + error</text>
  <rect x="674" y="358" width="180" height="76" rx="6" fill="#ecfdf5" stroke="#34d399"/>
  <text x="764" y="388" text-anchor="middle" class="body">环境状态</text>
  <text x="764" y="412" text-anchor="middle" class="small">version + side effect</text>
  <path d="M606 262 H670" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M764 300 V354" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M674 396 H610" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M516 358 V304" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="964" y="132" width="252" height="398" rx="8" fill="#ffffff" stroke="#059669"/>
  <rect x="964" y="132" width="252" height="58" rx="8" fill="#d1fae5"/>
  <text x="1090" y="169" text-anchor="middle" class="head">恢复判定</text>
  <text x="988" y="229" class="body">是否识别故障类型</text>
  <text x="988" y="263" class="body">是否先查状态再重试</text>
  <text x="988" y="297" class="body">是否避免重复副作用</text>
  <text x="988" y="331" class="body">是否保持业务不变量</text>
  <text x="988" y="365" class="body">是否在预算内收敛</text>
  <text x="988" y="399" class="body">是否安全终止或转人工</text>
  <rect x="988" y="442" width="204" height="56" rx="6" fill="#ecfdf5"/>
  <text x="1090" y="476" text-anchor="middle" class="metric">recover / contain / stop</text>

  <path d="M316 330 H386" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <path d="M890 330 H960" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="64" y="582" width="1152" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="92" y="620" class="head">必须分别覆盖的三个终态</text>
  <rect x="92" y="650" width="330" height="54" rx="6" fill="#d1fae5"/>
  <text x="257" y="682" text-anchor="middle" class="body">恢复成功：目标达成且无重复副作用</text>
  <rect x="475" y="650" width="330" height="54" rx="6" fill="#fef3c7"/>
  <text x="640" y="682" text-anchor="middle" class="body">受控降级：未达成但现场保持一致</text>
  <rect x="858" y="650" width="330" height="54" rx="6" fill="#fee2e2"/>
  <text x="1023" y="682" text-anchor="middle" class="body">错误恢复：重复写入、越权或状态污染</text>
  <text x="64" y="770" class="small">评测输出同时保留原始轨迹、故障命中记录、状态快照和断言结果，支持确定性重放。</text>
</svg>
