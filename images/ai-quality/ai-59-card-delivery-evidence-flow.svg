<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 卡片与发布证据包的交付流</title>
  <desc id="desc">模型工件、系统清单、评测证据、风险登记和监管适用性记录经过卡片编译、引用校验、风险门禁与角色审批，形成不可变发布证据包并进入部署登记。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}.title{font:700 28px sans-serif;fill:#0f172a}.sub{font:400 15px sans-serif;fill:#475569}
      .box{stroke-width:2;rx:6}.h{font:700 16px sans-serif;fill:#0f172a}.t{font:400 12.5px sans-serif;fill:#334155}
      .small{font:600 12px sans-serif;fill:#475569}.flow{stroke:#334155;stroke-width:2.1;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#64748b;stroke-width:1.8;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="48" y="50">Card 不是发布后的说明文：证据先绑定候选工件，再生成可审计交付包</text>
  <text class="sub" x="48" y="78">Model Card、System Card、Risk Register 与 Release Evidence Bundle 职责不同，通过稳定 ID、摘要、版本和有效期互相引用</text>

  <rect class="box" x="46" y="120" width="198" height="112" fill="#e0f2fe" stroke="#0284c7"/>
  <text class="h" x="64" y="150">模型工件与 Model Card</text>
  <text class="t" x="64" y="176">checkpoint/API 版本、训练边界</text>
  <text class="t" x="64" y="198">intended use、因素、指标、限制</text>
  <text class="small" x="64" y="218">主体：模型本身</text>

  <rect class="box" x="46" y="258" width="198" height="112" fill="#ecfccb" stroke="#65a30d"/>
  <text class="h" x="64" y="288">系统清单与 System Card</text>
  <text class="t" x="64" y="314">模型、Prompt、RAG、工具、UI</text>
  <text class="t" x="64" y="336">控制、红队、运营与系统限制</text>
  <text class="small" x="64" y="356">主体：部署系统与场景</text>

  <rect class="box" x="46" y="396" width="198" height="112" fill="#fef3c7" stroke="#d97706"/>
  <text class="h" x="64" y="426">评测与运行证据</text>
  <text class="t" x="64" y="452">run、数据快照、结果、unknown</text>
  <text class="t" x="64" y="474">覆盖、有效期、主体摘要</text>
  <text class="small" x="64" y="494">主体：可复现证据记录</text>

  <rect class="box" x="46" y="534" width="198" height="112" fill="#fee2e2" stroke="#dc2626"/>
  <text class="h" x="64" y="564">风险与适用性记录</text>
  <text class="t" x="64" y="590">scenario、残余风险、owner</text>
  <text class="t" x="64" y="612">jurisdiction、角色、依据、复审</text>
  <text class="small" x="64" y="632">主体：治理决策与责任</text>

  <rect class="box" x="310" y="198" width="224" height="368" fill="#f1f5f9" stroke="#475569"/>
  <text class="h" x="330" y="230">证据编译与引用校验</text>
  <text class="t" x="330" y="262">1. 解析 exact release candidate</text>
  <text class="t" x="330" y="290">2. 计算工件与配置摘要</text>
  <text class="t" x="330" y="318">3. 解析 model/system boundary</text>
  <text class="t" x="330" y="346">4. 风险 → 控制 → 评测映射</text>
  <text class="t" x="330" y="374">5. 检查覆盖、结果与 unknown</text>
  <text class="t" x="330" y="402">6. 版本 diff → 重评测触发</text>
  <text class="t" x="330" y="430">7. 检查过期与残余风险接受</text>
  <text class="t" x="330" y="458">8. 适用性状态与依据齐全</text>
  <text class="t" x="330" y="486">9. 生成 pre-approval digest</text>
  <text class="small" x="330" y="526">缺证据时输出 BLOCK/UNKNOWN</text>
  <text class="small" x="330" y="548">不自动补写法律结论</text>

  <path class="flow" d="M244 176 H278 V270 H304"/>
  <path class="flow" d="M244 314 H304"/>
  <path class="flow" d="M244 452 H304"/>
  <path class="flow" d="M244 590 H278 V510 H304"/>

  <rect class="box" x="596" y="122" width="254" height="146" fill="#dbeafe" stroke="#2563eb"/>
  <text class="h" x="616" y="154">四类版本化交付物</text>
  <text class="t" x="616" y="182">Model Card：模型能力与限制</text>
  <text class="t" x="616" y="206">System Card：整套系统与缓解</text>
  <text class="t" x="616" y="230">Risk Register：风险生命期状态</text>
  <text class="t" x="616" y="252">Evidence Bundle：候选发布快照</text>

  <rect class="box" x="596" y="304" width="254" height="146" fill="#f3e8ff" stroke="#9333ea"/>
  <text class="h" x="616" y="336">风险分级发布门禁</text>
  <text class="t" x="616" y="364">intended/forbidden use 与场景边界</text>
  <text class="t" x="616" y="388">硬风险、残余风险与例外有效期</text>
  <text class="t" x="616" y="412">模型/系统证据、覆盖与新鲜度</text>
  <text class="t" x="616" y="436">变更类型对应的重评测矩阵</text>

  <rect class="box" x="596" y="486" width="254" height="126" fill="#fff7ed" stroke="#ea580c"/>
  <text class="h" x="616" y="518">角色审批绑定摘要</text>
  <text class="t" x="616" y="546">system / product / safety / security</text>
  <text class="t" x="616" y="570">privacy / legal applicability / risk</text>
  <text class="small" x="616" y="594">内容变化后旧审批自动失效</text>

  <path class="flow" d="M534 288 H566 V195 H590"/>
  <path class="flow" d="M534 382 H590"/>
  <path class="flow" d="M534 478 H566 V549 H590"/>

  <rect class="box" x="916" y="176" width="318" height="260" fill="#dcfce7" stroke="#16a34a"/>
  <text class="h" x="936" y="208">不可变 Release Evidence Bundle</text>
  <text class="t" x="936" y="238">release candidate / manifest digest</text>
  <text class="t" x="936" y="264">四类交付物版本与内容摘要</text>
  <text class="t" x="936" y="290">风险—控制—证据引用图</text>
  <text class="t" x="936" y="316">覆盖、known limitation、residual risk</text>
  <text class="t" x="936" y="342">适用性记录与官方来源指针</text>
  <text class="t" x="936" y="368">审批角色、决定、时间与绑定摘要</text>
  <text class="t" x="936" y="394">监控、回滚、过期与重评测触发器</text>
  <text class="small" x="936" y="420">结果：ALLOW / RESTRICT / BLOCK / UNKNOWN</text>

  <path class="flow" d="M850 195 H886 V252 H910"/>
  <path class="flow" d="M850 377 H910"/>
  <path class="flow" d="M850 549 H886 V404 H910"/>

  <rect class="box" x="916" y="490" width="318" height="122" fill="#e2e8f0" stroke="#475569"/>
  <text class="h" x="936" y="522">部署登记与持续回路</text>
  <text class="t" x="936" y="550">artifact registry / rollout / monitor / rollback</text>
  <text class="t" x="936" y="576">incident / drift / expiry / scope change</text>
  <text class="small" x="936" y="598">触发新候选，不原地改旧证据包</text>
  <path class="flow" d="M1075 436 V484"/>
  <path class="dash" d="M916 552 H878 V662 H422 V572"/>

  <text class="small" x="48" y="688">核心约束：Card 可以给人阅读，但发布门禁必须读取结构化事实；文档存在不等于引用完整，审批存在也不等于审批绑定了当前候选。</text>
</svg>
