<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 能力自建、采购与组合的证据化决策系统</title>
  <desc id="desc">从问题合同和候选版本开始，经过盲测、数据控制、全生命周期成本和退出演练四类证据，先执行硬门，再对合格候选做偏好评分与敏感性分析。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#18212f" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/>
    </marker>
    <style>
      .title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#17212b}
      .subtitle{font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#52606d}
      .stage{font:700 19px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#17212b}
      .body{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#334155}
      .small{font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#334155}
      .white{fill:#fff}
    </style>
  </defs>
  <rect width="1280" height="720" fill="#f7f9fb"/>
  <rect x="0" y="0" width="1280" height="8" fill="#16817a"/>
  <text x="64" y="58" class="title">AI 能力决策：先证明合格，再比较偏好</text>
  <text x="64" y="88" class="subtitle">自建 B、采购 P、组合 H 使用同一问题合同与证据分母；任何硬失败都不能被价格或总分抵消</text>

  <g filter="url(#shadow)">
    <rect x="64" y="126" width="212" height="150" rx="8" fill="#ffffff" stroke="#8fa3b8"/>
    <rect x="64" y="126" width="212" height="42" rx="8" fill="#dce8f4"/>
    <rect x="64" y="160" width="212" height="8" fill="#dce8f4"/>
    <text x="84" y="153" class="stage">01 问题与需求合同</text>
    <text x="84" y="194" class="body">用户结果 / 禁止结果</text>
    <text x="84" y="220" class="body">数据、运行与退出边界</text>
    <text x="84" y="246" class="body">硬门 / 目标 / 偏好分离</text>

    <rect x="304" y="126" width="212" height="150" rx="8" fill="#ffffff" stroke="#8fa3b8"/>
    <rect x="304" y="126" width="212" height="42" rx="8" fill="#e6e0f2"/>
    <rect x="304" y="160" width="212" height="8" fill="#e6e0f2"/>
    <text x="324" y="153" class="stage">02 候选 Bundle</text>
    <text x="324" y="194" class="body">模型 / API / 数据 / 策略</text>
    <text x="324" y="220" class="body">报价 / 责任 / 退出计划</text>
    <text x="324" y="246" class="body">版本摘要与新鲜度</text>

    <rect x="544" y="126" width="672" height="150" rx="8" fill="#ffffff" stroke="#8fa3b8"/>
    <rect x="544" y="126" width="672" height="42" rx="8" fill="#e9f1ea"/>
    <rect x="544" y="160" width="672" height="8" fill="#e9f1ea"/>
    <text x="566" y="153" class="stage">03 四类独立证据</text>
    <g>
      <rect x="566" y="184" width="145" height="68" rx="6" fill="#f1f6fb" stroke="#a9bdd0"/>
      <text x="638" y="208" text-anchor="middle" class="small">盲测 Benchmark</text>
      <text x="638" y="232" text-anchor="middle" class="body">slice 与严格分母</text>
      <rect x="725" y="184" width="145" height="68" rx="6" fill="#f7f2e7" stroke="#c8b27c"/>
      <text x="797" y="208" text-anchor="middle" class="small">数据与控制面</text>
      <text x="797" y="232" text-anchor="middle" class="body">区域 / 访问 / 用途</text>
      <rect x="884" y="184" width="145" height="68" rx="6" fill="#eef5ef" stroke="#98b69d"/>
      <text x="956" y="208" text-anchor="middle" class="small">三年 TCO</text>
      <text x="956" y="232" text-anchor="middle" class="body">建 / 运 / 评 / 治 / 退</text>
      <rect x="1043" y="184" width="151" height="68" rx="6" fill="#f6ecec" stroke="#c79b9b"/>
      <text x="1118" y="208" text-anchor="middle" class="small">退出与替代演练</text>
      <text x="1118" y="232" text-anchor="middle" class="body">导出 / 删除 / RTO</text>
    </g>
  </g>

  <path d="M276 201 H294" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M516 201 H534" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M880 276 V316" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <path d="M640 332 L880 292 L1120 332 L1120 448 L880 488 L640 448 Z" fill="#203b4d"/>
    <text x="880" y="348" text-anchor="middle" class="stage white">04 硬约束资格门</text>
    <text x="880" y="381" text-anchor="middle" class="body white">驻留 · 禁止训练 · 权限泄露 · slice 最低值</text>
    <text x="880" y="408" text-anchor="middle" class="body white">可靠性 · TCO 上限 · 完整导出 · 删除面 · 替代 RTO</text>
    <text x="880" y="443" text-anchor="middle" style="font:700 15px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#ffd37a">FAIL / UNPROVEN → 不进入加权排名</text>
  </g>

  <path d="M640 390 H504" stroke="#a84343" stroke-width="2" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="64" y="326" width="420" height="126" rx="8" fill="#fff" stroke="#c96b6b"/>
    <rect x="64" y="326" width="10" height="126" rx="5" fill="#c44545"/>
    <text x="94" y="359" class="stage">阻断与证据缺口</text>
    <text x="94" y="388" class="body">保留失败事实、未知项、补偿控制、接受者与到期日</text>
    <text x="94" y="417" class="body">低报价、高 Demo 分和标准 API 都不能改写为 PASS</text>
  </g>

  <path d="M880 488 V528" stroke="#16817a" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="386" y="544" width="830" height="120" rx="8" fill="#fff" stroke="#69a39e"/>
    <rect x="386" y="544" width="830" height="38" rx="8" fill="#dcefeb"/>
    <rect x="386" y="574" width="830" height="8" fill="#dcefeb"/>
    <text x="408" y="570" class="stage">05 合格候选的偏好比较与敏感性分析</text>
    <text x="408" y="610" class="body">质量 · 安全 · 可靠性 · 数据/控制 · TCO · 退出准备 · 交付速度</text>
    <text x="408" y="638" class="body">输出：分场景排名、robustness share、翻转条件、合同动作、组合策略与复核触发器</text>
    <g>
      <rect x="64" y="544" width="282" height="120" rx="8" fill="#fff" stroke="#c7a45a"/>
      <text x="86" y="576" class="stage">决策输出不是一个总分</text>
      <text x="86" y="608" class="body">资格 + 证据限制 + 情景排名</text>
      <text x="86" y="634" class="body">+ 退出条件 + 下一次复核时间</text>
    </g>
  </g>
  <text x="64" y="700" class="subtitle">构造示意：所有候选、门槛与权重都应绑定版本；摘要用于发现变化，不证明声明内容真实。</text>
</svg>
