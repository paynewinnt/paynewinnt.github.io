<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">AI 调用链 Trace 与 Span 拓扑</title>
  <desc id="desc">展示一次 AI 工作流中 Prompt、检索、模型、工具、Judge 的父子 Span、重试 Span 和异步 Link</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#405c76"/>
    </marker>
    <marker id="linkArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8c6ab1"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#17324d" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 34px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #17324d; }
      .subtitle { font: 400 17px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #516679; }
      .h2 { font: 700 19px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #17324d; }
      .label { font: 600 15px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #243b52; }
      .text { font: 400 14px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #40566b; }
      .small { font: 400 12px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #5b6f81; }
      .mono { font: 600 13px 'SFMono-Regular', Consolas, monospace; fill: #17324d; }
      .white { fill: #ffffff; }
    </style>
  </defs>

  <rect width="1280" height="800" fill="#f7f9fc"/>
  <rect x="0" y="0" width="1280" height="92" fill="#ffffff"/>
  <rect x="0" y="90" width="1280" height="2" fill="#d8e3ec"/>
  <text x="56" y="49" class="title">AI 调用链：一个 Trace 串起 Prompt、检索、模型、工具与 Judge</text>
  <text x="56" y="77" class="subtitle">父子关系表达同步因果，Span Link 表达异步或批处理关联；逻辑调用与物理重试分别建模</text>

  <g filter="url(#shadow)">
    <rect x="56" y="118" width="1168" height="78" rx="8" fill="#eaf3fb" stroke="#719fc5"/>
  </g>
  <text x="80" y="147" class="h2">Root Span：ai.workflow</text>
  <text x="80" y="174" class="mono">trace_id = 4bf92f3577b34da6a3ce929d0e0e4736</text>
  <text x="626" y="147" class="label">业务关联</text>
  <text x="626" y="174" class="text">request_id / session_id / eval_run_id 是独立字段，不替代 trace_id</text>

  <line x1="86" y1="220" x2="1202" y2="220" stroke="#9cafbf" stroke-width="2"/>
  <text x="84" y="214" class="small">0 ms</text>
  <text x="1180" y="214" class="small">端到端结束</text>

  <text x="56" y="263" class="label">Orchestrator</text>
  <line x1="170" y1="258" x2="1202" y2="258" stroke="#d5dee6" stroke-width="1"/>
  <rect x="188" y="239" width="990" height="38" rx="6" fill="#dceafb" stroke="#638fb8"/>
  <text x="207" y="264" class="label">ai.workflow：从接收用户请求到最终结果提交</text>

  <text x="56" y="323" class="label">Prompt</text>
  <line x1="170" y1="318" x2="1202" y2="318" stroke="#d5dee6" stroke-width="1"/>
  <rect x="222" y="299" width="174" height="38" rx="6" fill="#e8f5eb" stroke="#6ca37a"/>
  <text x="309" y="323" text-anchor="middle" class="label">prompt.render</text>

  <text x="56" y="383" class="label">Retrieval</text>
  <line x1="170" y1="378" x2="1202" y2="378" stroke="#d5dee6" stroke-width="1"/>
  <rect x="408" y="359" width="274" height="38" rx="6" fill="#fff3df" stroke="#d3963e"/>
  <text x="545" y="383" text-anchor="middle" class="label">retrieval</text>
  <rect x="433" y="408" width="112" height="34" rx="6" fill="#fff9ef" stroke="#d8aa65"/>
  <rect x="557" y="408" width="100" height="34" rx="6" fill="#fff9ef" stroke="#d8aa65"/>
  <text x="489" y="430" text-anchor="middle" class="small">vector.query</text>
  <text x="607" y="430" text-anchor="middle" class="small">rerank</text>
  <line x1="489" y1="397" x2="489" y2="405" stroke="#405c76" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="607" y1="397" x2="607" y2="405" stroke="#405c76" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="56" y="490" class="label">Model</text>
  <line x1="170" y1="485" x2="1202" y2="485" stroke="#d5dee6" stroke-width="1"/>
  <rect x="696" y="466" width="214" height="38" rx="6" fill="#efeafb" stroke="#8d72b4"/>
  <text x="803" y="490" text-anchor="middle" class="label">model.generate（逻辑）</text>
  <rect x="711" y="515" width="88" height="34" rx="6" fill="#f8f5fc" stroke="#a78fc3"/>
  <rect x="811" y="515" width="84" height="34" rx="6" fill="#fff0f0" stroke="#cb777d"/>
  <text x="755" y="537" text-anchor="middle" class="small">attempt 1</text>
  <text x="853" y="537" text-anchor="middle" class="small">attempt 2</text>
  <line x1="755" y1="504" x2="755" y2="512" stroke="#405c76" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="853" y1="504" x2="853" y2="512" stroke="#405c76" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="901" y="537" class="small">retry：超时</text>

  <text x="56" y="597" class="label">Tool</text>
  <line x1="170" y1="592" x2="1202" y2="592" stroke="#d5dee6" stroke-width="1"/>
  <rect x="922" y="573" width="132" height="38" rx="6" fill="#e9f5f2" stroke="#4d9a86"/>
  <text x="988" y="597" text-anchor="middle" class="label">tool.execute</text>

  <text x="56" y="657" class="label">Judge</text>
  <line x1="170" y1="652" x2="1202" y2="652" stroke="#d5dee6" stroke-width="1"/>
  <rect x="1066" y="633" width="124" height="38" rx="6" fill="#ffecec" stroke="#c86f75"/>
  <text x="1128" y="657" text-anchor="middle" class="label">judge.evaluate</text>

  <line x1="309" y1="277" x2="309" y2="296" stroke="#405c76" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="396" y1="318" x2="408" y2="365" stroke="#405c76" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="682" y1="378" x2="696" y2="472" stroke="#405c76" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="910" y1="485" x2="922" y2="579" stroke="#405c76" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1054" y1="592" x2="1066" y2="639" stroke="#405c76" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M988 611 C990 706, 816 714, 764 552" fill="none" stroke="#8c6ab1" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#linkArrow)"/>
  <text x="824" y="704" class="small">Span Link：异步工具结果关联回后续模型尝试</text>

  <rect x="56" y="726" width="1168" height="48" rx="8" fill="#ffffff" stroke="#d6e1ea"/>
  <line x1="82" y1="750" x2="120" y2="750" stroke="#405c76" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="130" y="755" class="text">Parent / child：直接因果</text>
  <line x1="379" y1="750" x2="417" y2="750" stroke="#8c6ab1" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#linkArrow)"/>
  <text x="427" y="755" class="text">Span Link：异步、队列、批处理</text>
  <rect x="737" y="739" width="54" height="22" rx="5" fill="#fff0f0" stroke="#cb777d"/>
  <text x="803" y="755" class="text">物理 attempt：每次网络请求独立留痕</text>
</svg>
