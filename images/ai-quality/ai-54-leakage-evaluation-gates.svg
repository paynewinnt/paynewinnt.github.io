<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 数据泄漏评测的样本、证据与发布门禁</title>
  <desc id="desc">展示概率样本与事故强制样本的双重身份、检测和人工复核、证据归因，以及零容忍、统计阈值和未知率三类发布门禁。</desc>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .h1{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#111827}
      .sub{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#4b5563}
      .title{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#111827}
      .body{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#374151}
      .small{font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#4b5563}
      .white{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#ffffff}
      .flow{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow2)}
    </style>
  </defs>
  <rect width="1280" height="720" fill="#fafafa"/>
  <rect x="0" y="0" width="1280" height="8" fill="#7c3aed"/>
  <text x="48" y="55" class="h1">泄漏评测门禁：零容忍事实、总体估计和 unknown 必须分开</text>
  <text x="48" y="82" class="sub">事故强制样本用于处置，概率样本用于总体估计；同一运行可以兼具两种身份，但只能按纳入概率进入估计一次。</text>

  <rect x="44" y="118" width="240" height="210" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <rect x="44" y="118" width="240" height="38" rx="8" fill="#1d4ed8"/>
  <text x="61" y="143" class="white">A 预注册样本框</text>
  <text x="61" y="184" class="title">Eligible Population</text>
  <text x="61" y="213" class="body">• 场景、租户、sink、风险层</text>
  <text x="61" y="238" class="body">• 每单位 inclusion probability</text>
  <text x="61" y="263" class="body">• 明确排除项与 unknown</text>
  <text x="61" y="288" class="body">• 构造 canary 授权范围</text>
  <text x="61" y="313" class="small">分母先于结果冻结</text>

  <rect x="324" y="118" width="270" height="210" rx="8" fill="#f5f3ff" stroke="#7c3aed"/>
  <rect x="324" y="118" width="270" height="38" rx="8" fill="#6d28d9"/>
  <text x="341" y="143" class="white">B 双通道选择</text>
  <circle cx="400" cy="220" r="52" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="494" cy="220" r="52" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="357" y="211" class="body">概率抽样</text>
  <text x="368" y="233" class="small">pᵢ &gt; 0</text>
  <text x="466" y="211" class="body">事故强制</text>
  <text x="468" y="233" class="small">forced</text>
  <text x="425" y="220" class="small">双重</text>
  <text x="341" y="300" class="body">forced-only 不进入总体估计；双重身份</text>
  <text x="341" y="320" class="body">按 pᵢ 只计一次，同时进入事故处置。</text>

  <rect x="634" y="118" width="270" height="210" rx="8" fill="#ecfdf5" stroke="#059669"/>
  <rect x="634" y="118" width="270" height="38" rx="8" fill="#047857"/>
  <text x="651" y="143" class="white">C 检测与复核</text>
  <text x="651" y="184" class="title">Detector → Adjudication</text>
  <text x="651" y="213" class="body">• exact canary：已知标记</text>
  <text x="651" y="238" class="body">• DLP：未知敏感形态</text>
  <text x="651" y="263" class="body">• provenance：来源与可见性</text>
  <text x="651" y="288" class="body">• 人工复核：TP / FP / unknown</text>
  <text x="651" y="313" class="small">检测器超时不能记 clean</text>

  <rect x="944" y="118" width="292" height="210" rx="8" fill="#fff7ed" stroke="#ea580c"/>
  <rect x="944" y="118" width="292" height="38" rx="8" fill="#c2410c"/>
  <text x="961" y="143" class="white">D 证据包与首错层</text>
  <text x="961" y="184" class="title">Leakage Evidence Bundle</text>
  <text x="961" y="213" class="body">• case / run / model / prompt 版本</text>
  <text x="961" y="238" class="body">• canary、sink、接收方、tenant</text>
  <text x="961" y="263" class="body">• retrieval / context / cache trace</text>
  <text x="961" y="288" class="body">• 检测结果、复核、影响与时间线</text>
  <text x="961" y="313" class="small">事实与推断分栏</text>

  <path d="M284 223 H316" class="flow"/>
  <path d="M594 223 H626" class="flow"/>
  <path d="M904 223 H936" class="flow"/>

  <text x="48" y="374" class="title">三类门禁读取不同分母，任何一类失败都不能被平均分抵消</text>

  <rect x="44" y="400" width="370" height="188" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <rect x="44" y="400" width="370" height="40" rx="8" fill="#b91c1c"/>
  <text x="62" y="426" class="white">G1 零容忍事实门：观测计数</text>
  <text x="62" y="470" class="title">任一有效命中即阻断</text>
  <text x="62" y="500" class="body">• 不可用假密钥出现在未授权 sink</text>
  <text x="62" y="525" class="body">• 跨租户文档或缓存对象被披露</text>
  <text x="62" y="550" class="body">• 高敏构造 PII 到达未授权接收方</text>
  <text x="62" y="575" class="small">不使用流量加权稀释严重事件</text>

  <rect x="455" y="400" width="370" height="188" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="455" y="400" width="370" height="40" rx="8" fill="#1d4ed8"/>
  <text x="473" y="426" class="white">G2 统计质量门：概率样本分母</text>
  <text x="473" y="470" class="title">估计泄漏率与检测性能</text>
  <text x="473" y="500" class="body">• Σ(yᵢ / pᵢ) / Σ(1 / pᵢ)</text>
  <text x="473" y="525" class="body">• DLP precision / recall 分别报告</text>
  <text x="473" y="550" class="body">• 按 tenant、sink、风险级别切片</text>
  <text x="473" y="575" class="small">未标注与 forced-only 不偷换总体</text>

  <rect x="866" y="400" width="370" height="188" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <rect x="866" y="400" width="370" height="40" rx="8" fill="#b45309"/>
  <text x="884" y="426" class="white">G3 证据完整门：unknown 单独计数</text>
  <text x="884" y="470" class="title">不能判定就不能声称安全</text>
  <text x="884" y="500" class="body">• detector / Judge / trace 缺失率</text>
  <text x="884" y="525" class="body">• canary catalog 覆盖率与新鲜度</text>
  <text x="884" y="550" class="body">• 来源归因覆盖与人工复核积压</text>
  <text x="884" y="575" class="small">unknown 超限时 fail closed</text>

  <path d="M1090 328 V385 H229 V392" class="flow"/>
  <path d="M1090 328 V385 H640 V392" class="flow"/>
  <path d="M1090 328 V392" class="flow"/>

  <rect x="44" y="620" width="1192" height="58" rx="8" fill="#111827"/>
  <text x="64" y="646" style="font:700 15px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#f9fafb">决策记录必须说明：</text>
  <text x="222" y="646" style="font:400 14px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#d1d5db">阻断事实、估计总体、未决证据、适用范围、降级动作和复测条件。</text>
  <text x="64" y="666" style="font:400 12px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#9ca3af">PASS 仅支持已覆盖版本与场景；它不证明没有未知泄漏路径，也不证明训练数据成员关系。</text>
</svg>
