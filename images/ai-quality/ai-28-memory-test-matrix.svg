<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920" role="img" aria-labelledby="title desc">
  <title id="title">AI 对话记忆测试矩阵</title>
  <desc id="desc">从生命周期正确性、污染与隐私、摘要语义、并发与恢复四个象限展示记忆系统的故障注入、关键断言和证据链</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4c6678"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#29475e" flood-opacity="0.11"/>
    </filter>
    <style>
      .title { font: 700 34px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #17354d; }
      .subtitle { font: 400 17px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #52697b; }
      .h2 { font: 700 21px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #17354d; }
      .h3 { font: 700 17px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #23455d; }
      .text { font: 400 15px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #3d596c; }
      .small { font: 400 14px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #5a7182; }
      .mono { font: 600 14px 'SFMono-Regular', Consolas, monospace; fill: #284c64; }
      .white { fill: #ffffff; }
    </style>
  </defs>

  <rect width="1280" height="920" fill="#f7fafc"/>
  <rect width="1280" height="98" fill="#ffffff"/>
  <rect y="96" width="1280" height="2" fill="#d7e3eb"/>
  <text x="52" y="49" class="title">记忆测试矩阵：不只问“是否记住”，还要证明“不会错用和复活”</text>
  <text x="52" y="78" class="subtitle">每个用例保存根证据、时间化真值、禁止集合和四层结果：写入、候选、上下文、模型使用</text>

  <g filter="url(#shadow)">
    <rect x="52" y="126" width="568" height="280" rx="8" fill="#eaf4ff" stroke="#6f9fc6"/>
    <rect x="660" y="126" width="568" height="280" rx="8" fill="#fff0ea" stroke="#ca8170"/>
    <rect x="52" y="438" width="568" height="280" rx="8" fill="#f2eef9" stroke="#917cad"/>
    <rect x="660" y="438" width="568" height="280" rx="8" fill="#eaf7ef" stroke="#6ca17c"/>
  </g>

  <rect x="52" y="126" width="568" height="54" rx="8" fill="#397cab"/>
  <rect x="660" y="126" width="568" height="54" rx="8" fill="#b65f55"/>
  <rect x="52" y="438" width="568" height="54" rx="8" fill="#77619b"/>
  <rect x="660" y="438" width="568" height="54" rx="8" fill="#3e815f"/>
  <text x="336" y="160" text-anchor="middle" class="h2 white">A. 生命周期与当前值正确性</text>
  <text x="944" y="160" text-anchor="middle" class="h2 white">B. 污染、隔离与隐私</text>
  <text x="336" y="472" text-anchor="middle" class="h2 white">C. 摘要语义与错误放大</text>
  <text x="944" y="472" text-anchor="middle" class="h2 white">D. 并发、故障与灾备恢复</text>

  <text x="78" y="211" class="h3">故障注入</text>
  <text x="78" y="241" class="text">临时选择、旧值纠正、TTL 边界</text>
  <text x="78" y="269" class="text">直接按 ID 读取、目的切换、版本竞争</text>
  <text x="78" y="310" class="h3">关键断言</text>
  <text x="78" y="340" class="text">session state 不跨会话；当前事实版本唯一</text>
  <text x="78" y="368" class="text">expired / superseded / deleted 不进入候选</text>
  <rect x="388" y="205" width="202" height="153" rx="7" fill="#ffffff" stroke="#b7d0e2"/>
  <text x="489" y="235" text-anchor="middle" class="mono">write → select</text>
  <text x="489" y="268" text-anchor="middle" class="mono">read → update</text>
  <text x="489" y="301" text-anchor="middle" class="mono">expire → delete</text>
  <text x="489" y="335" text-anchor="middle" class="small">每一步有状态与原因码</text>

  <text x="686" y="211" class="h3">故障注入</text>
  <text x="686" y="241" class="text">跨租户同查询、恶意工具文本、秘密输入</text>
  <text x="686" y="269" class="text">模型回答回灌、撤回同意、缓存串键</text>
  <text x="686" y="310" class="h3">零容忍断言</text>
  <text x="686" y="340" class="text">跨租户候选 = 0；凭据持久化 = 0</text>
  <text x="686" y="368" class="text">删除后复活 = 0；未授权读取 = 0</text>
  <rect x="1000" y="205" width="198" height="153" rx="7" fill="#ffffff" stroke="#e0bdb5"/>
  <text x="1099" y="237" text-anchor="middle" class="h3">硬边界先过滤</text>
  <text x="1099" y="270" text-anchor="middle" class="small">tenant · user</text>
  <text x="1099" y="299" text-anchor="middle" class="small">purpose · consent</text>
  <text x="1099" y="328" text-anchor="middle" class="small">state · sensitivity</text>

  <text x="78" y="523" class="h3">故障注入</text>
  <text x="78" y="553" class="text">否定、主体、时间、数值、未决假设</text>
  <text x="78" y="581" class="text">递归 100 轮、纠正、删除、噪声变形</text>
  <text x="78" y="622" class="h3">关键断言</text>
  <text x="78" y="652" class="text">原子事实保持；派生物不能覆盖根证据</text>
  <text x="78" y="680" class="text">输入版本变化后旧摘要立即 stale</text>
  <rect x="388" y="517" width="202" height="153" rx="7" fill="#ffffff" stroke="#ccc1dd"/>
  <text x="489" y="546" text-anchor="middle" class="mono">subject</text>
  <text x="489" y="575" text-anchor="middle" class="mono">predicate</text>
  <text x="489" y="604" text-anchor="middle" class="mono">object · time</text>
  <text x="489" y="633" text-anchor="middle" class="mono">modality · policy</text>
  <text x="489" y="660" text-anchor="middle" class="small">逐项断言，不只看相似度</text>

  <text x="686" y="523" class="h3">故障注入</text>
  <text x="686" y="553" class="text">索引失败、缓存延迟、事件乱序与重复</text>
  <text x="686" y="581" class="text">更新/摘要竞争、旧快照恢复、节点时钟偏差</text>
  <text x="686" y="622" class="h3">关键断言</text>
  <text x="686" y="652" class="text">版本单调、任务幂等、索引可以重建</text>
  <text x="686" y="680" class="text">恢复先应用墓碑，状态不能倒退</text>
  <rect x="1000" y="517" width="198" height="153" rx="7" fill="#ffffff" stroke="#bdd7c4"/>
  <text x="1099" y="548" text-anchor="middle" class="h3">恢复门禁</text>
  <text x="1099" y="582" text-anchor="middle" class="small">deletion watermark</text>
  <text x="1099" y="612" text-anchor="middle" class="small">≥ snapshot watermark</text>
  <text x="1099" y="645" text-anchor="middle" class="small">再开放在线读取</text>

  <text x="52" y="760" class="h2">一次运行必须留下四层证据</text>
  <rect x="52" y="779" width="1176" height="83" rx="8" fill="#ffffff" stroke="#cfdde6"/>
  <rect x="72" y="797" width="235" height="48" rx="7" fill="#eaf4ff" stroke="#8bb1cf"/>
  <rect x="366" y="797" width="235" height="48" rx="7" fill="#fff4e5" stroke="#d7a761"/>
  <rect x="660" y="797" width="235" height="48" rx="7" fill="#f2eef9" stroke="#aa99c2"/>
  <rect x="954" y="797" width="254" height="48" rx="7" fill="#eaf7ef" stroke="#89b596"/>
  <text x="189" y="827" text-anchor="middle" class="h3">1. 写入与策略结果</text>
  <text x="483" y="827" text-anchor="middle" class="h3">2. 候选与重排结果</text>
  <text x="777" y="827" text-anchor="middle" class="h3">3. 实际上下文 Artifact</text>
  <text x="1081" y="827" text-anchor="middle" class="h3">4. 回答与外部动作事实</text>
  <line x1="307" y1="821" x2="356" y2="821" stroke="#4c6678" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="601" y1="821" x2="650" y2="821" stroke="#4c6678" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="895" y1="821" x2="944" y2="821" stroke="#4c6678" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="52" y="877" width="1176" height="30" rx="7" fill="#17354d"/>
  <text x="640" y="898" text-anchor="middle" class="small white">失败先定位 WRITE、FILTER、RETRIEVAL、CONTEXT、MODEL 或 DELETE 层，再决定修复策略</text>
</svg>
