<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">AI 测试的分层断言栈</title>
  <desc id="desc">从原始输出和运行证据开始，依次经过结构、规则、状态、证据和语义断言，再由策略层输出通过、复核或失败。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #475569; }
      .head { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #0f172a; }
      .body { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #334155; }
      .small { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #475569; }
      .white { fill: #ffffff; }
    </style>
  </defs>

  <rect width="1280" height="800" fill="#f8fafc"/>
  <rect x="34" y="28" width="1212" height="744" rx="14" fill="#ffffff" stroke="#dbe3ee" stroke-width="2"/>

  <text x="70" y="78" class="title">AI 测试的分层断言栈</text>
  <text x="70" y="111" class="subtitle">先用可证明的硬约束拦截，再把不可形式化的质量交给语义评估；任何结论都必须带证据。</text>

  <rect x="70" y="145" width="1140" height="86" rx="10" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/>
  <text x="92" y="178" class="head">输入与证据包</text>
  <text x="92" y="207" class="body">请求、模型输出、工具返回、状态快照、检索片段、时间线、模型与提示词版本</text>

  <line x1="640" y1="231" x2="640" y2="260" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="70" y="270" width="206" height="154" rx="10" fill="#e8f7ef" stroke="#15803d" stroke-width="2"/>
  <text x="90" y="305" class="head">① 结构断言</text>
  <text x="90" y="337" class="body">JSON Schema</text>
  <text x="90" y="365" class="body">类型 / 必填字段</text>
  <text x="90" y="393" class="body">枚举 / 范围</text>

  <rect x="303" y="270" width="206" height="154" rx="10" fill="#e8f7ef" stroke="#15803d" stroke-width="2"/>
  <text x="323" y="305" class="head">② 规则断言</text>
  <text x="323" y="337" class="body">权限与额度</text>
  <text x="323" y="365" class="body">字段间不变量</text>
  <text x="323" y="393" class="body">禁止动作清单</text>

  <rect x="536" y="270" width="206" height="154" rx="10" fill="#e8f7ef" stroke="#15803d" stroke-width="2"/>
  <text x="556" y="305" class="head">③ 状态断言</text>
  <text x="556" y="337" class="body">前置状态</text>
  <text x="556" y="365" class="body">合法状态迁移</text>
  <text x="556" y="393" class="body">幂等与副作用</text>

  <rect x="769" y="270" width="206" height="154" rx="10" fill="#e8f7ef" stroke="#15803d" stroke-width="2"/>
  <text x="789" y="305" class="head">④ 证据断言</text>
  <text x="789" y="337" class="body">引用可解析</text>
  <text x="789" y="365" class="body">结论可追溯</text>
  <text x="789" y="393" class="body">证据互相一致</text>

  <rect x="1002" y="270" width="208" height="154" rx="10" fill="#fff5df" stroke="#d97706" stroke-width="2"/>
  <text x="1022" y="305" class="head">⑤ 语义断言</text>
  <text x="1022" y="337" class="body">Embedding 相似度</text>
  <text x="1022" y="365" class="body">任务分类器</text>
  <text x="1022" y="393" class="body">LLM Judge + Rubric</text>

  <line x1="276" y1="347" x2="298" y2="347" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="509" y1="347" x2="531" y2="347" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="742" y1="347" x2="764" y2="347" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="975" y1="347" x2="997" y2="347" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="70" y="449" width="1140" height="106" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="92" y="484" class="head">策略聚合层：不是简单平均分</text>
  <text x="92" y="516" class="body">硬门禁优先级  &gt;  风险等级  &gt;  分维度语义阈值  &gt;  误报/漏报成本  &gt;  灰区复核预算</text>
  <text x="92" y="542" class="small">输出同时携带：命中规则、分项分数、阈值版本、原始证据、复核原因与可重放标识</text>

  <line x1="640" y1="555" x2="640" y2="586" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="70" y="598" width="350" height="108" rx="10" fill="#e8f7ef" stroke="#15803d" stroke-width="2"/>
  <text x="245" y="638" text-anchor="middle" class="head">PASS 自动通过</text>
  <text x="245" y="672" text-anchor="middle" class="body">硬断言全通过，语义分数越过通过阈值</text>

  <rect x="465" y="598" width="350" height="108" rx="10" fill="#fff5df" stroke="#d97706" stroke-width="2"/>
  <text x="640" y="638" text-anchor="middle" class="head">REVIEW 人工复核</text>
  <text x="640" y="672" text-anchor="middle" class="body">灰区、裁判分歧、证据不足或高风险样本</text>

  <rect x="860" y="598" width="350" height="108" rx="10" fill="#fff0f0" stroke="#dc2626" stroke-width="2"/>
  <text x="1035" y="638" text-anchor="middle" class="head">FAIL 自动失败</text>
  <text x="1035" y="672" text-anchor="middle" class="body">任一关键硬门禁失败，或语义分数低于下限</text>

  <rect x="70" y="729" width="14" height="14" fill="#e8f7ef" stroke="#15803d"/>
  <text x="94" y="742" class="small">确定性硬约束</text>
  <rect x="230" y="729" width="14" height="14" fill="#fff5df" stroke="#d97706"/>
  <text x="254" y="742" class="small">概率性语义判断</text>
  <rect x="426" y="729" width="14" height="14" fill="#f1f5f9" stroke="#64748b"/>
  <text x="450" y="742" class="small">策略与审计</text>
</svg>
