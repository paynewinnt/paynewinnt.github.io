<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840" role="img" aria-labelledby="title desc">
  <title id="title">多 Agent 系统的 Supervisor、Peer、Pipeline 与混合拓扑</title>
  <desc id="desc">对比 Supervisor Worker、Peer Debate、Pipeline 和 Artifact 混合拓扑的信息流、适用任务与主要风险，并展示所有拓扑共享的确定性控制面。</desc>
  <style>
    .bg { fill: #f8fafc; }
    .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
    .sub { font: 400 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
    .panelTitle { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
    .h { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
    .t { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
    .small { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
    .supervisor { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
    .worker { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .peer { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; }
    .pipeline { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .artifact { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
    .risk { fill: #fff1f2; stroke: #e11d48; stroke-width: 1.5; }
    .control { fill: #0f172a; }
    .arrow { stroke: #64748b; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    .bi { stroke: #0891b2; stroke-width: 2.2; fill: none; marker-start: url(#cyanStart); marker-end: url(#cyan); }
    .dashed { stroke: #ea580c; stroke-width: 2.2; fill: none; stroke-dasharray: 7 5; marker-end: url(#orange); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <marker id="cyan" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0891b2"/></marker>
    <marker id="cyanStart" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto"><path d="M9,0 L9,6 L0,3 z" fill="#0891b2"/></marker>
    <marker id="orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ea580c"/></marker>
  </defs>
  <rect class="bg" width="1280" height="840"/>
  <text class="title" x="54" y="56">拓扑不是角色数量，而是任务、状态和证据的流动规则</text>
  <text class="sub" x="54" y="89">选择拓扑时同时考虑可并行性、共享状态、仲裁依据、尾部时延与最终责任。</text>

  <rect class="panel" x="54" y="126" width="560" height="278" rx="8"/>
  <text class="panelTitle" x="80" y="162">1. Supervisor / Worker</text>
  <rect class="supervisor" x="250" y="184" width="168" height="62" rx="8"/>
  <text class="h" x="284" y="214">Supervisor</text>
  <text class="t" x="274" y="235">分解 · 分配 · 合并</text>
  <rect class="worker" x="90" y="286" width="126" height="58" rx="8"/>
  <text class="h" x="118" y="320">Worker A</text>
  <rect class="worker" x="270" y="286" width="126" height="58" rx="8"/>
  <text class="h" x="298" y="320">Worker B</text>
  <rect class="worker" x="450" y="286" width="126" height="58" rx="8"/>
  <text class="h" x="478" y="320">Worker C</text>
  <path class="arrow" d="M292 246 L180 282"/>
  <path class="arrow" d="M334 246 L334 282"/>
  <path class="arrow" d="M376 246 L488 282"/>
  <text class="small" x="80" y="376" fill="#1d4ed8">适合：独立宽度、动态分解、统一聚合</text>
  <text class="small" x="343" y="376" fill="#be123c">风险：单点、遗漏、合并瓶颈</text>

  <rect class="panel" x="638" y="126" width="588" height="278" rx="8"/>
  <text class="panelTitle" x="664" y="162">2. Peer / Debate</text>
  <rect class="peer" x="690" y="208" width="130" height="64" rx="8"/>
  <text class="h" x="725" y="239">Agent A</text>
  <text class="t" x="713" y="260">独立假设</text>
  <rect class="peer" x="868" y="292" width="130" height="64" rx="8"/>
  <text class="h" x="903" y="323">Agent B</text>
  <text class="t" x="891" y="344">反例与批评</text>
  <rect class="peer" x="1046" y="208" width="130" height="64" rx="8"/>
  <text class="h" x="1081" y="239">Agent C</text>
  <text class="t" x="1069" y="260">独立证据</text>
  <path class="bi" d="M820 240 C890 180 976 180 1046 240"/>
  <path class="bi" d="M790 272 C812 314 830 324 868 324"/>
  <path class="bi" d="M998 324 C1036 324 1054 314 1076 272"/>
  <text class="small" x="664" y="376" fill="#0e7490">适合：暴露假设、证据可仲裁的分歧</text>
  <text class="small" x="956" y="376" fill="#be123c">风险：迎合、漂移、相关错误</text>

  <rect class="panel" x="54" y="430" width="560" height="278" rx="8"/>
  <text class="panelTitle" x="80" y="466">3. Pipeline</text>
  <rect class="pipeline" x="82" y="506" width="118" height="68" rx="8"/>
  <text class="h" x="108" y="536">分析</text>
  <text class="t" x="103" y="558">证据清单</text>
  <path class="arrow" d="M200 540 L234 540"/>
  <rect class="pipeline" x="238" y="506" width="118" height="68" rx="8"/>
  <text class="h" x="264" y="536">实现</text>
  <text class="t" x="259" y="558">候选产物</text>
  <path class="arrow" d="M356 540 L390 540"/>
  <rect class="pipeline" x="394" y="506" width="118" height="68" rx="8"/>
  <text class="h" x="420" y="536">验证</text>
  <text class="t" x="415" y="558">测试结果</text>
  <rect class="risk" x="82" y="606" width="430" height="62" rx="8"/>
  <text class="small" x="104" y="632" fill="#be123c">上游错误会传播；每阶段都要验收原始 Artifact</text>
  <text class="t" x="104" y="654">适合严格阶段，不一定获得并行时延收益</text>

  <rect class="panel" x="638" y="430" width="588" height="278" rx="8"/>
  <text class="panelTitle" x="664" y="466">4. Supervisor + Artifact + 有限仲裁</text>
  <rect class="supervisor" x="664" y="506" width="144" height="62" rx="8"/>
  <text class="h" x="688" y="535">Supervisor</text>
  <text class="t" x="688" y="556">只传引用</text>
  <rect class="artifact" x="878" y="494" width="172" height="86" rx="8"/>
  <text class="h" x="907" y="526">Artifact Store</text>
  <text class="t" x="907" y="550">不可变 · 摘要</text>
  <text class="t" x="907" y="570">Claim · 证据血缘</text>
  <rect class="peer" x="1080" y="506" width="120" height="62" rx="8"/>
  <text class="h" x="1099" y="535">Arbiter</text>
  <text class="t" x="1099" y="556">仅处理冲突</text>
  <path class="dashed" d="M808 537 L874 537"/>
  <path class="dashed" d="M1050 537 L1076 537"/>
  <rect class="worker" x="692" y="614" width="110" height="54" rx="8"/>
  <text class="h" x="715" y="646">Worker</text>
  <rect class="worker" x="844" y="614" width="110" height="54" rx="8"/>
  <text class="h" x="867" y="646">Worker</text>
  <rect class="worker" x="996" y="614" width="110" height="54" rx="8"/>
  <text class="h" x="1019" y="646">Worker</text>
  <path class="arrow" d="M747 614 L908 580"/>
  <path class="arrow" d="M899 614 L946 580"/>
  <path class="arrow" d="M1051 614 L1002 580"/>

  <rect class="control" x="54" y="740" width="1172" height="68" rx="8"/>
  <text x="80" y="771" style="font: 700 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #ffffff;">所有拓扑共享的确定性控制面</text>
  <text x="80" y="795" style="font: 400 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #cbd5e1;">任务合同 · 权限 · 深度与预算 · 租约与版本 · 去重 · Artifact 验收 · 冲突策略 · 终态 Oracle</text>
</svg>
