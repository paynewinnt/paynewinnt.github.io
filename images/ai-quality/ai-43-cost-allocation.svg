<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 应用成本事件账本与四级分摊架构</title>
  <desc id="desc">展示模型、缓存、检索、工具、网络、人工和自建资源的使用事件，如何经过带生效时间的价格簿形成不可变成本分录，再按 request、run、task、tenant 四级身份聚合并与账单对账。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#64748b"/></marker>
    <style>
      .bg{fill:#f8fafc}.title{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.sub{font:400 18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}.h{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.t{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#334155}.small{font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.arrow{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="48" y="54">成本不是一个总数，而是一组可回放、可分摊、可对账的事件</text>
  <text class="sub" x="48" y="86">原始用量与定价分离；重试和失败不覆盖；共享成本通过有版本的规则分到业务责任对象。</text>

  <text class="h" x="48" y="134">1. 使用事件</text>
  <rect x="48" y="156" width="220" height="70" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text class="h" x="70" y="185">模型 Token</text><text class="small" x="70" y="210">输入 · 输出 · reasoning</text>
  <rect x="48" y="238" width="220" height="70" rx="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text class="h" x="70" y="267">Cache</text><text class="small" x="70" y="292">write · read · storage</text>
  <rect x="48" y="320" width="220" height="70" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text class="h" x="70" y="349">检索与工具</text><text class="small" x="70" y="374">embed · rerank · DB · call</text>
  <rect x="48" y="402" width="220" height="70" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text class="h" x="70" y="431">平台资源</text><text class="small" x="70" y="456">网络 · GPU · CPU · 存储</text>
  <rect x="48" y="484" width="220" height="70" rx="7" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/>
  <text class="h" x="70" y="513">流程成本</text><text class="small" x="70" y="538">重试 · 失败 · 人工复核</text>

  <path class="arrow" d="M268 355 L322 355"/>
  <text class="h" x="322" y="134">2. 计价与账本</text>
  <rect class="box" x="322" y="156" width="292" height="154" rx="7"/>
  <text class="h" x="346" y="190">版本化价格簿</text>
  <text class="t" x="346" y="222">provider · SKU · region · tier</text>
  <text class="t" x="346" y="250">unit · currency · valid_from/to</text>
  <text class="t" x="346" y="278">list / contract / effective rate</text>
  <rect x="322" y="330" width="292" height="224" rx="7" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text class="h" x="346" y="364">不可变成本分录</text>
  <text class="t" x="346" y="397">event_id + attempt_id 去重</text>
  <text class="t" x="346" y="427">quantity × Decimal unit price</text>
  <text class="t" x="346" y="457">source、估算/实算、失败状态</text>
  <text class="t" x="346" y="487">原分录不改；更正追加冲销</text>
  <text class="t" x="346" y="517">账单到达后回填 effective cost</text>

  <path class="arrow" d="M614 355 L668 355"/>
  <text class="h" x="668" y="134">3. 四级责任身份</text>
  <rect x="668" y="156" width="248" height="84" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text class="h" x="692" y="190">Request</text><text class="small" x="692" y="216">一次物理调用与 attempt</text>
  <rect x="690" y="254" width="226" height="84" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text class="h" x="714" y="288">Run</text><text class="small" x="714" y="314">一次工作流执行图</text>
  <rect x="712" y="352" width="204" height="84" rx="7" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text class="h" x="736" y="386">Task</text><text class="small" x="736" y="412">业务目标与最终结果</text>
  <rect x="734" y="450" width="182" height="84" rx="7" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text class="h" x="758" y="484">Tenant</text><text class="small" x="758" y="510">产品 / 客户 / 成本中心</text>

  <path class="arrow" d="M916 355 L970 355"/>
  <text class="h" x="970" y="134">4. 对账与使用</text>
  <rect class="box" x="970" y="156" width="262" height="112" rx="7"/>
  <text class="h" x="994" y="190">守恒检查</text><text class="t" x="994" y="222">分摊和 = 来源成本</text><text class="t" x="994" y="248">账本和 ≈ 账单和</text>
  <rect class="box" x="970" y="284" width="262" height="112" rx="7"/>
  <text class="h" x="994" y="318">管理视图</text><text class="t" x="994" y="350">showback / chargeback</text><text class="t" x="994" y="376">预算、预测与异常</text>
  <rect class="box" x="970" y="412" width="262" height="122" rx="7"/>
  <text class="h" x="994" y="446">质量联结</text><text class="t" x="994" y="478">任务是否真正验收</text><text class="t" x="994" y="504">失败浪费与人工成本</text>

  <rect x="48" y="594" width="1184" height="82" rx="7" fill="#0f172a"/>
  <text x="72" y="626" style="font:700 18px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#fff">List Cost 用于目录价基线；Effective Cost 反映折扣与承诺摊销；Allocated Cost 绑定责任对象。</text>
  <text x="72" y="656" style="font:600 17px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#bae6fd">三者都不能单独说明业务价值，必须再连接任务验收、质量底线和单位任务分母。</text>
</svg>
