<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Context Engineering Token 预算分配与动态裁剪流程</title>
  <desc id="desc">以一个非产品默认值的示意预算说明，先预留输出和安全余量，再装入固定上下文与动态候选；候选依次经过权限过滤、必选项、冲突消解、去重、效用评分、按预算装箱并输出审计轨迹。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { fill: #172033; font: 700 29px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .subtitle { fill: #526079; font: 400 16px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .h2 { fill: #172033; font: 700 19px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .label { fill: #172033; font: 700 16px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .small { fill: #526079; font: 400 14px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .mono { fill: #24304a; font: 600 15px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .line { stroke: #64748b; stroke-width: 2; fill: none; }
      .panel { fill: #ffffff; stroke: #d9e1ec; stroke-width: 2; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="54" y="54">Token 预算不是“塞满窗口”：先留完成任务所需的空间</text>
  <text class="subtitle" x="54" y="83">下方 32k 仅为算法示意，不代表任何模型上限、默认值或供应商承诺</text>

  <rect class="panel" x="54" y="112" width="1172" height="218" rx="8"/>
  <text class="h2" x="82" y="148">输入可用预算</text>
  <text class="mono" x="82" y="178">B_input = B_window - B_output_reserve - B_safety - B_protocol</text>

  <g transform="translate(82,204)">
    <rect x="0" y="0" width="1116" height="68" rx="7" fill="#eef1f5"/>
    <rect x="0" y="0" width="208" height="68" rx="7" fill="#e7efff" stroke="#7fa4df" stroke-width="2"/>
    <text class="label" x="104" y="29" text-anchor="middle">固定上下文 6k</text>
    <text class="small" x="104" y="51" text-anchor="middle">策略 · Schema · 当前任务</text>
    <rect x="208" y="0" width="626" height="68" fill="#dff4ee" stroke="#77bfa9" stroke-width="2"/>
    <text class="label" x="521" y="29" text-anchor="middle">动态候选 18k</text>
    <text class="small" x="521" y="51" text-anchor="middle">History · Memory · Retrieval · Tool Result · State</text>
    <rect x="834" y="0" width="74" height="68" fill="#fff0d9" stroke="#e8ab55" stroke-width="2"/>
    <text class="label" x="871" y="29" text-anchor="middle">2k</text>
    <text class="small" x="871" y="51" text-anchor="middle">余量</text>
    <rect x="908" y="0" width="208" height="68" rx="7" fill="#f4e9ff" stroke="#aa82d4" stroke-width="2"/>
    <text class="label" x="1012" y="29" text-anchor="middle">输出预留 6k</text>
    <text class="small" x="1012" y="51" text-anchor="middle">完成、工具参数与终态</text>
  </g>
  <text class="small" x="82" y="302">真实预算由模型计数器、任务输出上限、工具协议开销和历史误差共同确定；字符数只能做保守回退估算</text>

  <text class="h2" x="54" y="373">动态装配流水线</text>
  <g transform="translate(54,398)">
    <rect x="0" y="0" width="146" height="94" rx="8" fill="#ffe7e7" stroke="#df8888" stroke-width="2"/>
    <text class="label" x="73" y="30" text-anchor="middle">权限过滤</text>
    <text class="small" x="73" y="56" text-anchor="middle">tenant · ACL</text>
    <text class="small" x="73" y="78" text-anchor="middle">expiry · sensitivity</text>
    <path class="line" d="M156 47 H184" marker-end="url(#arrow)"/>

    <rect x="194" y="0" width="146" height="94" rx="8" fill="#e7efff" stroke="#7fa4df" stroke-width="2"/>
    <text class="label" x="267" y="30" text-anchor="middle">先装必选</text>
    <text class="small" x="267" y="56" text-anchor="middle">安全策略</text>
    <text class="small" x="267" y="78" text-anchor="middle">本轮任务与约束</text>
    <path class="line" d="M350 47 H378" marker-end="url(#arrow)"/>

    <rect x="388" y="0" width="146" height="94" rx="8" fill="#fff0d9" stroke="#e8ab55" stroke-width="2"/>
    <text class="label" x="461" y="30" text-anchor="middle">冲突消解</text>
    <text class="small" x="461" y="56" text-anchor="middle">authority · version</text>
    <text class="small" x="461" y="78" text-anchor="middle">valid time</text>
    <path class="line" d="M544 47 H572" marker-end="url(#arrow)"/>

    <rect x="582" y="0" width="146" height="94" rx="8" fill="#f4e9ff" stroke="#aa82d4" stroke-width="2"/>
    <text class="label" x="655" y="30" text-anchor="middle">去重聚类</text>
    <text class="small" x="655" y="56" text-anchor="middle">digest · semantic key</text>
    <text class="small" x="655" y="78" text-anchor="middle">保留来源集合</text>
    <path class="line" d="M738 47 H766" marker-end="url(#arrow)"/>

    <rect x="776" y="0" width="146" height="94" rx="8" fill="#e4f4ff" stroke="#6daed6" stroke-width="2"/>
    <text class="label" x="849" y="30" text-anchor="middle">效用评分</text>
    <text class="small" x="849" y="56" text-anchor="middle">relevance · trust</text>
    <text class="small" x="849" y="78" text-anchor="middle">recency / token</text>
    <path class="line" d="M932 47 H960" marker-end="url(#arrow)"/>

    <rect x="970" y="0" width="146" height="94" rx="8" fill="#dff4ee" stroke="#77bfa9" stroke-width="2"/>
    <text class="label" x="1043" y="30" text-anchor="middle">按预算装箱</text>
    <text class="small" x="1043" y="56" text-anchor="middle">lane cap · diversity</text>
    <text class="small" x="1043" y="78" text-anchor="middle">position policy</text>
  </g>

  <path class="line" d="M1097 502 V545 H900" marker-end="url(#arrow)"/>
  <rect x="628" y="535" width="262" height="100" rx="8" fill="#24304a"/>
  <text x="759" y="566" text-anchor="middle" fill="#ffffff" font="700 17px Inter, 'PingFang SC', sans-serif">Assembly Trace</text>
  <text x="759" y="593" text-anchor="middle" fill="#dbe5f4" font="400 14px ui-monospace, monospace">item_id · action · reason</text>
  <text x="759" y="616" text-anchor="middle" fill="#dbe5f4" font="400 14px ui-monospace, monospace">tokens · source_version · digest</text>

  <rect x="54" y="535" width="522" height="100" rx="8" fill="#ffffff" stroke="#d9e1ec" stroke-width="2"/>
  <text class="label" x="78" y="565">动态裁剪的停止条件</text>
  <text class="small" x="78" y="591">剩余预算小于候选项成本时，记录 dropped_budget；不能静默截断 JSON、工具结果或证据句。</text>
  <text class="small" x="78" y="616">必选项本身超预算时返回 CONTEXT_OVERFLOW，让上层压缩或缩小任务，不发送残缺上下文。</text>

  <rect x="942" y="535" width="284" height="100" rx="8" fill="#fff0d9" stroke="#e8ab55" stroke-width="2"/>
  <text class="label" x="966" y="565">缓存边界</text>
  <text class="small" x="966" y="591">只缓存版本固定的可信前缀</text>
  <text class="small" x="966" y="616">租户、权限、策略和 Schema 入键</text>

  <rect x="54" y="660" width="1172" height="36" rx="8" fill="#24304a"/>
  <text x="640" y="684" text-anchor="middle" fill="#ffffff" font="600 16px Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif">每次装配都要可重放：相同候选集、策略版本、Tokenizer 与预算，应得到相同选择和相同 Trace</text>
</svg>
