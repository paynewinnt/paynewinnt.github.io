<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">内容安全质量决策矩阵</title>
  <desc id="desc">按期望动作和实际动作区分正确允许、正确安全改写、正确拒答、正确升级、漏拦截、误拒答、路由错误和基础设施无结果，并标出发布硬门。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}.title{font:700 28px sans-serif;fill:#0f172a}.sub{font:400 15px sans-serif;fill:#475569}
      .head{font:700 15px sans-serif;fill:#0f172a}.cell{font:600 13px sans-serif;fill:#0f172a}.note{font:400 12px sans-serif;fill:#334155}
      .line{stroke:#94a3b8;stroke-width:1.5}.flow{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="50" y="50">期望动作 × 实际动作：先判语义，再决定进入哪个分母</text>
  <text class="sub" x="50" y="78">颜色表达工程判定，不代表所有产品共享同一政策；SAFE_REWRITE 还必须通过“无受限内容 + 安全意图保留”后置条件</text>

  <rect x="50" y="118" width="950" height="430" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <rect x="50" y="118" width="950" height="66" rx="6" fill="#e2e8f0"/>
  <text class="head" x="70" y="158">Policy Oracle</text>
  <text class="head" x="252" y="158">ALLOW</text>
  <text class="head" x="420" y="158">SAFE_REWRITE</text>
  <text class="head" x="631" y="158">REFUSE</text>
  <text class="head" x="789" y="158">ESCALATE</text>
  <text class="head" x="896" y="158">NO_RESULT</text>

  <line class="line" x1="220" y1="118" x2="220" y2="548"/><line class="line" x1="380" y1="118" x2="380" y2="548"/>
  <line class="line" x1="590" y1="118" x2="590" y2="548"/><line class="line" x1="750" y1="118" x2="750" y2="548"/>
  <line class="line" x1="880" y1="118" x2="880" y2="548"/>
  <line class="line" x1="50" y1="184" x2="1000" y2="184"/><line class="line" x1="50" y1="275" x2="1000" y2="275"/>
  <line class="line" x1="50" y1="366" x2="1000" y2="366"/><line class="line" x1="50" y1="457" x2="1000" y2="457"/>

  <text class="head" x="70" y="231">应允许</text><text class="note" x="70" y="252">安全且可回答</text>
  <rect x="222" y="186" width="156" height="87" fill="#dcfce7"/><text class="cell" x="244" y="224">正确允许</text><text class="note" x="244" y="246">同时验答案质量</text>
  <rect x="382" y="186" width="206" height="87" fill="#fef3c7"/><text class="cell" x="400" y="224">策略动作不一致</text><text class="note" x="400" y="246">可能损失信息</text>
  <rect x="592" y="186" width="156" height="87" fill="#fee2e2"/><text class="cell" x="617" y="224">误拒答</text><text class="note" x="610" y="246">安全不能靠全拒</text>
  <rect x="752" y="186" width="126" height="87" fill="#ffedd5"/><text class="cell" x="771" y="224">误升级</text><text class="note" x="766" y="246">容量与时延损失</text>
  <rect x="882" y="186" width="116" height="87" fill="#e2e8f0"/><text class="cell" x="898" y="224">基础设施</text><text class="note" x="898" y="246">独立分母</text>

  <text class="head" x="70" y="322">应安全改写</text><text class="note" x="70" y="343">保留安全意图</text>
  <rect x="222" y="277" width="156" height="87" fill="#fee2e2"/><text class="cell" x="244" y="315">可能漏拦截</text><text class="note" x="238" y="337">看最终内容 Oracle</text>
  <rect x="382" y="277" width="206" height="87" fill="#dcfce7"/><text class="cell" x="406" y="315">正确安全改写</text><text class="note" x="396" y="337">安全 + 意图保留</text>
  <rect x="592" y="277" width="156" height="87" fill="#fee2e2"/><text class="cell" x="617" y="315">误拒答</text><text class="note" x="610" y="337">本可安全帮助</text>
  <rect x="752" y="277" width="126" height="87" fill="#ffedd5"/><text class="cell" x="771" y="315">误升级</text><text class="note" x="766" y="337">策略路由错误</text>
  <rect x="882" y="277" width="116" height="87" fill="#e2e8f0"/><text class="cell" x="898" y="315">基础设施</text><text class="note" x="898" y="337">独立分母</text>

  <text class="head" x="70" y="413">应拒答</text><text class="note" x="70" y="434">确定性禁止</text>
  <rect x="222" y="368" width="156" height="87" fill="#fecaca"/><text class="cell" x="254" y="406">漏拦截</text><text class="note" x="240" y="428">高严重度硬门</text>
  <rect x="382" y="368" width="206" height="87" fill="#fecaca"/><text class="cell" x="413" y="406">边界不足</text><text class="note" x="400" y="428">若仍含受限内容</text>
  <rect x="592" y="368" width="156" height="87" fill="#dcfce7"/><text class="cell" x="617" y="406">正确拒答</text><text class="note" x="606" y="428">检查泄漏与一致性</text>
  <rect x="752" y="368" width="126" height="87" fill="#fef3c7"/><text class="cell" x="771" y="406">安全升级</text><text class="note" x="766" y="428">动作不完全一致</text>
  <rect x="882" y="368" width="116" height="87" fill="#e2e8f0"/><text class="cell" x="898" y="406">基础设施</text><text class="note" x="898" y="428">独立分母</text>

  <text class="head" x="70" y="504">应人工升级</text><text class="note" x="70" y="525">证据不足/高风险</text>
  <rect x="222" y="459" width="156" height="87" fill="#fecaca"/><text class="cell" x="245" y="497">绕过升级</text><text class="note" x="238" y="519">自动作出结果</text>
  <rect x="382" y="459" width="206" height="87" fill="#fecaca"/><text class="cell" x="411" y="497">绕过升级</text><text class="note" x="400" y="519">改写不是复核</text>
  <rect x="592" y="459" width="156" height="87" fill="#fef3c7"/><text class="cell" x="617" y="497">保守拒答</text><text class="note" x="606" y="519">安全但路由错误</text>
  <rect x="752" y="459" width="126" height="87" fill="#dcfce7"/><text class="cell" x="771" y="497">正确升级</text><text class="note" x="766" y="519">还需 SLA</text>
  <rect x="882" y="459" width="116" height="87" fill="#e2e8f0"/><text class="cell" x="898" y="497">基础设施</text><text class="note" x="898" y="519">独立分母</text>

  <rect x="1034" y="118" width="196" height="430" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text class="head" x="1054" y="154">发布门禁优先级</text>
  <rect x="1054" y="178" width="156" height="58" rx="4" fill="#fecaca" stroke="#dc2626"/>
  <text class="cell" x="1070" y="204">P0: critical miss</text><text class="note" x="1070" y="224">观察数 + 统计上界</text>
  <rect x="1054" y="254" width="156" height="58" rx="4" fill="#fee2e2" stroke="#ef4444"/>
  <text class="cell" x="1070" y="280">P1: 漏拦截</text><text class="note" x="1070" y="300">按标签与切片</text>
  <rect x="1054" y="330" width="156" height="58" rx="4" fill="#fef3c7" stroke="#d97706"/>
  <text class="cell" x="1070" y="356">P1: 策略不一致</text><text class="note" x="1070" y="376">成对变体与版本</text>
  <rect x="1054" y="406" width="156" height="58" rx="4" fill="#ffedd5" stroke="#ea580c"/>
  <text class="cell" x="1070" y="432">P2: 误拒答/误升级</text><text class="note" x="1070" y="452">可用性独立门</text>
  <rect x="1054" y="482" width="156" height="48" rx="4" fill="#e2e8f0" stroke="#64748b"/>
  <text class="cell" x="1070" y="510">No result 独立门</text>

  <path class="flow" d="M1132 548 V584 H920"/>
  <rect x="50" y="590" width="1180" height="88" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
  <text class="head" x="70" y="622">禁止的汇总方式</text>
  <text class="note" x="218" y="622">把无结果当拒答；用全量准确率掩盖 critical miss；把 REFUSE 视作天然安全；只报平均值而隐藏最差语言、地区、受众或变形切片</text>
  <text class="head" x="70" y="652">最低证据</text>
  <text class="note" x="218" y="652">分子、分母、unknown、策略版本、切片、成对差异、申诉翻转、基础设施状态，以及可回放的 case/attempt trace</text>
</svg>
