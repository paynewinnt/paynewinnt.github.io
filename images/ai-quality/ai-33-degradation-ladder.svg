<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="940" viewBox="0 0 1280 940" role="img" aria-labelledby="title desc">
  <title id="title">AI 功能降级阶梯与质量门槛</title>
  <desc id="desc">展示质量、延迟、配额、成本、安全和供应商六类信号如何经过能力匹配、质量安全门和预算检查，逐级选择完整 Agent、受限工作流、小模型、缓存检索、确定性规则或人工与明确不可用。</desc>
  <style>
    .bg { fill: #f8fafc; }
    .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
    .sub { font: 400 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
    .h { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
    .t { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
    .small { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
    .blue { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.5; }
    .green { fill: #ecfdf5; stroke: #059669; stroke-width: 2.5; }
    .amber { fill: #fffbeb; stroke: #d97706; stroke-width: 2.5; }
    .violet { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2.5; }
    .rose { fill: #fff1f2; stroke: #e11d48; stroke-width: 2.5; }
    .cyan { fill: #ecfeff; stroke: #0891b2; stroke-width: 2.5; }
    .arrow { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
  </style>
  <defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="3.5" orient="auto"><path d="M0,0 L0,7 L10,3.5 z" fill="#64748b"/></marker></defs>
  <rect class="bg" width="1280" height="940"/>
  <text class="title" x="54" y="58">降级先减少能力，再验证结果；不是换一个模型继续假装完整</text>
  <text class="sub" x="54" y="91">每一级都要满足当前请求的最低质量、安全、时限和数据新鲜度，否则继续向下或明确停止。</text>

  <text class="h" x="54" y="142">1. 六类运行信号</text>
  <rect class="blue" x="54" y="166" width="168" height="86" rx="8"/><text class="h" x="94" y="201">质量</text><text class="t" x="76" y="229">事实 · 引用 · 任务</text>
  <rect class="green" x="54" y="270" width="168" height="86" rx="8"/><text class="h" x="94" y="305">延迟</text><text class="t" x="76" y="333">队列 · TTFT · 尾延迟</text>
  <rect class="amber" x="54" y="374" width="168" height="86" rx="8"/><text class="h" x="94" y="409">配额</text><text class="t" x="76" y="437">速率 · 并发 · 容量</text>
  <rect class="violet" x="54" y="478" width="168" height="86" rx="8"/><text class="h" x="94" y="513">成本</text><text class="t" x="76" y="541">Token · 循环 · 预算</text>
  <rect class="rose" x="54" y="582" width="168" height="86" rx="8"/><text class="h" x="94" y="617">安全</text><text class="t" x="76" y="645">越权 · 外发 · 策略</text>
  <rect class="cyan" x="54" y="686" width="168" height="86" rx="8"/><text class="h" x="80" y="721">供应商</text><text class="t" x="76" y="749">连接 · 5xx · 协议</text>

  <path class="arrow" d="M222 470 L300 470"/>
  <text class="h" x="304" y="142">2. 路由控制面</text>
  <rect class="box" x="304" y="166" width="304" height="142" rx="8"/>
  <text class="h" x="330" y="203">请求能力契约</text>
  <text class="t" x="330" y="237">需要哪些数据、工具与输出</text>
  <text class="t" x="330" y="270">最低质量 · 安全 · 新鲜度 · 时限</text>
  <rect class="rose" x="304" y="330" width="304" height="142" rx="8"/>
  <text class="h" x="330" y="367">硬门槛</text>
  <text class="t" x="330" y="401">权限 · 安全 · 业务不变量</text>
  <text class="small" x="330" y="439" fill="#be123c">失败不得靠换模型绕过</text>
  <rect class="amber" x="304" y="494" width="304" height="142" rx="8"/>
  <text class="h" x="330" y="531">共享预算</text>
  <text class="t" x="330" y="565">绝对 deadline · 成本 · 重试次数</text>
  <text class="small" x="330" y="603" fill="#b45309">候选不能各拿一整份 SLO</text>
  <rect class="blue" x="304" y="658" width="304" height="142" rx="8"/>
  <text class="h" x="330" y="695">结果质量门</text>
  <text class="t" x="330" y="729">Schema · 语义 · 引用 · 后置条件</text>
  <text class="small" x="330" y="767" fill="#1d4ed8">200 不是业务成功</text>

  <path class="arrow" d="M608 470 L674 470"/>
  <text class="h" x="678" y="142">3. 逐级保留可信能力</text>
  <rect class="green" x="678" y="166" width="548" height="94" rx="8"/>
  <text class="h" x="704" y="202">L0 · 完整 Agent</text>
  <text class="t" x="934" y="202">规划 · 检索 · 工具 · 校验 · 审批</text>
  <text class="small" x="704" y="236" fill="#047857">关键依赖健康，完整任务契约通过</text>
  <path class="arrow" d="M952 260 L952 282"/>
  <rect class="blue" x="714" y="286" width="512" height="94" rx="8"/>
  <text class="h" x="740" y="322">L1 · 受限 Workflow</text>
  <text class="t" x="970" y="322">固定步骤 · 只读 · 人工确认</text>
  <text class="small" x="740" y="356" fill="#1d4ed8">关闭自由循环、高风险写入与动态工具</text>
  <path class="arrow" d="M970 380 L970 402"/>
  <rect class="violet" x="750" y="406" width="476" height="94" rx="8"/>
  <text class="h" x="776" y="442">L2 · 单模型 / 小模型</text>
  <text class="t" x="1004" y="442">分类 · 抽取 · 改写</text>
  <text class="small" x="776" y="476" fill="#6d28d9">仅开放已评测能力，不继承主模型承诺</text>
  <path class="arrow" d="M988 500 L988 522"/>
  <rect class="cyan" x="786" y="526" width="440" height="94" rx="8"/>
  <text class="h" x="812" y="562">L3 · 缓存 / 检索</text>
  <text class="t" x="1026" y="562">来源 · 权限 · as-of</text>
  <text class="small" x="812" y="596" fill="#0e7490">只返回证据支持且仍在新鲜期的内容</text>
  <path class="arrow" d="M1006 620 L1006 642"/>
  <rect class="amber" x="822" y="646" width="404" height="94" rx="8"/>
  <text class="h" x="848" y="682">L4 · 确定性规则</text>
  <text class="t" x="1048" y="682">公式 · 映射 · 静态入口</text>
  <text class="small" x="848" y="716" fill="#b45309">允许清单覆盖之外明确停止</text>
  <path class="arrow" d="M1024 740 L1024 762"/>
  <rect class="rose" x="858" y="766" width="368" height="94" rx="8"/>
  <text class="h" x="884" y="802">L5 · 人工 / 明确不可用</text>
  <text class="t" x="884" y="836">保留证据，不编造完整结果</text>

  <rect x="54" y="852" width="740" height="58" rx="8" fill="#0f172a"/>
  <text x="80" y="888" style="font: 700 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #ffffff;">任何实质降级都输出 level、reason、omitted_capabilities 和 data_as_of</text>
</svg>
