<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 工具调用能力授权与逐阶段执行流</title>
  <desc id="desc">将意图、策略授权、能力签发、执行器启动、目标接受、业务提交和结果观察拆成独立状态，并展示参数摘要绑定、过期、逐次授权和人工审批门。</desc>
  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/></marker>
    <style>
      .h1{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#0f172a}
      .sub{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#475569}
      .title{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#0f172a}
      .body{font:400 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#334155}
      .small{font:600 11px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#475569}
      .white{font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#fff}
      .flow{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow3)}
      .deny{stroke:#dc2626;stroke-width:2;stroke-dasharray:6 5;fill:none;marker-end:url(#arrowRed)}
    </style>
  </defs>
  <rect width="1280" height="720" fill="#f8fafc"/>
  <rect x="0" y="0" width="1280" height="8" fill="#0369a1"/>
  <text x="48" y="55" class="h1">工具调用状态机：模型提出意图，不持有隐式执行权</text>
  <text x="48" y="82" class="sub">授权绑定主体、资源、动作、条件和规范化参数摘要；能力必须短时、逐次、可撤销，并在执行边界再次验证。</text>

  <rect x="40" y="120" width="150" height="126" rx="8" fill="#eef2ff" stroke="#4f46e5"/>
  <rect x="40" y="120" width="150" height="32" rx="8" fill="#4338ca"/>
  <text x="54" y="142" class="white">1 intent</text>
  <text x="54" y="181" class="title">结构化意图</text>
  <text x="54" y="207" class="body">subject / tenant</text>
  <text x="54" y="228" class="body">resource / action</text>

  <rect x="218" y="120" width="160" height="126" rx="8" fill="#ecfeff" stroke="#0891b2"/>
  <rect x="218" y="120" width="160" height="32" rx="8" fill="#0e7490"/>
  <text x="232" y="142" class="white">2 authorization</text>
  <text x="232" y="181" class="title">策略决策点</text>
  <text x="232" y="207" class="body">属性、关系、条件</text>
  <text x="232" y="228" class="body">高风险需人工审批</text>

  <rect x="406" y="120" width="160" height="126" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <rect x="406" y="120" width="160" height="32" rx="8" fill="#15803d"/>
  <text x="420" y="142" class="white">3 capability</text>
  <text x="420" y="181" class="title">短时逐次能力</text>
  <text x="420" y="207" class="body">params_digest / exp</text>
  <text x="420" y="228" class="body">jti / max_uses = 1</text>

  <rect x="594" y="120" width="160" height="126" rx="8" fill="#fff7ed" stroke="#ea580c"/>
  <rect x="594" y="120" width="160" height="32" rx="8" fill="#c2410c"/>
  <text x="608" y="142" class="white">4 executor_started</text>
  <text x="608" y="181" class="title">执行边界复验</text>
  <text x="608" y="207" class="body">身份、摘要、过期</text>
  <text x="608" y="228" class="body">沙箱与出口策略</text>

  <rect x="782" y="120" width="150" height="126" rx="8" fill="#fdf2f8" stroke="#db2777"/>
  <rect x="782" y="120" width="150" height="32" rx="8" fill="#be185d"/>
  <text x="796" y="142" class="white">5 target_accepted</text>
  <text x="796" y="181" class="title">目标接收</text>
  <text x="796" y="207" class="body">协议与业务预检</text>
  <text x="796" y="228" class="body">尚未等于提交</text>

  <rect x="960" y="120" width="150" height="126" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <rect x="960" y="120" width="150" height="32" rx="8" fill="#b91c1c"/>
  <text x="974" y="142" class="white">6 committed</text>
  <text x="974" y="181" class="title">业务提交</text>
  <text x="974" y="207" class="body">幂等键与回执</text>
  <text x="974" y="228" class="body">不可假定可回滚</text>

  <rect x="1138" y="120" width="102" height="126" rx="8" fill="#f5f3ff" stroke="#7c3aed"/>
  <rect x="1138" y="120" width="102" height="32" rx="8" fill="#6d28d9"/>
  <text x="1150" y="142" class="white">7 observed</text>
  <text x="1150" y="181" class="title">观察</text>
  <text x="1150" y="207" class="body">读回状态</text>
  <text x="1150" y="228" class="body">独立证据</text>

  <path d="M190 183 H210" class="flow"/><path d="M378 183 H398" class="flow"/><path d="M566 183 H586" class="flow"/><path d="M754 183 H774" class="flow"/><path d="M932 183 H952" class="flow"/><path d="M1110 183 H1130" class="flow"/>

  <rect x="40" y="291" width="370" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="58" y="322" class="title">授权元组不是一个 scope 字符串</text>
  <text x="58" y="352" class="body">subject × tenant × resource × action × conditions</text>
  <text x="58" y="376" class="body">× canonical(params) × purpose × approval × expiry</text>
  <text x="58" y="407" class="small">任一维度变化，旧能力都不能被静默复用。</text>
  <text x="58" y="428" class="small">默认拒绝；策略不可用、时间未知、摘要失败均拒绝。</text>

  <rect x="455" y="291" width="370" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="473" y="322" class="title">执行器是第二个策略执行点</text>
  <text x="473" y="352" class="body">先校验能力，再启动沙箱；先绑定出口，再解析响应。</text>
  <text x="473" y="376" class="body">模型文本不能改写主机、方法、资源或幂等键。</text>
  <text x="473" y="407" class="small">“授权服务已检查”不能替代执行边界的本地验证。</text>
  <text x="473" y="428" class="small">拒绝事件本身必须可观察，不能被重试层吞掉。</text>

  <rect x="870" y="291" width="370" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="888" y="322" class="title">提交和观察之间存在不确定窗口</text>
  <text x="888" y="352" class="body">超时可能发生在提交前，也可能发生在提交后回包前。</text>
  <text x="888" y="376" class="body">只能用幂等键、目标查询与账本证据消解不确定性。</text>
  <text x="888" y="407" class="small">补偿是新的受权动作，不是把外部世界倒带。</text>
  <text x="888" y="428" class="small">observed=false 时，不能声称“未执行”或“已完成”。</text>

  <path d="M298 246 V282" class="flow"/><path d="M674 246 V282" class="flow"/><path d="M1035 246 V282" class="flow"/>

  <rect x="40" y="486" width="1200" height="164" rx="8" fill="#0f172a"/>
  <text x="60" y="517" style="font:700 18px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#f8fafc">任何拒绝都必须发生在副作用之前，任何提交都必须保留完整阶段证据</text>
  <rect x="60" y="540" width="205" height="76" rx="6" fill="#7f1d1d"/>
  <text x="76" y="566" class="white">Deny 1：意图非法</text><text x="76" y="590" style="font:400 12px sans-serif;fill:#fee2e2">未知动作、越租户资源</text>
  <rect x="294" y="540" width="205" height="76" rx="6" fill="#9a3412"/>
  <text x="310" y="566" class="white">Deny 2：授权不足</text><text x="310" y="590" style="font:400 12px sans-serif;fill:#ffedd5">条件失败、审批缺失</text>
  <rect x="528" y="540" width="205" height="76" rx="6" fill="#854d0e"/>
  <text x="544" y="566" class="white">Deny 3：能力失效</text><text x="544" y="590" style="font:400 12px sans-serif;fill:#fef3c7">过期、重放、摘要不符</text>
  <rect x="762" y="540" width="205" height="76" rx="6" fill="#164e63"/>
  <text x="778" y="566" class="white">Deny 4：沙箱越界</text><text x="778" y="590" style="font:400 12px sans-serif;fill:#cffafe">出口、文件、资源超限</text>
  <rect x="996" y="540" width="220" height="76" rx="6" fill="#4c1d95"/>
  <text x="1012" y="566" class="white">Unknown：提交状态不明</text><text x="1012" y="590" style="font:400 12px sans-serif;fill:#ede9fe">查询、对账、人工接管</text>
  <path d="M162 540 V463 H674 V449" class="deny"/>
  <path d="M396 540 V465 H298 V449" class="deny"/>
  <path d="M630 540 V459" class="deny"/>
  <path d="M864 540 V459" class="deny"/>
  <path d="M1106 540 V459" class="deny"/>
  <text x="60" y="638" style="font:400 12px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#94a3b8">阶段字段是事实，不是成熟度标签：target_accepted=true 不能推导 business_committed=true；business_committed=true 也不能推导 observed=true。</text>
</svg>
