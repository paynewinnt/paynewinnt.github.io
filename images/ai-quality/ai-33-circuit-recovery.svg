<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="940" viewBox="0 0 1280 940" role="img" aria-labelledby="title desc">
  <title id="title">AI 调用熔断、隔舱与恢复回切</title>
  <desc id="desc">展示 Closed、Open、Half-Open 熔断状态，按供应商和工作负载隔离资源，经过合成探测、冷启动预热、影子流量和分阶段灰度后恢复，并在质量或安全失败时退回稳定降级层。</desc>
  <style>
    .bg { fill: #f8fafc; }
    .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
    .sub { font: 400 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
    .h { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
    .t { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
    .small { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
    .closed { fill: #ecfdf5; stroke: #059669; stroke-width: 3; }
    .open { fill: #fff1f2; stroke: #e11d48; stroke-width: 3; }
    .half { fill: #fffbeb; stroke: #d97706; stroke-width: 3; }
    .blue { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.5; }
    .violet { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2.5; }
    .cyan { fill: #ecfeff; stroke: #0891b2; stroke-width: 2.5; }
    .arrow { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
    .rollback { fill: none; stroke: #e11d48; stroke-width: 3; stroke-dasharray: 9 7; marker-end: url(#red); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="3.5" orient="auto"><path d="M0,0 L0,7 L10,3.5 z" fill="#64748b"/></marker>
    <marker id="red" markerWidth="11" markerHeight="11" refX="10" refY="3.5" orient="auto"><path d="M0,0 L0,7 L10,3.5 z" fill="#e11d48"/></marker>
  </defs>
  <rect class="bg" width="1280" height="940"/>
  <text class="title" x="54" y="58">熔断负责停止无效调用，恢复负责证明完整能力真的回来</text>
  <text class="sub" x="54" y="91">隔舱限制故障扩散；Half-Open 只放有限探测；回切经过预热、影子和灰度，不直接恢复全量。</text>

  <text class="h" x="54" y="142">1. 熔断状态机</text>
  <rect class="closed" x="54" y="174" width="260" height="154" rx="8"/>
  <text class="h" x="127" y="214">CLOSED</text>
  <text class="t" x="82" y="250">允许调用并记录滑动窗口</text>
  <text class="t" x="82" y="280">质量、延迟与错误分别统计</text>
  <text class="small" x="82" y="307" fill="#047857">偶发失败不永久累加</text>

  <path class="arrow" d="M314 232 L422 232"/>
  <text class="small" x="326" y="213" fill="#475569">达到样本与失败阈值</text>
  <rect class="open" x="426" y="174" width="260" height="154" rx="8"/>
  <text class="h" x="517" y="214">OPEN</text>
  <text class="t" x="454" y="250">快速失败或进入验证过的阶梯</text>
  <text class="t" x="454" y="280">保护连接、并发、成本与依赖</text>
  <text class="small" x="454" y="307" fill="#be123c">不能返回任意默认答案</text>

  <path class="arrow" d="M686 232 L794 232"/>
  <text class="small" x="710" y="213" fill="#475569">恢复窗口到达</text>
  <rect class="half" x="798" y="174" width="260" height="154" rx="8"/>
  <text class="h" x="861" y="214">HALF-OPEN</text>
  <text class="t" x="826" y="250">有限探测，不接全量洪峰</text>
  <text class="t" x="826" y="280">验证质量、安全、Schema、延迟</text>
  <text class="small" x="826" y="307" fill="#b45309">独立探测隔舱</text>

  <path class="arrow" d="M928 174 C928 116 184 116 184 170"/>
  <text class="small" x="504" y="121" fill="#047857">连续多个窗口通过恢复条件</text>
  <path class="rollback" d="M928 328 C928 382 556 382 556 332"/>
  <text class="small" x="650" y="372" fill="#be123c">任一关键探测失败重新 Open</text>

  <text class="h" x="1090" y="142">状态事件</text>
  <rect class="box" x="1090" y="174" width="136" height="154" rx="8"/>
  <text class="t" x="1110" y="208">熔断键</text><text class="t" x="1110" y="237">原因与窗口</text><text class="t" x="1110" y="266">样本量</text><text class="t" x="1110" y="295">下次探测</text>

  <text class="h" x="54" y="430">2. Bulkhead 隔离故障资源</text>
  <rect class="blue" x="54" y="456" width="268" height="122" rx="8"/>
  <text class="h" x="80" y="494">在线主路径</text><text class="t" x="80" y="527">独立并发 · 连接池 · 队列</text><text class="small" x="80" y="555" fill="#1d4ed8">保护核心用户请求</text>
  <rect class="violet" x="344" y="456" width="268" height="122" rx="8"/>
  <text class="h" x="370" y="494">备用与降级路径</text><text class="t" x="370" y="527">容量上限 · 负载丢弃</text><text class="small" x="370" y="555" fill="#6d28d9">防止切换后二次雪崩</text>
  <rect class="cyan" x="634" y="456" width="268" height="122" rx="8"/>
  <text class="h" x="660" y="494">探测与预热</text><text class="t" x="660" y="527">全局租约 · 有限并发</text><text class="small" x="660" y="555" fill="#0e7490">不让用户承担冷启动</text>
  <rect class="open" x="924" y="456" width="302" height="122" rx="8"/>
  <text class="h" x="950" y="494">批量与低优先级</text><text class="t" x="950" y="527">可暂停 · 可延期 · 独立预算</text><text class="small" x="950" y="555" fill="#be123c">不争抢在线最后资源</text>

  <text class="h" x="54" y="638">3. 恢复回切是一条受控发布链</text>
  <rect class="box" x="54" y="666" width="190" height="112" rx="8"/>
  <text class="h" x="78" y="704">合成探测</text><text class="t" x="78" y="737">代表性能力断言</text><text class="small" x="78" y="763" fill="#475569">无用户结果</text>
  <path class="arrow" d="M244 722 L276 722"/>
  <rect class="cyan" x="280" y="666" width="190" height="112" rx="8"/>
  <text class="h" x="304" y="704">冷启动预热</text><text class="t" x="304" y="737">连接 · 容器 · 缓存</text><text class="small" x="304" y="763" fill="#0e7490">受控成本</text>
  <path class="arrow" d="M470 722 L502 722"/>
  <rect class="violet" x="506" y="666" width="190" height="112" rx="8"/>
  <text class="h" x="530" y="704">影子比较</text><text class="t" x="530" y="737">真实输入，不交付</text><text class="small" x="530" y="763" fill="#6d28d9">比较质量与协议</text>
  <path class="arrow" d="M696 722 L728 722"/>
  <rect class="blue" x="732" y="666" width="190" height="112" rx="8"/>
  <text class="h" x="756" y="704">分阶段灰度</text><text class="t" x="756" y="737">1% · 5% · 25% · 50%</text><text class="small" x="756" y="763" fill="#1d4ed8">按故障域推进</text>
  <path class="arrow" d="M922 722 L954 722"/>
  <rect class="closed" x="958" y="666" width="268" height="112" rx="8"/>
  <text class="h" x="982" y="704">恢复全量</text><text class="t" x="982" y="737">保留备用容量与回滚开关</text><text class="small" x="982" y="763" fill="#047857">稳定窗口后关闭事故</text>

  <path class="rollback" d="M1092 778 C1092 836 600 836 600 782"/>
  <text class="small" x="733" y="829" fill="#be123c">质量、安全或延迟退化：自动回到最近稳定层</text>
  <rect x="54" y="858" width="1172" height="50" rx="8" fill="#0f172a"/>
  <text x="80" y="890" style="font: 700 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #ffffff;">关闭条件应比打开条件更严格：使用迟滞、最短停留和连续窗口，避免 Open 与 Closed 反复振荡。</text>
</svg>
