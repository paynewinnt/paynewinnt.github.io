<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">ANN 与元数据过滤执行矩阵</title>
  <desc id="desc">按过滤选择率和候选搜索范围展示精确预过滤、分区或局部索引、近似后过滤与迭代扫描的适用区间、主要风险和验证证据，并强调租户隔离是授权边界而非召回调参。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#64748b"/></marker>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.green{fill:#ecfdf5;stroke:#059669;stroke-width:2}.amber{fill:#fffbeb;stroke:#d97706;stroke-width:2}.rose{fill:#fff1f2;stroke:#e11d48;stroke-width:2}.violet{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.arrow{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}
      .title{font:700 29px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.sub{font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}.h{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.t{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#334155}.small{font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}.label{font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#fff}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="48" y="50">过滤不是向量检索末尾的一条 WHERE：执行顺序会改变召回与隔离风险</text>
  <text class="sub" x="48" y="80">选择率 s = 合法候选数 / 全库数。s 越低，固定 ANN 扫描预算在后过滤后越容易凑不满 k；真实阈值必须由本库实验确定。</text>

  <rect class="panel" x="48" y="116" width="820" height="442" rx="8"/>
  <text class="h" x="74" y="151">执行策略矩阵</text>
  <text class="small" x="318" y="151">过滤选择率较低 ←</text><text class="small" x="694" y="151">→ 过滤选择率较高</text>
  <text class="small" transform="translate(78 450) rotate(-90)">扫描范围从受限子集到共享全库</text>

  <rect class="green" x="116" y="178" width="346" height="150" rx="8"/>
  <text class="h" x="138" y="211">A · 先过滤，再精确排序</text>
  <text class="t" x="138" y="240">适合：合法子集小、硬隔离、强一致删除</text>
  <text class="t" x="138" y="266">代价：子集变大时距离计算线性增长</text>
  <text class="small" x="138" y="298">证据：eligible_count · exact_top_k · p95</text>

  <rect class="blue" x="486" y="178" width="346" height="150" rx="8"/>
  <text class="h" x="508" y="211">B · 分区或局部 ANN 索引</text>
  <text class="t" x="508" y="240">适合：租户或类别稳定、路由可判定</text>
  <text class="t" x="508" y="266">代价：小分区质量、索引数量与运维成本</text>
  <text class="small" x="508" y="298">证据：partition_id · build_id · recall</text>

  <rect class="rose" x="116" y="352" width="346" height="150" rx="8"/>
  <text class="h" x="138" y="385">C · 固定候选后过滤</text>
  <text class="t" x="138" y="414">风险：低选择率时结果不足、相关项被挤出</text>
  <text class="t" x="138" y="440">禁区：把 tenant_id 仅当普通后过滤条件</text>
  <text class="small" x="138" y="472">证据：raw_k · rejected · returned_k</text>

  <rect class="amber" x="486" y="352" width="346" height="150" rx="8"/>
  <text class="h" x="508" y="385">D · 迭代扫描或动态超额召回</text>
  <text class="t" x="508" y="414">适合：共享索引、选择率波动、允许补扫</text>
  <text class="t" x="508" y="440">代价：尾延迟与扫描量必须设置硬预算</text>
  <text class="small" x="508" y="472">证据：rounds · visited · stop_reason</text>

  <rect class="violet" x="900" y="116" width="332" height="442" rx="8"/>
  <text class="h" x="924" y="151">决策顺序</text>
  <rect x="924" y="176" width="284" height="68" rx="7" fill="#fff"/>
  <text class="h" x="944" y="204">1 · 先做授权裁剪</text><text class="t" x="944" y="228">租户与 ACL 决定可搜索宇宙</text>
  <path class="arrow" d="M1066 244 V267"/>
  <rect x="924" y="270" width="284" height="68" rx="7" fill="#fff"/>
  <text class="h" x="944" y="298">2 · 测量选择率分布</text><text class="t" x="944" y="322">按查询切片看 p50 / p95 / 极端值</text>
  <path class="arrow" d="M1066 338 V361"/>
  <rect x="924" y="364" width="284" height="68" rx="7" fill="#fff"/>
  <text class="h" x="944" y="392">3 · 与 Flat 对照</text><text class="t" x="944" y="416">同一合法集合、同一距离、同一 k</text>
  <path class="arrow" d="M1066 432 V455"/>
  <rect x="924" y="458" width="284" height="68" rx="7" fill="#fff"/>
  <text class="h" x="944" y="486">4 · 设停止与失败语义</text><text class="t" x="944" y="510">不足 k、超时、预算耗尽显式返回</text>

  <rect x="48" y="588" width="1184" height="82" rx="8" fill="#0f172a"/>
  <text class="label" x="72" y="619">硬门禁</text><text class="label" x="166" y="619">跨租户结果 = 0</text>
  <text class="label" x="380" y="619">删除可见窗口达标</text><text class="label" x="606" y="619">不足 k 有原因码</text>
  <text class="label" x="810" y="619">ANN recall@k 对 Flat</text><text class="label" x="1050" y="619">p95 扫描预算</text>
  <text class="sub" x="72" y="650" style="fill:#cbd5e1">相似度分数、索引命中和 SQL 成功都不能证明业务正确；它们只说明各自层面的计算或执行结果。</text>
</svg>
