<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 编码助手从任务合同到发布证据的评测闭环</title>
  <desc id="desc">流程从任务合同和不可变仓库快照开始，经补丁生成、隔离执行、分层正确性、安全与依赖扫描、可维护性检查、人工评审和联合门禁，最后把线上缺陷与返工证据回灌任务集。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0 L0 6 L9 3 Z" fill="#334e5c"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#172a33" flood-opacity="0.13"/>
    </filter>
    <style>
      .bg{fill:#f5f7f8}.title{font:700 30px Arial,"PingFang SC",sans-serif;fill:#17272f}.sub{font:15px Arial,"PingFang SC",sans-serif;fill:#53656e}.h{font:700 17px Arial,"PingFang SC",sans-serif;fill:#1c2e37}.t{font:14px Arial,"PingFang SC",sans-serif;fill:#34464f}.tiny{font:13px Arial,"PingFang SC",sans-serif;fill:#586a73}.box{stroke-width:2;filter:url(#shadow)}.flow{fill:none;stroke:#334e5c;stroke-width:3;marker-end:url(#arrow)}.feedback{fill:none;stroke:#c84e5b;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="48" y="50">AI 编码助手评测：补丁必须回到同一份合同与仓库事实</text>
  <text class="sub" x="48" y="79">测试通过只是观测证据之一；正确性、安全性、可维护性、评审返工与开发收益需要分别度量</text>

  <g aria-label="评测主流程">
    <rect class="box" x="42" y="126" width="176" height="170" rx="8" fill="#e6f3f1" stroke="#17857c"/>
    <text class="h" x="62" y="160">1. 冻结评测输入</text>
    <text class="t" x="62" y="192">任务合同 / 风险不变量</text>
    <text class="t" x="62" y="218">base commit / tree 摘要</text>
    <text class="t" x="62" y="244">工具链 / 依赖锁 / 测试集</text>
    <text class="tiny" x="62" y="272">缺失即 UNKNOWN</text>

    <rect class="box" x="246" y="126" width="176" height="170" rx="8" fill="#fff3d8" stroke="#d18d16"/>
    <text class="h" x="266" y="160">2. 生成候选补丁</text>
    <text class="t" x="266" y="192">补丁摘要 / 触碰路径</text>
    <text class="t" x="266" y="218">依赖变化 / 生成参数</text>
    <text class="t" x="266" y="244">尝试与失败完整留痕</text>
    <text class="tiny" x="266" y="272">模型输出不直接执行</text>

    <rect class="box" x="450" y="126" width="176" height="170" rx="8" fill="#e8eef7" stroke="#4a6f9d"/>
    <text class="h" x="470" y="160">3. 隔离验证</text>
    <text class="t" x="470" y="192">构建 / 单元 / 集成</text>
    <text class="t" x="470" y="218">回归 / 负向 / 隐藏测试</text>
    <text class="t" x="470" y="244">无网络、最小权限、超时</text>
    <text class="tiny" x="470" y="272">结果绑定补丁摘要</text>

    <rect class="box" x="654" y="126" width="176" height="170" rx="8" fill="#fde7e9" stroke="#c84e5b"/>
    <text class="h" x="674" y="160">4. 风险与维护检查</text>
    <text class="t" x="674" y="192">秘密 / 危险调用 / 依赖</text>
    <text class="t" x="674" y="218">复杂度 / API / 变更范围</text>
    <text class="t" x="674" y="244">可测试性 / 可回滚性</text>
    <text class="tiny" x="674" y="272">硬门不被总分平均</text>

    <rect class="box" x="858" y="126" width="176" height="170" rx="8" fill="#f0eaf5" stroke="#775693"/>
    <text class="h" x="878" y="160">5. 人工评审</text>
    <text class="t" x="878" y="192">需求语义 / 架构一致性</text>
    <text class="t" x="878" y="218">阻塞意见 / 评审轮次</text>
    <text class="t" x="878" y="244">返工分钟 / 残余风险</text>
    <text class="tiny" x="878" y="272">身份来自可信目录</text>

    <rect class="box" x="1062" y="126" width="176" height="170" rx="8" fill="#e9f3df" stroke="#628b41"/>
    <text class="h" x="1082" y="160">6. 联合门禁</text>
    <text class="t" x="1082" y="192">正确性分层均满足</text>
    <text class="t" x="1082" y="218">安全硬门 + 维护预算</text>
    <text class="t" x="1082" y="244">证据完整且可重放</text>
    <text class="tiny" x="1082" y="272">PASS / DENY / UNKNOWN</text>

    <path class="flow" d="M218 210 H238"/><path class="flow" d="M422 210 H442"/>
    <path class="flow" d="M626 210 H646"/><path class="flow" d="M830 210 H850"/>
    <path class="flow" d="M1034 210 H1054"/>
  </g>

  <g aria-label="证据与反馈控制">
    <rect x="42" y="352" width="1196" height="208" rx="8" fill="#fff" stroke="#c3cfd5" stroke-width="2"/>
    <text class="h" x="66" y="386">贯穿所有阶段的证据键</text>
    <rect x="66" y="412" width="266" height="112" rx="6" fill="#eef7f5" stroke="#17857c"/>
    <text class="h" x="84" y="444">身份与版本</text>
    <text class="t" x="84" y="472">contract digest + base commit</text>
    <text class="t" x="84" y="497">tree / patch / runner image digest</text>

    <rect x="360" y="412" width="266" height="112" rx="6" fill="#fff7e5" stroke="#d18d16"/>
    <text class="h" x="378" y="444">分母与未知</text>
    <text class="t" x="378" y="472">应执行测试、风险路径、评审项</text>
    <text class="t" x="378" y="497">未运行、超时、缺失单独计数</text>

    <rect x="654" y="412" width="266" height="112" rx="6" fill="#f5eef7" stroke="#775693"/>
    <text class="h" x="672" y="444">可信签发者</text>
    <text class="t" x="672" y="472">runner / scanner / reviewer 分权</text>
    <text class="t" x="672" y="497">签名、时效、撤销与防重放</text>

    <rect x="948" y="412" width="266" height="112" rx="6" fill="#edf2f8" stroke="#4a6f9d"/>
    <text class="h" x="966" y="444">生产学习</text>
    <text class="t" x="966" y="472">逃逸缺陷、回滚、评审返工</text>
    <text class="t" x="966" y="497">最小复现进入 held-out 任务集</text>
  </g>

  <path class="feedback" d="M1150 305 C1150 650 146 650 146 305"/>
  <text class="tiny" x="370" y="620">只有同一任务、同一快照、同一证据口径下的失败，才适合进入下一轮评测与实验</text>
  <text class="tiny" x="414" y="683">构造架构：生产执行仍需操作系统或虚拟化级隔离与独立信任根</text>
</svg>
