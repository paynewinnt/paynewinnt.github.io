<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">缺陷聚类与根因分析决策流</title>
  <desc id="desc">展示从签名事件规范化、重复判定、聚类真值评测、稳定性检查、证据图构建、候选假设与反证，到人工确认和发布门禁的完整流程，并区分失败和未知出口。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#344f5e"/></marker>
    <marker id="stopArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#c94f5d"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1b2c35" flood-opacity="0.14"/></filter>
    <style>
      .bg{fill:#f5f7f8}.title{font:700 30px Arial,"PingFang SC",sans-serif;fill:#17262f}.sub{font:15px Arial,"PingFang SC",sans-serif;fill:#53646d}.h{font:700 16px Arial,"PingFang SC",sans-serif;fill:#1d2d35}.t{font:12px Arial,"PingFang SC",sans-serif;fill:#34454e}.tiny{font:12px Arial,"PingFang SC",sans-serif;fill:#596a73}.stage{stroke-width:2;filter:url(#shadow)}.flow{fill:none;stroke:#344f5e;stroke-width:2.7;marker-end:url(#arrow)}.stop{fill:none;stroke:#c94f5d;stroke-width:2.5;stroke-dasharray:7 6;marker-end:url(#stopArrow)}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="50" y="52">缺陷聚类 → 候选根因 → 人工决策 → 回流</text>
  <text class="sub" x="50" y="80">相似、重复与同根因使用不同标签和分母；任何证据缺失都进入 UNKNOWN，不用默认值补成绿色</text>

  <g aria-label="主决策流">
    <rect class="stage" x="42" y="132" width="150" height="144" rx="8" fill="#e5f3f2" stroke="#19877f"/>
    <text class="h" x="60" y="164">1. 事件入口</text><text class="t" x="60" y="194">签名 / Schema</text><text class="t" x="60" y="218">source / event ID</text><text class="tiny" x="60" y="247">时区与原始对象留存</text>
    <rect class="stage" x="214" y="132" width="150" height="144" rx="8" fill="#fff4d8" stroke="#d3911b"/>
    <text class="h" x="232" y="164">2. 语义分流</text><text class="t" x="232" y="194">重复 · 相似 · 同根因</text><text class="t" x="232" y="218">冲突 ID 隔离</text><text class="tiny" x="232" y="247">不跨标签自动合并</text>
    <rect class="stage" x="386" y="132" width="150" height="144" rx="8" fill="#e8eef8" stroke="#4e709f"/>
    <text class="h" x="404" y="164">3. 聚类评测</text><text class="t" x="404" y="194">Pairwise P/R/F1</text><text class="t" x="404" y="218">B-Cubed P/R/F1</text><text class="tiny" x="404" y="247">冻结真值与适用集合</text>
    <rect class="stage" x="558" y="132" width="150" height="144" rx="8" fill="#f2eaf7" stroke="#7b5794"/>
    <text class="h" x="576" y="164">4. 稳定性</text><text class="t" x="576" y="194">重采样 / 顺序扰动</text><text class="t" x="576" y="218">版本与阈值敏感度</text><text class="tiny" x="576" y="247">监测大簇吞并和碎裂</text>
    <rect class="stage" x="730" y="132" width="150" height="144" rx="8" fill="#eaf3df" stroke="#648e42"/>
    <text class="h" x="748" y="164">5. 证据图</text><text class="t" x="748" y="194">Trace / 构建 / 部署</text><text class="t" x="748" y="218">业务事实 / 人工记录</text><text class="tiny" x="748" y="247">有类型的来源关系</text>
    <rect class="stage" x="902" y="132" width="150" height="144" rx="8" fill="#fdebed" stroke="#c94f5d"/>
    <text class="h" x="920" y="164">6. 假设与反证</text><text class="t" x="920" y="194">必要条件 / 充分条件</text><text class="t" x="920" y="218">反事实 / 替代解释</text><text class="tiny" x="920" y="247">先发生不等于导致</text>
    <rect class="stage" x="1074" y="132" width="164" height="144" rx="8" fill="#e5f3e9" stroke="#37815f"/>
    <text class="h" x="1092" y="164">7. 人工确认</text><text class="t" x="1092" y="194">范围 / 置信度 / 责任</text><text class="t" x="1092" y="218">签名决策与可重开</text><text class="tiny" x="1092" y="247">自动系统不得代签</text>
    <path class="flow" d="M192 204 H206"/><path class="flow" d="M364 204 H378"/><path class="flow" d="M536 204 H550"/><path class="flow" d="M708 204 H722"/><path class="flow" d="M880 204 H894"/><path class="flow" d="M1052 204 H1066"/>
  </g>

  <g aria-label="门禁与回流">
    <rect x="42" y="350" width="1196" height="224" rx="8" fill="#fff" stroke="#c8d3d9" stroke-width="2"/>
    <text class="h" x="64" y="382">三个独立出口：继续调查、发布阻断、经证据确认后回流</text>

    <rect x="70" y="414" width="300" height="118" rx="7" fill="#fff5df" stroke="#d3911b" stroke-width="2"/>
    <text class="h" x="90" y="446">UNKNOWN：不能评价</text>
    <text class="t" x="90" y="474">真值覆盖不足 / Trace 缺口 / 时钟不可信</text>
    <text class="t" x="90" y="500">补证、缩小声明范围或转人工调查</text>

    <rect x="490" y="414" width="300" height="118" rx="7" fill="#fdebed" stroke="#c94f5d" stroke-width="2"/>
    <text class="h" x="510" y="446">DENY：控制不满足</text>
    <text class="t" x="510" y="474">指标越界 / 簇不稳定 / 反证未处置</text>
    <text class="t" x="510" y="500">阻断聚类版本或发布，不删除证据</text>

    <rect x="910" y="398" width="300" height="150" rx="7" fill="#e7f3ea" stroke="#37815f" stroke-width="2"/>
    <text class="h" x="930" y="430">PASS：有限范围内可使用</text>
    <text class="t" x="930" y="458">人工确认 + 签名证据 + 分母完整</text>
    <text class="t" x="930" y="484">缺陷状态、修复、回归集与监控回流</text>
    <text class="tiny" x="930" y="514">不宣称算法发现了唯一真实根因</text>

    <path class="stop" d="M462 284 C462 328 220 326 220 406"/>
    <path class="stop" d="M978 284 C978 334 640 330 640 406"/>
    <path class="flow" d="M1156 284 V390"/>
  </g>

  <path class="flow" d="M1060 556 C1060 654 288 654 288 284"/>
  <text class="tiny" x="432" y="628">复盘回流必须生成新版本真值、规则或评测集；历史报告保留原始结果，不被静默重写</text>
  <text class="tiny" x="50" y="683">构造门禁：阈值、样本和角色需要由实际组织按风险批准</text>
</svg>
