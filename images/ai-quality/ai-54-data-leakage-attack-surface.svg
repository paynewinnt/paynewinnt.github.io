<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 应用数据泄漏攻击面与首错层</title>
  <desc id="desc">从受控数据源经过检索、上下文、模型、输出、日志和缓存到接收方的数据流，标出跨租户、训练记忆证据和四类泄漏观察点。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .h1{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#0f172a}
      .sub{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#475569}
      .boxTitle{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#0f172a}
      .body{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#334155}
      .small{font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#475569}
      .badge{font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#ffffff}
      .flow{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#64748b;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1280" height="720" fill="#f8fafc"/>
  <rect x="0" y="0" width="1280" height="8" fill="#0f766e"/>
  <text x="48" y="55" class="h1">数据泄漏不是一个字符串命中，而是一条可归因的数据路径</text>
  <text x="48" y="82" class="sub">同一标记可能来自检索、上下文、模型输出、日志或缓存；训练记忆必须排除可见来源后再建立证据。</text>

  <rect x="42" y="116" width="210" height="190" rx="8" fill="#ecfeff" stroke="#0891b2" filter="url(#shadow)"/>
  <rect x="42" y="116" width="210" height="36" rx="8" fill="#0891b2"/>
  <text x="59" y="140" class="badge">0 受控素材与授权</text>
  <text x="59" y="179" class="boxTitle">Canary Catalog</text>
  <text x="59" y="207" class="body">• 无害构造 PII</text>
  <text x="59" y="231" class="body">• 明示不可用假密钥</text>
  <text x="59" y="255" class="body">• 内部文档标记</text>
  <text x="59" y="279" class="body">• 租户、用途、有效期</text>

  <rect x="286" y="116" width="210" height="190" rx="8" fill="#eef2ff" stroke="#4f46e5" filter="url(#shadow)"/>
  <rect x="286" y="116" width="210" height="36" rx="8" fill="#4f46e5"/>
  <text x="303" y="140" class="badge">1 选择与组装</text>
  <text x="303" y="179" class="boxTitle">Retrieval / Context</text>
  <text x="303" y="207" class="body">• ACL 与租户过滤</text>
  <text x="303" y="231" class="body">• 候选、重排、引用</text>
  <text x="303" y="255" class="body">• Prompt 与工具结果</text>
  <text x="303" y="279" class="body">• 逐项 provenance</text>

  <rect x="530" y="116" width="210" height="190" rx="8" fill="#f0fdf4" stroke="#16a34a" filter="url(#shadow)"/>
  <rect x="530" y="116" width="210" height="36" rx="8" fill="#15803d"/>
  <text x="547" y="140" class="badge">2 模型处理</text>
  <text x="547" y="179" class="boxTitle">Inference Boundary</text>
  <text x="547" y="207" class="body">• 固定模型与版本</text>
  <text x="547" y="231" class="body">• 可见上下文清单</text>
  <text x="547" y="255" class="body">• 隔离轨与删除对照</text>
  <text x="547" y="279" class="body">• 重复提取协议</text>

  <rect x="774" y="116" width="210" height="190" rx="8" fill="#fff7ed" stroke="#ea580c" filter="url(#shadow)"/>
  <rect x="774" y="116" width="210" height="36" rx="8" fill="#c2410c"/>
  <text x="791" y="140" class="badge">3 输出与副本</text>
  <text x="791" y="179" class="boxTitle">Response / Copies</text>
  <text x="791" y="207" class="body">• 用户响应与流式片段</text>
  <text x="791" y="231" class="body">• Trace、日志、指标</text>
  <text x="791" y="255" class="body">• 缓存与会话历史</text>
  <text x="791" y="279" class="body">• 导出、反馈、回放</text>

  <rect x="1018" y="116" width="220" height="190" rx="8" fill="#fdf2f8" stroke="#db2777" filter="url(#shadow)"/>
  <rect x="1018" y="116" width="220" height="36" rx="8" fill="#be185d"/>
  <text x="1035" y="140" class="badge">4 接收方与后果</text>
  <text x="1035" y="179" class="boxTitle">Audience / Tenant</text>
  <text x="1035" y="207" class="body">• 当前主体是否有权</text>
  <text x="1035" y="231" class="body">• 目标租户是否一致</text>
  <text x="1035" y="255" class="body">• 数据是否被持久化</text>
  <text x="1035" y="279" class="body">• 是否发生真实披露</text>

  <path d="M252 211 H278" class="flow"/>
  <path d="M496 211 H522" class="flow"/>
  <path d="M740 211 H766" class="flow"/>
  <path d="M984 211 H1010" class="flow"/>

  <rect x="42" y="348" width="285" height="128" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="69" cy="377" r="12" fill="#dc2626"/>
  <text x="65" y="382" class="badge">A</text>
  <text x="91" y="383" class="boxTitle">检索 / 跨租户泄漏</text>
  <text x="59" y="414" class="body">未授权 item 进入候选或上下文即失败，</text>
  <text x="59" y="438" class="body">不能等待模型“自觉不输出”后再判定。</text>
  <text x="59" y="462" class="small">首错证据：ACL 决策 + item provenance</text>

  <rect x="345" y="348" width="285" height="128" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="372" cy="377" r="12" fill="#ea580c"/>
  <text x="368" y="382" class="badge">B</text>
  <text x="394" y="383" class="boxTitle">输出 / 日志 / 缓存泄漏</text>
  <text x="362" y="414" class="body">分别观察用户面与后台副本；输出被遮盖，</text>
  <text x="362" y="438" class="body">不代表原始流式片段和日志已经安全。</text>
  <text x="362" y="462" class="small">首错证据：sink、写入顺序、租户命名空间</text>

  <rect x="648" y="348" width="285" height="128" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="675" cy="377" r="12" fill="#7c3aed"/>
  <text x="671" y="382" class="badge">C</text>
  <text x="697" y="383" class="boxTitle">模型记忆 / 训练提取证据</text>
  <text x="665" y="414" class="body">字符串命中只是一条观测；必须排除检索、</text>
  <text x="665" y="438" class="body">Prompt、缓存与公开来源，再执行预注册协议。</text>
  <text x="665" y="462" class="small">证据状态：观察 → 支持 → 仍非训练成员证明</text>

  <rect x="951" y="348" width="287" height="128" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="978" cy="377" r="12" fill="#0284c7"/>
  <text x="974" y="382" class="badge">D</text>
  <text x="1000" y="383" class="boxTitle">DLP 检测边界</text>
  <text x="968" y="414" class="body">规则、实体模型和 canary 各有漏报与误报；</text>
  <text x="968" y="438" class="body">检测器失败记 unknown，不能自动记为安全。</text>
  <text x="968" y="462" class="small">校准：精确率、召回率、覆盖率、不可判定率</text>

  <path d="M391 306 V340" class="dash"/>
  <path d="M879 306 V340" class="dash"/>
  <path d="M635 306 C635 326 790 326 790 340" class="dash"/>
  <path d="M1128 306 V340" class="dash"/>

  <rect x="42" y="516" width="1196" height="150" rx="8" fill="#0f172a"/>
  <text x="64" y="550" style="font:700 18px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#f8fafc">归因顺序：先冻结事实，再回答“哪一层最早违反不变量”</text>
  <rect x="64" y="574" width="205" height="58" rx="6" fill="#164e63"/>
  <text x="80" y="598" class="badge">① 输入与授权</text>
  <text x="80" y="618" style="font:400 12px sans-serif;fill:#cffafe">标记是否可见、是否有权</text>
  <path d="M269 603 H305" style="stroke:#94a3b8;stroke-width:2;fill:none;marker-end:url(#arrow)"/>
  <rect x="313" y="574" width="205" height="58" rx="6" fill="#3730a3"/>
  <text x="329" y="598" class="badge">② 处理与副本</text>
  <text x="329" y="618" style="font:400 12px sans-serif;fill:#e0e7ff">进入了哪个 stage / sink</text>
  <path d="M518 603 H554" style="stroke:#94a3b8;stroke-width:2;fill:none;marker-end:url(#arrow)"/>
  <rect x="562" y="574" width="205" height="58" rx="6" fill="#9a3412"/>
  <text x="578" y="598" class="badge">③ 检测与复核</text>
  <text x="578" y="618" style="font:400 12px sans-serif;fill:#ffedd5">命中、误报、unknown</text>
  <path d="M767 603 H803" style="stroke:#94a3b8;stroke-width:2;fill:none;marker-end:url(#arrow)"/>
  <rect x="811" y="574" width="205" height="58" rx="6" fill="#9f1239"/>
  <text x="827" y="598" class="badge">④ 证据与影响</text>
  <text x="827" y="618" style="font:400 12px sans-serif;fill:#fce7f3">接收方、持久化、范围</text>
  <path d="M1016 603 H1052" style="stroke:#94a3b8;stroke-width:2;fill:none;marker-end:url(#arrow)"/>
  <rect x="1060" y="574" width="154" height="58" rx="6" fill="#166534"/>
  <text x="1076" y="598" class="badge">⑤ 门禁决策</text>
  <text x="1076" y="618" style="font:400 12px sans-serif;fill:#dcfce7">阻断 / 限流 / 放行</text>
</svg>
