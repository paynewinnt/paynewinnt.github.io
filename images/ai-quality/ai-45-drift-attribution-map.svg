<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 应用七类漂移与版本数据血缘归因图</title>
  <desc id="desc">区分输入协变量、标签、概念、模型、Prompt、知识和基础设施漂移，把分布与性能告警连接到模型、Prompt、知识、工具和运行环境版本血缘，再通过配对回放、组件替换和成熟标签验证候选原因；强调告警不是损害或根因证明。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#64748b"/></marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#be123c"/></marker>
    <style>
      .bg{fill:#f8fafc}.title{font:700 31px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.sub{font:400 17px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}.h{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.t{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#334155}.small{font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.arrow{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}.dashed{fill:none;stroke:#be123c;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#arrowRed)}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <rect width="1280" height="104" fill="#fff"/>
  <line x1="0" y1="103" x2="1280" y2="103" stroke="#dbe4ec" stroke-width="2"/>
  <text class="title" x="48" y="45">先给漂移命名，再用版本与数据 lineage 缩小归因范围</text>
  <text class="sub" x="48" y="76">分布变化、性能下降和组件变更是三种事实；只有可证伪的对照才能把候选原因提升为根因证据。</text>

  <text class="h" x="48" y="134">A. 七类不可混用的漂移信号</text>
  <rect x="48" y="152" width="158" height="92" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text class="h" x="64" y="180">Input / Covariate</text><text class="t" x="64" y="205">Pₜ(X) ≠ P₀(X)</text><text class="small" x="64" y="228">内容、长度、语言、渠道</text>
  <rect x="218" y="152" width="148" height="92" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text class="h" x="234" y="180">Label / Prior</text><text class="t" x="234" y="205">Pₜ(Y) ≠ P₀(Y)</text><text class="small" x="234" y="228">严格 label shift 有额外假设</text>
  <rect x="378" y="152" width="148" height="92" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text class="h" x="394" y="180">Concept</text><text class="t" x="394" y="205">Pₜ(Y|X) ≠ P₀(Y|X)</text><text class="small" x="394" y="228">需成熟标签或实验补证</text>
  <rect x="538" y="152" width="148" height="92" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text class="h" x="554" y="180">Model</text><text class="t" x="554" y="205">权重 / 量化 / tokenizer</text><text class="small" x="554" y="228">别名不等于物理版本</text>
  <rect x="698" y="152" width="148" height="92" rx="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text class="h" x="714" y="180">Prompt</text><text class="t" x="714" y="205">模板 / policy / tools</text><text class="small" x="714" y="228">含运行时上下文组装</text>
  <rect x="858" y="152" width="148" height="92" rx="7" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text class="h" x="874" y="180">Knowledge</text><text class="t" x="874" y="205">语料 / ACL / 索引</text><text class="small" x="874" y="228">外部事实也会过期</text>
  <rect x="1018" y="152" width="214" height="92" rx="7" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/>
  <text class="h" x="1034" y="180">Infrastructure</text><text class="t" x="1034" y="205">运行时 / 区域 / 缓存 / 依赖</text><text class="small" x="1034" y="228">可改变延迟和可见行为</text>

  <path class="arrow" d="M640 244 L640 276"/>
  <rect x="48" y="280" width="1184" height="178" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="h" x="68" y="311">B. 同一 request/task 的不可变 lineage bundle</text>
  <rect x="68" y="330" width="204" height="98" rx="6" fill="#eaf4ff" stroke="#3b82f6"/>
  <text class="t" x="84" y="354">数据与选择</text><text class="small" x="84" y="377">event / schema / sampling</text><text class="small" x="84" y="398">label definition / as_of</text><text class="small" x="84" y="419">source snapshot digest</text>
  <path class="arrow" d="M272 379 L294 379"/>
  <rect x="298" y="330" width="204" height="98" rx="6" fill="#fff7df" stroke="#d97706"/>
  <text class="t" x="314" y="354">模型与路由</text><text class="small" x="314" y="377">artifact hash / tokenizer</text><text class="small" x="314" y="398">route policy / parameters</text><text class="small" x="314" y="419">provider deployment ID</text>
  <path class="arrow" d="M502 379 L524 379"/>
  <rect x="528" y="330" width="204" height="98" rx="6" fill="#f2edfa" stroke="#7c3aed"/>
  <text class="t" x="544" y="354">Prompt 与策略</text><text class="small" x="544" y="377">template / rendered digest</text><text class="small" x="544" y="398">examples / safety policy</text><text class="small" x="544" y="419">tool schema / memory policy</text>
  <path class="arrow" d="M732 379 L754 379"/>
  <rect x="758" y="330" width="204" height="98" rx="6" fill="#fce7f3" stroke="#db2777"/>
  <text class="t" x="774" y="354">知识与权限</text><text class="small" x="774" y="377">corpus / chunk / embedding</text><text class="small" x="774" y="398">index / ACL / freshness</text><text class="small" x="774" y="419">retrieved evidence IDs</text>
  <path class="arrow" d="M962 379 L984 379"/>
  <rect x="988" y="330" width="224" height="98" rx="6" fill="#fff0f2" stroke="#e11d48"/>
  <text class="t" x="1004" y="354">基础设施与观测</text><text class="small" x="1004" y="377">image / library / hardware</text><text class="small" x="1004" y="398">region / cache / dependency</text><text class="small" x="1004" y="419">telemetry schema / clock</text>

  <path class="arrow" d="M640 458 L640 486"/>
  <rect x="48" y="490" width="252" height="142" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text class="h" x="68" y="522">1. 检测告警</text>
  <text class="t" x="68" y="550">两样本差异 · 变点 · 黄金探针</text>
  <text class="small" x="68" y="576">事实：统计量或规则越界</text>
  <text class="small" x="68" y="600">不是：用户损害、根因、修复方案</text>
  <path class="arrow" d="M300 561 L326 561"/>
  <rect x="330" y="490" width="252" height="142" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text class="h" x="350" y="522">2. 候选原因集</text>
  <text class="t" x="350" y="550">按时间、影响面与 lineage 求交</text>
  <text class="small" x="350" y="576">模型 M7？Prompt P18？索引 K4？</text>
  <text class="small" x="350" y="600">同时保留外部输入与标签变化</text>
  <path class="arrow" d="M582 561 L608 561"/>
  <rect x="612" y="490" width="292" height="142" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text class="h" x="632" y="522">3. 可证伪验证</text>
  <text class="t" x="632" y="550">配对回放 · 单组件替换 · 2×2 对照</text>
  <text class="small" x="632" y="576">固定输入与其余版本，观察差异是否消失</text>
  <text class="small" x="632" y="600">成熟标签验证损害，故障注入验证检测器</text>
  <path class="arrow" d="M904 561 L930 561"/>
  <rect x="934" y="490" width="298" height="142" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text class="h" x="954" y="522">4. 版本化决策</text>
  <text class="t" x="954" y="550">继续观察 · 重校准 · 修复 · 回滚</text>
  <text class="small" x="954" y="576">记录 observation / inference / decision</text>
  <text class="small" x="954" y="600">处置后再测，不能删除原始告警</text>

  <path class="dashed" d="M1083 632 L1083 670 L174 670 L174 632"/>
  <text class="small" x="432" y="662" fill="#9f1239">处置结果回流到探针、阈值与离线集；若反事实验证不成立，撤销根因假设而不是改写观测</text>
</svg>
