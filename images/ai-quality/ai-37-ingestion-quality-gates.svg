<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">知识库摄取质量门禁、隔离区与重放闭环</title>
  <desc id="desc">展示接收安全、格式解析、内容结构、身份去重、权限租户、发布完整性六类门禁，以及失败进入隔离区、人工处置、版本化修复和从不可变输入重放的闭环。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#64748b"/></marker>
    <marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#e11d48"/></marker>
    <style>
      .bg{fill:#f8fafc}.title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.sub{font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}.h{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.t{font:400 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#334155}.small{font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.head{font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#fff}.grid{stroke:#cbd5e1;stroke-width:1.5}.arrow{fill:none;stroke:#64748b;stroke-width:2.3;marker-end:url(#arrow)}.fail{fill:none;stroke:#e11d48;stroke-width:2.3;stroke-dasharray:7 5;marker-end:url(#red)}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="40" y="48">门禁失败不污染在线索引：隔离、修复、重放、再验收</text>
  <text class="sub" x="40" y="76">每个门禁输出机器可判定状态与证据；重试必须从不可变输入和固定版本配置开始。</text>

  <rect x="40" y="108" width="1200" height="48" rx="8" fill="#334155"/>
  <text class="head" x="58" y="138">门禁</text><text class="head" x="218" y="138">核心断言</text><text class="head" x="555" y="138">失败注入</text><text class="head" x="820" y="138">证据</text><text class="head" x="1070" y="138">失败动作</text>

  <rect x="40" y="156" width="1200" height="70" fill="#fff1f2" class="grid"/>
  <text class="h" x="58" y="185">接收与安全</text><text class="t" x="58" y="209">G1</text>
  <text class="t" x="218" y="184">大小、解包率、文件数、恶意代码与超时</text><text class="t" x="218" y="207">解析器在禁网、低权限、资源上限内运行</text>
  <text class="t" x="555" y="184">压缩炸弹、递归容器、超大页</text><text class="t" x="555" y="207">挂起解析器、外部链接与宏</text>
  <text class="t" x="820" y="184">raw hash · scanner version</text><text class="t" x="820" y="207">limit · elapsed · exit reason</text>
  <text class="small" x="1070" y="196" fill="#be123c">SECURITY_QUARANTINE</text>

  <rect x="40" y="226" width="1200" height="70" fill="#fffbeb" class="grid"/>
  <text class="h" x="58" y="255">格式与解析</text><text class="t" x="58" y="279">G2</text>
  <text class="t" x="218" y="254">声明 MIME、字节检测、编码和解析器一致</text><text class="t" x="218" y="277">页数、表格、附件、OCR 覆盖可解释</text>
  <text class="t" x="555" y="254">错扩展名、坏编码、截断 PDF</text><text class="t" x="555" y="277">扫描页、合并单元格、隐藏文本</text>
  <text class="t" x="820" y="254">detector/parser/OCR versions</text><text class="t" x="820" y="277">warning codes · coverage</text>
  <text class="small" x="1070" y="266" fill="#b45309">PARSE_QUARANTINE</text>

  <rect x="40" y="296" width="1200" height="70" fill="#ecfeff" class="grid"/>
  <text class="h" x="58" y="325">内容与结构</text><text class="t" x="58" y="349">G3</text>
  <text class="t" x="218" y="324">正文非空、乱码率受控、标题层级有效</text><text class="t" x="218" y="347">表格行列关系与页坐标不被扁平化破坏</text>
  <text class="t" x="555" y="324">空正文、重复页眉、字符替换</text><text class="t" x="555" y="347">表头错位、阅读顺序交换</text>
  <text class="t" x="820" y="324">quality metrics · samples</text><text class="t" x="820" y="347">normalized hash · rule version</text>
  <text class="small" x="1070" y="336" fill="#0e7490">CONTENT_REVIEW</text>

  <rect x="40" y="366" width="1200" height="70" fill="#f5f3ff" class="grid"/>
  <text class="h" x="58" y="395">身份与去重</text><text class="t" x="58" y="419">G4</text>
  <text class="t" x="218" y="394">document/version/chunk ID 稳定且可重算</text><text class="t" x="218" y="417">精确重复与近重复分开处理，不误合并版本</text>
  <text class="t" x="555" y="394">同内容不同租户、微改政策</text><text class="t" x="555" y="417">插页导致 ordinal 改变、碰撞</text>
  <text class="t" x="820" y="394">hash inputs · cluster decision</text><text class="t" x="820" y="417">prior version · supersedes</text>
  <text class="small" x="1070" y="406" fill="#6d28d9">IDENTITY_CONFLICT</text>

  <rect x="40" y="436" width="1200" height="70" fill="#ecfdf5" class="grid"/>
  <text class="h" x="58" y="465">ACL 与租户</text><text class="t" x="58" y="489">G5</text>
  <text class="t" x="218" y="464">Chunk 权限来自已验证源策略并默认拒绝</text><text class="t" x="218" y="487">租户、主体、组、deny 和有效期完整</text>
  <text class="t" x="555" y="464">ACL 拉取超时、未知组</text><text class="t" x="555" y="487">父目录 deny、跨租户同内容</text>
  <text class="t" x="820" y="464">policy/version/source snapshot</text><text class="t" x="820" y="487">effective ACL · decision trace</text>
  <text class="small" x="1070" y="476" fill="#047857">ACL_QUARANTINE</text>

  <rect x="40" y="506" width="1200" height="70" fill="#eff6ff" class="grid"/>
  <text class="h" x="58" y="535">发布完整性</text><text class="t" x="58" y="559">G6</text>
  <text class="t" x="218" y="534">manifest 数量、hash、血缘与索引写入一致</text><text class="t" x="218" y="557">生成号原子切换，失败仍服务旧版本</text>
  <text class="t" x="555" y="534">写一半断电、事件丢失</text><text class="t" x="555" y="557">重复完成事件、并发重放</text>
  <text class="t" x="820" y="534">run_id · manifest_hash</text><text class="t" x="820" y="557">generation · commit receipt</text>
  <text class="small" x="1070" y="546" fill="#1d4ed8">PUBLISH_ABORT</text>

  <rect x="40" y="610" width="190" height="68" rx="8" fill="#fff" stroke="#e11d48" stroke-width="2"/>
  <text class="h" x="58" y="638">隔离记录</text><text class="t" x="58" y="661">原字节 + 失败证据</text>
  <path class="arrow" d="M230 644 L272 644"/>
  <rect x="276" y="610" width="190" height="68" rx="8" fill="#fff" stroke="#d97706" stroke-width="2"/>
  <text class="h" x="294" y="638">处置决策</text><text class="t" x="294" y="661">修复、拒绝或批准例外</text>
  <path class="arrow" d="M466 644 L508 644"/>
  <rect x="512" y="610" width="190" height="68" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
  <text class="h" x="530" y="638">固定新版本</text><text class="t" x="530" y="661">parser/config/policy</text>
  <path class="arrow" d="M702 644 L744 644"/>
  <rect x="748" y="610" width="190" height="68" rx="8" fill="#fff" stroke="#0891b2" stroke-width="2"/>
  <text class="h" x="766" y="638">从源重放</text><text class="t" x="766" y="661">新 run_id，旧记录不覆盖</text>
  <path class="arrow" d="M938 644 L980 644"/>
  <rect x="984" y="610" width="256" height="68" rx="8" fill="#fff" stroke="#059669" stroke-width="2"/>
  <text class="h" x="1002" y="638">全门禁通过后发布</text><text class="t" x="1002" y="661">对比旧版本并保留回滚点</text>
  <path class="fail" d="M1112 610 C1112 588 135 598 135 606"/>
</svg>
