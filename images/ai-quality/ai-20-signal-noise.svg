<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">AI 回归测试中的信号与噪声</title>
  <desc id="desc">展示质量变化信号、随机噪声来源、配对比较矩阵和噪声预算判定方法</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#38556f"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#17324d" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 34px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #17324d; }
      .subtitle { font: 400 17px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #516679; }
      .h2 { font: 700 21px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #17324d; }
      .label { font: 600 16px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #243b52; }
      .text { font: 400 15px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #3b5268; }
      .small { font: 400 13px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #516679; }
      .mono { font: 600 15px 'SFMono-Regular', Consolas, monospace; fill: #17324d; }
      .white { fill: #ffffff; }
    </style>
  </defs>

  <rect width="1280" height="800" fill="#f7f9fc"/>
  <rect x="0" y="0" width="1280" height="92" fill="#ffffff"/>
  <rect x="0" y="90" width="1280" height="2" fill="#d8e3ec"/>
  <text x="56" y="49" class="title">AI 回归中的信号与噪声：不要把一次波动当成质量变化</text>
  <text x="56" y="77" class="subtitle">配对、重复、分层和置信区间共同回答：变化来自候选版本，还是来自评测系统本身？</text>

  <g filter="url(#shadow)">
    <rect x="56" y="124" width="558" height="250" rx="8" fill="#ffffff" stroke="#d6e1ea"/>
    <rect x="638" y="124" width="586" height="250" rx="8" fill="#ffffff" stroke="#d6e1ea"/>
  </g>

  <text x="84" y="160" class="h2">观测分数的组成</text>
  <rect x="84" y="181" width="502" height="54" rx="6" fill="#eaf4ff" stroke="#74a8d2"/>
  <text x="335" y="215" text-anchor="middle" class="mono">observed = product signal + eval noise</text>

  <rect x="84" y="256" width="238" height="87" rx="7" fill="#eaf6ed" stroke="#69a87d"/>
  <text x="203" y="286" text-anchor="middle" class="label">希望测到的信号</text>
  <text x="101" y="313" class="text">Prompt、模型、检索、工具</text>
  <text x="101" y="335" class="small">真正改变了任务结果</text>

  <rect x="348" y="256" width="238" height="87" rx="7" fill="#fff1e6" stroke="#d8913b"/>
  <text x="467" y="286" text-anchor="middle" class="label">必须控制的噪声</text>
  <text x="365" y="313" class="text">采样、Judge、环境、并发</text>
  <text x="365" y="335" class="small">没有版本变化也会波动</text>

  <text x="666" y="160" class="h2">为什么要配对同一任务</text>
  <line x1="690" y1="331" x2="1172" y2="331" stroke="#9fb0c0" stroke-width="2"/>
  <line x1="690" y1="187" x2="690" y2="331" stroke="#9fb0c0" stroke-width="2"/>
  <text x="691" y="352" text-anchor="middle" class="small">case 1</text>
  <text x="787" y="352" text-anchor="middle" class="small">case 2</text>
  <text x="883" y="352" text-anchor="middle" class="small">case 3</text>
  <text x="979" y="352" text-anchor="middle" class="small">case 4</text>
  <text x="1075" y="352" text-anchor="middle" class="small">case 5</text>
  <text x="1171" y="352" text-anchor="middle" class="small">case 6</text>
  <polyline points="691,280 787,240 883,296 979,215 1075,255 1171,204" fill="none" stroke="#688199" stroke-width="3"/>
  <polyline points="691,265 787,226 883,288 979,196 1075,247 1171,184" fill="none" stroke="#2f8663" stroke-width="3"/>
  <g fill="#688199">
    <circle cx="691" cy="280" r="5"/><circle cx="787" cy="240" r="5"/><circle cx="883" cy="296" r="5"/>
    <circle cx="979" cy="215" r="5"/><circle cx="1075" cy="255" r="5"/><circle cx="1171" cy="204" r="5"/>
  </g>
  <g fill="#2f8663">
    <circle cx="691" cy="265" r="5"/><circle cx="787" cy="226" r="5"/><circle cx="883" cy="288" r="5"/>
    <circle cx="979" cy="196" r="5"/><circle cx="1075" cy="247" r="5"/><circle cx="1171" cy="184" r="5"/>
  </g>
  <line x1="952" y1="158" x2="985" y2="158" stroke="#688199" stroke-width="3"/>
  <text x="992" y="163" class="small">Baseline</text>
  <line x1="1071" y1="158" x2="1104" y2="158" stroke="#2f8663" stroke-width="3"/>
  <text x="1111" y="163" class="small">Candidate</text>
  <text x="666" y="185" class="small">同一 case 内做差，抵消任务难度；再跨 case 汇总差值</text>

  <g filter="url(#shadow)">
    <rect x="56" y="398" width="558" height="300" rx="8" fill="#ffffff" stroke="#d6e1ea"/>
    <rect x="638" y="398" width="586" height="300" rx="8" fill="#ffffff" stroke="#d6e1ea"/>
  </g>

  <text x="84" y="435" class="h2">二元结果的配对矩阵</text>
  <text x="357" y="469" text-anchor="middle" class="label">候选通过</text>
  <text x="504" y="469" text-anchor="middle" class="label">候选失败</text>
  <text x="111" y="536" class="label">基线通过</text>
  <text x="111" y="626" class="label">基线失败</text>
  <rect x="278" y="484" width="156" height="76" fill="#e9f5ed" stroke="#8ab99a"/>
  <rect x="434" y="484" width="156" height="76" fill="#ffe9e9" stroke="#d47d83"/>
  <rect x="278" y="560" width="156" height="76" fill="#eaf4ff" stroke="#78a8d0"/>
  <rect x="434" y="560" width="156" height="76" fill="#f0f2f4" stroke="#aab5bf"/>
  <text x="356" y="516" text-anchor="middle" class="label">共同通过</text>
  <text x="356" y="542" text-anchor="middle" class="mono">a</text>
  <text x="512" y="516" text-anchor="middle" class="label">回退</text>
  <text x="512" y="542" text-anchor="middle" class="mono">b</text>
  <text x="356" y="592" text-anchor="middle" class="label">改进</text>
  <text x="356" y="618" text-anchor="middle" class="mono">c</text>
  <text x="512" y="592" text-anchor="middle" class="label">共同失败</text>
  <text x="512" y="618" text-anchor="middle" class="mono">d</text>
  <text x="84" y="669" class="small">McNemar 只关注不一致对 b 与 c；共同结果不提供版本差异证据</text>

  <text x="666" y="435" class="h2">噪声预算不是“忽略失败”</text>
  <rect x="666" y="459" width="530" height="52" rx="6" fill="#edf3f8"/>
  <text x="931" y="492" text-anchor="middle" class="mono">noise_health = invalid + flip + judge_disagree</text>

  <rect x="666" y="531" width="154" height="82" rx="7" fill="#fff4e8" stroke="#d79a4d"/>
  <rect x="841" y="531" width="154" height="82" rx="7" fill="#f4effb" stroke="#9477bb"/>
  <rect x="1016" y="531" width="180" height="82" rx="7" fill="#eef5fb" stroke="#719ec1"/>
  <text x="743" y="561" text-anchor="middle" class="label">invalid rate</text>
  <text x="743" y="590" text-anchor="middle" class="small">环境判废比例</text>
  <text x="918" y="561" text-anchor="middle" class="label">flip rate</text>
  <text x="918" y="590" text-anchor="middle" class="small">同配置结果翻转</text>
  <text x="1106" y="561" text-anchor="middle" class="label">judge disagreement</text>
  <text x="1106" y="590" text-anchor="middle" class="small">裁判与校准集分歧</text>

  <line x1="743" y1="613" x2="743" y2="640" stroke="#38556f" stroke-width="2"/>
  <line x1="918" y1="613" x2="918" y2="640" stroke="#38556f" stroke-width="2"/>
  <line x1="1106" y1="613" x2="1106" y2="640" stroke="#38556f" stroke-width="2"/>
  <line x1="743" y1="640" x2="1106" y2="640" stroke="#38556f" stroke-width="2"/>
  <line x1="924" y1="640" x2="924" y2="660" stroke="#38556f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="924" y="688" text-anchor="middle" class="label">超预算：评测结果标记为不可信并修复评测系统</text>

  <rect x="56" y="724" width="1168" height="48" rx="8" fill="#17324d"/>
  <text x="640" y="754" text-anchor="middle" class="label white">先证明评测系统足够稳定，再用它证明候选版本足够稳定</text>
</svg>
