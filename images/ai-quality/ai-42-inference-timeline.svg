<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">大模型推理请求的统一事件时间线</title>
  <desc id="desc">从客户端发送、服务端入队、预填充、首个有效输出 Token 到解码完成，区分网络、排队、prefill、decode、TTFT、TPOT 和端到端延迟的测量边界。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#475569"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}.title{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.sub{font:400 18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}.h{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.t{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#334155}.small{font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}.line{stroke:#475569;stroke-width:3;marker-end:url(#arrow)}.tick{stroke:#64748b;stroke-width:2}.box{stroke-width:2;rx:7}.brace{fill:none;stroke-width:4;stroke-linecap:round}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="48" y="54">先固定时钟和事件，再讨论 TTFT、TPOT 与吞吐</text>
  <text class="sub" x="48" y="86">客户端口径用于体验，服务端阶段口径用于归因；跨工具比较前必须核对首 Token、空事件和分母定义。</text>

  <text class="h" x="48" y="137">客户端</text>
  <text class="h" x="48" y="251">服务端</text>
  <text class="h" x="48" y="365">流式输出</text>
  <line class="line" x1="156" y1="150" x2="1216" y2="150"/>
  <line class="line" x1="156" y1="264" x2="1216" y2="264"/>
  <line class="line" x1="156" y1="378" x2="1216" y2="378"/>

  <rect class="box" x="170" y="113" width="132" height="74" fill="#dbeafe" stroke="#2563eb"/>
  <text class="h" x="188" y="143">t0 发送</text><text class="small" x="188" y="168">单调时钟</text>
  <rect class="box" x="323" y="227" width="144" height="74" fill="#e0f2fe" stroke="#0284c7"/>
  <text class="h" x="342" y="257">t1 入队</text><text class="small" x="342" y="282">admission 后</text>
  <rect class="box" x="488" y="227" width="150" height="74" fill="#fef3c7" stroke="#d97706"/>
  <text class="h" x="505" y="257">t2 Prefill</text><text class="small" x="505" y="282">开始计算</text>
  <rect class="box" x="659" y="227" width="154" height="74" fill="#dcfce7" stroke="#16a34a"/>
  <text class="h" x="678" y="257">t3 首输出</text><text class="small" x="678" y="282">服务端生成</text>
  <rect class="box" x="834" y="341" width="145" height="74" fill="#ede9fe" stroke="#7c3aed"/>
  <text class="h" x="854" y="371">t4 下一词</text><text class="small" x="854" y="396">Token 间隔</text>
  <rect class="box" x="1000" y="341" width="178" height="74" fill="#ffe4e6" stroke="#e11d48"/>
  <text class="h" x="1019" y="371">tn 最终词</text><text class="small" x="1019" y="396">不含空 done</text>

  <line class="tick" x1="236" y1="187" x2="236" y2="221"/>
  <line class="tick" x1="395" y1="187" x2="395" y2="227"/>
  <line class="tick" x1="563" y1="187" x2="563" y2="227"/>
  <line class="tick" x1="736" y1="301" x2="736" y2="341"/>
  <line class="tick" x1="906" y1="301" x2="906" y2="341"/>
  <line class="tick" x1="1089" y1="301" x2="1089" y2="341"/>

  <path class="brace" d="M323 442 L323 462 L488 462 L488 442" stroke="#0284c7"/>
  <text class="h" x="348" y="490" fill="#0369a1">Queue</text>
  <path class="brace" d="M488 442 L488 516 L659 516 L659 442" stroke="#d97706"/>
  <text class="h" x="522" y="544" fill="#b45309">Prefill</text>
  <path class="brace" d="M659 442 L659 570 L1178 570 L1178 442" stroke="#7c3aed"/>
  <text class="h" x="853" y="598" fill="#6d28d9">Decode：逐 Token 迭代</text>

  <rect x="48" y="622" width="1184" height="66" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="t" x="72" y="649">TTFTclient = 首个有效 Token 到达 - t0　　E2E = 最终有效 Token 到达 - t0</text>
  <text class="t" x="72" y="677">TPOTmean = (最终 Token 时间 - 首 Token 时间) / (输出 Token 数 - 1)；单 Token 输出时记为不可定义</text>
</svg>
