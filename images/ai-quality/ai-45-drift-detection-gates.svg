<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 漂移检测的多证据门禁</title>
  <desc id="desc">展示契约与版本、无标签分布检测、黄金探针、延迟标签和业务结果五条证据进入变点与归因层，再依据证据充分性决定观察、重校准、修复、回滚或重训；漂移告警单独不能证明损害或根因。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#64748b"/></marker>
    <style>
      .bg{fill:#f8fafc}.title{font:700 31px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.sub{font:400 17px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}.h{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.t{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#334155}.small{font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.arrow{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="48" y="46">漂移门禁：无标签信号负责早发现，成熟结果负责证明损害</text>
  <text class="sub" x="48" y="77">黄金探针缩短检测时间，lineage 缩小候选原因；重校准、回滚和重训必须对应不同失效机制。</text>

  <rect x="48" y="118" width="238" height="420" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="h" x="68" y="150">证据输入</text>
  <rect x="68" y="172" width="198" height="58" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text class="t" x="84" y="197">契约 / Schema / 缺失</text><text class="small" x="84" y="219">全量、最快、确定性</text>
  <rect x="68" y="244" width="198" height="58" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
  <text class="t" x="84" y="269">P(X) 两样本 / 距离</text><text class="small" x="84" y="291">无标签早期告警</text>
  <rect x="68" y="316" width="198" height="58" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
  <text class="t" x="84" y="341">黄金探针与变形关系</text><text class="small" x="84" y="363">固定风险能力回归</text>
  <rect x="68" y="388" width="198" height="58" rx="6" fill="#fce7f3" stroke="#db2777"/>
  <text class="t" x="84" y="413">版本 / 数据 lineage</text><text class="small" x="84" y="435">模型 · Prompt · 知识 · infra</text>
  <rect x="68" y="460" width="198" height="58" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text class="t" x="84" y="485">成熟标签与业务结果</text><text class="small" x="84" y="507">最慢，最接近损害</text>

  <path class="arrow" d="M286 328 L318 328"/>
  <rect x="322" y="118" width="286" height="420" rx="7" fill="#fff7df" stroke="#d97706" stroke-width="2"/>
  <text class="h" x="342" y="150">检测与变点层</text>
  <rect class="box" x="342" y="172" width="246" height="72" rx="6"/>
  <text class="t" x="358" y="197">固定基线 + 滚动窗口</text><text class="small" x="358" y="220">季节/发布/渠道基线分开</text><text class="small" x="358" y="238">样本量、缺失、检验族一起记录</text>
  <rect class="box" x="342" y="260" width="246" height="72" rx="6"/>
  <text class="t" x="358" y="285">变点 / CUSUM / 自适应窗口</text><text class="small" x="358" y="308">检测“何时变”，不回答“为何变”</text><text class="small" x="358" y="326">去重告警并设置冷却</text>
  <rect class="box" x="342" y="348" width="246" height="72" rx="6"/>
  <text class="t" x="358" y="373">分层与黄金探针交叉</text><text class="small" x="358" y="396">定位语言、风险、知识域、版本</text><text class="small" x="358" y="414">探针通过不代表总体无漂移</text>
  <rect x="342" y="436" width="246" height="72" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text class="t" x="358" y="461">输出：DRIFT_ALERT</text><text class="small" x="358" y="484">统计/规则越界 + 时间 + 影响面</text><text class="small" x="358" y="502">不是 DAMAGE 或 ROOT_CAUSE</text>

  <path class="arrow" d="M608 328 L640 328"/>
  <rect x="644" y="118" width="286" height="420" rx="7" fill="#f2edfa" stroke="#7c3aed" stroke-width="2"/>
  <text class="h" x="664" y="150">归因与损害验证</text>
  <rect class="box" x="664" y="172" width="246" height="72" rx="6"/>
  <text class="t" x="680" y="197">时间邻近只是候选筛选</text><text class="small" x="680" y="220">发布 diff × 受影响 strata × Trace</text><text class="small" x="680" y="238">保留未变组件与外部事件</text>
  <rect class="box" x="664" y="260" width="246" height="72" rx="6"/>
  <text class="t" x="680" y="285">配对回放 / 单组件替换</text><text class="small" x="680" y="308">固定输入、Prompt、知识、infra</text><text class="small" x="680" y="326">验证差异能否出现与消失</text>
  <rect class="box" x="664" y="348" width="246" height="72" rx="6"/>
  <text class="t" x="680" y="373">成熟标签验证损害</text><text class="small" x="680" y="396">P(Y)、P(Y|X)、校准与业务后果</text><text class="small" x="680" y="414">报告 completeness 与 as_of</text>
  <rect x="664" y="436" width="246" height="72" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text class="t" x="680" y="461">证据状态</text><text class="small" x="680" y="484">alert_only / damage_supported</text><text class="small" x="680" y="502">cause_candidate / cause_supported</text>

  <path class="arrow" d="M930 328 L962 328"/>
  <rect x="966" y="118" width="266" height="420" rx="7" fill="#eaf8ef" stroke="#16a34a" stroke-width="2"/>
  <text class="h" x="986" y="150">分机制处置门</text>
  <rect x="986" y="172" width="226" height="58" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
  <text class="t" x="1002" y="197">观察 / 加密抽样</text><text class="small" x="1002" y="219">仅告警，损害未知</text>
  <rect x="986" y="244" width="226" height="58" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text class="t" x="1002" y="269">重校准阈值 / 概率</text><text class="small" x="1002" y="291">映射失准且标签充分</text>
  <rect x="986" y="316" width="226" height="58" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
  <text class="t" x="1002" y="341">修 Prompt / 知识 / infra</text><text class="small" x="1002" y="363">组件根因有对照支持</text>
  <rect x="986" y="388" width="226" height="58" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text class="t" x="1002" y="413">暂停 / 回滚</text><text class="small" x="1002" y="435">安全硬门或已证实损害</text>
  <rect x="986" y="460" width="226" height="58" rx="6" fill="#fce7f3" stroke="#db2777"/>
  <text class="t" x="1002" y="485">重训 / 重建索引</text><text class="small" x="1002" y="507">旧能力边界已不适用</text>

  <rect x="48" y="574" width="1184" height="100" rx="7" fill="#0f172a"/>
  <text x="70" y="607" style="font:700 18px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#fff">三条禁止跨越的推理捷径</text>
  <text x="70" y="637" style="font:600 15px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#bfdbfe">P(X) 变化 ≠ P(Y|X) 变化　　漂移告警 ≠ 质量损害　　版本时间相邻 ≠ 根因</text>
  <text x="70" y="660" style="font:600 15px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#bbf7d0">正确链路：检测事实 → lineage 候选 → 可证伪对照 → 成熟结果 → 版本化处置与再验证</text>
</svg>
