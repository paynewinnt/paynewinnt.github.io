<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 审计事件到证据导出的可信流水线</title>
  <desc id="desc">从业务动作产生事件，经源端最小化、身份与追踪关联、追加式账本、分层存储、受控查询，最终生成包含清单、完整性证明和缺口声明的证据包。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f4858"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#17252f" flood-opacity="0.16"/>
    </filter>
    <style>
      .bg{fill:#f5f7f8}.title{font:700 30px Arial,"PingFang SC",sans-serif;fill:#16242d}.sub{font:16px Arial,"PingFang SC",sans-serif;fill:#50616b}.h{font:700 18px Arial,"PingFang SC",sans-serif;fill:#17252f}.t{font:15px Arial,"PingFang SC",sans-serif;fill:#2f3e46}.tiny{font:13px Arial,"PingFang SC",sans-serif;fill:#50616b}.box{stroke-width:2;filter:url(#shadow)}.flow{fill:none;stroke:#2f4858;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#d1495b;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="56" y="58">AI 审计事件 → 可验证证据包</text>
  <text class="sub" x="56" y="88">可信来自可追踪的控制组合；哈希链只验证已采集记录的某些完整性属性</text>

  <g aria-label="主流水线">
    <rect class="box" x="50" y="142" width="190" height="178" rx="8" fill="#e5f4f2" stroke="#16827b"/>
    <text class="h" x="70" y="176">1. 业务事实源</text>
    <text class="t" x="70" y="210">用户请求 / 策略决策</text>
    <text class="t" x="70" y="238">模型尝试 / 工具执行</text>
    <text class="t" x="70" y="266">人工批准 / 最终结果</text>
    <text class="tiny" x="70" y="298">事件 ID 在源端生成</text>

    <rect class="box" x="286" y="142" width="190" height="178" rx="8" fill="#fff4d9" stroke="#d3911b"/>
    <text class="h" x="306" y="176">2. 源端最小化</text>
    <text class="t" x="306" y="210">字段分级与目的检查</text>
    <text class="t" x="306" y="238">脱敏 / 假名化 / 令牌化</text>
    <text class="t" x="306" y="266">密钥与原文禁止入日志</text>
    <text class="tiny" x="306" y="298">失败时隔离而非放行</text>

    <rect class="box" x="522" y="142" width="190" height="178" rx="8" fill="#e8eef8" stroke="#496a9f"/>
    <text class="h" x="542" y="176">3. 关联与校验</text>
    <text class="t" x="542" y="210">Trace / Span / Attempt</text>
    <text class="t" x="542" y="238">Schema / 时钟 / 去重</text>
    <text class="t" x="542" y="266">策略与资源版本摘要</text>
    <text class="tiny" x="542" y="298">保留 occurred / observed</text>

    <rect class="box" x="758" y="142" width="190" height="178" rx="8" fill="#f2eaf7" stroke="#7d5395"/>
    <text class="h" x="778" y="176">4. 追加式证据账本</text>
    <text class="t" x="778" y="210">分区序号与前序摘要</text>
    <text class="t" x="778" y="238">周期检查点与外部锚</text>
    <text class="t" x="778" y="266">冷热层 / WORM 能力</text>
    <text class="tiny" x="778" y="298">缺口与迟到单独记录</text>

    <rect class="box" x="994" y="142" width="236" height="178" rx="8" fill="#eaf3df" stroke="#5e8c3b"/>
    <text class="h" x="1014" y="176">5. 受控查询与导出</text>
    <text class="t" x="1014" y="210">审批 / 最小权限 / 双人复核</text>
    <text class="t" x="1014" y="238">break-glass 有期限且被审计</text>
    <text class="t" x="1014" y="266">Manifest / 对象摘要 / 缺口声明</text>
    <text class="tiny" x="1014" y="298">导出本身再次产生审计事件</text>

    <path class="flow" d="M240 232 H278"/>
    <path class="flow" d="M476 232 H514"/>
    <path class="flow" d="M712 232 H750"/>
    <path class="flow" d="M948 232 H986"/>
  </g>

  <g aria-label="控制平面">
    <rect x="50" y="382" width="1180" height="238" rx="8" fill="#ffffff" stroke="#ccd6dc" stroke-width="2"/>
    <text class="h" x="74" y="418">贯穿控制平面</text>

    <rect x="74" y="444" width="252" height="126" rx="6" fill="#edf7f6" stroke="#16827b"/>
    <text class="h" x="92" y="475">数据契约</text>
    <text class="t" x="92" y="505">事件类型版本、必填字段、枚举</text>
    <text class="t" x="92" y="532">actor / subject / resource 分离</text>
    <text class="tiny" x="92" y="556">禁止自由文本承载秘密</text>

    <rect x="350" y="444" width="252" height="126" rx="6" fill="#fff5df" stroke="#d3911b"/>
    <text class="h" x="368" y="475">隐私与保留</text>
    <text class="t" x="368" y="505">目的、适用范围、保留规则版本</text>
    <text class="t" x="368" y="532">法律冻结、复核、到期删除证明</text>
    <text class="tiny" x="368" y="556">期限不是全球统一常数</text>

    <rect x="626" y="444" width="252" height="126" rx="6" fill="#f2ecf6" stroke="#7d5395"/>
    <text class="h" x="644" y="475">身份与访问</text>
    <text class="t" x="644" y="505">人、服务、代理委托链可区分</text>
    <text class="t" x="644" y="532">查询理由、审批票据、结果范围</text>
    <text class="tiny" x="644" y="556">审计管理员不能静默改证据</text>

    <rect x="902" y="444" width="302" height="126" rx="6" fill="#fbeaec" stroke="#d1495b"/>
    <text class="h" x="920" y="475">完整性与覆盖度监控</text>
    <text class="t" x="920" y="505">链断裂、重复、迟到、时钟回拨</text>
    <text class="t" x="920" y="532">预期机会数与已证明事件数配对</text>
    <text class="tiny" x="920" y="556">完整性通过 ≠ 采集事实真实或完整</text>
  </g>

  <path class="dash" d="M1110 322 C1110 350 1030 350 1030 374"/>
  <path class="dash" d="M200 374 C200 350 144 350 144 326"/>
  <text class="tiny" x="494" y="662">红色虚线：控制反馈与审计自身的审计，不代表业务因果证明</text>
</svg>
