<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">AI 评测接入 CI/CD 的分层质量门禁</title>
  <desc id="desc">展示从变更识别、快速评测、完整评测、风险门禁到灰度发布和线上监控的流水线。</desc>
  <style>
    .bg { fill: #f8fafc; }
    .title { font: 700 32px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
    .sub { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
    .h { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
    .t { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
    .small { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .stage { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; }
    .fast { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .full { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
    .gate { fill: #fff7ed; stroke: #ea580c; stroke-width: 2.5; }
    .online { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .fail { fill: #fff1f2; stroke: #e11d48; stroke-width: 2; }
    .arrow { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    .rollback { stroke: #e11d48; stroke-width: 2.5; fill: none; stroke-dasharray: 8 6; marker-end: url(#red); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#e11d48"/></marker>
  </defs>
  <rect class="bg" width="1280" height="760"/>
  <text class="title" x="56" y="58">AI 质量门禁不是一个总分阈值，而是一条分层证据链</text>
  <text class="sub" x="56" y="89">不同变更触发不同评测深度；离线指标、风险底线和线上反馈共同决定能否继续发布。</text>

  <rect class="stage" x="50" y="160" width="160" height="104" rx="8"/>
  <text class="h" x="77" y="194">1. 变更识别</text>
  <text class="t" x="77" y="221">Prompt / 数据 / 模型</text>
  <text class="t" x="77" y="244">工具 / 策略 / 代码</text>
  <path class="arrow" d="M210 212 L246 212"/>

  <rect class="stage" x="250" y="160" width="160" height="104" rx="8"/>
  <text class="h" x="277" y="194">2. 风险分级</text>
  <text class="t" x="277" y="221">影响面 × 可逆性</text>
  <text class="t" x="277" y="244">权限 × 数据敏感度</text>
  <path class="arrow" d="M410 212 L446 212"/>

  <rect class="fast" x="450" y="145" width="176" height="134" rx="8"/>
  <text class="h" x="477" y="180">3. 快速评测</text>
  <text class="t" x="477" y="207">Schema 与规则测试</text>
  <text class="t" x="477" y="230">高风险核心样本</text>
  <text class="t" x="477" y="253">小规模重复运行</text>
  <path class="arrow" d="M626 212 L662 212"/>

  <rect class="full" x="666" y="145" width="176" height="134" rx="8"/>
  <text class="h" x="693" y="180">4. 完整评测</text>
  <text class="t" x="693" y="207">分层评测集</text>
  <text class="t" x="693" y="230">成对基线比较</text>
  <text class="t" x="693" y="253">鲁棒性与安全测试</text>
  <path class="arrow" d="M842 212 L878 212"/>

  <rect class="gate" x="882" y="145" width="176" height="134" rx="8"/>
  <text class="h" x="909" y="180">5. 风险门禁</text>
  <text class="t" x="909" y="207">硬底线是否满足</text>
  <text class="t" x="909" y="230">相对退化是否超限</text>
  <text class="t" x="909" y="253">证据是否充分</text>
  <path class="arrow" d="M1058 212 L1094 212"/>

  <rect class="online" x="1098" y="145" width="136" height="134" rx="8"/>
  <text class="h" x="1121" y="180">6. 灰度</text>
  <text class="t" x="1121" y="207">影子 / 金丝雀</text>
  <text class="t" x="1121" y="230">线上护栏</text>
  <text class="t" x="1121" y="253">自动回滚</text>

  <rect class="fail" x="452" y="340" width="604" height="82" rx="8"/>
  <text class="h" x="478" y="374">阻断路径：失败不是删除一次结果再重跑</text>
  <text class="t" x="478" y="400">保留首错证据，区分真实退化、评测器异常、基础设施故障和统计不确定。</text>
  <path class="rollback" d="M970 279 L970 336"/>
  <path class="rollback" d="M754 279 L754 336"/>
  <path class="rollback" d="M538 279 L538 336"/>

  <rect class="stage" x="50" y="482" width="1184" height="178" rx="8"/>
  <text class="h" x="78" y="520">门禁同时检查四类条件</text>
  <rect x="78" y="544" width="252" height="84" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text class="h" x="98" y="570">绝对底线</text>
  <text class="t" x="98" y="596">安全、越权、数据泄漏、核心成功率</text>
  <text class="small" x="98" y="617" fill="#1d4ed8">任一硬门禁失败即阻断</text>
  <rect x="362" y="544" width="252" height="84" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text class="h" x="382" y="570">相对退化</text>
  <text class="t" x="382" y="596">候选版本相对基线的分层差异</text>
  <text class="small" x="382" y="617" fill="#6d28d9">防止总分掩盖局部回退</text>
  <rect x="646" y="544" width="252" height="84" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text class="h" x="666" y="570">统计可信度</text>
  <text class="t" x="666" y="596">样本量、重复次数、置信区间</text>
  <text class="small" x="666" y="617" fill="#c2410c">不确定时升级而非假装通过</text>
  <rect x="930" y="544" width="276" height="84" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text class="h" x="950" y="570">证据完整性</text>
  <text class="t" x="950" y="596">版本、数据、Trace、判定与审批</text>
  <text class="small" x="950" y="617" fill="#047857">任何结论都能重放与审计</text>
  <text class="sub" x="56" y="712">发布结论必须能回答：改了什么、测了什么、退化在哪里、依据是否可靠、线上失效时如何回退。</text>
</svg>
