<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Embedding 与向量检索的可复现工程流水线</title>
  <desc id="desc">展示文档经过解析、切片、模型版本化和向量写入后，查询如何在精确基线与近似索引中执行，再经过元数据过滤和证据记录输出结果；底部列出必须冻结的实验变量。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#64748b"/></marker>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.green{fill:#ecfdf5;stroke:#059669;stroke-width:2}.amber{fill:#fffbeb;stroke:#d97706;stroke-width:2}.violet{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.rose{fill:#fff1f2;stroke:#e11d48;stroke-width:2}.cyan{fill:#ecfeff;stroke:#0891b2;stroke-width:2}.arrow{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}
      .title{font:700 29px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.sub{font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}.h{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.t{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#334155}.small{font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}.white{fill:#fff}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="48" y="50">向量检索不是一次相似度调用，而是一条可版本化、可对照的流水线</text>
  <text class="sub" x="48" y="80">离线写入契约决定候选空间；在线距离、索引和过滤共同决定返回集合；Flat 精确结果提供近似检索的真值基线。</text>

  <text class="h" x="48" y="122">离线数据面</text>
  <rect class="blue" x="48" y="140" width="178" height="100" rx="8"/>
  <text class="h" x="70" y="174">文档快照</text><text class="t" x="70" y="202">doc_id · revision</text><text class="t" x="70" y="224">tenant · ACL · valid_at</text>
  <path class="arrow" d="M226 190 H260"/>
  <rect class="green" x="260" y="140" width="178" height="100" rx="8"/>
  <text class="h" x="282" y="174">解析与切片</text><text class="t" x="282" y="202">chunk_id · parent_id</text><text class="t" x="282" y="224">边界 · overlap · hash</text>
  <path class="arrow" d="M438 190 H472"/>
  <rect class="violet" x="472" y="140" width="178" height="100" rx="8"/>
  <text class="h" x="494" y="174">Embedding</text><text class="t" x="494" y="202">model_id · dimension</text><text class="t" x="494" y="224">normalization · dtype</text>
  <path class="arrow" d="M650 190 H684"/>
  <rect class="cyan" x="684" y="140" width="178" height="100" rx="8"/>
  <text class="h" x="706" y="174">向量与元数据</text><text class="t" x="706" y="202">vector · immutable IDs</text><text class="t" x="706" y="224">filter fields · checksum</text>
  <path class="arrow" d="M862 190 H896"/>
  <rect class="amber" x="896" y="140" width="336" height="100" rx="8"/>
  <text class="h" x="918" y="174">索引快照与发布</text><text class="t" x="918" y="202">Flat baseline + ANN candidate index</text><text class="t" x="918" y="224">build_id · params · corpus manifest</text>

  <text class="h" x="48" y="292">在线查询面</text>
  <rect class="panel" x="48" y="310" width="178" height="104" rx="8"/>
  <text class="h" x="70" y="345">查询契约</text><text class="t" x="70" y="373">query vector · metric</text><text class="t" x="70" y="395">tenant · ACL · as_of</text>
  <path class="arrow" d="M226 362 H268"/>
  <rect class="blue" x="268" y="292" width="230" height="74" rx="8"/>
  <text class="h" x="290" y="323">Flat 精确检索</text><text class="t" x="290" y="348">全量距离排序 · oracle top-k</text>
  <rect class="violet" x="268" y="382" width="230" height="74" rx="8"/>
  <text class="h" x="290" y="413">ANN 检索</text><text class="t" x="290" y="438">IVF / HNSW / PQ · 参数化</text>
  <path class="arrow" d="M498 329 H542"/><path class="arrow" d="M498 419 H542"/>
  <rect class="green" x="542" y="310" width="220" height="104" rx="8"/>
  <text class="h" x="564" y="345">过滤执行</text><text class="t" x="564" y="373">pre / post / iterative</text><text class="t" x="564" y="395">选择率与扫描预算</text>
  <path class="arrow" d="M762 362 H806"/>
  <rect class="amber" x="806" y="310" width="190" height="104" rx="8"/>
  <text class="h" x="828" y="345">候选与补足</text><text class="t" x="828" y="373">stable tie-break</text><text class="t" x="828" y="395">不足 k 不得静默</text>
  <path class="arrow" d="M996 362 H1040"/>
  <rect class="rose" x="1040" y="310" width="192" height="104" rx="8"/>
  <text class="h" x="1062" y="345">结果与证据</text><text class="t" x="1062" y="373">IDs · raw distance</text><text class="t" x="1062" y="395">visited · filtered · latency</text>

  <rect x="48" y="486" width="1184" height="178" rx="8" fill="#0f172a"/>
  <text class="h white" x="72" y="520">一次可复现实验必须冻结四组变量</text>
  <rect x="72" y="540" width="260" height="94" rx="7" fill="#e0f2fe"/>
  <text class="h" x="92" y="570">数据契约</text><text class="small" x="92" y="596">语料快照 · chunk manifest</text><text class="small" x="92" y="618">权限快照 · 删除墓碑</text>
  <rect x="356" y="540" width="260" height="94" rx="7" fill="#dcfce7"/>
  <text class="h" x="376" y="570">表示契约</text><text class="small" x="376" y="596">模型工件 · 维度 · 池化</text><text class="small" x="376" y="618">归一化 · 精度 · 前处理</text>
  <rect x="640" y="540" width="260" height="94" rx="7" fill="#fef3c7"/>
  <text class="h" x="660" y="570">检索契约</text><text class="small" x="660" y="596">距离方向 · k · 索引参数</text><text class="small" x="660" y="618">过滤顺序 · 超额召回</text>
  <rect x="924" y="540" width="284" height="94" rx="7" fill="#fae8ff"/>
  <text class="h" x="944" y="570">运行证据</text><text class="small" x="944" y="596">seed · build_id · 硬件 · 并发</text><text class="small" x="944" y="618">ANN recall@k · p50/p95 · 内存</text>
</svg>
