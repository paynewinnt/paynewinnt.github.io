<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">合成数据风险与失败注入测试矩阵</title>
  <desc id="desc">按生成验证相关性、标签自证与重复、偏差放大、隐私泄漏、测试污染和虚假覆盖六类风险，列出注入方式、独立证据与验收动作。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 31px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #17324d; }
      .sub { font: 400 16px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #51697d; }
      .head { font: 700 16px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #ffffff; }
      .h { font: 700 16px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #17324d; }
      .t { font: 400 14px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334f63; }
      .mono { font: 600 13px "SFMono-Regular", Consolas, monospace; fill: #3f5d70; }
      .line { stroke: #cbd9e3; stroke-width: 1.5; }
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <rect width="1280" height="102" fill="#ffffff"/>
  <rect y="100" width="1280" height="2" fill="#dce6ed"/>
  <text class="title" x="44" y="45">合成数据负向测试：故意制造“看起来通过”的坏样本</text>
  <text class="sub" x="44" y="76">测试目标是让错误在发布前留下可复核证据，而不是让生成器、验证器和覆盖报表彼此证明对方正确。</text>

  <rect x="42" y="122" width="1196" height="46" rx="7" fill="#315d77"/>
  <text class="head" x="60" y="151">风险</text>
  <text class="head" x="250" y="151">失败注入</text>
  <text class="head" x="590" y="151">需要观察的独立证据</text>
  <text class="head" x="952" y="151">门禁动作</text>

  <rect x="42" y="180" width="1196" height="78" rx="7" fill="#eaf4ff" stroke="#83aac8"/>
  <rect x="42" y="180" width="178" height="78" rx="7" fill="#d4e8f7"/>
  <text class="h" x="60" y="210">生成-验证相关</text>
  <text class="t" x="60" y="234">共同盲区</text>
  <text class="t" x="244" y="207">同模型生成并打分；替换措辞但保留</text>
  <text class="t" x="244" y="232">错误事实，观察验证器是否同步放行</text>
  <text class="mono" x="584" y="207">generator_family != validator_family</text>
  <text class="t" x="584" y="232">确定性 Oracle 与盲化人工复核差异</text>
  <text class="t" x="946" y="207">同源自证进入隔离池</text>
  <text class="t" x="946" y="232">高风险样本强制异源复核</text>

  <rect x="42" y="268" width="1196" height="78" rx="7" fill="#f2edfa" stroke="#9a85b7"/>
  <rect x="42" y="268" width="178" height="78" rx="7" fill="#e4d9f1"/>
  <text class="h" x="60" y="298">标签自证与重复</text>
  <text class="t" x="60" y="322">虚假规模</text>
  <text class="t" x="244" y="295">复制模板、同义改写、交换实体；让同一</text>
  <text class="t" x="244" y="320">标签理由在一个错误闭环里反复出现</text>
  <text class="mono" x="584" y="295">exact_hash · near_dup_cluster</text>
  <text class="t" x="584" y="320">独立标签来源与簇级错误率</text>
  <text class="t" x="946" y="295">精确重复自动阻断</text>
  <text class="t" x="946" y="320">语义近重复只生成复核候选</text>

  <rect x="42" y="356" width="1196" height="78" rx="7" fill="#fff5df" stroke="#d0a15b"/>
  <rect x="42" y="356" width="178" height="78" rx="7" fill="#f8e5bc"/>
  <text class="h" x="60" y="386">偏差放大</text>
  <text class="t" x="60" y="410">尾部消失</text>
  <text class="t" x="244" y="383">压低一个低频群体的采样权重；多轮</text>
  <text class="t" x="244" y="408">回流后比较群体比例与错误率变化</text>
  <text class="mono" x="584" y="383">real_anchor_ratio -> synthetic_ratio</text>
  <text class="t" x="584" y="408">各切片效用、拒答和伤害指标</text>
  <text class="t" x="946" y="383">超出业务容忍度即阻断</text>
  <text class="t" x="946" y="408">补真实锚点后重新生成</text>

  <rect x="42" y="444" width="1196" height="78" rx="7" fill="#eaf7ef" stroke="#78a889"/>
  <rect x="42" y="444" width="178" height="78" rx="7" fill="#d5ecdd"/>
  <text class="h" x="60" y="474">隐私泄漏</text>
  <text class="t" x="60" y="498">误称匿名</text>
  <text class="t" x="244" y="471">在私有源中放入唯一哨兵、罕见标识和</text>
  <text class="t" x="244" y="496">长片段，诱导生成器逐字复现</text>
  <text class="mono" x="584" y="471">sentinel_hits · verbatim_overlap</text>
  <text class="t" x="584" y="496">DP 机制参数、隐私单位与预算账本</text>
  <text class="t" x="946" y="471">命中即隔离并追踪后代</text>
  <text class="t" x="946" y="496">无 DP 证明不得标记 DP</text>

  <rect x="42" y="532" width="1196" height="78" rx="7" fill="#fff0f0" stroke="#c98082"/>
  <rect x="42" y="532" width="178" height="78" rx="7" fill="#f5dada"/>
  <text class="h" x="60" y="562">测试污染</text>
  <text class="t" x="60" y="586">答案泄漏</text>
  <text class="t" x="244" y="559">把密封样本、答案摘要或评测反馈放入</text>
  <text class="t" x="244" y="584">种子与 Prompt，检查派生链是否越界</text>
  <text class="mono" x="584" y="559">prohibited_ancestor · split_use</text>
  <text class="t" x="584" y="584">Prompt 指纹、生成批次和访问日志</text>
  <text class="t" x="946" y="559">整批作废并轮换密封集</text>
  <text class="t" x="946" y="584">训练与评测用途不可转换</text>

  <rect x="42" y="620" width="1196" height="62" rx="7" fill="#eef4f6" stroke="#8fa5b2"/>
  <rect x="42" y="620" width="178" height="62" rx="7" fill="#dbe7ec"/>
  <text class="h" x="60" y="648">虚假覆盖</text>
  <text class="t" x="60" y="671">格子已填满</text>
  <text class="t" x="244" y="648">生成同一成功路径的表面变体，填满</text>
  <text class="t" x="244" y="671">场景标签却不触发关键状态转换</text>
  <text class="mono" x="584" y="648">anchor_coverage · mutation_kill_rate</text>
  <text class="t" x="584" y="671">真实故障回放与业务后置条件</text>
  <text class="t" x="946" y="648">分开报告名义与证据覆盖</text>
  <text class="t" x="946" y="671">无锚点格子不得声明已验证</text>
</svg>
