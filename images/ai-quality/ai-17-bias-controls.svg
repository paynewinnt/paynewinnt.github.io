<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">LLM 裁判偏差的检测与控制矩阵</title>
  <desc id="desc">展示位置、长度、风格、自偏好和证据泄漏五类偏差，以及相应的对照实验、控制措施和监控指标。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #475569; }
      .head { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #0f172a; }
      .body { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #334155; }
      .small { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #475569; }
      .white { fill: #ffffff; }
    </style>
  </defs>

  <rect width="1280" height="800" fill="#f8fafc"/>
  <rect x="34" y="28" width="1212" height="744" rx="14" fill="#ffffff" stroke="#dbe3ee" stroke-width="2"/>
  <text x="70" y="78" class="title">LLM 裁判偏差：检测实验与控制矩阵</text>
  <text x="70" y="111" class="subtitle">偏差不能靠“提示裁判保持客观”消除，必须用可重复的反事实实验测量。</text>

  <rect x="70" y="145" width="164" height="55" rx="8" fill="#334155"/>
  <rect x="234" y="145" width="275" height="55" fill="#334155"/>
  <rect x="509" y="145" width="345" height="55" fill="#334155"/>
  <rect x="854" y="145" width="356" height="55" rx="8" fill="#334155"/>
  <text x="152" y="179" text-anchor="middle" class="head white">偏差类型</text>
  <text x="371" y="179" text-anchor="middle" class="head white">最小检测实验</text>
  <text x="681" y="179" text-anchor="middle" class="head white">主要控制</text>
  <text x="1032" y="179" text-anchor="middle" class="head white">必须监控的量</text>

  <g>
    <rect x="70" y="200" width="164" height="88" fill="#fff0f0" stroke="#dbe3ee"/>
    <rect x="234" y="200" width="275" height="88" fill="#ffffff" stroke="#dbe3ee"/>
    <rect x="509" y="200" width="345" height="88" fill="#ffffff" stroke="#dbe3ee"/>
    <rect x="854" y="200" width="356" height="88" fill="#ffffff" stroke="#dbe3ee"/>
    <text x="152" y="235" text-anchor="middle" class="head">位置偏差</text>
    <text x="152" y="262" text-anchor="middle" class="small">偏爱 A 或先出现项</text>
    <text x="254" y="235" class="body">同一对答案执行 AB / BA</text>
    <text x="254" y="262" class="body">比较胜负是否翻转</text>
    <text x="529" y="235" class="body">顺序随机化 + 双向判定</text>
    <text x="529" y="262" class="body">不一致进入平局或人工复核</text>
    <text x="874" y="235" class="body">swap consistency、A/B 选择率</text>
    <text x="874" y="262" class="body">按任务与长度切片</text>
  </g>

  <g>
    <rect x="70" y="288" width="164" height="88" fill="#fff5df" stroke="#dbe3ee"/>
    <rect x="234" y="288" width="275" height="88" fill="#ffffff" stroke="#dbe3ee"/>
    <rect x="509" y="288" width="345" height="88" fill="#ffffff" stroke="#dbe3ee"/>
    <rect x="854" y="288" width="356" height="88" fill="#ffffff" stroke="#dbe3ee"/>
    <text x="152" y="323" text-anchor="middle" class="head">长度偏差</text>
    <text x="152" y="350" text-anchor="middle" class="small">冗长被误当完整</text>
    <text x="254" y="323" class="body">保留事实不变，增删赘述</text>
    <text x="254" y="350" class="body">比较分数变化</text>
    <text x="529" y="323" class="body">rubric 显式惩罚无关信息</text>
    <text x="529" y="350" class="body">正确性与完整性分开评分</text>
    <text x="874" y="323" class="body">分数与 token 数相关系数</text>
    <text x="874" y="350" class="body">等质量不同长度差值</text>
  </g>

  <g>
    <rect x="70" y="376" width="164" height="88" fill="#eaf2ff" stroke="#dbe3ee"/>
    <rect x="234" y="376" width="275" height="88" fill="#ffffff" stroke="#dbe3ee"/>
    <rect x="509" y="376" width="345" height="88" fill="#ffffff" stroke="#dbe3ee"/>
    <rect x="854" y="376" width="356" height="88" fill="#ffffff" stroke="#dbe3ee"/>
    <text x="152" y="411" text-anchor="middle" class="head">风格偏差</text>
    <text x="152" y="438" text-anchor="middle" class="small">格式像质量</text>
    <text x="254" y="411" class="body">仅改变标题、列表、语气</text>
    <text x="254" y="438" class="body">保持信息内容相同</text>
    <text x="529" y="411" class="body">内容维度与表达维度解耦</text>
    <text x="529" y="438" class="body">对答案做规范化对照</text>
    <text x="874" y="411" class="body">格式处理前后分数漂移</text>
    <text x="874" y="438" class="body">风格切片误差</text>
  </g>

  <g>
    <rect x="70" y="464" width="164" height="88" fill="#f6edff" stroke="#dbe3ee"/>
    <rect x="234" y="464" width="275" height="88" fill="#ffffff" stroke="#dbe3ee"/>
    <rect x="509" y="464" width="345" height="88" fill="#ffffff" stroke="#dbe3ee"/>
    <rect x="854" y="464" width="356" height="88" fill="#ffffff" stroke="#dbe3ee"/>
    <text x="152" y="499" text-anchor="middle" class="head">自偏好</text>
    <text x="152" y="526" text-anchor="middle" class="small">偏爱同源表达</text>
    <text x="254" y="499" class="body">隐藏来源，按生成模型分层</text>
    <text x="254" y="526" class="body">对比人工可验证结果</text>
    <text x="529" y="499" class="body">异源裁判组合 + 盲评</text>
    <text x="529" y="526" class="body">可验证任务优先硬指标</text>
    <text x="874" y="499" class="body">source-conditioned error</text>
    <text x="874" y="526" class="body">错误答案上的自偏好率</text>
  </g>

  <g>
    <rect x="70" y="552" width="164" height="88" fill="#e8f7ef" stroke="#dbe3ee"/>
    <rect x="234" y="552" width="275" height="88" fill="#ffffff" stroke="#dbe3ee"/>
    <rect x="509" y="552" width="345" height="88" fill="#ffffff" stroke="#dbe3ee"/>
    <rect x="854" y="552" width="356" height="88" fill="#ffffff" stroke="#dbe3ee"/>
    <text x="152" y="587" text-anchor="middle" class="head">证据泄漏</text>
    <text x="152" y="614" text-anchor="middle" class="small">答案操纵裁判</text>
    <text x="254" y="587" class="body">在候选中注入评分指令</text>
    <text x="254" y="614" class="body">检查判定是否被带偏</text>
    <text x="529" y="587" class="body">数据与指令分隔、引用白名单</text>
    <text x="529" y="614" class="body">高风险样本双通道校验</text>
    <text x="874" y="587" class="body">攻击成功率、拒判率</text>
    <text x="874" y="614" class="body">无证据判词占比</text>
  </g>

  <rect x="70" y="674" width="1140" height="64" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="92" y="703" class="head">控制闭环</text>
  <text x="220" y="703" class="body">反事实样本 → 偏差指标 → 阈值/协议调整 → 人工复核 → 固化回归集</text>
  <line x1="220" y1="719" x2="1126" y2="719" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
