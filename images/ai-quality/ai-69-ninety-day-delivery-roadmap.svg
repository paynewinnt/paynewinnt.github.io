<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">测试开发工程师 90 天 AI 质量工程交付路线</title>
  <desc id="desc">路线按 0 到 30 天建立问题、数据和最小评测闭环，31 到 60 天加入 Trace、故障注入、门禁和 CI，61 到 90 天完成 runbook、演示、证据包和冻结发布，每阶段都有退出门和砍范围规则。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-12%" width="120%" height="136%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#17212b" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/>
    </marker>
    <style>
      .title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#17212b}
      .subtitle{font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#52606d}
      .phase{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#17212b}
      .head{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#17212b}
      .body{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#334155}
      .small{font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#334155}
      .white{fill:#fff}
    </style>
  </defs>
  <rect width="1280" height="720" fill="#f7f9fb"/>
  <rect x="0" y="0" width="1280" height="8" fill="#315f74"/>
  <text x="60" y="57" class="title">90 天只做一条完整证据链</text>
  <text x="60" y="87" class="subtitle">Problem → Dataset → Runner → Trace → Gate → Evidence；阶段退出门优先于功能数量</text>

  <line x1="110" y1="144" x2="1170" y2="144" stroke="#95a4af" stroke-width="4"/>
  <circle cx="110" cy="144" r="11" fill="#315f74"/>
  <circle cx="463" cy="144" r="11" fill="#7b5f91"/>
  <circle cx="816" cy="144" r="11" fill="#3d8067"/>
  <circle cx="1170" cy="144" r="11" fill="#a5683e"/>
  <text x="110" y="126" text-anchor="middle" class="small">Day 0</text>
  <text x="463" y="126" text-anchor="middle" class="small">Day 30</text>
  <text x="816" y="126" text-anchor="middle" class="small">Day 60</text>
  <text x="1170" y="126" text-anchor="middle" class="small">Day 90</text>

  <g filter="url(#shadow)">
    <rect x="60" y="184" width="360" height="370" rx="8" fill="#fff" stroke="#87a7b7"/>
    <rect x="60" y="184" width="360" height="62" rx="8" fill="#dcebf2"/>
    <rect x="60" y="238" width="360" height="8" fill="#dcebf2"/>
    <text x="84" y="216" class="phase">0-30 天</text>
    <text x="84" y="238" class="body">最小可重跑评测闭环</text>
    <text x="84" y="278" class="head">Problem / Contract</text>
    <text x="84" y="302" class="body">任务、禁止结果、数据与完成定义</text>
    <text x="84" y="338" class="head">Dataset / Evaluator</text>
    <text x="84" y="362" class="body">12 → 72 条 case，slice、oracle、digest</text>
    <text x="84" y="398" class="head">Runner / Report</text>
    <text x="84" y="422" class="body">run identity、attempt、严格分母、JSON</text>
    <rect x="84" y="458" width="312" height="70" rx="6" fill="#eef5f8"/>
    <text x="102" y="484" class="head">阶段退出门</text>
    <text x="102" y="508" class="body">改错引用后稳定失败并可定位</text>
  </g>

  <path d="M420 370 H446" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="460" y="184" width="360" height="370" rx="8" fill="#fff" stroke="#a48cb5"/>
    <rect x="460" y="184" width="360" height="62" rx="8" fill="#ece4f2"/>
    <rect x="460" y="238" width="360" height="8" fill="#ece4f2"/>
    <text x="484" y="216" class="phase">31-60 天</text>
    <text x="484" y="238" class="body">失败、恢复与交付门</text>
    <text x="484" y="278" class="head">Trace / Held-out</text>
    <text x="484" y="302" class="body">run-case-attempt、版本绑定、独立标签</text>
    <text x="484" y="338" class="head">Fault Injection</text>
    <text x="484" y="362" class="body">timeout、malformed、wrong citation、gap</text>
    <text x="484" y="398" class="head">Gate / CI</text>
    <text x="484" y="422" class="body">overall、slice、critical、recovery、证据</text>
    <rect x="484" y="458" width="312" height="70" rx="6" fill="#f3eef6"/>
    <text x="502" y="484" class="head">阶段退出门</text>
    <text x="502" y="508" class="body">故障分母可见，Gate 用非零退出码阻断</text>
  </g>

  <path d="M820 370 H846" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="860" y="184" width="360" height="370" rx="8" fill="#fff" stroke="#75a08e"/>
    <rect x="860" y="184" width="360" height="62" rx="8" fill="#deeee7"/>
    <rect x="860" y="238" width="360" height="8" fill="#deeee7"/>
    <text x="884" y="216" class="phase">61-90 天</text>
    <text x="884" y="238" class="body">可运行、可值班、可讲清</text>
    <text x="884" y="278" class="head">Runbook / Drill</text>
    <text x="884" y="302" class="body">非作者演练、时间线、复盘与 action</text>
    <text x="884" y="338" class="head">README / ADR / Evidence</text>
    <text x="884" y="362" class="body">入口、取舍、报告、包外 manifest</text>
    <text x="884" y="398" class="head">Demo / Freeze</text>
    <text x="884" y="422" class="body">12 分钟脚本、新环境重跑、v1.0 快照</text>
    <rect x="884" y="458" width="312" height="70" rx="6" fill="#eaf4ef"/>
    <text x="902" y="484" class="head">阶段退出门</text>
    <text x="902" y="508" class="body">陌生人按 README 和 runbook 独立复核</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="60" y="586" width="1160" height="82" rx="8" fill="#263844"/>
    <text x="86" y="618" class="head white">砍范围规则</text>
    <text x="216" y="618" class="body white">优先砍 UI、数据库、多模型、自动 Judge、Dashboard、真机写操作与分布式执行</text>
    <text x="86" y="646" class="head white">不可砍</text>
    <text x="216" y="646" class="body white">Contract、版本化 Dataset、Runner、Trace、Gate、负向故障、测试、README、ADR、runbook 与限制声明</text>
  </g>
  <text x="60" y="702" class="subtitle">构造路线：时间按每周约 10 小时规划；实际节奏应根据领域熟悉度、评审资源和项目风险调整。</text>
</svg>
