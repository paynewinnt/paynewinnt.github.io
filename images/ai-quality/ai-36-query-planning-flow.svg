<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">RAG 查询规划器的确定性合同与执行流</title>
  <desc id="desc">展示原始查询先提取实体、时间、否定和权限约束，再分别选择规范化、单查询改写、多查询、HyDE、数据源路由或依赖分解；所有路径受预算、去重、无答案和证据归因门禁约束。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#64748b"/></marker>
    <style>
      .bg{fill:#f8fafc}.title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.sub{font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}.h{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.t{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#334155}.small{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.green{fill:#ecfdf5;stroke:#059669;stroke-width:2}.amber{fill:#fffbeb;stroke:#d97706;stroke-width:2}.violet{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.rose{fill:#fff1f2;stroke:#e11d48;stroke-width:2}.cyan{fill:#ecfeff;stroke:#0891b2;stroke-width:2}.arrow{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="40" y="48">查询规划先保存业务约束，再选择检索动作</text>
  <text class="sub" x="40" y="76">任何生成式步骤都只是候选计划；合同校验、预算和证据回填决定它能否执行。</text>

  <rect class="blue" x="40" y="112" width="205" height="410" rx="8"/>
  <text class="h" x="60" y="145">1. QueryEnvelope</text>
  <text class="t" x="60" y="177">原始查询 raw_query</text>
  <text class="t" x="60" y="204">规范文本 normalized</text>
  <text class="t" x="60" y="231">实体 entities</text>
  <text class="t" x="60" y="258">时间范围 time_range</text>
  <text class="t" x="60" y="285">否定约束 negations</text>
  <text class="t" x="60" y="312">租户与主体 principal</text>
  <text class="t" x="60" y="339">允许源 allowed_sources</text>
  <text class="t" x="60" y="366">期望答案形态</text>
  <line x1="60" y1="392" x2="225" y2="392" stroke="#93c5fd" stroke-width="2"/>
  <text class="small" x="60" y="421" fill="#1d4ed8">不可静默删除</text>
  <text class="t" x="60" y="448">实体 · 时间 · 否定</text>
  <text class="t" x="60" y="475">权限 · 比较范围</text>
  <text class="small" x="60" y="504" fill="#be123c">缺失即拒绝计划</text>

  <path class="arrow" d="M245 317 L278 317"/>
  <text class="h" x="282" y="106">2. 六类动作各有不同语义</text>
  <rect class="green" x="282" y="126" width="186" height="112" rx="8"/>
  <text class="h" x="300" y="157">Normalization</text>
  <text class="t" x="300" y="185">空白、大小写、Unicode</text>
  <text class="small" x="300" y="214" fill="#047857">不改变问题含义</text>
  <rect class="cyan" x="486" y="126" width="186" height="112" rx="8"/>
  <text class="h" x="504" y="157">Rewrite</text>
  <text class="t" x="504" y="185">生成一个检索表达</text>
  <text class="small" x="504" y="214" fill="#0e7490">必须保留约束</text>
  <rect class="violet" x="690" y="126" width="186" height="112" rx="8"/>
  <text class="h" x="708" y="157">Multi-query</text>
  <text class="t" x="708" y="185">并行覆盖多个表述</text>
  <text class="small" x="708" y="214" fill="#6d28d9">共享同一意图</text>

  <rect class="amber" x="282" y="258" width="186" height="112" rx="8"/>
  <text class="h" x="300" y="289">HyDE</text>
  <text class="t" x="300" y="317">假设文档只用于向量</text>
  <text class="small" x="300" y="346" fill="#b45309">不是事实证据</text>
  <rect class="blue" x="486" y="258" width="186" height="112" rx="8"/>
  <text class="h" x="504" y="289">Source routing</text>
  <text class="t" x="504" y="317">选择数据源与索引</text>
  <text class="small" x="504" y="346" fill="#1d4ed8">ACL 先于检索</text>
  <rect class="rose" x="690" y="258" width="186" height="112" rx="8"/>
  <text class="h" x="708" y="289">Decomposition</text>
  <text class="t" x="708" y="317">子问题与依赖 DAG</text>
  <text class="small" x="708" y="346" fill="#be123c">答案逐步绑定</text>

  <rect class="box" x="282" y="394" width="594" height="128" rx="8"/>
  <text class="h" x="302" y="425">3. PlannerContract</text>
  <text class="t" x="302" y="454">plan_id · planner_version · strategy · steps · dependency_ids</text>
  <text class="t" x="302" y="481">max_queries · max_hops · max_candidates · token/cost/deadline</text>
  <text class="small" x="302" y="508" fill="#475569">拓扑无环、预算可加总、路由在允许集合、每一步可追踪</text>

  <path class="arrow" d="M876 317 L912 317"/>
  <rect class="green" x="916" y="112" width="324" height="188" rx="8"/>
  <text class="h" x="938" y="145">4. 受控执行与合并</text>
  <text class="t" x="938" y="176">按依赖就绪顺序执行</text>
  <text class="t" x="938" y="203">候选按 canonical_id 去重</text>
  <text class="t" x="938" y="230">保留来源、步骤与排名贡献</text>
  <text class="t" x="938" y="257">任一预算耗尽立即停止扩张</text>
  <text class="small" x="938" y="284" fill="#047857">输出 EvidenceLedger</text>

  <rect class="amber" x="916" y="322" width="324" height="200" rx="8"/>
  <text class="h" x="938" y="355">5. 结果门禁</text>
  <text class="t" x="938" y="386">有证据：回填 claim / source / step</text>
  <text class="t" x="938" y="413">无证据：NO_ANSWER，不生成事实</text>
  <text class="t" x="938" y="440">需澄清：返回缺失槽位</text>
  <text class="t" x="938" y="467">越权路由：DENIED，不尝试旁路</text>
  <text class="small" x="938" y="500" fill="#b45309">Schema 合法仍需业务断言</text>

  <rect x="40" y="558" width="1200" height="122" rx="8" fill="#fff" stroke="#fda4af" stroke-width="2"/>
  <text class="h" x="60" y="589">失败反馈进入明确分类，不用“检索效果差”概括</text>
  <rect class="rose" x="60" y="608" width="208" height="48" rx="6"/><text class="small" x="78" y="638" fill="#be123c">INTENT_DRIFT · 约束丢失</text>
  <rect class="amber" x="286" y="608" width="208" height="48" rx="6"/><text class="small" x="304" y="638" fill="#b45309">DEPENDENCY · 子问题断链</text>
  <rect class="violet" x="512" y="608" width="208" height="48" rx="6"/><text class="small" x="530" y="638" fill="#6d28d9">BUDGET · 查询扩张失控</text>
  <rect class="cyan" x="738" y="608" width="208" height="48" rx="6"/><text class="small" x="756" y="638" fill="#0e7490">ROUTING · 数据源或权限</text>
  <rect class="blue" x="964" y="608" width="252" height="48" rx="6"/><text class="small" x="982" y="638" fill="#1d4ed8">ATTRIBUTION · 证据无法归因</text>
</svg>
