<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">AI 发布门禁判定模型</title>
  <desc id="desc">展示硬门禁、相对退化、统计置信与风险加权共同形成通过、人工复核和阻断三个决策区。</desc>
  <style>
    .bg { fill: #f8fafc; }
    .title { font: 700 32px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
    .sub { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
    .h { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
    .t { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
    .code { font: 600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0f172a; }
    .pass { fill: #ecfdf5; stroke: #059669; stroke-width: 2.5; }
    .review { fill: #fefce8; stroke: #ca8a04; stroke-width: 2.5; }
    .block { fill: #fff1f2; stroke: #e11d48; stroke-width: 2.5; }
    .input { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; }
    .calc { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .arrow { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
  <rect class="bg" width="1280" height="760"/>
  <text class="title" x="58" y="58">门禁判定要保留“灰区”，不能把统计不确定强行压成通过</text>
  <text class="sub" x="58" y="89">先检查不可妥协的安全底线，再比较候选与基线，最后结合风险与证据决定发布动作。</text>

  <rect class="input" x="58" y="142" width="252" height="96" rx="8"/>
  <text class="h" x="82" y="175">候选评测结果</text>
  <text class="t" x="82" y="202">按场景、风险、语言、工具分层</text>
  <text class="t" x="82" y="224">保留每个样本的配对结果</text>
  <rect class="input" x="58" y="270" width="252" height="96" rx="8"/>
  <text class="h" x="82" y="303">冻结基线</text>
  <text class="t" x="82" y="330">模型、Prompt、数据、策略版本</text>
  <text class="t" x="82" y="352">同一评测器和执行环境</text>
  <rect class="input" x="58" y="398" width="252" height="96" rx="8"/>
  <text class="h" x="82" y="431">风险与门禁策略</text>
  <text class="t" x="82" y="458">硬底线、退化预算、样本要求</text>
  <text class="t" x="82" y="480">豁免权限与最长有效期</text>

  <path class="arrow" d="M310 190 C360 190 360 234 410 234"/>
  <path class="arrow" d="M310 318 C360 318 360 286 410 286"/>
  <path class="arrow" d="M310 446 C360 446 360 338 410 338"/>

  <rect class="calc" x="414" y="164" width="374" height="246" rx="8"/>
  <text class="h" x="442" y="200">分层门禁计算</text>
  <text class="code" x="442" y="228">hard_fail = violates(metric, op, limit)</text>
  <text class="code" x="442" y="260">delta_g = candidate_g - baseline_g</text>
  <text class="code" x="442" y="292">loss_g = max(-delta_g, 0)</text>
  <text class="code" x="442" y="324">risk_loss = sum(weight_g * loss_g)</text>
  <text class="code" x="442" y="356">uncertain = CI(delta_g) crosses budget</text>
  <text class="t" x="442" y="388">g 表示业务或风险切片，不只看全局平均。</text>

  <path class="arrow" d="M788 220 L854 170"/>
  <path class="arrow" d="M788 277 L854 317"/>
  <path class="arrow" d="M788 336 L854 500"/>

  <rect class="pass" x="858" y="118" width="350" height="128" rx="8"/>
  <text class="h" x="886" y="154">通过：进入受控灰度</text>
  <text class="t" x="886" y="183">硬底线满足；关键分层未超退化预算；</text>
  <text class="t" x="886" y="207">证据充分，并配置线上护栏与回滚条件。</text>

  <rect class="review" x="858" y="268" width="350" height="128" rx="8"/>
  <text class="h" x="886" y="304">人工复核：补证据后再判</text>
  <text class="t" x="886" y="333">置信区间跨越预算、评测器分歧、样本不足，</text>
  <text class="t" x="886" y="357">或低风险收益与局部退化需要业务权衡。</text>

  <rect class="block" x="858" y="418" width="350" height="128" rx="8"/>
  <text class="h" x="886" y="454">阻断：修复或回滚</text>
  <text class="t" x="886" y="483">安全硬门禁失败、关键任务明显退化、</text>
  <text class="t" x="886" y="507">证据链不完整，或豁免条件已经失效。</text>

  <rect x="414" y="446" width="374" height="174" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="h" x="442" y="482">判定顺序</text>
  <text class="t" x="442" y="516">1. 硬安全性质优先，不允许被平均分抵消</text>
  <text class="t" x="442" y="548">2. 使用配对结果比较同一样本上的变化</text>
  <text class="t" x="442" y="580">3. 不确定结论进入复核，不自动放行</text>
  <text class="t" x="442" y="612">4. 发布后继续用线上护栏验证外部有效性</text>

  <rect x="58" y="652" width="1150" height="54" rx="8" fill="#0f172a"/>
  <text x="84" y="685" style="font: 600 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #ffffff;">完整证据包 = 变更清单 + 版本指纹 + 评测集版本 + 样本级结果 + Trace + 门禁决策 + 审批/豁免 + 回滚目标</text>
</svg>
