<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 红队证据、Finding、修复与复测闭环</title>
  <desc id="desc">展示红队从授权规则和场景版本开始，构建隔离环境并执行，采集跨信任域证据、运行安全与效用 Oracle、聚类 Finding、声明修复性质，再运行原始、变体、跨入口、故障和合法对照复测。通过后限定范围关闭，失败则沿返回箭头重新打开。</desc>
  <defs>
    <marker id="arrow47b" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#64748b"/>
    </marker>
    <marker id="return47b" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#dc2626"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}.title{font:700 32px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.sub{font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}.head{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.text{font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#334155}.small{font:500 12px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.arrow{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow47b)}.return{fill:none;stroke:#dc2626;stroke-width:3;stroke-dasharray:7 5;marker-end:url(#return47b)}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="38" y="45">Finding 关闭需要新证据，不能靠状态字段自证</text>
  <text class="sub" x="38" y="73">旧版先重现，新版再验证安全性质；原始攻击失效只是起点，变体、故障与合法效用共同决定闭环。</text>

  <text class="head" x="38" y="111">发现链：授权 → 运行 → 事实 → Finding</text>
  <rect x="38" y="132" width="210" height="128" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text class="head" x="56" y="161">1. RoE + Scenario</text>
  <text class="text" x="56" y="190">资产 · 边界 · 前提</text><text class="text" x="56" y="214">安全性质 · 对照 · 停止</text><text class="small" x="56" y="239">scenario_id + version</text>
  <rect x="288" y="132" width="210" height="128" rx="7" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text class="head" x="306" y="161">2. Isolated Run</text>
  <text class="text" x="306" y="190">profile · seed · attempt</text><text class="text" x="306" y="214">短期能力 · 模拟副作用</text><text class="small" x="306" y="239">操作员干预也写事件</text>
  <rect x="538" y="132" width="210" height="128" rx="7" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text class="head" x="556" y="161">3. Evidence Package</text>
  <text class="text" x="556" y="190">Trace · policy · tool</text><text class="text" x="556" y="214">before/after · manifest</text><text class="small" x="556" y="239">跨信任域 + SHA-256</text>
  <rect x="788" y="132" width="210" height="128" rx="7" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text class="head" x="806" y="161">4. Oracle</text>
  <text class="text" x="806" y="190">安全：pass/fail/unknown</text><text class="text" x="806" y="214">效用：合法任务后置条件</text><text class="small" x="806" y="239">proposed ≠ committed</text>
  <rect x="1038" y="132" width="204" height="128" rx="7" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/>
  <text class="head" x="1056" y="161">5. Finding / Triage</text>
  <text class="text" x="1056" y="190">性质 · 范围 · 前提</text><text class="text" x="1056" y="214">后果 · 严重度 · owner</text><text class="small" x="1056" y="239">观测与推断分栏</text>
  <path class="arrow" d="M248 196 L288 196"/><path class="arrow" d="M498 196 L538 196"/><path class="arrow" d="M748 196 L788 196"/><path class="arrow" d="M998 196 L1038 196"/>

  <path class="arrow" d="M1140 260 L1140 316"/>
  <text class="head" x="38" y="323">修复链：性质声明 → 复测矩阵 → 决策</text>
  <rect x="1038" y="342" width="204" height="128" rx="7" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text class="head" x="1056" y="371">6. Fix Contract</text>
  <text class="text" x="1056" y="400">改变组件与版本</text><text class="text" x="1056" y="424">声称保护性质</text><text class="small" x="1056" y="449">临时控制 + 残余风险</text>
  <rect x="760" y="342" width="238" height="128" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text class="head" x="778" y="371">7. Retest Matrix</text>
  <text class="text" x="778" y="399">原始 · 语义变体 · 跨入口</text><text class="text" x="778" y="423">权限 · 故障 · 多次尝试</text><text class="small" x="778" y="448">合法对照 + 未影响回归</text>
  <rect x="482" y="342" width="238" height="128" rx="7" fill="#ecfdf5" stroke="#14b8a6" stroke-width="2"/>
  <text class="head" x="500" y="371">8. Evidence Review</text>
  <text class="text" x="500" y="399">旧 profile 可重现</text><text class="text" x="500" y="423">新 profile 无未授权 commit</text><text class="small" x="500" y="448">证据完整 · 效用达标</text>
  <rect x="248" y="342" width="194" height="128" rx="7" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text class="head" x="266" y="371">9. Decision</text>
  <text class="text" x="266" y="399">close / partial</text><text class="text" x="266" y="423">reopen / risk accept</text><text class="small" x="266" y="448">approver + 适用范围</text>
  <rect x="38" y="342" width="170" height="128" rx="7" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text class="head" x="56" y="371">10. Regression</text>
  <text class="text" x="56" y="399">发布门禁</text><text class="text" x="56" y="423">持续场景库</text><text class="small" x="56" y="448">新版本触发复跑</text>
  <path class="arrow" d="M1038 406 L998 406"/><path class="arrow" d="M760 406 L720 406"/><path class="arrow" d="M482 406 L442 406"/><path class="arrow" d="M248 406 L208 406"/>

  <path class="return" d="M345 470 C345 535 1010 535 1140 470"/>
  <text class="text" x="587" y="526" fill="#b91c1c">复测失败、范围扩大或新变体重现 → reopened → 回到 Finding / Fix</text>
  <path class="return" d="M123 470 C123 585 143 585 143 260"/>
  <text class="small" x="50" y="552" fill="#b91c1c">版本/工具/策略变化</text><text class="small" x="50" y="570" fill="#b91c1c">重新进入授权场景</text>

  <rect x="38" y="592" width="1204" height="94" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text class="head" x="58" y="621">每一跳都保留可审计对象</text>
  <rect x="58" y="636" width="212" height="34" rx="5" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text class="small" x="72" y="658">scenario_version + RoE</text>
  <rect x="290" y="636" width="212" height="34" rx="5" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text class="small" x="304" y="658">profile + run + manifest</text>
  <rect x="522" y="636" width="212" height="34" rx="5" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text class="small" x="536" y="658">finding + severity rationale</text>
  <rect x="754" y="636" width="212" height="34" rx="5" fill="#ecfdf5" stroke="#4ade80" stroke-width="2"/>
  <text class="small" x="768" y="658">fix property + residual risk</text>
  <rect x="986" y="636" width="236" height="34" rx="5" fill="#f0fdfa" stroke="#2dd4bf" stroke-width="2"/>
  <text class="small" x="1000" y="658">retest evidence + approver + scope</text>
</svg>
