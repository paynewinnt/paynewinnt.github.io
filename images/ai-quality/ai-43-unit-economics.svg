<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 应用质量约束下的单位任务经济模型</title>
  <desc id="desc">展示质量调整单位成本的分子包含直接、共享、失败与人工成本，分母只计通过业务验收且满足质量底线的任务，并通过事前预算、运行中门禁、事后回归控制优化。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#64748b"/></marker>
    <style>
      .bg{fill:#f8fafc}.title{font:700 34px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.sub{font:400 18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}.h{font:700 21px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.t{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#334155}.small{font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.arrow{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="48" y="54">便宜的调用不等于便宜的任务，单位经济必须经过质量验收</text>
  <text class="sub" x="48" y="86">示例公式用于治理口径；权重、预算和质量阈值都必须由具体业务风险与历史真值校准。</text>

  <rect x="48" y="132" width="430" height="352" rx="7" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text class="h" x="76" y="170">分子：Allocated Cost</text>
  <rect class="box" x="76" y="194" width="176" height="78" rx="7"/><text class="h" x="96" y="226">直接成本</text><text class="small" x="96" y="252">模型 · 检索 · 工具</text>
  <rect class="box" x="274" y="194" width="176" height="78" rx="7"/><text class="h" x="294" y="226">共享成本</text><text class="small" x="294" y="252">GPU · 平台 · 网络</text>
  <rect class="box" x="76" y="292" width="176" height="78" rx="7"/><text class="h" x="96" y="324">失败浪费</text><text class="small" x="96" y="350">重试 · 超时 · 废弃</text>
  <rect class="box" x="274" y="292" width="176" height="78" rx="7"/><text class="h" x="294" y="324">人工成本</text><text class="small" x="294" y="350">复核 · 纠错 · 申诉</text>
  <text class="t" x="76" y="414">保留失败成本，不能从报表中删除</text>
  <text class="t" x="76" y="446">共享成本按版本化规则守恒分摊</text>

  <text x="500" y="306" style="font:700 48px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#475569">÷</text>

  <rect x="550" y="132" width="306" height="352" rx="7" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text class="h" x="578" y="170">分母：合格任务</text>
  <circle cx="613" cy="224" r="17" fill="#16a34a"/><path d="M604 224 L611 231 L624 215" fill="none" stroke="#fff" stroke-width="4"/>
  <text class="t" x="646" y="230">业务后置条件成立</text>
  <circle cx="613" cy="278" r="17" fill="#2563eb"/><path d="M604 278 L611 285 L624 269" fill="none" stroke="#fff" stroke-width="4"/>
  <text class="t" x="646" y="284">质量与安全底线通过</text>
  <circle cx="613" cy="332" r="17" fill="#7c3aed"/><path d="M604 332 L611 339 L624 323" fill="none" stroke="#fff" stroke-width="4"/>
  <text class="t" x="646" y="338">去重且归属目标任务</text>
  <circle cx="613" cy="386" r="17" fill="#d97706"/><path d="M604 386 L611 393 L624 377" fill="none" stroke="#fff" stroke-width="4"/>
  <text class="t" x="646" y="392">观察窗口已完整</text>
  <text class="small" x="578" y="446">未验收任务保留在分子，不进入分母</text>

  <path class="arrow" d="M856 308 L914 308"/>
  <rect x="914" y="132" width="318" height="352" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text class="h" x="942" y="170">结果与三道门禁</text>
  <text x="942" y="220" style="font:700 23px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#1d4ed8">质量调整单位成本</text>
  <text class="t" x="942" y="254">= 分摊成本 / 合格任务数</text>
  <line x1="942" y1="278" x2="1204" y2="278" stroke="#bfdbfe" stroke-width="2"/>
  <text class="h" x="942" y="316">事前：预算预留</text><text class="small" x="942" y="342">按 P50/P95 用量估算并留余量</text>
  <text class="h" x="942" y="382">运行中：增量门禁</text><text class="small" x="942" y="408">限制循环、工具与剩余预算</text>
  <text class="h" x="942" y="448">事后：优化回归</text><text class="small" x="942" y="474">成本下降且质量底线不退化</text>

  <rect x="48" y="530" width="1184" height="142" rx="7" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="h" x="76" y="566">决策顺序</text>
  <rect x="76" y="590" width="244" height="54" rx="7" fill="#dbeafe"/><text class="t" x="100" y="623">1. 先守质量与安全底线</text>
  <path class="arrow" d="M320 617 L354 617"/>
  <rect x="354" y="590" width="244" height="54" rx="7" fill="#dcfce7"/><text class="t" x="378" y="623">2. 再比较合格任务成本</text>
  <path class="arrow" d="M598 617 L632 617"/>
  <rect x="632" y="590" width="244" height="54" rx="7" fill="#fef3c7"/><text class="t" x="656" y="623">3. 验证尾延迟与容量</text>
  <path class="arrow" d="M876 617 L910 617"/>
  <rect x="910" y="590" width="294" height="54" rx="7" fill="#ffe4e6"/><text class="t" x="934" y="623">4. 失败则回滚，不粉饰节省</text>
</svg>
