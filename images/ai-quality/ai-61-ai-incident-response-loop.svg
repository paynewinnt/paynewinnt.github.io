<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 事故从发现止损到评测回灌的响应闭环</title>
  <desc id="desc">展示信号检测、事故确认、隔离止损、兼容回滚、业务恢复、复盘行动项和评测集回灌七个阶段，证据保全与分层沟通作为贯穿控制。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0 L0 6 L9 3 Z" fill="#344f5e"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1b2c35" flood-opacity="0.14"/>
    </filter>
    <style>
      .bg{fill:#f5f7f8}.title{font:700 30px Arial,"PingFang SC",sans-serif;fill:#17262f}.sub{font:15px Arial,"PingFang SC",sans-serif;fill:#53646d}.h{font:700 17px Arial,"PingFang SC",sans-serif;fill:#1d2d35}.t{font:14px Arial,"PingFang SC",sans-serif;fill:#34454e}.tiny{font:13px Arial,"PingFang SC",sans-serif;fill:#596a73}.stage{stroke-width:2;filter:url(#shadow)}.flow{fill:none;stroke:#344f5e;stroke-width:3;marker-end:url(#arrow)}.feedback{fill:none;stroke:#c94f5d;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="52" y="52">AI 事故响应：先控制影响，再用证据恢复与学习</text>
  <text class="sub" x="52" y="80">事件不是自动等于事故；回滚成功必须同时验证业务后置条件、质量、安全与证据完整性</text>

  <g aria-label="事故响应主流程">
    <rect class="stage" x="44" y="132" width="150" height="154" rx="8" fill="#e5f3f2" stroke="#19877f"/>
    <text class="h" x="64" y="166">1. 检测信号</text>
    <text class="t" x="64" y="198">用户症状 / SLI</text>
    <text class="t" x="64" y="224">质量与安全门禁</text>
    <text class="t" x="64" y="250">业务结果对账</text>

    <rect class="stage" x="216" y="132" width="150" height="154" rx="8" fill="#fff4d8" stroke="#d3911b"/>
    <text class="h" x="236" y="166">2. 确认事故</text>
    <text class="t" x="236" y="198">影响 / 范围 / 速度</text>
    <text class="t" x="236" y="224">观测与推断分离</text>
    <text class="t" x="236" y="250">定级、角色、节奏</text>

    <rect class="stage" x="388" y="132" width="150" height="154" rx="8" fill="#fde7e9" stroke="#c94f5d"/>
    <text class="h" x="408" y="166">3. 隔离止损</text>
    <text class="t" x="408" y="198">工具 kill switch</text>
    <text class="t" x="408" y="224">路由人工 / 限流</text>
    <text class="t" x="408" y="250">保全证据与对账</text>

    <rect class="stage" x="560" y="132" width="150" height="154" rx="8" fill="#eee8f5" stroke="#795695"/>
    <text class="h" x="580" y="166">4. 兼容回滚</text>
    <text class="t" x="580" y="198">依赖图与已知好包</text>
    <text class="t" x="580" y="224">缓存 / 会话 / Schema</text>
    <text class="t" x="580" y="250">灰度与失败回退</text>

    <rect class="stage" x="732" y="132" width="150" height="154" rx="8" fill="#e7eff8" stroke="#4e709f"/>
    <text class="h" x="752" y="166">5. 验证恢复</text>
    <text class="t" x="752" y="198">HTTP + 业务结果</text>
    <text class="t" x="752" y="224">质量 / 安全 / 审计</text>
    <text class="t" x="752" y="250">连续观察窗</text>

    <rect class="stage" x="904" y="132" width="150" height="154" rx="8" fill="#eaf3df" stroke="#648e42"/>
    <text class="h" x="924" y="166">6. 复盘行动</text>
    <text class="t" x="924" y="198">时间线与系统因素</text>
    <text class="t" x="924" y="224">Owner / 到期 / 证据</text>
    <text class="t" x="924" y="250">复发监控</text>

    <rect class="stage" x="1076" y="132" width="160" height="154" rx="8" fill="#e4f1ec" stroke="#2f8468"/>
    <text class="h" x="1096" y="166">7. 评测回灌</text>
    <text class="t" x="1096" y="198">最小化场景模板</text>
    <text class="t" x="1096" y="224">训练 / 回归隔离</text>
    <text class="t" x="1096" y="250">变体与污染检测</text>

    <path class="flow" d="M194 209 H208"/><path class="flow" d="M366 209 H380"/>
    <path class="flow" d="M538 209 H552"/><path class="flow" d="M710 209 H724"/>
    <path class="flow" d="M882 209 H896"/><path class="flow" d="M1054 209 H1068"/>
  </g>

  <g aria-label="贯穿控制">
    <rect x="44" y="346" width="1192" height="206" rx="8" fill="#fff" stroke="#c7d2d8" stroke-width="2"/>
    <text class="h" x="68" y="380">贯穿响应的四条控制线</text>

    <rect x="68" y="405" width="262" height="112" rx="6" fill="#f0f7f6" stroke="#19877f"/>
    <text class="h" x="86" y="437">证据保全</text>
    <text class="t" x="86" y="465">版本摘要、事件时间、决策记录</text>
    <text class="t" x="86" y="490">最小化冻结，未知与缺口显式化</text>

    <rect x="358" y="405" width="262" height="112" rx="6" fill="#fff5df" stroke="#d3911b"/>
    <text class="h" x="376" y="437">事件指挥</text>
    <text class="t" x="376" y="465">IC / Operations / Comms / Evidence</text>
    <text class="t" x="376" y="490">决策者、时间盒、下一检查点</text>

    <rect x="648" y="405" width="262" height="112" rx="6" fill="#f2ecf6" stroke="#795695"/>
    <text class="h" x="666" y="437">分层沟通</text>
    <text class="t" x="666" y="465">已知事实、未知、用户影响</text>
    <text class="t" x="666" y="490">当前动作与下一次更新时间</text>

    <rect x="938" y="405" width="274" height="112" rx="6" fill="#edf2f8" stroke="#4e709f"/>
    <text class="h" x="956" y="437">状态与门禁</text>
    <text class="t" x="956" y="465">声明、止损、稳定、恢复、关闭</text>
    <text class="t" x="956" y="490">任何失败均可回到止损阶段</text>
  </g>

  <path class="feedback" d="M1156 294 C1156 636 128 636 128 294"/>
  <text class="tiny" x="420" y="612">回灌后的回归、演练和监控重新进入检测体系；它不是把事故原文直接加入训练集</text>
  <text class="tiny" x="446" y="674">构造流程：各组织需按业务风险、法规、合同与值班能力裁剪</text>
</svg>
