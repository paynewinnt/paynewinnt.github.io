<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 组件回滚兼容性与恢复门禁矩阵</title>
  <desc id="desc">矩阵列出模型、提示词、知识、工具适配器、策略和路由回滚时的兼容依赖、隐藏状态和恢复成功条件，强调 HTTP 成功不足以证明恢复。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0 L0 6 L9 3 Z" fill="#435661"/>
    </marker>
    <style>
      .bg{fill:#f7f8f8}.title{font:700 29px Arial,"PingFang SC",sans-serif;fill:#172730}.sub{font:15px Arial,"PingFang SC",sans-serif;fill:#53656e}.head{font:700 15px Arial,"PingFang SC",sans-serif;fill:#fff}.row{font:700 15px Arial,"PingFang SC",sans-serif;fill:#20313a}.cell{font:13px Arial,"PingFang SC",sans-serif;fill:#31434d}.tiny{font:12.5px Arial,"PingFang SC",sans-serif;fill:#586a73}.grid{stroke:#c6d0d5;stroke-width:1}.arrow{fill:none;stroke:#435661;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="45" y="48">回滚不是单组件倒带：依赖兼容先于流量切换</text>
  <text class="sub" x="45" y="76">每个已知好版本都应是带依赖摘要的发布包；恢复门禁同时检查用户、业务、质量、安全、审计与容量</text>

  <g aria-label="组件兼容矩阵">
    <rect x="45" y="106" width="1190" height="400" rx="7" fill="#fff" stroke="#aebbc1" stroke-width="2"/>
    <rect x="45" y="106" width="1190" height="56" rx="7" fill="#334d5c"/>
    <line class="grid" x1="198" y1="106" x2="198" y2="506"/>
    <line class="grid" x1="476" y1="106" x2="476" y2="506"/>
    <line class="grid" x1="742" y1="106" x2="742" y2="506"/>
    <line class="grid" x1="1002" y1="106" x2="1002" y2="506"/>
    <text class="head" x="86" y="140">回滚组件</text>
    <text class="head" x="258" y="140">必须固定的依赖</text>
    <text class="head" x="538" y="140">容易遗漏的状态</text>
    <text class="head" x="802" y="140">回滚前兼容检查</text>
    <text class="head" x="1044" y="140">恢复成功证据</text>

    <rect x="45" y="162" width="1190" height="57" fill="#eef7f5"/>
    <rect x="45" y="219" width="1190" height="57" fill="#fff8e7"/>
    <rect x="45" y="276" width="1190" height="57" fill="#eef2f8"/>
    <rect x="45" y="333" width="1190" height="57" fill="#f3edf7"/>
    <rect x="45" y="390" width="1190" height="57" fill="#fdebed"/>
    <rect x="45" y="447" width="1190" height="59" fill="#edf4e8"/>
    <line class="grid" x1="45" y1="219" x2="1235" y2="219"/><line class="grid" x1="45" y1="276" x2="1235" y2="276"/>
    <line class="grid" x1="45" y1="333" x2="1235" y2="333"/><line class="grid" x1="45" y1="390" x2="1235" y2="390"/>
    <line class="grid" x1="45" y1="447" x2="1235" y2="447"/>

    <text class="row" x="69" y="196">模型</text>
    <text class="cell" x="216" y="185">Prompt、工具调用协议</text><text class="cell" x="216" y="204">Tokenizer、解码参数</text>
    <text class="cell" x="494" y="185">供应商别名漂移</text><text class="cell" x="494" y="204">会话与前缀缓存</text>
    <text class="cell" x="760" y="185">能力、上下文、Schema</text><text class="cell" x="760" y="204">区域与配额可用</text>
    <text class="cell" x="1020" y="185">任务质量与安全切片</text><text class="cell" x="1020" y="204">延迟、成本无回归</text>

    <text class="row" x="69" y="253">Prompt</text>
    <text class="cell" x="216" y="242">模型能力、输出契约</text><text class="cell" x="216" y="261">策略原因码、知识结构</text>
    <text class="cell" x="494" y="242">模板缓存与会话历史</text><text class="cell" x="494" y="261">A/B 黏性分桶</text>
    <text class="cell" x="760" y="242">字段、工具名、引用格式</text><text class="cell" x="760" y="261">旧会话迁移或排空</text>
    <text class="cell" x="1020" y="242">结构有效 + 业务正确</text><text class="cell" x="1020" y="261">拒绝与澄清不退化</text>

    <text class="row" x="69" y="310">知识</text>
    <text class="cell" x="216" y="299">解析、chunk、Embedding</text><text class="cell" x="216" y="318">ACL、版本与生效时间</text>
    <text class="cell" x="494" y="299">索引别名、缓存、删除</text><text class="cell" x="494" y="318">增量更新水位</text>
    <text class="cell" x="760" y="299">旧快照权限与 Schema</text><text class="cell" x="760" y="318">撤销内容不可复活</text>
    <text class="cell" x="1020" y="299">新鲜度、权限、引用</text><text class="cell" x="1020" y="318">冲突裁决正确</text>

    <text class="row" x="69" y="367">工具适配器</text>
    <text class="cell" x="216" y="356">输入单位、幂等协议</text><text class="cell" x="216" y="375">目标 API 与凭据范围</text>
    <text class="cell" x="494" y="356">在途请求、重试队列</text><text class="cell" x="494" y="375">业务提交与补偿</text>
    <text class="cell" x="760" y="356">旧适配器能否读新消息</text><text class="cell" x="760" y="375">副作用状态先对账</text>
    <text class="cell" x="1020" y="356">金额/对象后置条件</text><text class="cell" x="1020" y="375">重复副作用为零</text>

    <text class="row" x="69" y="424">策略</text>
    <text class="cell" x="216" y="413">特征定义、身份、工具阶段</text><text class="cell" x="216" y="432">法规/合同适用快照</text>
    <text class="cell" x="494" y="413">决策缓存、临时例外</text><text class="cell" x="494" y="432">人工审批有效期</text>
    <text class="cell" x="760" y="413">旧规则仍适用于当前事实</text><text class="cell" x="760" y="432">高风险默认拒绝</text>
    <text class="cell" x="1020" y="413">越权动作硬门为零</text><text class="cell" x="1020" y="432">理由码与审计齐全</text>

    <text class="row" x="69" y="481">路由</text>
    <text class="cell" x="216" y="470">候选包、健康、容量</text><text class="cell" x="216" y="489">租户/地区/风险约束</text>
    <text class="cell" x="494" y="470">黏性会话、边缘缓存</text><text class="cell" x="494" y="489">异步任务与影子流量</text>
    <text class="cell" x="760" y="470">所有分桶指向兼容包</text><text class="cell" x="760" y="489">故障转移不越数据域</text>
    <text class="cell" x="1020" y="470">受影响 cohort 清零</text><text class="cell" x="1020" y="489">容量与队列稳定</text>
  </g>

  <g aria-label="恢复门禁">
    <text class="row" x="48" y="562">恢复门禁</text>
    <rect x="146" y="535" width="132" height="54" rx="6" fill="#e7f2f0" stroke="#19877f"/><text class="row" x="177" y="568">用户症状</text>
    <rect x="314" y="535" width="132" height="54" rx="6" fill="#fff1cc" stroke="#d3911b"/><text class="row" x="344" y="568">业务结果</text>
    <rect x="482" y="535" width="132" height="54" rx="6" fill="#e9eef7" stroke="#4e709f"/><text class="row" x="513" y="568">质量切片</text>
    <rect x="650" y="535" width="132" height="54" rx="6" fill="#f3e9f6" stroke="#795695"/><text class="row" x="681" y="568">安全策略</text>
    <rect x="818" y="535" width="132" height="54" rx="6" fill="#fde7ea" stroke="#c94f5d"/><text class="row" x="849" y="568">审计对账</text>
    <rect x="986" y="535" width="132" height="54" rx="6" fill="#eaf3e3" stroke="#648e42"/><text class="row" x="1017" y="568">容量成本</text>
    <path class="arrow" d="M278 562 H306"/><path class="arrow" d="M446 562 H474"/><path class="arrow" d="M614 562 H642"/>
    <path class="arrow" d="M782 562 H810"/><path class="arrow" d="M950 562 H978"/>
    <rect x="440" y="625" width="400" height="54" rx="7" fill="#fff" stroke="#c94f5d" stroke-width="2"/>
    <text class="row" x="477" y="658">任一硬门失败 → 保持隔离或回到兼容回滚</text>
    <text class="tiny" x="368" y="705">HTTP 2xx 仅证明接口层接受；金额、权限、提交、用户影响和审计覆盖必须独立核验</text>
  </g>
</svg>
