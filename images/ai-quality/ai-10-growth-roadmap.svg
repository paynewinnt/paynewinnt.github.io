<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">AI 质量工程十二个月成长路线</title>
  <desc id="desc">从模型与数据实验、离线评测闭环、Agent 与可靠性闭环，最终进入安全与领域化闭环，每个阶段都用交付物和阶段门验收。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <style>
      .base { font-family: Arial, "Noto Sans SC", "Microsoft YaHei", sans-serif; }
      .title { font-size: 32px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 17px; fill: #475569; }
      .phase { font-size: 22px; font-weight: 700; fill: #ffffff; }
      .month { font-size: 17px; font-weight: 700; fill: #ffffff; }
      .label { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .text { font-size: 16px; fill: #334155; }
      .gate { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .small { font-size: 15px; fill: #475569; }
      .arrow { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1280" height="800" fill="#f8fafc"/>
  <rect x="0" y="0" width="1280" height="8" fill="#7c3aed"/>

  <g class="base">
    <text x="56" y="58" class="title">AI 质量工程成长路线</text>
    <text x="56" y="88" class="subtitle">按闭环能力推进，每个阶段必须留下可运行、可比较、可复核的工程证据</text>

    <line x1="98" y1="132" x2="1182" y2="132" stroke="#cbd5e1" stroke-width="6"/>
    <circle cx="190" cy="132" r="13" fill="#2563eb"/>
    <circle cx="490" cy="132" r="13" fill="#0f766e"/>
    <circle cx="790" cy="132" r="13" fill="#7c3aed"/>
    <circle cx="1090" cy="132" r="13" fill="#dc2626"/>
    <text x="158" y="166" class="small">第 1-2 月</text>
    <text x="458" y="166" class="small">第 3-5 月</text>
    <text x="758" y="166" class="small">第 6-8 月</text>
    <text x="1046" y="166" class="small">第 9-12 月</text>

    <path d="M344 432 L370 432" class="arrow"/>
    <path d="M644 432 L670 432" class="arrow"/>
    <path d="M944 432 L970 432" class="arrow"/>

    <g transform="translate(60,196)">
      <rect width="284" height="500" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
      <rect width="284" height="86" rx="6" fill="#2563eb"/>
      <text x="20" y="36" class="phase">阶段一</text>
      <text x="20" y="66" class="month">模型与数据实验</text>

      <text x="20" y="120" class="label">目标</text>
      <text x="20" y="148" class="text">看见真实输入和行为波动</text>

      <line x1="20" y1="170" x2="264" y2="170" stroke="#dbeafe"/>
      <text x="20" y="202" class="label">关键任务</text>
      <text x="20" y="231" class="text">Tokenizer 边界实验</text>
      <text x="20" y="258" class="text">采样参数重复实验</text>
      <text x="20" y="285" class="text">小型分层数据集</text>
      <text x="20" y="312" class="text">请求与延迟记录</text>

      <line x1="20" y1="334" x2="264" y2="334" stroke="#dbeafe"/>
      <text x="20" y="366" class="label">交付物</text>
      <text x="20" y="395" class="text">行为探针与实验报告</text>
      <text x="20" y="422" class="text">Dataset Card</text>

      <rect x="16" y="438" width="252" height="6" rx="3" fill="#dbeafe"/>
      <text x="20" y="458" class="gate">阶段门</text>
      <text x="20" y="479" class="small">同版本、同参数可重放</text>
      <text x="20" y="498" class="small">能定位输入或模型失败</text>
    </g>

    <g transform="translate(360,196)">
      <rect width="284" height="500" rx="6" fill="#ffffff" stroke="#5eead4" stroke-width="2"/>
      <rect width="284" height="86" rx="6" fill="#0f766e"/>
      <text x="20" y="36" class="phase">阶段二</text>
      <text x="20" y="66" class="month">离线质量闭环</text>

      <text x="20" y="120" class="label">目标</text>
      <text x="20" y="148" class="text">从看回答进入自动评测</text>

      <line x1="20" y1="170" x2="264" y2="170" stroke="#ccfbf1"/>
      <text x="20" y="202" class="label">关键任务</text>
      <text x="20" y="231" class="text">多层断言与裁判校准</text>
      <text x="20" y="258" class="text">分层回归集</text>
      <text x="20" y="285" class="text">统计比较与置信区间</text>
      <text x="20" y="312" class="text">历史缺陷回流</text>

      <line x1="20" y1="334" x2="264" y2="334" stroke="#ccfbf1"/>
      <text x="20" y="366" class="label">交付物</text>
      <text x="20" y="395" class="text">评测 Runner 与基线</text>
      <text x="20" y="422" class="text">CI 质量门禁</text>

      <rect x="16" y="438" width="252" height="6" rx="3" fill="#ccfbf1"/>
      <text x="20" y="458" class="gate">阶段门</text>
      <text x="20" y="479" class="small">候选版本可自动对比</text>
      <text x="20" y="498" class="small">报告可下钻失败样本</text>
    </g>

    <g transform="translate(660,196)">
      <rect width="284" height="500" rx="6" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
      <rect width="284" height="86" rx="6" fill="#7c3aed"/>
      <text x="20" y="36" class="phase">阶段三</text>
      <text x="20" y="66" class="month">Agent 与可靠性闭环</text>

      <text x="20" y="120" class="label">目标</text>
      <text x="20" y="148" class="text">让动作可控、可恢复</text>

      <line x1="20" y1="170" x2="264" y2="170" stroke="#ede9fe"/>
      <text x="20" y="202" class="label">关键任务</text>
      <text x="20" y="231" class="text">工具契约与状态机</text>
      <text x="20" y="258" class="text">故障注入与轨迹评测</text>
      <text x="20" y="285" class="text">SLO、容量和成本</text>
      <text x="20" y="312" class="text">灰度、降级与回滚</text>

      <line x1="20" y1="334" x2="264" y2="334" stroke="#ede9fe"/>
      <text x="20" y="366" class="label">交付物</text>
      <text x="20" y="395" class="text">Trace 与故障注入报告</text>
      <text x="20" y="422" class="text">SLO 和运行手册</text>

      <rect x="16" y="438" width="252" height="6" rx="3" fill="#ede9fe"/>
      <text x="20" y="458" class="gate">阶段门</text>
      <text x="20" y="479" class="small">失败后外部状态一致</text>
      <text x="20" y="498" class="small">异常可定位到具体阶段</text>
    </g>

    <g transform="translate(960,196)">
      <rect width="260" height="500" rx="6" fill="#ffffff" stroke="#fda4af" stroke-width="2"/>
      <rect width="260" height="86" rx="6" fill="#dc2626"/>
      <text x="20" y="36" class="phase">阶段四</text>
      <text x="20" y="66" class="month">安全与领域化闭环</text>

      <text x="20" y="120" class="label">目标</text>
      <text x="20" y="148" class="text">可信交付高价值场景</text>

      <line x1="20" y1="170" x2="240" y2="170" stroke="#ffe4e6"/>
      <text x="20" y="202" class="label">关键任务</text>
      <text x="20" y="231" class="text">威胁模型与攻击集</text>
      <text x="20" y="258" class="text">数据分类与权限矩阵</text>
      <text x="20" y="285" class="text">领域基准与专家复核</text>
      <text x="20" y="312" class="text">线上失败反馈闭环</text>

      <line x1="20" y1="334" x2="240" y2="334" stroke="#ffe4e6"/>
      <text x="20" y="366" class="label">交付物</text>
      <text x="20" y="395" class="text">风险登记册</text>
      <text x="20" y="422" class="text">领域端到端项目</text>

      <rect x="16" y="438" width="228" height="6" rx="3" fill="#ffe4e6"/>
      <text x="20" y="458" class="gate">阶段门</text>
      <text x="20" y="479" class="small">适用边界清晰</text>
      <text x="20" y="498" class="small">控制效果可以度量</text>
    </g>

    <g transform="translate(60,704)">
      <rect width="1160" height="54" rx="6" fill="#1e293b"/>
      <text x="24" y="34" class="month">贯穿原则：</text>
      <text x="140" y="34" class="text" fill="#e2e8f0">每个阶段都保留版本、数据、脚本、失败样本和复核记录；不以课程数量或成功截图代替能力证据。</text>
    </g>
  </g>
</svg>
