<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 服务 SLI、SLO、错误预算与发布决策分层架构</title>
  <desc id="desc">从客户端、网关、工作流与业务结果采集事件，经 request、run、task 和标签身份账本，分别形成请求、任务、延迟和有真值质量 SLI，再计算错误预算、覆盖率和燃烧率，最终路由到告警、工单、发布冻结与责任人。箭头从左向右表示数据和决策方向。</desc>
  <defs>
    <marker id="arrow46a" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#64748b"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}.title{font:700 32px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.sub{font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}.head{font:700 19px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.text{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#334155}.small{font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.flow{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow46a)}.dash{fill:none;stroke:#94a3b8;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#arrow46a)}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="38" y="45">可靠性结论来自证据链，发布动作来自经批准的政策</text>
  <text class="sub" x="38" y="73">Request、Task 与有真值质量分别计算；Unknown 和标签覆盖独立暴露；任何告警都不能直接冒充根因。</text>

  <text class="head" x="38" y="113">1. 用户与系统事件</text>
  <rect x="38" y="132" width="202" height="80" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text class="head" x="56" y="162">客户端边界</text>
  <text class="small" x="56" y="187">send · 首内容 · 完成 · 取消</text>
  <rect x="38" y="224" width="202" height="80" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text class="head" x="56" y="254">网关与 Attempt</text>
  <text class="small" x="56" y="279">接收 · 限流 · 重试 · 终态</text>
  <rect x="38" y="316" width="202" height="80" rx="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text class="head" x="56" y="346">Workflow 事件</text>
  <text class="small" x="56" y="371">检索 · 模型 · 工具 · 审批</text>
  <rect x="38" y="408" width="202" height="80" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text class="head" x="56" y="438">业务与质量结果</text>
  <text class="small" x="56" y="463">后置条件 · 真值 · 裁决</text>

  <path class="flow" d="M240 310 L276 310"/>
  <text class="head" x="276" y="113">2. 身份与事实账本</text>
  <rect class="box" x="276" y="132" width="216" height="356" rx="7"/>
  <rect x="294" y="151" width="180" height="64" rx="6" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text class="head" x="312" y="178">Request / Attempt</text>
  <text class="small" x="312" y="199">一次物理调用，不覆盖重试</text>
  <rect x="294" y="228" width="180" height="64" rx="6" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text class="head" x="312" y="255">Run</text>
  <text class="small" x="312" y="276">一次工作流执行图</text>
  <rect x="294" y="305" width="180" height="64" rx="6" fill="#ecfdf5" stroke="#4ade80" stroke-width="2"/>
  <text class="head" x="312" y="332">Task</text>
  <text class="small" x="312" y="353">用户目标与业务后置条件</text>
  <rect x="294" y="382" width="180" height="86" rx="6" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text class="head" x="312" y="409">Label / Outcome</text>
  <text class="small" x="312" y="432">来源 · rubric · 时间 · 裁决</text>
  <text class="small" x="312" y="452">迟到追加，不覆盖历史</text>

  <path class="flow" d="M492 310 L528 310"/>
  <text class="head" x="528" y="113">3. 版本化 SLI 分类</text>
  <rect class="box" x="528" y="132" width="268" height="356" rx="7"/>
  <text class="text" x="548" y="162">Request availability / latency</text>
  <text class="text" x="548" y="190">Task completion / deadline</text>
  <text class="text" x="548" y="218">Labeled semantic quality</text>
  <line x1="548" y1="235" x2="776" y2="235" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="548" y="252" width="104" height="58" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text class="head" x="571" y="278">Good</text>
  <text class="small" x="562" y="298">证据完整</text>
  <rect x="672" y="252" width="104" height="58" rx="6" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/>
  <text class="head" x="699" y="278">Bad</text>
  <text class="small" x="685" y="298">已知失败</text>
  <rect x="548" y="326" width="104" height="68" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text class="head" x="565" y="353">Unknown</text>
  <text class="small" x="561" y="375">证据缺失</text>
  <rect x="672" y="326" width="104" height="68" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text class="head" x="685" y="353">Excluded</text>
  <text class="small" x="687" y="375">规则排除</text>
  <rect x="548" y="411" width="228" height="57" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text class="text" x="562" y="435">原事件 + SLI version → 可回放</text>
  <text class="small" x="562" y="456">规则改变生成新分类，不改事实</text>

  <path class="flow" d="M796 310 L832 310"/>
  <text class="head" x="832" y="113">4. 目标与预算</text>
  <rect class="box" x="832" y="132" width="206" height="356" rx="7"/>
  <rect x="850" y="151" width="170" height="73" rx="6" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
  <text class="head" x="868" y="178">SLI 与 SLO</text>
  <text class="small" x="868" y="201">SLI = G / (G+B)</text>
  <rect x="850" y="238" width="170" height="86" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text class="head" x="868" y="265">错误预算</text>
  <text class="small" x="868" y="288">allowed = 1 - target</text>
  <text class="small" x="868" y="308">burn = bad% ÷ (1-S)</text>
  <rect x="850" y="338" width="170" height="62" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text class="head" x="868" y="365">质量覆盖</text>
  <text class="small" x="868" y="386">labels / eligible</text>
  <rect x="850" y="414" width="170" height="54" rx="6" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/>
  <text class="text" x="866" y="437">stale / no data</text>
  <text class="small" x="866" y="456">状态无效，不沿用绿色</text>

  <path class="flow" d="M1038 310 L1074 310"/>
  <text class="head" x="1074" y="113">5. 行动与 Owner</text>
  <rect x="1074" y="132" width="168" height="74" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text class="head" x="1092" y="160">Page</text>
  <text class="small" x="1092" y="183">立即止损 · 值班</text>
  <rect x="1074" y="220" width="168" height="74" rx="7" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text class="head" x="1092" y="248">Ticket</text>
  <text class="small" x="1092" y="271">补标分析 · 质量 owner</text>
  <rect x="1074" y="308" width="168" height="74" rx="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text class="head" x="1092" y="336">Release Gate</text>
  <text class="small" x="1092" y="359">扩量/冻结 · 发布 authority</text>
  <rect x="1074" y="396" width="168" height="92" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text class="head" x="1092" y="424">Decision Record</text>
  <text class="small" x="1092" y="447">观测 ≠ 推断 ≠ 决策</text>
  <text class="small" x="1092" y="468">期限 · 例外 · 复审</text>

  <rect x="38" y="532" width="1204" height="145" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text class="head" x="58" y="562">贯穿性数据健康与治理</text>
  <rect x="58" y="580" width="214" height="72" rx="6" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text class="text" x="74" y="607">入口/终态对账</text><text class="small" x="74" y="631">丢失 · 重复 · 乱序 · 时钟</text>
  <rect x="292" y="580" width="214" height="72" rx="6" fill="#ecfdf5" stroke="#4ade80" stroke-width="2"/>
  <text class="text" x="308" y="607">标签数据契约</text><text class="small" x="308" y="631">覆盖 · 时延 · 切片 · 裁决</text>
  <rect x="526" y="580" width="214" height="72" rx="6" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
  <text class="text" x="542" y="607">监控配置即代码</text><text class="small" x="542" y="631">分类 · 聚合 · 路由 · 回放</text>
  <rect x="760" y="580" width="214" height="72" rx="6" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text class="text" x="776" y="607">故障注入</text><text class="small" x="776" y="631">stale · retry · label outage</text>
  <rect x="994" y="580" width="228" height="72" rx="6" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text class="text" x="1010" y="607">政策与责任</text><text class="small" x="1010" y="631">owner · 豁免 · 解冻 · 审计</text>
  <path class="dash" d="M662 532 L662 496"/>
</svg>
