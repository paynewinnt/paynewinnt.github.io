<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 系统差分评测的配对流水线</title>
  <desc id="desc">共同输入和同一外部快照扇出到基线及模型、Prompt、参数、检索候选；每个候选用配对种子执行，经过确定性断言、双顺序裁判和业务结果测量，形成逐样本候选矩阵，再按差异分类、配对区间和严重度做发布或回滚决策。</desc>
  <defs>
    <style>
      .bg{fill:#f7fafc}.title{font:700 32px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#17324d}.sub{font:400 17px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#526b7d}.h{font:700 18px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#17324d}.t{font:400 15px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#334f63}.s{font:600 14px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#526b7d}.box{fill:#fff;stroke:#c8d7e2;stroke-width:2}.blue{fill:#e8f3ff;stroke:#4b89b7;stroke-width:2}.green{fill:#e8f7ee;stroke:#57956d;stroke-width:2}.amber{fill:#fff4dc;stroke:#c38a34;stroke-width:2}.violet{fill:#f1ecfa;stroke:#8970ad;stroke-width:2}.rose{fill:#fff0f1;stroke:#bd676b;stroke-width:2}.arrow{fill:none;stroke:#617b8d;stroke-width:2.6;marker-end:url(#arrow)}.rollback{fill:none;stroke:#bd676b;stroke-width:2.5;stroke-dasharray:7 6;marker-end:url(#red)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#617b8d"/></marker>
    <marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#bd676b"/></marker>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <rect width="1280" height="104" fill="#fff"/>
  <rect y="102" width="1280" height="2" fill="#dce6ed"/>
  <text class="title" x="46" y="45">差分评测：先构造可归因的配对事实，再谈谁更好</text>
  <text class="sub" x="46" y="77">disagreement 只是调查入口；共同错误、规范允许变化和裁判偏差都可能产生或隐藏差异。</text>

  <rect class="violet" x="42" y="132" width="218" height="144" rx="7"/>
  <text class="h" x="64" y="163">冻结实验合同</text>
  <text class="t" x="64" y="192">假设 · margin · α</text>
  <text class="t" x="64" y="217">切片 · 严重度 · 停止规则</text>
  <text class="t" x="64" y="242">候选身份与唯一变更因素</text>
  <text class="s" x="64" y="264">先注册，再看结果</text>

  <rect class="blue" x="42" y="312" width="218" height="132" rx="7"/>
  <text class="h" x="64" y="343">共同输入与同快照</text>
  <text class="t" x="64" y="372">case_id · dataset hash</text>
  <text class="t" x="64" y="397">检索语料 · 工具响应</text>
  <text class="t" x="64" y="422">政策 · 时间 · 权限 · seed</text>
  <path class="arrow" d="M151 312 L151 284"/>

  <path class="arrow" d="M260 204 L302 204"/>
  <path class="arrow" d="M260 378 L282 378 L282 244 L302 244"/>
  <rect class="box" x="306" y="126" width="300" height="326" rx="7"/>
  <text class="h" x="328" y="158">候选工件矩阵：身份不可只写模型名</text>
  <rect class="blue" x="328" y="180" width="256" height="50" rx="6"/>
  <text class="t" x="346" y="211">B：稳定基线完整快照</text>
  <rect class="green" x="328" y="242" width="256" height="50" rx="6"/>
  <text class="t" x="346" y="273">C1：仅变模型 revision</text>
  <rect class="amber" x="328" y="304" width="256" height="50" rx="6"/>
  <text class="t" x="346" y="335">C2：仅变 Prompt version</text>
  <rect class="violet" x="328" y="366" width="256" height="50" rx="6"/>
  <text class="t" x="346" y="397">C3：仅变检索 index snapshot</text>
  <text class="s" x="328" y="439">组合候选单列验证交互，不冒充单因素归因</text>

  <path class="arrow" d="M606 289 L646 289"/>
  <rect class="amber" x="650" y="126" width="270" height="326" rx="7"/>
  <text class="h" x="672" y="158">配对执行与顺序控制</text>
  <text class="t" x="672" y="190">同 case 同外部快照扇出</text>
  <text class="t" x="672" y="216">同 seed 或预注册 seed 集</text>
  <text class="t" x="672" y="242">执行先后按区组随机化</text>
  <line x1="672" y1="260" x2="898" y2="260" stroke="#dcc18a" stroke-width="2"/>
  <text class="h" x="672" y="292">三类证据并存</text>
  <text class="t" x="672" y="321">确定性：Schema / 工具副作用</text>
  <text class="t" x="672" y="347">语义：盲化 A/B 与 B/A 裁判</text>
  <text class="t" x="672" y="373">结果：任务后置条件 / 人工真值</text>
  <text class="s" x="672" y="405">超时和缺失保留为结果，不做成功者偏差</text>
  <text class="s" x="672" y="431">原始输出不可变保存，评测器独立版本化</text>

  <path class="arrow" d="M920 289 L958 289"/>
  <rect class="blue" x="962" y="126" width="276" height="326" rx="7"/>
  <text class="h" x="984" y="158">逐样本配对记录</text>
  <text class="t" x="984" y="190">B pass / C pass：共同通过</text>
  <text class="t" x="984" y="216">B pass / C fail：候选回归</text>
  <text class="t" x="984" y="242">B fail / C pass：候选修复</text>
  <text class="t" x="984" y="268">B fail / C fail：共同失败</text>
  <line x1="984" y1="286" x2="1216" y2="286" stroke="#bfd7e8" stroke-width="2"/>
  <text class="h" x="984" y="318">差异标签</text>
  <text class="t" x="984" y="346">内容 / 安全 / 副作用 / 性能</text>
  <text class="t" x="984" y="372">允许差异 / 真值冲突 / 裁判不稳</text>
  <text class="t" x="984" y="398">环境污染 / 缺失 / 无法归因</text>
  <text class="s" x="984" y="430">保留 output、judge 与 outcome 三层事实</text>

  <path class="arrow" d="M1100 452 L1100 486"/>
  <rect class="box" x="306" y="490" width="932" height="106" rx="7"/>
  <text class="h" x="328" y="520">配对决策：统计区间限定不确定性，业务严重度限定不可交易风险</text>
  <rect class="green" x="328" y="540" width="252" height="36" rx="6"/><text class="t" x="346" y="564">改善：区间下界超过 0</text>
  <rect class="blue" x="596" y="540" width="250" height="36" rx="6"/><text class="t" x="614" y="564">非劣：区间下界高于 -δ</text>
  <rect class="amber" x="862" y="540" width="162" height="36" rx="6"/><text class="t" x="880" y="564">不确定：补证据</text>
  <rect class="rose" x="1040" y="540" width="176" height="36" rx="6"/><text class="t" x="1058" y="564">硬回归：直接阻断</text>

  <path class="arrow" d="M604 596 L604 628"/>
  <path class="arrow" d="M938 596 L938 628"/>
  <rect class="green" x="306" y="632" width="590" height="58" rx="7"/>
  <text class="h" x="328" y="658">影子 / 灰度 / 提升：持续保存配对任务结果与反事实限制</text>
  <text class="s" x="328" y="680">候选只有在同一风险合同下成立，不能将 benchmark 胜率直接外推生产</text>
  <rect class="rose" x="916" y="632" width="322" height="58" rx="7"/>
  <text class="h" x="938" y="658">自动回滚与证据冻结</text>
  <text class="s" x="938" y="680">恢复稳定指针，保留失败候选工件</text>
  <path class="rollback" d="M1080 632 C1080 612 1260 618 1260 108 C1260 92 474 92 474 122"/>
</svg>
