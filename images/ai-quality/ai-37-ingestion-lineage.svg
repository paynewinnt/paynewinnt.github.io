<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">知识库摄取流水线与可追溯血缘模型</title>
  <desc id="desc">展示源对象经过接收、恶意内容扫描与沙箱、MIME和编码检测、解析或OCR、规范化、分片、ACL绑定和索引发布，并用 W3C PROV 的实体活动代理和 OpenLineage 的作业运行数据集记录完整血缘。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#64748b"/></marker>
    <style>
      .bg{fill:#f8fafc}.title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.sub{font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}.h{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.t{font:400 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#334155}.small{font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.green{fill:#ecfdf5;stroke:#059669;stroke-width:2}.amber{fill:#fffbeb;stroke:#d97706;stroke-width:2}.violet{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.rose{fill:#fff1f2;stroke:#e11d48;stroke-width:2}.cyan{fill:#ecfeff;stroke:#0891b2;stroke-width:2}.arrow{fill:none;stroke:#64748b;stroke-width:2.2;marker-end:url(#arrow)}.dash{fill:none;stroke:#e11d48;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="40" y="48">从不可变源字节到可授权 Chunk，每一步都留下血缘</text>
  <text class="sub" x="40" y="76">文件名和上传者声明只是线索；发布索引前必须证明解析、内容、权限、身份与版本之间的关系。</text>

  <text class="h" x="40" y="112">运行流水线</text>
  <rect class="blue" x="40" y="132" width="142" height="126" rx="8"/>
  <text class="h" x="57" y="163">接收源对象</text><text class="t" x="57" y="190">tenant · URI</text><text class="t" x="57" y="213">raw hash · size</text><text class="small" x="57" y="240" fill="#1d4ed8">不可变快照</text>
  <path class="arrow" d="M182 195 L204 195"/>
  <rect class="rose" x="208" y="132" width="142" height="126" rx="8"/>
  <text class="h" x="225" y="163">扫描与沙箱</text><text class="t" x="225" y="190">解包配额 · 超时</text><text class="t" x="225" y="213">禁网 · 低权限</text><text class="small" x="225" y="240" fill="#be123c">失败进隔离区</text>
  <path class="arrow" d="M350 195 L372 195"/>
  <rect class="amber" x="376" y="132" width="142" height="126" rx="8"/>
  <text class="h" x="393" y="163">检测格式</text><text class="t" x="393" y="190">声明 MIME</text><text class="t" x="393" y="213">字节 · charset</text><text class="small" x="393" y="240" fill="#b45309">冲突可观测</text>
  <path class="arrow" d="M518 195 L540 195"/>
  <rect class="violet" x="544" y="132" width="142" height="126" rx="8"/>
  <text class="h" x="561" y="163">解析或 OCR</text><text class="t" x="561" y="190">段落 · 页 · 表格</text><text class="t" x="561" y="213">坐标 · 置信信号</text><text class="small" x="561" y="240" fill="#6d28d9">保存原始产物</text>
  <path class="arrow" d="M686 195 L708 195"/>
  <rect class="cyan" x="712" y="132" width="142" height="126" rx="8"/>
  <text class="h" x="729" y="163">内容规范化</text><text class="t" x="729" y="190">Unicode · 空白</text><text class="t" x="729" y="213">结构 · 表格语义</text><text class="small" x="729" y="240" fill="#0e7490">规则版本化</text>
  <path class="arrow" d="M854 195 L876 195"/>
  <rect class="green" x="880" y="132" width="142" height="126" rx="8"/>
  <text class="h" x="897" y="163">分片与 ACL</text><text class="t" x="897" y="190">stable chunk_id</text><text class="t" x="897" y="213">租户 · 允许/拒绝</text><text class="small" x="897" y="240" fill="#047857">权限不后补</text>
  <path class="arrow" d="M1022 195 L1044 195"/>
  <rect class="blue" x="1048" y="132" width="192" height="126" rx="8"/>
  <text class="h" x="1065" y="163">门禁与原子发布</text><text class="t" x="1065" y="190">质量报告 · manifest</text><text class="t" x="1065" y="213">index_generation</text><text class="small" x="1065" y="240" fill="#1d4ed8">旧版本可回滚</text>

  <text class="h" x="40" y="310">不可变实体与派生关系</text>
  <rect class="amber" x="40" y="334" width="210" height="100" rx="8"/>
  <text class="h" x="58" y="365">SourceBlob</text><text class="t" x="58" y="391">raw hash + source version</text><text class="small" x="58" y="417" fill="#b45309">PROV Entity</text>
  <path class="arrow" d="M250 384 L286 384"/>
  <rect class="violet" x="290" y="334" width="210" height="100" rx="8"/>
  <text class="h" x="308" y="365">ParsedArtifact</text><text class="t" x="308" y="391">parser_id + parser_version</text><text class="small" x="308" y="417" fill="#6d28d9">wasDerivedFrom</text>
  <path class="arrow" d="M500 384 L536 384"/>
  <rect class="cyan" x="540" y="334" width="210" height="100" rx="8"/>
  <text class="h" x="558" y="365">CanonicalDocument</text><text class="t" x="558" y="391">content_hash + normalizer</text><text class="small" x="558" y="417" fill="#0e7490">wasGeneratedBy</text>
  <path class="arrow" d="M750 384 L786 384"/>
  <rect class="green" x="790" y="334" width="210" height="100" rx="8"/>
  <text class="h" x="808" y="365">Chunk + ACLBinding</text><text class="t" x="808" y="391">version + ordinal + hash</text><text class="small" x="808" y="417" fill="#047857">hadMember / policy</text>
  <path class="arrow" d="M1000 384 L1036 384"/>
  <rect class="blue" x="1040" y="334" width="200" height="100" rx="8"/>
  <text class="h" x="1058" y="365">IndexArtifact</text><text class="t" x="1058" y="391">manifest + generation</text><text class="small" x="1058" y="417" fill="#1d4ed8">published dataset</text>

  <text class="h" x="40" y="482">两种互补表达</text>
  <rect class="box" x="40" y="504" width="570" height="154" rx="8"/>
  <text class="h" x="60" y="535">W3C PROV：解释“谁用什么过程产生了什么”</text>
  <rect class="amber" x="60" y="558" width="142" height="68" rx="6"/><text class="h" x="101" y="586">Entity</text><text class="t" x="77" y="610">字节、文档、Chunk</text>
  <rect class="blue" x="245" y="558" width="142" height="68" rx="6"/><text class="h" x="282" y="586">Activity</text><text class="t" x="264" y="610">解析、规范化、发布</text>
  <rect class="rose" x="430" y="558" width="142" height="68" rx="6"/><text class="h" x="468" y="586">Agent</text><text class="t" x="448" y="610">软件、服务、操作者</text>
  <path class="arrow" d="M202 592 L241 592"/><path class="arrow" d="M387 592 L426 592"/>

  <rect class="box" x="630" y="504" width="610" height="154" rx="8"/>
  <text class="h" x="650" y="535">OpenLineage：解释“哪次 Job Run 读写了哪些 Dataset”</text>
  <rect class="violet" x="650" y="558" width="162" height="68" rx="6"/><text class="h" x="711" y="586">Job</text><text class="t" x="670" y="610">定义的摄取工作</text>
  <rect class="cyan" x="850" y="558" width="162" height="68" rx="6"/><text class="h" x="909" y="586">Run</text><text class="t" x="868" y="610">一次执行与状态事件</text>
  <rect class="green" x="1050" y="558" width="162" height="68" rx="6"/><text class="h" x="1096" y="586">Dataset</text><text class="t" x="1070" y="610">输入、输出与质量面</text>
  <path class="arrow" d="M812 592 L846 592"/><path class="arrow" d="M1012 592 L1046 592"/>

  <rect x="40" y="680" width="1200" height="24" rx="6" fill="#0f172a"/>
  <text class="small" x="60" y="697" fill="#fff">血缘事件本身也要版本化、鉴权和校验；有 lineage 字段不等于来源真实或处理正确。</text>
</svg>
