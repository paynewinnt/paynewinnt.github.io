<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">内部 AI 风险等级与发布门禁矩阵</title>
  <desc id="desc">四级内部工程风险等级对应逐级增强的证据、审批、灰度和运营要求，旁边独立展示监管适用性评审，强调内部等级不等同于任何法定分类。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}.title{font:700 28px sans-serif;fill:#0f172a}.sub{font:400 15px sans-serif;fill:#475569}
      .head{font:700 15px sans-serif;fill:#0f172a}.cell{font:600 13px sans-serif;fill:#0f172a}.t{font:400 12px sans-serif;fill:#334155}
      .line{stroke:#94a3b8;stroke-width:1.4}.flow{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="48" y="50">内部风险等级决定工程证据强度，不替代外部法律适用性判断</text>
  <text class="sub" x="48" y="78">等级基于具体系统、用途、受影响对象、影响、暴露、可逆性与控制，不是模型名称的永久标签</text>

  <rect x="48" y="116" width="900" height="470" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <rect x="48" y="116" width="900" height="64" rx="6" fill="#e2e8f0"/>
  <text class="head" x="68" y="154">内部等级</text>
  <text class="head" x="184" y="154">用途与暴露</text>
  <text class="head" x="390" y="154">最低证据</text>
  <text class="head" x="626" y="154">审批与运营门禁</text>
  <text class="head" x="842" y="154">结果</text>
  <line class="line" x1="154" y1="116" x2="154" y2="586"/><line class="line" x1="358" y1="116" x2="358" y2="586"/>
  <line class="line" x1="594" y1="116" x2="594" y2="586"/><line class="line" x1="812" y1="116" x2="812" y2="586"/>
  <line class="line" x1="48" y1="180" x2="948" y2="180"/><line class="line" x1="48" y1="280" x2="948" y2="280"/>
  <line class="line" x1="48" y1="382" x2="948" y2="382"/><line class="line" x1="48" y1="484" x2="948" y2="484"/>

  <rect x="50" y="182" width="896" height="96" fill="#ecfccb"/>
  <text class="cell" x="68" y="220">T1 探索</text><text class="t" x="68" y="244">离线、无真实决策</text>
  <text class="t" x="174" y="214">受控数据、内部人员</text><text class="t" x="174" y="238">无外部副作用</text><text class="t" x="174" y="260">禁止转生产</text>
  <text class="t" x="376" y="208">模型来源、基础功能测试</text><text class="t" x="376" y="232">数据权限、已知限制</text><text class="t" x="376" y="256">实验到期时间</text>
  <text class="t" x="612" y="214">技术 owner</text><text class="t" x="612" y="238">隔离环境与自动销毁</text><text class="t" x="612" y="260">不可作为业务依据</text>
  <text class="cell" x="830" y="226">仅实验</text><text class="t" x="830" y="250">不发布</text>

  <rect x="50" y="282" width="896" height="98" fill="#dbeafe"/>
  <text class="cell" x="68" y="322">T2 辅助</text><text class="t" x="68" y="346">低影响、可撤销</text>
  <text class="t" x="174" y="312">人审后使用</text><text class="t" x="174" y="336">无高影响自动决策</text><text class="t" x="174" y="360">有限用户与渠道</text>
  <text class="t" x="376" y="306">Model/System Card</text><text class="t" x="376" y="330">核心质量/安全/隐私证据</text><text class="t" x="376" y="354">回滚和监控冒烟</text>
  <text class="t" x="612" y="312">system + product owner</text><text class="t" x="612" y="336">小流量灰度、抽样复核</text><text class="t" x="612" y="360">变更触发重评测</text>
  <text class="cell" x="830" y="326">受限发布</text><text class="t" x="830" y="350">可回滚</text>

  <rect x="50" y="384" width="896" height="98" fill="#fef3c7"/>
  <text class="cell" x="68" y="424">T3 重大</text><text class="t" x="68" y="448">可能实质影响用户</text>
  <text class="t" x="174" y="414">广泛外部暴露</text><text class="t" x="174" y="438">决策支持或工具动作</text><text class="t" x="174" y="462">错误恢复成本较高</text>
  <text class="t" x="376" y="408">风险—控制—评测全映射</text><text class="t" x="376" y="432">切片、红队、故障、SLO</text><text class="t" x="376" y="456">独立保留集与残余风险</text>
  <text class="t" x="612" y="414">safety/security/privacy</text><text class="t" x="612" y="438">适用性 owner 与阶段审批</text><text class="t" x="612" y="462">自动止损、事件演练</text>
  <text class="cell" x="830" y="428">条件发布</text><text class="t" x="830" y="452">持续监督</text>

  <rect x="50" y="486" width="896" height="98" fill="#fee2e2"/>
  <text class="cell" x="68" y="522">T4 严重</text><text class="t" x="68" y="546">生命/权利</text><text class="t" x="68" y="568">系统性影响</text>
  <text class="t" x="174" y="516">高影响或难以逆转</text><text class="t" x="174" y="540">高规模、高自主性</text><text class="t" x="174" y="564">严格 forbidden use</text>
  <text class="t" x="376" y="510">T3 全部 + 独立验证</text><text class="t" x="376" y="534">硬风险零容忍、演练证据</text><text class="t" x="376" y="558">分阶段授权与持续重评</text>
  <text class="t" x="612" y="516">高级风险接受人</text><text class="t" x="612" y="540">专项法律/领域/安全审批</text><text class="t" x="612" y="564">默认阻断，逐项授权</text>
  <text class="cell" x="830" y="530">默认 BLOCK</text><text class="t" x="830" y="554">例外有期限</text>

  <rect x="984" y="116" width="248" height="470" rx="6" fill="#ffffff" stroke="#9333ea" stroke-width="2"/>
  <text class="head" x="1004" y="150">独立的监管适用性轨</text>
  <rect x="1004" y="176" width="208" height="70" rx="4" fill="#f3e8ff"/>
  <text class="cell" x="1020" y="202">1. 作用域与角色</text>
  <text class="t" x="1020" y="224">jurisdiction / provider / deployer</text>
  <rect x="1004" y="264" width="208" height="70" rx="4" fill="#f3e8ff"/>
  <text class="cell" x="1020" y="290">2. 官方分类依据</text>
  <text class="t" x="1020" y="312">条款、附件、时间与事实</text>
  <rect x="1004" y="352" width="208" height="70" rx="4" fill="#f3e8ff"/>
  <text class="cell" x="1020" y="378">3. 义务与证据映射</text>
  <text class="t" x="1020" y="400">适用 / 不适用 / 未决</text>
  <rect x="1004" y="440" width="208" height="70" rx="4" fill="#f3e8ff"/>
  <text class="cell" x="1020" y="466">4. 专业 owner 复审</text>
  <text class="t" x="1020" y="488">变更、到期、监管更新</text>
  <text class="t" x="1004" y="540">内部 T1–T4 ≠ EU AI Act</text>
  <text class="t" x="1004" y="562">或任何其他法定风险类别</text>

  <path class="flow" d="M948 350 H978"/>
  <rect x="48" y="618" width="1184" height="64" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
  <text class="head" x="68" y="646">共同硬门</text>
  <text class="t" x="170" y="646">forbidden use、未决 critical risk、证据 FAIL/UNKNOWN、主体摘要不匹配、已过期、缺 owner/审批、适用性未决</text>
  <text class="t" x="68" y="670">等级越高只会增加证据与审批，不会把已失败的硬风险平均掉；外部法律分类始终由具体事实、角色、条款和专业评审决定。</text>
</svg>
