<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Prompt Injection 攻击传播路径</title>
  <desc id="desc">展示用户输入、网页、知识库、附件和工具返回如何经过上下文构建进入模型，并影响高权限工具与敏感数据。</desc>
  <style>
    .bg { fill: #f7f9fc; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
    .untrusted { fill: #fff1f2; stroke: #e11d48; stroke-width: 2; }
    .core { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.5; }
    .privileged { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
    .safe { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .title { font: 700 32px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
    .subtitle { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
    .h { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
    .t { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
    .small { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
    .risk { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #be123c; }
    .arrow { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    .attack { stroke: #e11d48; stroke-width: 3; fill: none; stroke-dasharray: 8 6; marker-end: url(#attack); }
    .boundary { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 7; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <marker id="attack" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#e11d48"/></marker>
  </defs>
  <rect class="bg" width="1280" height="760"/>
  <text class="title" x="64" y="58">Prompt Injection 不是一个输入框问题，而是一条信任传播链</text>
  <text class="subtitle" x="64" y="90">红色虚线表示恶意指令可借助外部数据进入模型上下文，并在高权限动作中放大影响。</text>

  <text class="h" x="74" y="140">不可信输入源</text>
  <rect class="untrusted" x="64" y="162" width="230" height="76" rx="8"/>
  <text class="h" x="88" y="193">直接用户输入</text>
  <text class="small" x="88" y="218">显式覆盖、诱导、编码载荷</text>
  <rect class="untrusted" x="64" y="258" width="230" height="76" rx="8"/>
  <text class="h" x="88" y="289">网页与搜索结果</text>
  <text class="small" x="88" y="314">隐藏文本、元数据、页面评论</text>
  <rect class="untrusted" x="64" y="354" width="230" height="76" rx="8"/>
  <text class="h" x="88" y="385">RAG 知识片段</text>
  <text class="small" x="88" y="410">被污染文档、跨租户召回</text>
  <rect class="untrusted" x="64" y="450" width="230" height="76" rx="8"/>
  <text class="h" x="88" y="481">附件与多模态内容</text>
  <text class="small" x="88" y="506">PDF、图片、OCR、邮件正文</text>
  <rect class="untrusted" x="64" y="546" width="230" height="76" rx="8"/>
  <text class="h" x="88" y="577">工具返回值</text>
  <text class="small" x="88" y="602">API 错误、工单、数据库字段</text>

  <line class="boundary" x1="328" y1="130" x2="328" y2="660"/>
  <text class="small" x="338" y="151">信任边界 A</text>

  <rect class="panel" x="380" y="222" width="238" height="150" rx="8"/>
  <text class="h" x="415" y="260">上下文构建器</text>
  <text class="t" x="415" y="292">系统指令 + 用户任务</text>
  <text class="t" x="415" y="320">检索片段 + 工具结果</text>
  <text class="risk" x="415" y="348">风险：指令与数据混装</text>

  <rect class="core" x="690" y="222" width="220" height="150" rx="8"/>
  <text class="h" x="735" y="260">模型 / Agent</text>
  <text class="t" x="725" y="292">理解、规划、生成</text>
  <text class="t" x="725" y="320">选择工具与参数</text>
  <text class="risk" x="725" y="348">没有天然安全边界</text>

  <path class="arrow" d="M618 297 L686 297"/>
  <path class="attack" d="M294 296 C340 296 346 272 378 272"/>
  <path class="attack" d="M294 392 C350 392 344 322 378 322"/>
  <path class="attack" d="M294 488 C410 488 510 438 690 346"/>
  <path class="attack" d="M294 584 C460 584 600 464 716 370"/>
  <path class="attack" d="M294 200 C410 200 510 228 690 260"/>

  <line class="boundary" x1="950" y1="130" x2="950" y2="660"/>
  <text class="small" x="960" y="151">信任边界 B</text>

  <rect class="privileged" x="994" y="174" width="222" height="94" rx="8"/>
  <text class="h" x="1023" y="208">高权限工具</text>
  <text class="t" x="1023" y="235">发信、写库、执行命令</text>
  <rect class="privileged" x="994" y="296" width="222" height="94" rx="8"/>
  <text class="h" x="1023" y="330">敏感数据</text>
  <text class="t" x="1023" y="357">凭据、客户数据、内部文档</text>
  <rect class="privileged" x="994" y="418" width="222" height="94" rx="8"/>
  <text class="h" x="1023" y="452">外部通信</text>
  <text class="t" x="1023" y="474">URL、Webhook</text>
  <text class="t" x="1023" y="497">第三方 API</text>
  <path class="arrow" d="M910 260 L990 221"/>
  <path class="arrow" d="M910 297 L990 343"/>
  <path class="arrow" d="M910 336 C948 370 948 430 990 465"/>

  <rect class="safe" x="380" y="566" width="530" height="92" rx="8"/>
  <text class="h" x="408" y="600">测试真正要验证的安全性质</text>
  <text class="t" x="408" y="624">即使模型受影响，也不能越权调用工具、读取秘密，</text>
  <text class="t" x="408" y="648">也不能把敏感数据带出边界。</text>
  <text class="small" x="64" y="712">测试重点：传播路径、可达权限、动作副作用和数据流，而不是只判断模型是否“听从了坏指令”。</text>
</svg>
