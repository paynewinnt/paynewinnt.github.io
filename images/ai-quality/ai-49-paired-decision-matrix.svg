<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 候选差分评测的配对统计与业务决策矩阵</title>
  <desc id="desc">矩阵按硬回归、统计改善、统计非劣、不确定、切片冲突、裁判顺序不稳和仅有不一致七种证据状态，区分可观测事实、不能推出的结论和发布动作，并以箭头表示从观测到推断再到决策。</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.title{font:700 31px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#17324d}.sub{font:400 17px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#526b7d}.head{font:700 17px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#fff}.h{font:700 16px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#17324d}.t{font:400 15px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#334f63}.m{font:600 14px "SFMono-Regular",Consolas,monospace;fill:#405f73}.arrow{fill:none;stroke:#647f91;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#647f91"/></marker>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <rect width="1280" height="104" fill="#fff"/>
  <rect y="102" width="1280" height="2" fill="#dce6ed"/>
  <text class="title" x="42" y="45">配对区间回答“差多少”，严重度合同回答“能不能发布”</text>
  <text class="sub" x="42" y="77">以下状态互不抵消：总体改善不能冲掉关键安全回归，裁判一致也不能自动升级为业务真值。</text>

  <rect x="38" y="122" width="1204" height="46" rx="7" fill="#315d77"/>
  <text class="head" x="56" y="152">证据状态</text>
  <text class="head" x="252" y="152">观测事实</text>
  <text class="head" x="604" y="152">推断边界</text>
  <text class="head" x="946" y="152">发布 / 回滚动作</text>

  <rect x="38" y="178" width="1204" height="68" rx="7" fill="#fff0f1" stroke="#c77b7f"/>
  <rect x="38" y="178" width="190" height="68" rx="7" fill="#f5d9dc"/>
  <text class="h" x="56" y="207">关键硬回归</text><text class="m" x="56" y="230">severity = BLOCKER</text>
  <text class="t" x="248" y="207">候选新增越权副作用、事实硬错或数据泄漏</text><text class="t" x="248" y="230">至少一条有可复现证据链</text>
  <text class="t" x="600" y="207">样本少不等于风险小；总分提升不能抵消</text><text class="t" x="600" y="230">但告警仍需排除环境和评测器故障</text>
  <text class="t" x="942" y="207">阻断候选，冻结工件与输入快照</text><text class="t" x="942" y="230">已灰度则回滚稳定指针</text>

  <rect x="38" y="256" width="1204" height="68" rx="7" fill="#e8f7ee" stroke="#76a889"/>
  <rect x="38" y="256" width="190" height="68" rx="7" fill="#d5ecde"/>
  <text class="h" x="56" y="285">统计改善</text><text class="m" x="56" y="308">CI_low &gt; 0</text>
  <text class="t" x="248" y="285">预注册主指标的配对差值区间整体为正</text><text class="t" x="248" y="308">关键切片和硬门同时通过</text>
  <text class="t" x="600" y="285">只支持目标总体与当前快照；不证明因果机制</text><text class="t" x="600" y="308">也不证明所有输入上候选都更好</text>
  <text class="t" x="942" y="285">允许进入影子或受控灰度</text><text class="t" x="942" y="308">保留回滚窗口与线上停止条件</text>

  <rect x="38" y="334" width="1204" height="68" rx="7" fill="#e8f3ff" stroke="#79a6c6"/>
  <rect x="38" y="334" width="190" height="68" rx="7" fill="#d5e8f6"/>
  <text class="h" x="56" y="363">统计非劣</text><text class="m" x="56" y="386">CI_low &gt; -δ</text>
  <text class="t" x="248" y="363">质量退化下界未越过预注册容忍边际</text><text class="t" x="248" y="386">另有明确成本、延迟或可用性收益</text>
  <text class="t" x="600" y="363">非劣不是相等或更优；δ 是业务损失预算</text><text class="t" x="600" y="386">事后放宽 δ 会使结论失去约束</text>
  <text class="t" x="942" y="363">仅按合同允许的收益推进</text><text class="t" x="942" y="386">报告剩余退化可能与监控方案</text>

  <rect x="38" y="412" width="1204" height="68" rx="7" fill="#fff4dc" stroke="#d0a05a"/>
  <rect x="38" y="412" width="190" height="68" rx="7" fill="#f8e5bb"/>
  <text class="h" x="56" y="441">统计不确定</text><text class="m" x="56" y="464">CI crosses gates</text>
  <text class="t" x="248" y="441">区间同时跨过改善线、零或非劣边际</text><text class="t" x="248" y="464">样本、方差或缺失不足以作结论</text>
  <text class="t" x="600" y="441">不是“没有差异”，也不是“差不多可发布”</text><text class="t" x="600" y="464">继续重复同一偏样本不会修复外推问题</text>
  <text class="t" x="942" y="441">维持基线，补预注册样本或缩小声明</text><text class="t" x="942" y="464">禁止挑选有利 seed 后重算</text>

  <rect x="38" y="490" width="1204" height="68" rx="7" fill="#f1ecfa" stroke="#9a84b7"/>
  <rect x="38" y="490" width="190" height="68" rx="7" fill="#e3d9f1"/>
  <text class="h" x="56" y="519">总体好、切片坏</text><text class="m" x="56" y="542">slice regression</text>
  <text class="t" x="248" y="519">总体区间为正，但高风险语言或客户切片退化</text><text class="t" x="248" y="542">切片样本与权重在实验前已登记</text>
  <text class="t" x="600" y="519">总体平均可能掩盖伤害；也需防止小切片噪声</text><text class="t" x="600" y="542">不能只凭一个告警断言候选是根因</text>
  <text class="t" x="942" y="519">按严重度阻断、限定路由或人工复核</text><text class="t" x="942" y="542">补充有代表性的切片证据</text>

  <rect x="38" y="568" width="1204" height="68" rx="7" fill="#eef4f6" stroke="#8da5b3"/>
  <rect x="38" y="568" width="190" height="68" rx="7" fill="#dbe7ec"/>
  <text class="h" x="56" y="597">裁判顺序不稳</text><text class="m" x="56" y="620">A/B != B/A</text>
  <text class="t" x="248" y="597">交换位置后胜负翻转，或长答案稳定获偏好</text><text class="t" x="248" y="620">原始确定性指标可能未变化</text>
  <text class="t" x="600" y="597">揭示评测器不稳定，不自动说明任一候选正确</text><text class="t" x="600" y="620">两次一致仍可能共享同一事实盲区</text>
  <text class="t" x="942" y="597">降级为 tie / 人工复核，校准裁判</text><text class="t" x="942" y="620">裁判版本变化后重跑完整矩阵</text>

  <rect x="38" y="646" width="1204" height="48" rx="7" fill="#fff" stroke="#c8d7e2" stroke-width="2"/>
  <text class="h" x="56" y="676">仅发现 disagreement</text>
  <path class="arrow" d="M230 670 L330 670"/>
  <text class="t" x="344" y="676">先查允许差异、共同错误与外部快照</text>
  <path class="arrow" d="M670 670 L760 670"/>
  <text class="t" x="774" y="676">建立独立 Oracle 或人工证据</text>
  <path class="arrow" d="M1032 670 L1106 670"/>
  <text class="h" x="1120" y="676">再决策</text>
</svg>
