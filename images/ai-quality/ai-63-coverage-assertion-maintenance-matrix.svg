<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">测试覆盖、断言敏感度与维护成本联合判断矩阵</title>
  <desc id="desc">矩阵按风险需求展示可达性、代码覆盖、变异杀伤、断言故障敏感度、数据独立性、稳定性、维护预算和最终处置，强调任何单列为绿都不能独立支持晋级。</desc>
  <defs>
    <style>
      .bg{fill:#f6f8f8}.title{font:700 29px Arial,"PingFang SC",sans-serif;fill:#17272f}.sub{font:15px Arial,"PingFang SC",sans-serif;fill:#52646d}.head{font:700 14px Arial,"PingFang SC",sans-serif;fill:#fff}.row{font:700 15px Arial,"PingFang SC",sans-serif;fill:#20313a}.cell{font:13px Arial,"PingFang SC",sans-serif;fill:#30434c}.tiny{font:12px Arial,"PingFang SC",sans-serif;fill:#5a6b74}.grid{stroke:#c8d2d7;stroke-width:1}.good{fill:#e8f3df}.warn{fill:#fff3d8}.bad{fill:#fde7e9}.unknown{fill:#edf0f2}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="42" y="49">覆盖 × 断言 × 维护：测试资产要同时回答“到达、发现、养得起”</text>
  <text class="sub" x="42" y="77">表内均为构造状态；覆盖率的分母、等价变异裁决和 flaky 重复次数必须随报告保存</text>

  <g aria-label="联合判断矩阵">
    <rect x="40" y="112" width="1200" height="426" rx="7" fill="#fff" stroke="#afbdc4" stroke-width="2"/>
    <rect x="40" y="112" width="1200" height="62" rx="7" fill="#314d5c"/>
    <text class="head" x="58" y="140">风险需求</text><text class="head" x="58" y="159">与候选</text>
    <text class="head" x="210" y="149">可达性</text><text class="head" x="319" y="140">语句 / 分支</text><text class="head" x="319" y="159">覆盖</text>
    <text class="head" x="446" y="140">变异杀伤</text><text class="head" x="446" y="159">等价另列</text>
    <text class="head" x="570" y="140">故障注入下</text><text class="head" x="570" y="159">断言敏感度</text>
    <text class="head" x="710" y="140">数据独立</text><text class="head" x="820" y="140">稳定性</text><text class="head" x="920" y="140">维护预算</text><text class="head" x="1060" y="140">处置</text>

    <line class="grid" x1="188" y1="112" x2="188" y2="538"/><line class="grid" x1="292" y1="112" x2="292" y2="538"/>
    <line class="grid" x1="420" y1="112" x2="420" y2="538"/><line class="grid" x1="548" y1="112" x2="548" y2="538"/>
    <line class="grid" x1="688" y1="112" x2="688" y2="538"/><line class="grid" x1="798" y1="112" x2="798" y2="538"/>
    <line class="grid" x1="900" y1="112" x2="900" y2="538"/><line class="grid" x1="1038" y1="112" x2="1038" y2="538"/>

    <rect x="40" y="174" width="1200" height="91" fill="#f8faf9"/><rect class="good" x="188" y="174" width="104" height="91"/><rect class="good" x="292" y="174" width="128" height="91"/><rect class="good" x="420" y="174" width="128" height="91"/><rect class="good" x="548" y="174" width="140" height="91"/><rect class="good" x="688" y="174" width="110" height="91"/><rect class="good" x="798" y="174" width="102" height="91"/><rect class="good" x="900" y="174" width="138" height="91"/><rect class="good" x="1038" y="174" width="202" height="91"/>
    <text class="row" x="56" y="205">R-01 幂等重试</text><text class="tiny" x="56" y="229">candidate-17</text><text class="tiny" x="56" y="249">关键资金路径</text>
    <text class="cell" x="207" y="218">REACHABLE</text><text class="cell" x="310" y="209">6/6 语句</text><text class="cell" x="310" y="232">4/4 分支</text>
    <text class="cell" x="438" y="209">9/10 杀死</text><text class="tiny" x="438" y="232">1 等价已签审</text><text class="cell" x="566" y="209">5/5 相关故障</text><text class="tiny" x="566" y="232">均触发目标断言</text>
    <text class="cell" x="706" y="218">独立命名空间</text><text class="cell" x="816" y="209">60/60 一致</text><text class="tiny" x="816" y="232">顺序/并发重跑</text><text class="cell" x="918" y="209">1.8 s / 1 fixture</text><text class="tiny" x="918" y="232">owner 已确认</text><text class="row" x="1060" y="218">晋级观察期</text>

    <line class="grid" x1="40" y1="265" x2="1240" y2="265"/>
    <rect class="warn" x="40" y="265" width="1200" height="91"/><rect class="good" x="188" y="265" width="104" height="91"/><rect class="good" x="292" y="265" width="128" height="91"/><rect class="bad" x="420" y="265" width="128" height="91"/><rect class="bad" x="548" y="265" width="140" height="91"/><rect class="good" x="688" y="265" width="110" height="91"/><rect class="good" x="798" y="265" width="102" height="91"/><rect class="good" x="900" y="265" width="138" height="91"/><rect class="bad" x="1038" y="265" width="202" height="91"/>
    <text class="row" x="56" y="296">R-02 租户隔离</text><text class="tiny" x="56" y="320">candidate-24</text><text class="tiny" x="56" y="340">覆盖高，oracle 弱</text>
    <text class="cell" x="207" y="309">REACHABLE</text><text class="cell" x="310" y="300">8/8 语句</text><text class="cell" x="310" y="323">5/5 分支</text>
    <text class="cell" x="438" y="300">2/8 杀死</text><text class="tiny" x="438" y="323">6 个存活</text><text class="cell" x="566" y="300">1/4 相关故障</text><text class="tiny" x="566" y="323">只断言 HTTP 200</text>
    <text class="cell" x="706" y="309">独立命名空间</text><text class="cell" x="816" y="300">60/60 一致</text><text class="tiny" x="816" y="323">稳定但无力</text><text class="cell" x="918" y="300">1.2 s / 1 fixture</text><text class="tiny" x="918" y="323">预算内</text><text class="row" x="1060" y="309">拒绝：补 oracle</text>

    <line class="grid" x1="40" y1="356" x2="1240" y2="356"/>
    <rect class="unknown" x="40" y="356" width="1200" height="91"/><rect class="unknown" x="188" y="356" width="104" height="91"/><rect class="unknown" x="292" y="356" width="128" height="91"/><rect class="unknown" x="420" y="356" width="128" height="91"/><rect class="unknown" x="548" y="356" width="140" height="91"/><rect class="bad" x="688" y="356" width="110" height="91"/><rect class="bad" x="798" y="356" width="102" height="91"/><rect class="warn" x="900" y="356" width="138" height="91"/><rect class="bad" x="1038" y="356" width="202" height="91"/>
    <text class="row" x="56" y="387">R-03 到期清理</text><text class="tiny" x="56" y="411">candidate-31</text><text class="tiny" x="56" y="431">共享时钟与数据</text>
    <text class="cell" x="207" y="400">UNKNOWN</text><text class="cell" x="310" y="391">未纳入 source</text><text class="tiny" x="310" y="414">不能写 0%</text><text class="cell" x="438" y="391">执行超时</text><text class="tiny" x="438" y="414">留在未知分母</text>
    <text class="cell" x="566" y="391">未完成</text><text class="tiny" x="566" y="414">不是 0/0=100%</text><text class="cell" x="706" y="391">共享数据</text><text class="tiny" x="706" y="414">跨 case 污染</text><text class="cell" x="816" y="391">47/60 一致</text><text class="tiny" x="816" y="414">13 次漂移</text><text class="cell" x="918" y="391">28 s / 4 fixture</text><text class="tiny" x="918" y="414">接近上限</text><text class="row" x="1060" y="400">隔离并排障</text>

    <line class="grid" x1="40" y1="447" x2="1240" y2="447"/>
    <rect class="warn" x="40" y="447" width="1200" height="91"/><rect class="unknown" x="188" y="447" width="104" height="91"/><rect class="warn" x="292" y="447" width="128" height="91"/><rect class="warn" x="420" y="447" width="128" height="91"/><rect class="warn" x="548" y="447" width="140" height="91"/><rect class="good" x="688" y="447" width="110" height="91"/><rect class="good" x="798" y="447" width="102" height="91"/><rect class="bad" x="900" y="447" width="138" height="91"/><rect class="bad" x="1038" y="447" width="202" height="91"/>
    <text class="row" x="56" y="478">R-04 旧接口兼容</text><text class="tiny" x="56" y="502">candidate-38</text><text class="tiny" x="56" y="522">风险已退出待确认</text>
    <text class="cell" x="207" y="491">待架构审批</text><text class="cell" x="310" y="482">4/6 语句</text><text class="cell" x="310" y="505">2/4 分支</text><text class="cell" x="438" y="482">4/7 杀死</text><text class="tiny" x="438" y="505">等价未裁决</text>
    <text class="cell" x="566" y="482">3/4 相关故障</text><text class="tiny" x="566" y="505">一个 oracle 不可验</text><text class="cell" x="706" y="491">独立</text><text class="cell" x="816" y="482">60/60 一致</text><text class="tiny" x="816" y="505">信号稳定</text><text class="cell" x="918" y="482">41 s / 7 fixture</text><text class="tiny" x="918" y="505">超过维护预算</text><text class="row" x="1060" y="491">先确认退役</text>
  </g>

  <g aria-label="决策规则">
    <rect x="40" y="574" width="1200" height="98" rx="7" fill="#fff" stroke="#b6c4cb" stroke-width="2"/>
    <text class="row" x="60" y="606">联合门禁</text>
    <text class="cell" x="168" y="606">可达风险有明确分母</text><text class="cell" x="361" y="606">相关故障能使断言失败</text><text class="cell" x="582" y="606">等价与超时不伪装成杀死</text><text class="cell" x="817" y="606">数据与执行稳定</text><text class="cell" x="1013" y="606">维护预算有 owner</text>
    <text class="tiny" x="60" y="641">任一硬条件失败：DENY；证据缺失：UNKNOWN；所有条件满足：进入观察期，而不是直接宣称“测试质量已被永久证明”。</text>
  </g>
</svg>
