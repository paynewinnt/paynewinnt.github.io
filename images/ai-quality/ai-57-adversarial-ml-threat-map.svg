<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">数据投毒、后门、模型提取与成员推断威胁地图</title>
  <desc id="desc">按生命周期、攻击者写权限或查询权限、直接目标、观测证据和防守控制，区分四类对抗机器学习风险。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#345f70"/></marker>
    <marker id="attack" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#b24b37"/></marker>
    <style>
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17323d; }
      .subtitle { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4c6872; }
      .stage { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17323d; }
      .boxTitle { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17323d; }
      .boxText { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #48636d; }
      .riskTitle { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #8d3526; }
      .edge { fill: none; stroke: #345f70; stroke-width: 2.2; marker-end: url(#arrow); }
      .attackEdge { fill: none; stroke: #b24b37; stroke-width: 2.2; stroke-dasharray: 7 5; marker-end: url(#attack); }
    </style>
  </defs>
  <rect width="1280" height="720" fill="#f7faf9"/>
  <rect x="36" y="28" width="1208" height="76" rx="6" fill="#e7f0ed"/>
  <text class="title" x="64" y="62">对抗机器学习风险必须从攻击前提开始建模</text>
  <text class="subtitle" x="64" y="88">同一个“异常分数”可能来自投毒、普通脏数据、分布漂移或实现缺陷；攻击标签需要权限、目标和证据共同支持</text>

  <rect x="42" y="132" width="1196" height="132" rx="6" fill="#edf4f2" stroke="#b4c9c1"/>
  <text class="stage" x="64" y="164">系统生命周期</text>
  <g>
    <rect x="64" y="184" width="176" height="58" rx="5" fill="#ffffff" stroke="#77a08f"/><text class="boxTitle" x="84" y="210">数据采集与标注</text><text class="boxText" x="84" y="229">source / writer / lineage</text>
    <rect x="284" y="184" width="176" height="58" rx="5" fill="#ffffff" stroke="#77a08f"/><text class="boxTitle" x="304" y="210">训练与微调</text><text class="boxText" x="304" y="229">dataset / code / seed</text>
    <rect x="504" y="184" width="176" height="58" rx="5" fill="#ffffff" stroke="#77a08f"/><text class="boxTitle" x="524" y="210">验证与注册</text><text class="boxText" x="524" y="229">clean / trigger / slice</text>
    <rect x="724" y="184" width="176" height="58" rx="5" fill="#ffffff" stroke="#77a08f"/><text class="boxTitle" x="744" y="210">推理 API</text><text class="boxText" x="744" y="229">output / query / identity</text>
    <rect x="944" y="184" width="250" height="58" rx="5" fill="#ffffff" stroke="#77a08f"/><text class="boxTitle" x="964" y="210">监控、响应与再训练</text><text class="boxText" x="964" y="229">telemetry / revocation / rollback</text>
  </g>
  <path class="edge" d="M240 213 H284"/><path class="edge" d="M460 213 H504"/><path class="edge" d="M680 213 H724"/><path class="edge" d="M900 213 H944"/>

  <g>
    <rect x="42" y="302" width="280" height="250" rx="6" fill="#fff4f0" stroke="#d59b8e"/>
    <text class="riskTitle" x="64" y="334">投毒与后门</text>
    <text class="boxTitle" x="64" y="364">前提</text><text class="boxText" x="118" y="364">可写训练数据、标签或训练流程</text>
    <text class="boxTitle" x="64" y="392">目标</text><text class="boxText" x="118" y="392">整体退化或触发条件下定向行为</text>
    <text class="boxTitle" x="64" y="420">证据</text><text class="boxText" x="118" y="420">配对训练、剂量响应、触发特异性</text>
    <text class="boxTitle" x="64" y="448">分母</text><text class="boxText" x="118" y="448">有效 clean / trigger 样本分别报告</text>
    <text class="boxTitle" x="64" y="476">缓解</text><text class="boxText" x="118" y="476">来源控制、隔离、鲁棒聚合、回滚</text>
    <rect x="64" y="500" width="236" height="32" rx="4" fill="#ffffff" stroke="#d59b8e"/><text class="boxText" x="78" y="521">高触发成功率 ≠ 已证明真实攻击者身份</text>

    <rect x="346" y="302" width="280" height="250" rx="6" fill="#f3f0f8" stroke="#b4a5c9"/>
    <text class="riskTitle" x="368" y="334">模型提取</text>
    <text class="boxTitle" x="368" y="364">前提</text><text class="boxText" x="422" y="364">可查询目标输出，预算与反馈已知</text>
    <text class="boxTitle" x="368" y="392">目标</text><text class="boxText" x="422" y="392">在预注册分布上复制功能</text>
    <text class="boxTitle" x="368" y="420">证据</text><text class="boxText" x="422" y="420">独立留出集 fidelity 与预算曲线</text>
    <text class="boxTitle" x="368" y="448">分母</text><text class="boxText" x="422" y="448">有效且未用于构建替代模型的查询</text>
    <text class="boxTitle" x="368" y="476">缓解</text><text class="boxText" x="422" y="476">最小输出、限流、行为监控、隔离</text>
    <rect x="368" y="500" width="236" height="32" rx="4" fill="#ffffff" stroke="#b4a5c9"/><text class="boxText" x="382" y="521">相似输出 ≠ 自动证明模型被窃取</text>

    <rect x="650" y="302" width="280" height="250" rx="6" fill="#edf5f8" stroke="#94b7c6"/>
    <text class="riskTitle" x="672" y="334">成员推断</text>
    <text class="boxTitle" x="672" y="364">前提</text><text class="boxText" x="726" y="364">候选记录、模型反馈与辅助信息</text>
    <text class="boxTitle" x="672" y="392">目标</text><text class="boxText" x="726" y="392">判断某记录是否属于训练集</text>
    <text class="boxTitle" x="672" y="420">证据</text><text class="boxText" x="726" y="420">平衡对照、ROC/PR、置信区间</text>
    <text class="boxTitle" x="672" y="448">分母</text><text class="boxText" x="726" y="448">member / non-member 分开并保留基率</text>
    <text class="boxTitle" x="672" y="476">缓解</text><text class="boxText" x="726" y="476">泛化、最小反馈、DP、审计</text>
    <rect x="672" y="500" width="236" height="32" rx="4" fill="#ffffff" stroke="#94b7c6"/><text class="boxText" x="686" y="521">高于机会水平 ≠ 某记录确实参与训练</text>

    <rect x="954" y="302" width="284" height="250" rx="6" fill="#fff8e9" stroke="#d1b271"/>
    <text class="riskTitle" x="976" y="334">共同评测控制</text>
    <text class="boxTitle" x="976" y="364">冻结假设</text><text class="boxText" x="1054" y="364">知识、能力、预算、目标</text>
    <text class="boxTitle" x="976" y="392">对照设计</text><text class="boxText" x="1054" y="392">配对种子、数据、版本与顺序</text>
    <text class="boxTitle" x="976" y="420">不确定性</text><text class="boxText" x="1054" y="420">区间、重复、未知与缺失</text>
    <text class="boxTitle" x="976" y="448">业务代价</text><text class="boxText" x="1054" y="448">防守后 utility / latency 损失</text>
    <text class="boxTitle" x="976" y="476">安全边界</text><text class="boxText" x="1054" y="476">隔离构造目标、无真实攻击步骤</text>
    <rect x="976" y="500" width="238" height="32" rx="4" fill="#ffffff" stroke="#d1b271"/><text class="boxText" x="990" y="521">检测信号 ≠ 归因结论 ≠ 风险接受决定</text>
  </g>

  <path class="attackEdge" d="M160 302 V274 H152 V242"/><path class="attackEdge" d="M218 302 V280 H372 V242"/>
  <path class="attackEdge" d="M486 302 V280 H812 V242"/><path class="attackEdge" d="M790 302 V274 H846 V242"/>

  <rect x="42" y="584" width="1196" height="96" rx="6" fill="#ffffff" stroke="#c3d2cc"/>
  <text class="stage" x="64" y="616">报告输出必须拆成三栏</text>
  <text class="boxTitle" x="64" y="647">观测：</text><text class="boxText" x="122" y="647">某构造攻击在固定预算与样本上达到的指标和区间</text>
  <text class="boxTitle" x="470" y="647">推断：</text><text class="boxText" x="528" y="647">哪些攻击前提与机制得到支持，哪些仍未知</text>
  <text class="boxTitle" x="858" y="647">决定：</text><text class="boxText" x="916" y="647">阻断、缓解、接受或继续调查及其适用范围</text>
</svg>
