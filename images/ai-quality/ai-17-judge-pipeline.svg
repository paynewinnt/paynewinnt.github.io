<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">可校准的 LLM-as-Judge 评测流水线</title>
  <desc id="desc">评测样本经过盲化和随机化，进入带评分细则的点式或成对裁判，多次运行后聚合，并通过人工黄金集校准，最终输出分数和不确定性。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #475569; }
      .head { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #0f172a; }
      .body { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #334155; }
      .small { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect width="1280" height="800" fill="#f8fafc"/>
  <rect x="34" y="28" width="1212" height="744" rx="14" fill="#ffffff" stroke="#dbe3ee" stroke-width="2"/>
  <text x="70" y="78" class="title">可校准的 LLM-as-Judge 评测流水线</text>
  <text x="70" y="111" class="subtitle">Judge 是有测量误差的评估器：先约束输入和量表，再测一致性、偏差与人工相关性。</text>

  <rect x="70" y="152" width="210" height="125" rx="10" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/>
  <text x="175" y="188" text-anchor="middle" class="head">① 评测样本</text>
  <text x="90" y="221" class="body">输入 / 参考资料</text>
  <text x="90" y="248" class="body">候选回答 / 风险标签</text>

  <line x1="280" y1="214" x2="323" y2="214" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="333" y="152" width="210" height="125" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="438" y="188" text-anchor="middle" class="head">② 盲化与随机化</text>
  <text x="353" y="221" class="body">移除模型身份</text>
  <text x="353" y="248" class="body">交换顺序 / 固定版本</text>

  <line x1="543" y1="214" x2="586" y2="214" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="596" y="152" width="250" height="125" rx="10" fill="#fff5df" stroke="#d97706" stroke-width="2"/>
  <text x="721" y="188" text-anchor="middle" class="head">③ Rubric + 评估协议</text>
  <text x="616" y="221" class="body">维度、锚点、禁止项</text>
  <text x="616" y="248" class="body">pointwise / pairwise / reference</text>

  <line x1="846" y1="214" x2="889" y2="214" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="899" y="152" width="311" height="125" rx="10" fill="#f6edff" stroke="#7e22ce" stroke-width="2"/>
  <text x="1054" y="188" text-anchor="middle" class="head">④ 裁判执行</text>
  <text x="919" y="221" class="body">结构化输出 + 逐维证据</text>
  <text x="919" y="248" class="body">多次运行 / 多裁判 / 超时重试</text>

  <line x1="1054" y1="277" x2="1054" y2="329" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="899" y="339" width="311" height="125" rx="10" fill="#e8f7ef" stroke="#15803d" stroke-width="2"/>
  <text x="1054" y="375" text-anchor="middle" class="head">⑤ 聚合与不确定性</text>
  <text x="919" y="408" class="body">多数票 / 中位数 / Bradley-Terry</text>
  <text x="919" y="435" class="body">分歧率 / 置信区间 / 灰区</text>

  <line x1="899" y1="401" x2="846" y2="401" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="596" y="339" width="250" height="125" rx="10" fill="#fff0f0" stroke="#dc2626" stroke-width="2"/>
  <text x="721" y="375" text-anchor="middle" class="head">⑥ 人工黄金集校准</text>
  <text x="616" y="408" class="body">专家双标 + 仲裁</text>
  <text x="616" y="435" class="body">一致性 / 相关性 / 偏差切片</text>

  <line x1="596" y1="401" x2="543" y2="401" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="333" y="339" width="210" height="125" rx="10" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/>
  <text x="438" y="375" text-anchor="middle" class="head">⑦ 质量门禁</text>
  <text x="353" y="408" class="body">通过 / 复核 / 失败</text>
  <text x="353" y="435" class="body">附阈值版本和原因</text>

  <line x1="333" y1="401" x2="280" y2="401" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="70" y="339" width="210" height="125" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="175" y="375" text-anchor="middle" class="head">⑧ 审计报告</text>
  <text x="90" y="408" class="body">分项分数 / 原始判词</text>
  <text x="90" y="435" class="body">成本 / 版本 / 可重放 ID</text>

  <rect x="70" y="515" width="1140" height="172" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="92" y="552" class="head">必须同时报告的四组指标</text>
  <rect x="92" y="574" width="250" height="82" rx="8" fill="#eaf2ff"/>
  <text x="217" y="603" text-anchor="middle" class="head">有效性</text>
  <text x="217" y="632" text-anchor="middle" class="body">与人工排序/评分的相关性</text>
  <rect x="374" y="574" width="250" height="82" rx="8" fill="#e8f7ef"/>
  <text x="499" y="603" text-anchor="middle" class="head">可靠性</text>
  <text x="499" y="632" text-anchor="middle" class="body">重测一致性与裁判间一致性</text>
  <rect x="656" y="574" width="250" height="82" rx="8" fill="#fff5df"/>
  <text x="781" y="603" text-anchor="middle" class="head">公平性</text>
  <text x="781" y="632" text-anchor="middle" class="body">位置、长度、风格、来源切片</text>
  <rect x="938" y="574" width="250" height="82" rx="8" fill="#f6edff"/>
  <text x="1063" y="603" text-anchor="middle" class="head">可运营性</text>
  <text x="1063" y="632" text-anchor="middle" class="body">延迟、成本、失败率、复核率</text>

  <text x="70" y="728" class="small">反馈闭环：人工分歧样本 → 修订 rubric / 数据切片 / 阈值 → 版本化回归；禁止把单一 Judge 分数直接当作真值。</text>
</svg>
