<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">LLMOps 提升、观测和完整回滚流水线</title>
  <desc id="desc">展示开发、预发、影子、金丝雀和生产阶段的证据门禁、职责分离以及按完整发布包回滚的路径。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .stage { fill: #ffffff; stroke: #5d6b7a; stroke-width: 2; }
      .active { fill: #e8f6ef; stroke: #287654; stroke-width: 2; }
      .gate { fill: #fff2d6; stroke: #a56a00; stroke-width: 2; }
      .block { fill: #fde8e7; stroke: #a43e37; stroke-width: 2; }
      .audit { fill: #e8f0ff; stroke: #3569a8; stroke-width: 2; }
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17202a; }
      .subtitle { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b5563; }
      .box-title { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17202a; }
      .text { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #344054; }
      .label { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5f6670; }
      .arrow { stroke: #566576; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .rollback { stroke: #a43e37; stroke-width: 3; fill: none; stroke-dasharray: 9 6; marker-end: url(#red-arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#566576"/>
    </marker>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#a43e37"/>
    </marker>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="52" y="52">从开发到生产：每次提升消费证据，回滚恢复完整组合</text>
  <text class="subtitle" x="52" y="82">构建者、质量批准者、风险批准者和部署者分离；证据不足为 UNKNOWN，硬底线失败为 BLOCK</text>

  <rect class="stage" x="50" y="150" width="170" height="108" rx="7"/>
  <text class="box-title" x="72" y="182">DEV</text>
  <text class="text" x="72" y="208">版本图闭包</text>
  <text class="text" x="72" y="232">可重复构建</text>

  <rect class="gate" x="260" y="150" width="170" height="108" rx="7"/>
  <text class="box-title" x="282" y="182">离线 Gate</text>
  <text class="text" x="282" y="208">分母 / CI / Slice</text>
  <text class="text" x="282" y="232">签名 Evidence</text>

  <rect class="stage" x="470" y="150" width="170" height="108" rx="7"/>
  <text class="box-title" x="492" y="182">STAGING</text>
  <text class="text" x="492" y="208">集成与重建</text>
  <text class="text" x="492" y="232">模拟工具目标</text>

  <rect class="active" x="680" y="150" width="170" height="108" rx="7"/>
  <text class="box-title" x="702" y="182">SHADOW</text>
  <text class="text" x="702" y="208">复制输入，不副作用</text>
  <text class="text" x="702" y="232">覆盖与漂移</text>

  <rect class="active" x="890" y="150" width="170" height="108" rx="7"/>
  <text class="box-title" x="912" y="182">CANARY</text>
  <text class="text" x="912" y="208">有限真实流量</text>
  <text class="text" x="912" y="232">业务后置条件</text>

  <rect class="active" x="1100" y="150" width="130" height="108" rx="7"/>
  <text class="box-title" x="1122" y="182">PROD</text>
  <text class="text" x="1122" y="208">Bundle B</text>
  <text class="text" x="1122" y="232">持续监控</text>

  <path class="arrow" d="M220 204 H254"/>
  <path class="arrow" d="M430 204 H464"/>
  <path class="arrow" d="M640 204 H674"/>
  <path class="arrow" d="M850 204 H884"/>
  <path class="arrow" d="M1060 204 H1094"/>

  <rect class="audit" x="140" y="332" width="300" height="116" rx="7"/>
  <text class="box-title" x="162" y="364">签名发布包与重建验证</text>
  <text class="text" x="162" y="390">组件摘要 / 图 / 合同 / Runner</text>
  <text class="text" x="162" y="414">从内容库重新取回并逐项验真</text>

  <rect class="audit" x="490" y="332" width="300" height="116" rx="7"/>
  <text class="box-title" x="512" y="364">职责分离与审批收据</text>
  <text class="text" x="512" y="390">Builder ≠ Quality ≠ Risk ≠ Deployer</text>
  <text class="text" x="512" y="414">环境、Bundle、epoch、到期均绑定</text>

  <rect class="gate" x="840" y="332" width="300" height="116" rx="7"/>
  <text class="box-title" x="862" y="364">线上证据门</text>
  <text class="text" x="862" y="390">eligible / observed / valid / impact</text>
  <text class="text" x="862" y="414">质量、安全、漂移、容量与成本</text>

  <path class="arrow" d="M290 326 V264"/>
  <path class="arrow" d="M640 326 V264"/>
  <path class="arrow" d="M990 326 V264"/>

  <rect class="block" x="140" y="526" width="300" height="112" rx="7"/>
  <text class="box-title" x="162" y="558">BLOCK</text>
  <text class="text" x="162" y="584">关键风险或兼容性明确失败</text>
  <text class="text" x="162" y="608">停止提升，保留证据</text>

  <rect class="gate" x="490" y="526" width="300" height="112" rx="7"/>
  <text class="box-title" x="512" y="558">UNKNOWN</text>
  <text class="text" x="512" y="584">缺分母、缺 Trace、样本不足</text>
  <text class="text" x="512" y="608">阻断自动提升，修复测量链</text>

  <rect class="block" x="840" y="526" width="300" height="112" rx="7"/>
  <text class="box-title" x="862" y="558">完整回滚到 Bundle A</text>
  <text class="text" x="862" y="584">恢复 7 个组件与兼容合同</text>
  <text class="text" x="862" y="608">排空在途、验证后置条件</text>

  <path class="rollback" d="M1165 258 C1170 470 1110 496 1040 520"/>
  <path class="rollback" d="M840 582 C675 675 372 675 220 264"/>
  <text class="label" x="932" y="492">异常触发：停止扩流并选择已验证历史 Bundle</text>
  <text class="subtitle" x="52" y="694">只回滚 Model 会留下 Prompt、Retriever、Tool 或 Policy 的不兼容状态；Alias 移动后仍要核验实际部署摘要</text>
</svg>
