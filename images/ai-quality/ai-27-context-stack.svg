<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Context Engineering 上下文来源、治理属性与组装栈</title>
  <desc id="desc">展示 instruction、history、memory、retrieval、tool result 和 working state 六类候选内容，经过来源、权限、可信度、时效、冲突与 Token 成本检查后，组装成采样时的有限上下文。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { fill: #172033; font: 700 29px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .subtitle { fill: #526079; font: 400 16px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .h2 { fill: #172033; font: 700 19px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .label { fill: #172033; font: 700 16px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .small { fill: #526079; font: 400 14px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .tiny { fill: #526079; font: 400 13px Inter, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .line { stroke: #64748b; stroke-width: 2; fill: none; }
      .panel { fill: #ffffff; stroke: #d9e1ec; stroke-width: 2; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="54" y="54">Context Engineering：选择与组织采样时的全部 Token</text>
  <text class="subtitle" x="54" y="83">“更长”不是目标；目标是在权限和预算内，让最小的高信号上下文可追溯、可裁剪、可评测</text>

  <text class="h2" x="54" y="124">候选来源</text>
  <g transform="translate(54,144)">
    <rect x="0" y="0" width="260" height="68" rx="8" fill="#e7efff" stroke="#7fa4df" stroke-width="2"/>
    <text class="label" x="18" y="28">Instruction</text><text class="small" x="18" y="51">策略、任务、输出契约</text>
    <rect x="0" y="78" width="260" height="68" rx="8" fill="#dff4ee" stroke="#77bfa9" stroke-width="2"/>
    <text class="label" x="18" y="106">History</text><text class="small" x="18" y="129">当前会话的消息与决策</text>
    <rect x="0" y="156" width="260" height="68" rx="8" fill="#fff0d9" stroke="#e8ab55" stroke-width="2"/>
    <text class="label" x="18" y="184">Memory</text><text class="small" x="18" y="207">跨轮次偏好、事实与摘要</text>
    <rect x="0" y="234" width="260" height="68" rx="8" fill="#f4e9ff" stroke="#aa82d4" stroke-width="2"/>
    <text class="label" x="18" y="262">Retrieval</text><text class="small" x="18" y="285">知识片段、版本与 ACL</text>
    <rect x="0" y="312" width="260" height="68" rx="8" fill="#ffe7e7" stroke="#df8888" stroke-width="2"/>
    <text class="label" x="18" y="340">Tool Result</text><text class="small" x="18" y="363">结构化事实与不可信文本</text>
    <rect x="0" y="390" width="260" height="68" rx="8" fill="#e4f4ff" stroke="#6daed6" stroke-width="2"/>
    <text class="label" x="18" y="418">Working State</text><text class="small" x="18" y="441">目标、计划、已完成与待处理</text>
  </g>

  <path class="line" d="M330 373 H390" marker-end="url(#arrow)"/>

  <rect class="panel" x="400" y="132" width="390" height="500" rx="8"/>
  <text class="h2" x="595" y="169" text-anchor="middle">Context Assembler 治理门</text>
  <g transform="translate(428,193)">
    <rect x="0" y="0" width="334" height="48" rx="6" fill="#eef4ff"/>
    <text class="label" x="18" y="20">1. Provenance 与授权</text><text class="tiny" x="18" y="39">来源主体、租户、版本、哈希、ACL 是否匹配</text>
    <rect x="0" y="56" width="334" height="48" rx="6" fill="#eaf7f2"/>
    <text class="label" x="18" y="76">2. Authority 与 Trust</text><text class="tiny" x="18" y="95">谁有权下指令，谁只提供可引用的数据</text>
    <rect x="0" y="112" width="334" height="48" rx="6" fill="#fff5e7"/>
    <text class="label" x="18" y="132">3. Freshness 与有效期</text><text class="tiny" x="18" y="151">事件时间、版本时间、TTL 和撤销状态</text>
    <rect x="0" y="168" width="334" height="48" rx="6" fill="#f7efff"/>
    <text class="label" x="18" y="188">4. 冲突与重复</text><text class="tiny" x="18" y="207">同一事实键先裁决，不把矛盾静默塞给模型</text>
    <rect x="0" y="224" width="334" height="48" rx="6" fill="#fff0f0"/>
    <text class="label" x="18" y="244">5. Poisoning 边界</text><text class="tiny" x="18" y="263">检索与工具文本不能升级成高权指令</text>
    <rect x="0" y="280" width="334" height="48" rx="6" fill="#edf8ff"/>
    <text class="label" x="18" y="300">6. Utility / Token</text><text class="tiny" x="18" y="319">相关性、必要性、信息增益与占用成本</text>
    <rect x="0" y="340" width="334" height="72" rx="6" fill="#24304a"/>
    <text x="167" y="368" text-anchor="middle" fill="#ffffff" font="700 16px Inter, 'PingFang SC', sans-serif">每个决定写入 Assembly Trace</text>
    <text x="167" y="393" text-anchor="middle" fill="#dbe5f4" font="400 12px Inter, 'PingFang SC', sans-serif">included · dropped · summarized · conflicted</text>
  </g>

  <path class="line" d="M790 373 H850" marker-end="url(#arrow)"/>

  <text class="h2" x="1046" y="124" text-anchor="middle">最终采样上下文</text>
  <g transform="translate(860,144)">
    <rect x="0" y="0" width="366" height="70" rx="8" fill="#e7efff" stroke="#7fa4df" stroke-width="2"/>
    <text class="label" x="18" y="28">固定可信前缀</text><text class="small" x="18" y="51">安全策略 · 任务边界 · 输出契约</text>
    <rect x="0" y="76" width="366" height="70" rx="8" fill="#e4f4ff" stroke="#6daed6" stroke-width="2"/>
    <text class="label" x="18" y="104">当前任务与 Working State</text><text class="small" x="18" y="127">本轮目标 · 未决事项 · 最近有效动作</text>
    <rect x="0" y="152" width="366" height="70" rx="8" fill="#dff4ee" stroke="#77bfa9" stroke-width="2"/>
    <text class="label" x="18" y="180">精选 History / Memory</text><text class="small" x="18" y="203">保留因果，不保留全部聊天噪声</text>
    <rect x="0" y="228" width="366" height="88" rx="8" fill="#f4e9ff" stroke="#aa82d4" stroke-width="2"/>
    <text class="label" x="18" y="256">Retrieval Evidence</text><text class="small" x="18" y="280">来源、版本、有效期与引用 ID</text>
    <text class="tiny" x="18" y="302">内容仍是数据，不因排在前面而获得指令权</text>
    <rect x="0" y="322" width="366" height="88" rx="8" fill="#ffe7e7" stroke="#df8888" stroke-width="2"/>
    <text class="label" x="18" y="350">Tool Result</text><text class="small" x="18" y="374">Schema 字段与外部自由文本分开包装</text>
    <text class="tiny" x="18" y="396">大结果留引用，按需再取，不直接整包回灌</text>
    <rect x="0" y="416" width="366" height="70" rx="8" fill="#fff0d9" stroke="#e8ab55" stroke-width="2"/>
    <text class="label" x="18" y="444">当前用户输入</text><text class="small" x="18" y="467">保留原始意图与实体绑定</text>
  </g>

  <rect x="54" y="654" width="1172" height="42" rx="8" fill="#24304a"/>
  <text x="640" y="681" text-anchor="middle" fill="#ffffff" font="600 17px Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif">优先级、可信度和相关性是三个不同维度：高相关的不可信文本仍然只能作为数据，高权指令也要接受版本与有效期检查</text>
</svg>
