<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">确定性门禁与语义分数的三段式判定区</title>
  <desc id="desc">确定性门禁失败时直接失败，门禁通过后再按语义分数划分失败、人工复核和自动通过，并使用误报漏报成本校准阈值。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #475569; }
      .head { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #0f172a; }
      .body { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #334155; }
      .small { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #475569; }
      .mono { font: 600 16px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0f172a; }
    </style>
  </defs>

  <rect width="1280" height="800" fill="#f8fafc"/>
  <rect x="34" y="28" width="1212" height="744" rx="14" fill="#ffffff" stroke="#dbe3ee" stroke-width="2"/>
  <text x="70" y="78" class="title">确定性门禁 + 语义分数：三段式判定区</text>
  <text x="70" y="111" class="subtitle">阈值不是模型属性，而是结合样本分布、风险等级和复核成本形成的业务决策。</text>

  <rect x="70" y="150" width="280" height="104" rx="10" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/>
  <text x="210" y="188" text-anchor="middle" class="head">样本 + 完整证据</text>
  <text x="210" y="220" text-anchor="middle" class="body">output / state / trace / source</text>
  <line x1="350" y1="202" x2="408" y2="202" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <polygon points="480,139 562,202 480,265 398,202" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="480" y="194" text-anchor="middle" class="head">硬门禁</text>
  <text x="480" y="220" text-anchor="middle" class="body">是否通过？</text>

  <line x1="480" y1="265" x2="480" y2="324" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="493" y="296" class="small">否</text>
  <rect x="340" y="334" width="280" height="90" rx="10" fill="#fff0f0" stroke="#dc2626" stroke-width="2"/>
  <text x="480" y="371" text-anchor="middle" class="head">直接 FAIL</text>
  <text x="480" y="401" text-anchor="middle" class="body">保留失败规则与原始证据</text>

  <line x1="562" y1="202" x2="665" y2="202" stroke="#15803d" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="602" y="190" class="small">是</text>
  <rect x="675" y="150" width="535" height="104" rx="10" fill="#fff5df" stroke="#d97706" stroke-width="2"/>
  <text x="942" y="188" text-anchor="middle" class="head">计算分维度语义分数</text>
  <text x="942" y="220" text-anchor="middle" class="body">正确性、相关性、完整性、忠实度分别评分，不先压成一个总分</text>

  <text x="70" y="482" class="head">语义判定轴（仅对硬门禁已通过的样本生效）</text>
  <line x1="110" y1="570" x2="1170" y2="570" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="110" y="514" width="310" height="56" fill="#fff0f0"/>
  <rect x="420" y="514" width="390" height="56" fill="#fff5df"/>
  <rect x="810" y="514" width="330" height="56" fill="#e8f7ef"/>
  <line x1="420" y1="502" x2="420" y2="594" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 5"/>
  <line x1="810" y1="502" x2="810" y2="594" stroke="#15803d" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="265" y="550" text-anchor="middle" class="head">自动失败区</text>
  <text x="615" y="550" text-anchor="middle" class="head">灰区：人工复核</text>
  <text x="975" y="550" text-anchor="middle" class="head">自动通过区</text>
  <text x="110" y="604" text-anchor="middle" class="mono">0.0</text>
  <text x="420" y="604" text-anchor="middle" class="mono">T_fail</text>
  <text x="810" y="604" text-anchor="middle" class="mono">T_pass</text>
  <text x="1140" y="604" text-anchor="middle" class="mono">1.0</text>

  <rect x="70" y="635" width="545" height="100" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="92" y="671" class="head">阈值校准目标</text>
  <text x="92" y="702" class="body">最小化：C_FP × FP + C_FN × FN + C_R × REVIEW</text>
  <text x="92" y="724" class="small">同时满足关键风险召回率、自动化覆盖率和人工复核容量约束</text>

  <rect x="645" y="635" width="565" height="100" rx="10" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/>
  <text x="667" y="671" class="head">上线后持续监控</text>
  <text x="667" y="702" class="body">分布漂移、灰区占比、误报/漏报、分群表现、阈值版本与回滚</text>
  <text x="667" y="724" class="small">不同任务和风险等级使用不同阈值，不共用一个“万能 0.8”</text>
</svg>
