<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Generator、三层有效性、Shrinker、Oracle 与状态机矩阵</title>
  <desc id="desc">矩阵按全有效输入、Schema 单缺陷输入、业务无效输入、状态迁移无效序列和覆盖导向变异五类测试族，展示生成目标、有效性预期、收缩保持条件以及对应 Oracle 和状态机证据；顶部箭头表示每个样本从生成到判断的处理顺序。</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#17324d}.sub{font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#51697d}.head{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#fff}.rowh{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#17324d}.t{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#334f63}.mono{font:600 12px "SFMono-Regular",Consolas,monospace;fill:#3c586b}.line{stroke:#c4d3de;stroke-width:1.4}.arrow{fill:none;stroke:#6b7f8e;stroke-width:2.3;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#6b7f8e"/></marker>
  </defs>

  <rect class="bg" width="1280" height="720"/>
  <rect width="1280" height="100" fill="#ffffff"/>
  <rect y="98" width="1280" height="2" fill="#dce6ed"/>
  <text class="title" x="42" y="43">Generator × Validity × Shrinker × Oracle：每个测试族保持不同的真值</text>
  <text class="sub" x="42" y="74">Invalid 不是随机破坏；先决定要违反哪一层，再用单缺陷生成和保持型收缩让根因可归因。</text>

  <rect x="42" y="118" width="1196" height="48" rx="7" fill="#315d77"/>
  <text class="head" x="58" y="148">测试族</text>
  <text class="head" x="205" y="148">Generator：怎样产生</text>
  <text class="head" x="487" y="148">Validity：期望向量</text>
  <text class="head" x="735" y="148">Shrinker：必须保持</text>
  <text class="head" x="993" y="148">Oracle / 状态机证据</text>

  <path class="arrow" d="M425 110 L468 110"/>
  <path class="arrow" d="M675 110 L718 110"/>
  <path class="arrow" d="M935 110 L978 110"/>

  <rect x="42" y="177" width="1196" height="91" rx="7" fill="#e8f4ff" stroke="#7ea8c5"/>
  <rect x="42" y="177" width="145" height="91" rx="7" fill="#d6eaf8"/>
  <text class="rowh" x="58" y="207">A. 全有效</text>
  <text class="t" x="58" y="230">成功与不变量</text>
  <text class="t" x="201" y="202">从 Schema 构造，再满足政策快照；</text>
  <text class="t" x="201" y="224">沿可达状态边生成动作与参数</text>
  <text class="mono" x="201" y="247">boundary + weighted state path</text>
  <text class="mono" x="483" y="203">schema=T · business=T</text>
  <text class="mono" x="483" y="226">transition=T</text>
  <text class="t" x="731" y="202">三层仍有效；保留失败谓词；</text>
  <text class="t" x="731" y="224">同步缩相互依赖字段与前缀</text>
  <text class="t" x="989" y="202">后置条件、幂等、响应-状态一致</text>
  <text class="t" x="989" y="224">模型/工具调用 Trace + 沙箱快照</text>
  <text class="mono" x="989" y="247">accepted edge + invariant set</text>

  <rect x="42" y="278" width="1196" height="91" rx="7" fill="#fff0f1" stroke="#c98286"/>
  <rect x="42" y="278" width="145" height="91" rx="7" fill="#f6dadd"/>
  <text class="rowh" x="58" y="308">B. Schema 无效</text>
  <text class="t" x="58" y="331">单关键字缺陷</text>
  <text class="t" x="201" y="303">先生成全有效对象，只做一次定向</text>
  <text class="t" x="201" y="325">变异：required/type/enum/bound</text>
  <text class="mono" x="201" y="348">exactly one mutation_id</text>
  <text class="mono" x="483" y="304">schema=F(target keyword)</text>
  <text class="mono" x="483" y="327">business=N/A · transition=N/A</text>
  <text class="t" x="731" y="303">保持同一关键字和实例路径失败；</text>
  <text class="t" x="731" y="325">不得顺手制造第二种 Schema 错</text>
  <text class="t" x="989" y="303">解析/验证器必须拒绝且不执行工具</text>
  <text class="t" x="989" y="325">错误类别、路径、零副作用证据</text>
  <text class="mono" x="989" y="348">rejected before executor</text>

  <rect x="42" y="379" width="1196" height="91" rx="7" fill="#fff5de" stroke="#cc9a4f"/>
  <rect x="42" y="379" width="145" height="91" rx="7" fill="#f7e6bd"/>
  <text class="rowh" x="58" y="409">C. 业务无效</text>
  <text class="t" x="58" y="432">结构合法反例</text>
  <text class="t" x="201" y="404">保持 Schema 合法，只违反一条政策：</text>
  <text class="t" x="201" y="426">余额、权限、时区、实体关系</text>
  <text class="mono" x="201" y="449">one business_rule_id</text>
  <text class="mono" x="483" y="405">schema=T · business=F(rule)</text>
  <text class="mono" x="483" y="428">transition=N/A</text>
  <text class="t" x="731" y="404">保持 Schema 有效、同一政策失败；</text>
  <text class="t" x="731" y="426">冻结业务快照与主体身份</text>
  <text class="t" x="989" y="404">确定性政策 Oracle，不调用写工具</text>
  <text class="t" x="989" y="426">rule_id、snapshot_id、拒绝阶段</text>
  <text class="mono" x="989" y="449">schema pass → policy reject</text>

  <rect x="42" y="480" width="1196" height="91" rx="7" fill="#eaf7ee" stroke="#76a889"/>
  <rect x="42" y="480" width="145" height="91" rx="7" fill="#d5ecdc"/>
  <text class="rowh" x="58" y="510">D. 迁移无效</text>
  <text class="t" x="58" y="533">合法动作错时序</text>
  <text class="t" x="201" y="505">每步 Schema 与业务均合法，删除、</text>
  <text class="t" x="201" y="527">交换或重复一个关键前置动作</text>
  <text class="mono" x="201" y="550">one invalid edge / prefix</text>
  <text class="mono" x="483" y="506">schema=T · business=T</text>
  <text class="mono" x="483" y="529">transition=F(edge)</text>
  <text class="t" x="731" y="505">保持前缀能到达源状态、同一非法边；</text>
  <text class="t" x="731" y="527">若测深层故障则不得删触发前置步骤</text>
  <text class="t" x="989" y="505">参考状态机与执行器状态差分</text>
  <text class="t" x="989" y="527">拒绝非法边；重复不得多次写入</text>
  <text class="mono" x="989" y="550">state_before/after + call ledger</text>

  <rect x="42" y="581" width="1196" height="91" rx="7" fill="#f0ecf8" stroke="#9781b4"/>
  <rect x="42" y="581" width="145" height="91" rx="7" fill="#e2d9f0"/>
  <text class="rowh" x="58" y="611">E. 覆盖导向</text>
  <text class="t" x="58" y="634">探索而非证明</text>
  <text class="t" x="201" y="606">从 corpus 选种；结构感知 mutation；</text>
  <text class="t" x="201" y="628">按新边、规则与状态给探索能量</text>
  <text class="mono" x="201" y="651">seed lineage + mutation stack</text>
  <text class="t" x="483" y="607">有效性向量显式标记，不混池；</text>
  <text class="t" x="483" y="629">新颖失败需回到 A/B/C/D 分类</text>
  <text class="t" x="731" y="606">先固定失败签名再用对应行收缩；</text>
  <text class="t" x="731" y="628">覆盖可变化，根因与谓词不可漂移</text>
  <text class="t" x="989" y="606">覆盖只决定保留和调度优先级；</text>
  <text class="t" x="989" y="628">最终仍由属性、Oracle、状态机裁决</text>
  <text class="mono" x="989" y="651">novelty != correctness</text>

  <path class="line" d="M187 177 L187 672 M469 177 L469 672 M717 177 L717 672 M975 177 L975 672"/>
  <text class="t" x="42" y="703">统一记录：case_id、seed/path、generator/shrinker 版本、三层 validity 向量、rule/edge ID、失败签名、覆盖增量、资源成本与处置决策。</text>
</svg>
