<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">非确定性 AI 自动化回归的分层门禁</title>
  <desc id="desc">从冻结基线、配对重复试验、统计判定到四层质量门禁和证据归档的完整流程图</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#35526f"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#17324d" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 34px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #17324d; }
      .subtitle { font: 400 17px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #516679; }
      .box-title { font: 700 19px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #17324d; }
      .box-text { font: 400 15px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #3a5167; }
      .band-title { font: 700 18px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #ffffff; }
      .band-text { font: 400 15px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #243b52; }
      .small { font: 400 13px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #516679; }
      .mono { font: 600 14px 'SFMono-Regular', Consolas, monospace; fill: #17324d; }
    </style>
  </defs>

  <rect width="1280" height="800" fill="#f6f9fc"/>
  <rect x="0" y="0" width="1280" height="92" fill="#ffffff"/>
  <rect x="0" y="90" width="1280" height="2" fill="#d8e3ec"/>
  <text x="56" y="49" class="title">非确定性 AI 自动化回归：从随机输出到可发布结论</text>
  <text x="56" y="77" class="subtitle">同一任务做配对重复试验；确定性风险先拦截，统计质量再判定，所有结论可回放</text>

  <g filter="url(#shadow)">
    <rect x="56" y="126" width="196" height="142" rx="8" fill="#eaf4ff" stroke="#6aa6d8" stroke-width="2"/>
    <rect x="291" y="126" width="196" height="142" rx="8" fill="#edf8f1" stroke="#69a87d" stroke-width="2"/>
    <rect x="526" y="126" width="196" height="142" rx="8" fill="#fff7e8" stroke="#d99a3d" stroke-width="2"/>
    <rect x="761" y="126" width="196" height="142" rx="8" fill="#f4effb" stroke="#8d70bc" stroke-width="2"/>
    <rect x="996" y="126" width="228" height="142" rx="8" fill="#fff0f0" stroke="#cb6f75" stroke-width="2"/>
  </g>

  <text x="154" y="160" text-anchor="middle" class="box-title">1. 冻结比较合同</text>
  <text x="76" y="192" class="box-text">• 数据集与分层权重</text>
  <text x="76" y="217" class="box-text">• Prompt / 模型 / 工具</text>
  <text x="76" y="242" class="box-text">• Judge 与环境快照</text>

  <text x="389" y="160" text-anchor="middle" class="box-title">2. 配对重复试验</text>
  <text x="311" y="192" class="box-text">• 相同 case_id</text>
  <text x="311" y="217" class="box-text">• 相同 trial_slot</text>
  <text x="311" y="242" class="box-text">• 基线与候选同窗口</text>

  <text x="624" y="160" text-anchor="middle" class="box-title">3. 分离无效试验</text>
  <text x="546" y="192" class="box-text">• 基础设施失败</text>
  <text x="546" y="217" class="box-text">• 产品失败</text>
  <text x="546" y="242" class="box-text">• 预先声明判废规则</text>

  <text x="859" y="160" text-anchor="middle" class="box-title">4. 统计与配对判定</text>
  <text x="781" y="192" class="box-text">• 通过率与置信区间</text>
  <text x="781" y="217" class="box-text">• paired delta / McNemar</text>
  <text x="781" y="242" class="box-text">• 分层与关键用例</text>

  <text x="1110" y="160" text-anchor="middle" class="box-title">5. 证据归档</text>
  <text x="1016" y="192" class="box-text">• 输入、检索与工具轨迹</text>
  <text x="1016" y="217" class="box-text">• 原始输出与评分明细</text>
  <text x="1016" y="242" class="box-text">• 版本清单与内容摘要</text>

  <line x1="252" y1="197" x2="281" y2="197" stroke="#35526f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="487" y1="197" x2="516" y2="197" stroke="#35526f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="722" y1="197" x2="751" y2="197" stroke="#35526f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="957" y1="197" x2="986" y2="197" stroke="#35526f" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="56" y="320" class="box-title">四层门禁：越靠近提交越快，越靠近发布越接近真实分布</text>

  <g filter="url(#shadow)">
    <rect x="56" y="345" width="1168" height="76" rx="8" fill="#ffffff" stroke="#d6e1ea"/>
    <rect x="56" y="345" width="166" height="76" rx="8" fill="#b8424a"/>
    <rect x="56" y="345" width="16" height="76" fill="#b8424a"/>

    <rect x="56" y="437" width="1168" height="76" rx="8" fill="#ffffff" stroke="#d6e1ea"/>
    <rect x="56" y="437" width="166" height="76" rx="8" fill="#cb7b22"/>
    <rect x="56" y="437" width="16" height="76" fill="#cb7b22"/>

    <rect x="56" y="529" width="1168" height="76" rx="8" fill="#ffffff" stroke="#d6e1ea"/>
    <rect x="56" y="529" width="166" height="76" rx="8" fill="#39715a"/>
    <rect x="56" y="529" width="16" height="76" fill="#39715a"/>

    <rect x="56" y="621" width="1168" height="76" rx="8" fill="#ffffff" stroke="#d6e1ea"/>
    <rect x="56" y="621" width="166" height="76" rx="8" fill="#355f8a"/>
    <rect x="56" y="621" width="16" height="76" fill="#355f8a"/>
  </g>

  <text x="139" y="377" text-anchor="middle" class="band-title">L0 硬约束门禁</text>
  <text x="139" y="401" text-anchor="middle" class="band-title">每次提交</text>
  <text x="250" y="375" class="band-text">Schema、权限、敏感数据、工具副作用、关键事实断言</text>
  <text x="250" y="400" class="small">任何一次违规直接阻断；随机通过率不能稀释安全与协议错误</text>
  <text x="1147" y="387" text-anchor="end" class="mono">1 trial</text>

  <text x="139" y="469" text-anchor="middle" class="band-title">L1 快速回归</text>
  <text x="139" y="493" text-anchor="middle" class="band-title">合并请求</text>
  <text x="250" y="467" class="band-text">核心样本、配对差值、历史高风险失败簇、成本与时延上限</text>
  <text x="250" y="492" class="small">强调快速反馈；低频随机失败进入夜间复验，不自动解释为通过</text>
  <text x="1147" y="479" text-anchor="end" class="mono">1–3 trials</text>

  <text x="139" y="561" text-anchor="middle" class="band-title">L2 统计回归</text>
  <text x="139" y="585" text-anchor="middle" class="band-title">夜间 / 候选版</text>
  <text x="250" y="559" class="band-text">分层样本、Wilson 区间、paired bootstrap、flaky eval 健康度</text>
  <text x="250" y="584" class="small">判定非劣、改进与不确定；报告区间，不只报告一个平均分</text>
  <text x="1147" y="571" text-anchor="end" class="mono">5–20 trials</text>

  <text x="139" y="653" text-anchor="middle" class="band-title">L3 线上验证</text>
  <text x="139" y="677" text-anchor="middle" class="band-title">灰度 / 发布后</text>
  <text x="250" y="651" class="band-text">影子流量、真实分布、失败预算、漂移、用户结果与回滚信号</text>
  <text x="250" y="676" class="small">离线回归不能替代生产监控；线上结果反哺样本但不能污染历史基线</text>
  <text x="1147" y="663" text-anchor="end" class="mono">continuous</text>

  <rect x="56" y="723" width="1168" height="48" rx="8" fill="#e9f0f6"/>
  <text x="640" y="753" text-anchor="middle" class="box-title">发布结论 = 硬约束全通过 + 配对质量非劣 + 噪声在预算内 + 证据可复现</text>
</svg>
