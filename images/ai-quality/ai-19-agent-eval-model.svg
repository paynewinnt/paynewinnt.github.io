<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Agent 最终状态与执行轨迹双层评测模型</title>
  <desc id="desc">展示任务契约、沙箱环境、最终状态判定与轨迹判定之间的关系。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 30px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .head { font: 700 19px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .body { font: 400 15px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .metric { font: 600 14px "JetBrains Mono", "Noto Sans SC", monospace; fill: #1e293b; }
      .small { font: 500 13px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect width="1280" height="720" fill="#f8fafc"/>
  <rect x="0" y="0" width="1280" height="8" fill="#2563eb"/>
  <text x="64" y="58" class="title">Agent 评测模型：最终状态与执行轨迹分开判</text>
  <text x="64" y="87" class="subtitle">结果正确不代表过程合规；过程看似合理也不代表任务真正完成。</text>

  <g filter="url(#shadow)">
    <rect x="64" y="132" width="252" height="448" rx="8" fill="#ffffff" stroke="#64748b"/>
    <rect x="64" y="132" width="252" height="58" rx="8" fill="#e2e8f0"/>
    <text x="190" y="169" text-anchor="middle" class="head">任务契约</text>
    <text x="88" y="229" class="body">初始状态</text>
    <text x="88" y="265" class="body">目标谓词</text>
    <text x="88" y="301" class="body">禁止变化的不变量</text>
    <text x="88" y="337" class="body">允许工具与权限</text>
    <text x="88" y="373" class="body">成本与步骤预算</text>
    <text x="88" y="409" class="body">可恢复故障集合</text>
    <rect x="88" y="455" width="204" height="90" rx="6" fill="#f1f5f9"/>
    <text x="190" y="486" text-anchor="middle" class="metric">fixture + oracle</text>
    <text x="190" y="516" text-anchor="middle" class="metric">policy + budget</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="370" y="132" width="314" height="448" rx="8" fill="#ffffff" stroke="#7c3aed"/>
    <rect x="370" y="132" width="314" height="58" rx="8" fill="#ede9fe"/>
    <text x="527" y="169" text-anchor="middle" class="head">受控 Agent 沙箱</text>
    <rect x="402" y="222" width="250" height="62" rx="6" fill="#f5f3ff" stroke="#a78bfa"/>
    <text x="527" y="248" text-anchor="middle" class="body">模型决策：选择动作与参数</text>
    <text x="527" y="271" text-anchor="middle" class="small">decision_id / seed / prompt_version</text>
    <rect x="402" y="316" width="250" height="62" rx="6" fill="#eff6ff" stroke="#60a5fa"/>
    <text x="527" y="342" text-anchor="middle" class="body">工具代理：校验、执行、注入故障</text>
    <text x="527" y="365" text-anchor="middle" class="small">request / response / side_effect</text>
    <rect x="402" y="410" width="250" height="62" rx="6" fill="#ecfdf5" stroke="#34d399"/>
    <text x="527" y="436" text-anchor="middle" class="body">环境状态：快照、事件与版本</text>
    <text x="527" y="459" text-anchor="middle" class="small">state_before / state_after</text>
    <path d="M527 284 V312" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M527 378 V406" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="738" y="132" width="478" height="204" rx="8" fill="#ecfdf5" stroke="#059669"/>
    <text x="764" y="172" class="head">A. 最终状态判定</text>
    <text x="764" y="208" class="body">业务目标是否满足，数据是否真实落地</text>
    <text x="764" y="240" class="body">无关实体是否保持不变，副作用是否收口</text>
    <rect x="764" y="268" width="420" height="46" rx="6" fill="#d1fae5"/>
    <text x="974" y="297" text-anchor="middle" class="metric">task_success / invariant_pass / progress</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="738" y="376" width="478" height="204" rx="8" fill="#fff7ed" stroke="#ea580c"/>
    <text x="764" y="416" class="head">B. 执行轨迹判定</text>
    <text x="764" y="452" class="body">工具选择、参数、顺序、状态读取是否正确</text>
    <text x="764" y="484" class="body">恢复、权限、重试、成本与终止是否合规</text>
    <rect x="764" y="512" width="420" height="46" rx="6" fill="#ffedd5"/>
    <text x="974" y="541" text-anchor="middle" class="metric">tool / args / order / recovery / safety / cost</text>
  </g>

  <path d="M316 356 H366" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M684 248 H734" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M684 466 H734" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="64" y="620" width="1152" height="58" rx="8" fill="#fee2e2" stroke="#ef4444"/>
  <text x="88" y="655" class="body">门禁原则：高风险任务必须同时满足“目标状态正确、轨迹无越权”；安全约束不能被平均分抵消。</text>
</svg>
