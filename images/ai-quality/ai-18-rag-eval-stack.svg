<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">RAG 分层评测栈</title>
  <desc id="desc">展示从评测集、检索、上下文、生成到引用与端到端结果的分层指标和归因关系。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 30px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .layer-title { font: 700 20px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .body { font: 400 15px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .metric { font: 600 14px "JetBrains Mono", "Noto Sans SC", monospace; fill: #1e293b; }
      .legend { font: 500 14px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #334155; }
    </style>
  </defs>
  <rect width="1280" height="720" fill="#f8fafc"/>
  <rect x="0" y="0" width="1280" height="8" fill="#0f766e"/>
  <text x="64" y="58" class="title">RAG 分层评测栈：先定位链路，再解释总分</text>
  <text x="64" y="87" class="subtitle">同一个错误答案可能来自语料、检索、上下文拼装、生成或引用；每层必须保留独立观测值。</text>

  <g filter="url(#shadow)">
    <rect x="64" y="135" width="190" height="420" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <rect x="64" y="135" width="190" height="58" rx="8" fill="#e2e8f0"/>
    <text x="159" y="171" text-anchor="middle" class="layer-title">评测契约</text>
    <text x="84" y="230" class="body">查询与用户意图</text>
    <text x="84" y="267" class="body">语料快照与权限</text>
    <text x="84" y="304" class="body">qrels 相关性标注</text>
    <text x="84" y="341" class="body">原子事实与答案边界</text>
    <text x="84" y="378" class="body">允许拒答的条件</text>
    <rect x="84" y="420" width="150" height="92" rx="6" fill="#f1f5f9"/>
    <text x="159" y="450" text-anchor="middle" class="metric">dataset_version</text>
    <text x="159" y="477" text-anchor="middle" class="metric">corpus_snapshot</text>
    <text x="159" y="504" text-anchor="middle" class="metric">query_slice</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="290" y="135" width="190" height="420" rx="8" fill="#ffffff" stroke="#0284c7"/>
    <rect x="290" y="135" width="190" height="58" rx="8" fill="#e0f2fe"/>
    <text x="385" y="171" text-anchor="middle" class="layer-title">检索层</text>
    <text x="310" y="230" class="body">候选是否找全</text>
    <text x="310" y="267" class="body">首个证据是否靠前</text>
    <text x="310" y="304" class="body">多级相关性排序</text>
    <text x="310" y="341" class="body">分片去重与父文档</text>
    <rect x="310" y="390" width="150" height="122" rx="6" fill="#f0f9ff"/>
    <text x="385" y="421" text-anchor="middle" class="metric">Recall@k</text>
    <text x="385" y="449" text-anchor="middle" class="metric">MRR</text>
    <text x="385" y="477" text-anchor="middle" class="metric">nDCG@k</text>
    <text x="385" y="505" text-anchor="middle" class="metric">HitRate@k</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="516" y="135" width="190" height="420" rx="8" fill="#ffffff" stroke="#7c3aed"/>
    <rect x="516" y="135" width="190" height="58" rx="8" fill="#ede9fe"/>
    <text x="611" y="171" text-anchor="middle" class="layer-title">上下文层</text>
    <text x="536" y="230" class="body">进入窗口的有效证据</text>
    <text x="536" y="267" class="body">噪声与重复片段</text>
    <text x="536" y="304" class="body">预算截断与顺序</text>
    <text x="536" y="341" class="body">必要事实覆盖程度</text>
    <rect x="536" y="405" width="150" height="107" rx="6" fill="#f5f3ff"/>
    <text x="611" y="439" text-anchor="middle" class="metric">Context Precision</text>
    <text x="611" y="469" text-anchor="middle" class="metric">Context Recall</text>
    <text x="611" y="499" text-anchor="middle" class="metric">Noise Ratio</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="742" y="135" width="190" height="420" rx="8" fill="#ffffff" stroke="#d97706"/>
    <rect x="742" y="135" width="190" height="58" rx="8" fill="#fef3c7"/>
    <text x="837" y="171" text-anchor="middle" class="layer-title">生成层</text>
    <text x="762" y="230" class="body">陈述是否受证据支持</text>
    <text x="762" y="267" class="body">是否回答用户问题</text>
    <text x="762" y="304" class="body">冲突信息如何处理</text>
    <text x="762" y="341" class="body">未知时是否正确拒答</text>
    <rect x="762" y="405" width="150" height="107" rx="6" fill="#fffbeb"/>
    <text x="837" y="439" text-anchor="middle" class="metric">Faithfulness</text>
    <text x="837" y="469" text-anchor="middle" class="metric">Answer Relevance</text>
    <text x="837" y="499" text-anchor="middle" class="metric">Abstention</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="968" y="135" width="248" height="420" rx="8" fill="#ffffff" stroke="#dc2626"/>
    <rect x="968" y="135" width="248" height="58" rx="8" fill="#fee2e2"/>
    <text x="1092" y="171" text-anchor="middle" class="layer-title">引用与端到端</text>
    <text x="990" y="230" class="body">引用是否支持对应陈述</text>
    <text x="990" y="267" class="body">关键陈述是否都有引用</text>
    <text x="990" y="304" class="body">来源是否可访问且版本正确</text>
    <text x="990" y="341" class="body">答案是否完成业务任务</text>
    <rect x="990" y="390" width="204" height="122" rx="6" fill="#fef2f2"/>
    <text x="1092" y="421" text-anchor="middle" class="metric">Citation Correctness</text>
    <text x="1092" y="449" text-anchor="middle" class="metric">Citation Completeness</text>
    <text x="1092" y="477" text-anchor="middle" class="metric">Task Success</text>
    <text x="1092" y="505" text-anchor="middle" class="metric">Latency / Cost</text>
  </g>

  <path d="M254 345 H286" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M480 345 H512" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M706 345 H738" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M932 345 H964" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="64" y="603" width="1152" height="70" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="88" y="632" class="legend">归因原则</text>
  <text x="188" y="632" class="body">先看正确证据是否进入上下文，再看模型是否使用证据，最后检查引用是否准确绑定到原子陈述。</text>
  <text x="188" y="658" class="body">端到端分数用于放行；分层指标用于修复。两者不能互相替代。</text>
</svg>
