<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 应用供应链工件谱系与运行时闭环</title>
  <desc id="desc">从数据、模型、Prompt、代码、容器、插件和 MCP 服务，经过构建证明、制品登记、发布门禁，到运行时 served digest 与撤回处置的有向关系图。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#315b6b"/>
    </marker>
    <marker id="alertArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b3442e"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#12252d" flood-opacity="0.16"/>
    </filter>
    <style>
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17323d; }
      .subtitle { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #48636d; }
      .lane { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17323d; }
      .boxTitle { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17323d; }
      .boxText { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #3d5862; }
      .small { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #315b6b; }
      .edge { fill: none; stroke: #315b6b; stroke-width: 2.2; marker-end: url(#arrow); }
      .alertEdge { fill: none; stroke: #b3442e; stroke-width: 2.2; stroke-dasharray: 7 5; marker-end: url(#alertArrow); }
    </style>
  </defs>
  <rect width="1280" height="720" fill="#f7faf9"/>
  <rect x="36" y="28" width="1208" height="76" rx="6" fill="#e7f0ed"/>
  <text class="title" x="64" y="62">AI 应用供应链：从来源声明到运行时事实</text>
  <text class="subtitle" x="64" y="88">对象身份以 digest 固定；证明、策略与运行时观测分别保存，任何一层缺失都不能由“扫描无告警”代替</text>

  <rect x="36" y="126" width="208" height="466" rx="6" fill="#eef4f1" stroke="#b7cbc2"/>
  <text class="lane" x="58" y="157">输入工件</text>
  <g filter="url(#shadow)">
    <rect x="58" y="178" width="164" height="66" rx="5" fill="#ffffff" stroke="#74a18d"/>
    <text class="boxTitle" x="76" y="203">数据与标签</text><text class="boxText" x="76" y="225">快照 / 许可 / 过滤规则</text>
    <rect x="58" y="260" width="164" height="66" rx="5" fill="#ffffff" stroke="#74a18d"/>
    <text class="boxTitle" x="76" y="285">模型与适配器</text><text class="boxText" x="76" y="307">权重 / tokenizer / LoRA</text>
    <rect x="58" y="342" width="164" height="66" rx="5" fill="#ffffff" stroke="#74a18d"/>
    <text class="boxTitle" x="76" y="367">Prompt 与策略</text><text class="boxText" x="76" y="389">模板 / 路由 / 判定规则</text>
    <rect x="58" y="424" width="164" height="66" rx="5" fill="#ffffff" stroke="#74a18d"/>
    <text class="boxTitle" x="76" y="449">代码与容器</text><text class="boxText" x="76" y="471">源码 / 依赖 / 基础镜像</text>
    <rect x="58" y="506" width="164" height="66" rx="5" fill="#ffffff" stroke="#74a18d"/>
    <text class="boxTitle" x="76" y="531">插件与 MCP</text><text class="boxText" x="76" y="553">server / tool schema / 配置</text>
  </g>

  <rect x="278" y="126" width="224" height="466" rx="6" fill="#f1f3f8" stroke="#bdc5d8"/>
  <text class="lane" x="300" y="157">构建与证明</text>
  <g filter="url(#shadow)">
    <rect x="300" y="188" width="180" height="78" rx="5" fill="#ffffff" stroke="#7f8fb5"/>
    <text class="boxTitle" x="318" y="214">隔离构建</text><text class="boxText" x="318" y="236">固定输入与 builder identity</text><text class="boxText" x="318" y="254">生成 subject digest</text>
    <rect x="300" y="294" width="180" height="78" rx="5" fill="#ffffff" stroke="#7f8fb5"/>
    <text class="boxTitle" x="318" y="320">Provenance</text><text class="boxText" x="318" y="342">SLSA / in-toto statement</text><text class="boxText" x="318" y="360">materials → products</text>
    <rect x="300" y="400" width="180" height="78" rx="5" fill="#ffffff" stroke="#7f8fb5"/>
    <text class="boxTitle" x="318" y="426">签名与日志</text><text class="boxText" x="318" y="448">授权 signer + inclusion proof</text><text class="boxText" x="318" y="466">独立验证信任根</text>
    <rect x="300" y="506" width="180" height="58" rx="5" fill="#ffffff" stroke="#7f8fb5"/>
    <text class="boxTitle" x="318" y="532">可重建性</text><text class="boxText" x="318" y="552">同输入产物比对</text>
  </g>

  <rect x="536" y="126" width="224" height="466" rx="6" fill="#fff6e7" stroke="#dcc59a"/>
  <text class="lane" x="558" y="157">清单与决策</text>
  <g filter="url(#shadow)">
    <rect x="558" y="188" width="180" height="78" rx="5" fill="#ffffff" stroke="#bd913d"/>
    <text class="boxTitle" x="576" y="214">SBOM / AI BOM</text><text class="boxText" x="576" y="236">SPDX / CycloneDX</text><text class="boxText" x="576" y="254">完整度声明与关系图</text>
    <rect x="558" y="294" width="180" height="78" rx="5" fill="#ffffff" stroke="#bd913d"/>
    <text class="boxTitle" x="576" y="320">风险证据</text><text class="boxText" x="576" y="342">漏洞 / 许可 / 行为测试</text><text class="boxText" x="576" y="360">例外到期与责任人</text>
    <rect x="558" y="400" width="180" height="78" rx="5" fill="#ffffff" stroke="#bd913d"/>
    <text class="boxTitle" x="576" y="426">策略门禁</text><text class="boxText" x="576" y="448">身份、来源、时效、能力</text><text class="boxText" x="576" y="466">ALLOW / HOLD / DENY</text>
    <rect x="558" y="506" width="180" height="58" rx="5" fill="#ffffff" stroke="#bd913d"/>
    <text class="boxTitle" x="576" y="532">审批收据</text><text class="boxText" x="576" y="552">策略版本 + evidence digest</text>
  </g>

  <rect x="794" y="126" width="224" height="466" rx="6" fill="#edf5f8" stroke="#a9c7d3"/>
  <text class="lane" x="816" y="157">发布与运行</text>
  <g filter="url(#shadow)">
    <rect x="816" y="188" width="180" height="78" rx="5" fill="#ffffff" stroke="#5c97ad"/>
    <text class="boxTitle" x="834" y="214">不可变发布集</text><text class="boxText" x="834" y="236">release manifest</text><text class="boxText" x="834" y="254">全部工件 digest</text>
    <rect x="816" y="294" width="180" height="78" rx="5" fill="#ffffff" stroke="#5c97ad"/>
    <text class="boxTitle" x="834" y="320">运行时证明</text><text class="boxText" x="834" y="342">served model / prompt</text><text class="boxText" x="834" y="360">server / schema digest</text>
    <rect x="816" y="400" width="180" height="78" rx="5" fill="#ffffff" stroke="#5c97ad"/>
    <text class="boxTitle" x="834" y="426">持续观测</text><text class="boxText" x="834" y="448">版本漂移 / 未登记调用</text><text class="boxText" x="834" y="466">能力与网络偏差</text>
    <rect x="816" y="506" width="180" height="58" rx="5" fill="#ffffff" stroke="#5c97ad"/>
    <text class="boxTitle" x="834" y="532">分批发布</text><text class="boxText" x="834" y="552">按证据扩大流量</text>
  </g>

  <rect x="1052" y="126" width="192" height="466" rx="6" fill="#f9eeee" stroke="#d9aaa2"/>
  <text class="lane" x="1074" y="157">撤回与恢复</text>
  <g filter="url(#shadow)">
    <rect x="1074" y="200" width="148" height="78" rx="5" fill="#ffffff" stroke="#b95a48"/>
    <text class="boxTitle" x="1092" y="226">吊销事件</text><text class="boxText" x="1092" y="248">signer / digest / supplier</text><text class="boxText" x="1092" y="266">reason + effective time</text>
    <rect x="1074" y="320" width="148" height="78" rx="5" fill="#ffffff" stroke="#b95a48"/>
    <text class="boxTitle" x="1092" y="346">影响闭包</text><text class="boxText" x="1092" y="368">反向谱系查询</text><text class="boxText" x="1092" y="386">环境与请求定位</text>
    <rect x="1074" y="440" width="148" height="78" rx="5" fill="#ffffff" stroke="#b95a48"/>
    <text class="boxTitle" x="1092" y="466">处置动作</text><text class="boxText" x="1092" y="488">冻结 / 回滚 / 隔离</text><text class="boxText" x="1092" y="506">复验后重新批准</text>
  </g>

  <path class="edge" d="M244 350 H278"/><path class="edge" d="M502 350 H536"/><path class="edge" d="M760 350 H794"/><path class="edge" d="M1018 350 H1052"/>
  <path class="alertEdge" d="M1148 592 V640 H650 V594"/>
  <text class="small" x="730" y="660">撤回沿谱系反向传播，重新发布必须生成新的证据与审批收据</text>
  <rect x="36" y="616" width="570" height="70" rx="5" fill="#ffffff" stroke="#c4d2cd"/>
  <text class="boxTitle" x="56" y="642">三个不能混写的结论</text>
  <text class="boxText" x="56" y="666">digest 证明比特相等；签名证明某密钥认可某消息；透明日志证明条目可审计地出现。三者都不证明工件无恶意行为。</text>
</svg>
