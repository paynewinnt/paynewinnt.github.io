<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">微调候选分切片验收矩阵</title>
  <desc id="desc">使用构造数据展示基线与候选的成对验收。业务主指标要求显著改善，关键切片限制最大退化，安全事件要求为零，运行成本受预算约束，产物血缘必须完整。候选虽提高总体任务得分，但因高风险拒答切片退化和新增安全违规而被拒绝。</desc>
  <style>
    .bg { fill: #f8fafc; }
    .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #172033; }
    .sub { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #526077; }
    .head { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #ffffff; }
    .h { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #172033; }
    .t { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #344258; }
    .small { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .line { stroke: #cbd5e1; stroke-width: 1.5; }
    .pass { fill: #ecfdf5; }
    .fail { fill: #fff1f2; }
    .warn { fill: #fffbeb; }
    .info { fill: #eff6ff; }
    .plain { fill: #ffffff; }
  </style>

  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="42" y="50">候选验收矩阵：总体变好不能抵消关键切片和安全红线</text>
  <text class="sub" x="42" y="80">下表全部是构造数据；门槛在训练前写入实验合同，结果按同一测试版本成对比较。</text>

  <rect x="42" y="112" width="1196" height="54" rx="7" fill="#172033"/>
  <text class="head" x="62" y="145">验收维度</text>
  <text class="head" x="326" y="145">统计单位 / 样本</text>
  <text class="head" x="544" y="145">稳定基线</text>
  <text class="head" x="696" y="145">候选模型</text>
  <text class="head" x="848" y="145">合同门槛</text>
  <text class="head" x="1090" y="145">判定</text>

  <rect class="pass" x="42" y="174" width="1196" height="72"/>
  <text class="h" x="62" y="204">核心任务正确率</text>
  <text class="t" x="62" y="228">结构化客服分类</text>
  <text class="t" x="326" y="216">同一密封测试集 n=2,400</text>
  <text class="h" x="544" y="216">86.2%</text>
  <text class="h" x="696" y="216">89.1%</text>
  <text class="t" x="848" y="216">绝对提升 ≥ 2.0pp</text>
  <text class="small" x="1090" y="216" fill="#047857">通过</text>

  <rect class="fail" x="42" y="250" width="1196" height="72"/>
  <text class="h" x="62" y="280">高风险拒答切片</text>
  <text class="t" x="62" y="304">不可执行退款承诺</text>
  <text class="t" x="326" y="292">固定风险集 n=180</text>
  <text class="h" x="544" y="292">97.8%</text>
  <text class="h" x="696" y="292">93.9%</text>
  <text class="t" x="848" y="292">退化不得超过 0.5pp</text>
  <text class="small" x="1090" y="292" fill="#be123c">拒绝</text>

  <rect class="fail" x="42" y="326" width="1196" height="72"/>
  <text class="h" x="62" y="356">安全严重事件</text>
  <text class="t" x="62" y="380">逐样本人工复核</text>
  <text class="t" x="326" y="368">攻击与隐私集 n=620</text>
  <text class="h" x="544" y="368">0</text>
  <text class="h" x="696" y="368">2</text>
  <text class="t" x="848" y="368">严重事件必须为 0</text>
  <text class="small" x="1090" y="368" fill="#be123c">硬失败</text>

  <rect class="pass" x="42" y="402" width="1196" height="72"/>
  <text class="h" x="62" y="432">运行预算</text>
  <text class="t" x="62" y="456">端到端 p95 / 单位成本</text>
  <text class="t" x="326" y="444">固定环境重复 5 轮</text>
  <text class="h" x="544" y="444">820ms / 1.00x</text>
  <text class="h" x="696" y="444">790ms / 0.93x</text>
  <text class="t" x="848" y="444">延迟 ≤ 900ms，成本 ≤ 1.05x</text>
  <text class="small" x="1090" y="444" fill="#047857">通过</text>

  <rect class="info" x="42" y="478" width="1196" height="72"/>
  <text class="h" x="62" y="508">关键语言最差退化</text>
  <text class="t" x="62" y="532">简中 / 繁中 / 英文</text>
  <text class="t" x="326" y="520">每切片至少 n=250</text>
  <text class="h" x="544" y="520">基准点</text>
  <text class="h" x="696" y="520">-0.3pp</text>
  <text class="t" x="848" y="520">任一切片退化 ≤ 1.0pp</text>
  <text class="small" x="1090" y="520" fill="#047857">通过</text>

  <rect class="pass" x="42" y="554" width="1196" height="72"/>
  <text class="h" x="62" y="584">产物与复现</text>
  <text class="t" x="62" y="608">数据 / 代码 / 基座 / 环境</text>
  <text class="t" x="326" y="596">manifest 哈希逐项校验</text>
  <text class="h" x="544" y="596">完整</text>
  <text class="h" x="696" y="596">完整</text>
  <text class="t" x="848" y="596">缺一项即禁止发布</text>
  <text class="small" x="1090" y="596" fill="#047857">通过</text>

  <rect class="fail" x="42" y="645" width="1196" height="51" rx="7"/>
  <text class="h" x="62" y="677">最终结论</text>
  <text class="t" x="190" y="677">核心任务提升 2.9pp，但高风险拒答退化且出现 2 个严重事件</text>
  <text class="small" x="1090" y="677" fill="#be123c">候选拒绝</text>
</svg>
