<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="title desc">
  <title id="title">多 Agent 系统的评测指标与故障注入矩阵</title>
  <desc id="desc">按任务分解、委派执行、冲突处理、结果合并和运行终止五个阶段，展示对应质量指标、故障注入、关键证据和发布门禁。</desc>
  <style>
    .bg { fill: #f8fafc; }
    .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
    .sub { font: 400 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
    .header { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
    .rowTitle { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
    .t { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
    .small { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .label { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .blue { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.5; }
    .cyan { fill: #ecfeff; stroke: #67e8f9; stroke-width: 1.5; }
    .purple { fill: #f5f3ff; stroke: #c4b5fd; stroke-width: 1.5; }
    .orange { fill: #fff7ed; stroke: #fdba74; stroke-width: 1.5; }
    .green { fill: #ecfdf5; stroke: #6ee7b7; stroke-width: 1.5; }
    .red { fill: #fff1f2; stroke: #fda4af; stroke-width: 1.5; }
    .gate { fill: #0f172a; }
    .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
  <rect class="bg" width="1280" height="860"/>
  <text class="title" x="54" y="56">多 Agent 不能只评最终答案，协作过程也要有 Oracle</text>
  <text class="sub" x="54" y="89">每个阶段同时检查质量、注入协议故障并保存可回放证据；硬门禁失败不能被总体平均分抵消。</text>

  <rect class="label" x="54" y="132" width="180" height="64" rx="8"/>
  <text class="header" x="83" y="170">评测维度 / 阶段</text>
  <rect class="blue" x="246" y="132" width="184" height="64" rx="8"/>
  <text class="header" x="286" y="160">任务分解</text>
  <text class="t" x="278" y="182">目标 -> 子任务图</text>
  <rect class="cyan" x="442" y="132" width="184" height="64" rx="8"/>
  <text class="header" x="482" y="160">委派执行</text>
  <text class="t" x="474" y="182">租约 -> Artifact</text>
  <rect class="purple" x="638" y="132" width="184" height="64" rx="8"/>
  <text class="header" x="678" y="160">冲突处理</text>
  <text class="t" x="670" y="182">Claim -> 仲裁</text>
  <rect class="orange" x="834" y="132" width="184" height="64" rx="8"/>
  <text class="header" x="874" y="160">结果合并</text>
  <text class="t" x="866" y="182">血缘 -> 最终输出</text>
  <rect class="green" x="1030" y="132" width="196" height="64" rx="8"/>
  <text class="header" x="1074" y="160">运行终止</text>
  <text class="t" x="1062" y="182">Oracle -> 终态</text>

  <rect class="label" x="54" y="210" width="180" height="116" rx="8"/>
  <text class="rowTitle" x="80" y="245">质量指标</text>
  <text class="t" x="80" y="273">评价系统是否</text>
  <text class="t" x="80" y="297">真的协作成功</text>
  <rect class="blue" x="246" y="210" width="184" height="116" rx="8"/>
  <text class="t" x="266" y="240">需求覆盖率</text>
  <text class="t" x="266" y="266">依赖正确率</text>
  <text class="t" x="266" y="292">无意重叠率</text>
  <rect class="cyan" x="442" y="210" width="184" height="116" rx="8"/>
  <text class="t" x="462" y="240">委派正确率</text>
  <text class="t" x="462" y="266">合同接受率</text>
  <text class="t" x="462" y="292">重复劳动率</text>
  <rect class="purple" x="638" y="210" width="184" height="116" rx="8"/>
  <text class="t" x="658" y="240">冲突率</text>
  <text class="t" x="658" y="266">检测召回率</text>
  <text class="t" x="658" y="292">无证据仲裁率</text>
  <rect class="orange" x="834" y="210" width="184" height="116" rx="8"/>
  <text class="t" x="854" y="240">聚合忠实度</text>
  <text class="t" x="854" y="266">限制保留率</text>
  <text class="t" x="854" y="292">无来源主张率</text>
  <rect class="green" x="1030" y="210" width="196" height="116" rx="8"/>
  <text class="t" x="1050" y="240">端到端成功率</text>
  <text class="t" x="1050" y="266">成本 / 成功任务</text>
  <text class="t" x="1050" y="292">P95 时延</text>

  <rect class="label" x="54" y="340" width="180" height="132" rx="8"/>
  <text class="rowTitle" x="80" y="375">故障注入</text>
  <text class="t" x="80" y="403">在协议边界制造</text>
  <text class="t" x="80" y="427">重复、迟到、冲突</text>
  <text class="t" x="80" y="451">与部分失败</text>
  <rect class="red" x="246" y="340" width="184" height="132" rx="8"/>
  <text class="t" x="266" y="372">Supervisor 崩溃</text>
  <text class="t" x="266" y="398">重复登记任务</text>
  <text class="t" x="266" y="424">循环委派</text>
  <text class="t" x="266" y="450">预算并发冲突</text>
  <rect class="red" x="442" y="340" width="184" height="132" rx="8"/>
  <text class="t" x="462" y="372">Worker 超时</text>
  <text class="t" x="462" y="398">迟到结果</text>
  <text class="t" x="462" y="424">越界 Artifact</text>
  <text class="t" x="462" y="450">租约被回收</text>
  <rect class="red" x="638" y="340" width="184" height="132" rx="8"/>
  <text class="t" x="658" y="372">相反事实</text>
  <text class="t" x="658" y="398">相关错误多数</text>
  <text class="t" x="658" y="424">Arbiter 无证据</text>
  <text class="t" x="658" y="450">讨论问题漂移</text>
  <rect class="red" x="834" y="340" width="184" height="132" rx="8"/>
  <text class="t" x="854" y="372">Artifact 被篡改</text>
  <text class="t" x="854" y="398">删除限制条件</text>
  <text class="t" x="854" y="424">引用错配</text>
  <text class="t" x="854" y="450">新增无来源数字</text>
  <rect class="red" x="1030" y="340" width="196" height="132" rx="8"/>
  <text class="t" x="1050" y="372">Straggler 卡死</text>
  <text class="t" x="1050" y="398">取消传播丢失</text>
  <text class="t" x="1050" y="424">预算耗尽</text>
  <text class="t" x="1050" y="450">错误宣布成功</text>

  <rect class="label" x="54" y="486" width="180" height="116" rx="8"/>
  <text class="rowTitle" x="80" y="521">关键证据</text>
  <text class="t" x="80" y="549">结论必须能够</text>
  <text class="t" x="80" y="575">定位第一次分叉</text>
  <rect class="blue" x="246" y="486" width="184" height="116" rx="8"/>
  <text class="t" x="266" y="518">requirement registry</text>
  <text class="t" x="266" y="544">task graph / depth</text>
  <text class="t" x="266" y="570">dedup key / budget</text>
  <rect class="cyan" x="442" y="486" width="184" height="116" rx="8"/>
  <text class="t" x="462" y="518">lease / fencing</text>
  <text class="t" x="462" y="544">tool trace</text>
  <text class="t" x="462" y="570">Artifact digest</text>
  <rect class="purple" x="638" y="486" width="184" height="116" rx="8"/>
  <text class="t" x="658" y="518">Claim group</text>
  <text class="t" x="658" y="544">evidence refs</text>
  <text class="t" x="658" y="570">arbitration policy</text>
  <rect class="orange" x="834" y="486" width="184" height="116" rx="8"/>
  <text class="t" x="854" y="518">claim lineage</text>
  <text class="t" x="854" y="544">merger version</text>
  <text class="t" x="854" y="570">final validation</text>
  <rect class="green" x="1030" y="486" width="196" height="116" rx="8"/>
  <text class="t" x="1050" y="518">goal oracle</text>
  <text class="t" x="1050" y="544">terminal reason</text>
  <text class="t" x="1050" y="570">cost / critical path</text>

  <rect class="label" x="54" y="616" width="180" height="116" rx="8"/>
  <text class="rowTitle" x="80" y="651">硬门禁</text>
  <text class="t" x="80" y="679">任一关键条件失败</text>
  <text class="t" x="80" y="705">不得被总分抵消</text>
  <rect class="blue" x="246" y="616" width="184" height="116" rx="8"/>
  <text class="small" x="266" y="653" fill="#1d4ed8">必要目标有 owner</text>
  <text class="t" x="266" y="681">图无环</text>
  <text class="t" x="266" y="707">范围与预算合法</text>
  <rect class="cyan" x="442" y="616" width="184" height="116" rx="8"/>
  <text class="small" x="462" y="653" fill="#0e7490">越权结果为零</text>
  <text class="t" x="462" y="681">迟到提交不覆盖</text>
  <text class="t" x="462" y="707">证据合同通过</text>
  <rect class="purple" x="638" y="616" width="184" height="116" rx="8"/>
  <text class="small" x="658" y="653" fill="#6d28d9">关键冲突已收口</text>
  <text class="t" x="658" y="681">无证据不选边</text>
  <text class="t" x="658" y="707">未决项显式保留</text>
  <rect class="orange" x="834" y="616" width="184" height="116" rx="8"/>
  <text class="small" x="854" y="653" fill="#c2410c">必要 Claim 不丢失</text>
  <text class="t" x="854" y="681">无新增事实</text>
  <text class="t" x="854" y="707">引用支持主张</text>
  <rect class="green" x="1030" y="616" width="196" height="116" rx="8"/>
  <text class="small" x="1050" y="653" fill="#047857">Goal Oracle 通过</text>
  <text class="t" x="1050" y="681">安全边界满足</text>
  <text class="t" x="1050" y="707">成本与时延在预算</text>

  <path class="arrow" d="M338 752 L1138 752"/>
  <rect class="gate" x="54" y="770" width="1172" height="58" rx="8"/>
  <text x="80" y="805" style="font: 600 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #ffffff;">发布结论 = 强单 Agent 配对基线 + 分层协作指标 + 协议故障注入 + 样本级证据；不等于“Agent 数越多越好”</text>
</svg>
