<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">对抗机器学习测试矩阵与发布判定</title>
  <desc id="desc">以攻击类型为行，以前提、实验、指标、切片、业务效用和门禁为列，展示安全构造评测矩阵以及从实验到发布决定的流程。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#396477"/></marker>
    <style>
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17323d; }
      .subtitle { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b6771; }
      .head { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .rowHead { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17323d; }
      .cell { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #435f69; }
      .flowT { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17323d; }
      .flowD { font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4c6670; }
      .edge { fill: none; stroke: #396477; stroke-width: 2.2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1280" height="720" fill="#f7faf9"/>
  <rect x="36" y="28" width="1208" height="76" rx="6" fill="#e7f0ed"/>
  <text class="title" x="64" y="62">把攻击名称展开为可复现的实验合同</text>
  <text class="subtitle" x="64" y="88">矩阵中的阈值均应预注册；硬错误、统计信号与正常业务效用分别判定，不能压成一个安全总分</text>

  <rect x="46" y="132" width="1188" height="44" rx="5" fill="#315f70"/>
  <text class="head" x="66" y="159">类型</text><text class="head" x="176" y="159">攻击前提</text><text class="head" x="374" y="159">安全实验</text><text class="head" x="576" y="159">主指标与分母</text><text class="head" x="790" y="159">关键切片</text><text class="head" x="954" y="159">效用代价</text><text class="head" x="1104" y="159">门禁</text>

  <g>
    <rect x="46" y="176" width="1188" height="86" fill="#ffffff" stroke="#c6d4cf"/>
    <text class="rowHead" x="66" y="210">投毒</text><text class="cell" x="176" y="202">数据写权限、预算 q</text><text class="cell" x="176" y="222">目标：整体或定向退化</text><text class="cell" x="374" y="202">同一 clean 数据与种子</text><text class="cell" x="374" y="222">仅替换构造污染集</text><text class="cell" x="576" y="202">Δutility、target success</text><text class="cell" x="576" y="222">分母：有效独立测试项</text><text class="cell" x="790" y="202">来源、标签、类别</text><text class="cell" x="790" y="222">污染率与训练阶段</text><text class="cell" x="954" y="202">clean accuracy</text><text class="cell" x="954" y="222">训练成本与拒收率</text><text class="cell" x="1104" y="202">硬目标命中</text><text class="cell" x="1104" y="222">区间越界</text>

    <rect x="46" y="262" width="1188" height="86" fill="#f3f7f5" stroke="#c6d4cf"/>
    <text class="rowHead" x="66" y="296">后门</text><text class="cell" x="176" y="288">可植入触发相关样本</text><text class="cell" x="176" y="308">触发器不接触真实目标</text><text class="cell" x="374" y="288">trigger / clean / near-trigger</text><text class="cell" x="374" y="308">配对矩阵与盲化判定</text><text class="cell" x="576" y="288">ASR 与 clean utility</text><text class="cell" x="576" y="308">分母按三轨独立报告</text><text class="cell" x="790" y="288">位置、强度、语义</text><text class="cell" x="790" y="308">目标类与非目标类</text><text class="cell" x="954" y="288">误拒 near-trigger</text><text class="cell" x="954" y="308">正常样本退化</text><text class="cell" x="1104" y="288">ASR 上界</text><text class="cell" x="1104" y="308">最差切片</text>

    <rect x="46" y="348" width="1188" height="86" fill="#ffffff" stroke="#c6d4cf"/>
    <text class="rowHead" x="66" y="382">模型提取</text><text class="cell" x="176" y="374">API 反馈、身份数量</text><text class="cell" x="176" y="394">总查询与并发预算</text><text class="cell" x="374" y="374">授权沙箱中的替代函数</text><text class="cell" x="374" y="394">留出分布不用于拟合</text><text class="cell" x="576" y="374">fidelity、advantage</text><text class="cell" x="576" y="394">分母：独立有效查询</text><text class="cell" x="790" y="374">高价值边界、租户</text><text class="cell" x="790" y="394">预算与输出粒度</text><text class="cell" x="954" y="374">限流误伤、延迟</text><text class="cell" x="954" y="394">合法批量任务</text><text class="cell" x="1104" y="374">预算内 fidelity</text><text class="cell" x="1104" y="394">异常查询告警</text>

    <rect x="46" y="434" width="1188" height="86" fill="#f3f7f5" stroke="#c6d4cf"/>
    <text class="rowHead" x="66" y="468">成员推断</text><text class="cell" x="176" y="460">候选记录与辅助分布</text><text class="cell" x="176" y="480">输出字段和查询预算</text><text class="cell" x="374" y="460">平衡 member / non-member</text><text class="cell" x="374" y="480">阈值开发集与测试集隔离</text><text class="cell" x="576" y="460">TPR@FPR、AUC、PPV</text><text class="cell" x="576" y="480">分母与生产基率并报</text><text class="cell" x="790" y="460">稀有度、重复度</text><text class="cell" x="790" y="480">损失、群体与数据源</text><text class="cell" x="954" y="460">DP 训练 utility</text><text class="cell" x="954" y="480">校准和吞吐变化</text><text class="cell" x="1104" y="460">区间与风险阈值</text><text class="cell" x="1104" y="480">未知不得通过</text>
  </g>
  <line x1="152" y1="132" x2="152" y2="520" stroke="#b6c9c2"/><line x1="350" y1="132" x2="350" y2="520" stroke="#b6c9c2"/><line x1="552" y1="132" x2="552" y2="520" stroke="#b6c9c2"/><line x1="766" y1="132" x2="766" y2="520" stroke="#b6c9c2"/><line x1="930" y1="132" x2="930" y2="520" stroke="#b6c9c2"/><line x1="1080" y1="132" x2="1080" y2="520" stroke="#b6c9c2"/>

  <g>
    <rect x="46" y="562" width="174" height="94" rx="6" fill="#ffffff" stroke="#80a293"/>
    <text class="flowT" x="64" y="590">1. 冻结威胁合同</text><text class="flowD" x="64" y="614">knowledge / capability</text><text class="flowD" x="64" y="633">budget / objective</text>
    <rect x="252" y="562" width="174" height="94" rx="6" fill="#ffffff" stroke="#80a293"/>
    <text class="flowT" x="270" y="590">2. 生成配对实验</text><text class="flowD" x="270" y="614">固定 seed 与 clean data</text><text class="flowD" x="270" y="633">注入单一受控差异</text>
    <rect x="458" y="562" width="174" height="94" rx="6" fill="#ffffff" stroke="#80a293"/>
    <text class="flowT" x="476" y="590">3. 计算统计证据</text><text class="flowD" x="476" y="614">点估计、区间、切片</text><text class="flowD" x="476" y="633">有效分母与缺失</text>
    <rect x="664" y="562" width="174" height="94" rx="6" fill="#ffffff" stroke="#80a293"/>
    <text class="flowT" x="682" y="590">4. 评估缓解代价</text><text class="flowD" x="682" y="614">utility / latency / cost</text><text class="flowD" x="682" y="633">合法用户误伤</text>
    <rect x="870" y="562" width="174" height="94" rx="6" fill="#ffffff" stroke="#80a293"/>
    <text class="flowT" x="888" y="590">5. 作范围化决定</text><text class="flowD" x="888" y="614">ALLOW / HOLD / DENY</text><text class="flowD" x="888" y="633">适用版本与期限</text>
    <rect x="1076" y="562" width="158" height="94" rx="6" fill="#fff3ef" stroke="#bf705e"/>
    <text class="flowT" x="1094" y="590">6. 持续监控</text><text class="flowD" x="1094" y="614">预算、异常、漂移</text><text class="flowD" x="1094" y="633">触发重评测</text>
  </g>
  <path class="edge" d="M220 609 H252"/><path class="edge" d="M426 609 H458"/><path class="edge" d="M632 609 H664"/><path class="edge" d="M838 609 H870"/><path class="edge" d="M1044 609 H1076"/>
  <text class="cell" x="48" y="692">所有数值均来自构造数据时，报告必须显式标注“构造示例”；实验通过只支持所冻结的攻击者能力、预算、数据分布和模型版本。</text>
</svg>
