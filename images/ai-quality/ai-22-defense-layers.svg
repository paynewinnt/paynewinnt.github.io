<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Prompt Injection 分层防御与测试断言</title>
  <desc id="desc">展示来源治理、上下文隔离、策略校验、最小权限、人工确认、输出控制和审计回归组成的纵深防御。</desc>
  <style>
    .bg { fill: #f8fafc; }
    .title { font: 700 32px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
    .sub { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
    .h { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
    .t { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
    .assert { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #065f46; }
    .layer1 { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .layer2 { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
    .layer3 { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
    .layer4 { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .layer5 { fill: #fefce8; stroke: #ca8a04; stroke-width: 2; }
    .layer6 { fill: #f0fdfa; stroke: #0f766e; stroke-width: 2; }
    .layer7 { fill: #f1f5f9; stroke: #475569; stroke-width: 2; }
    .risk { fill: #fff1f2; stroke: #e11d48; stroke-width: 2; }
    .arrow { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
  <rect class="bg" width="1280" height="760"/>
  <text class="title" x="60" y="58">纵深防御：让攻击即使影响模型，也无法直接变成安全事件</text>
  <text class="sub" x="60" y="89">每一层都必须对应可自动判断的安全断言；“模型拒绝了”只能算其中一项证据。</text>

  <rect class="risk" x="60" y="116" width="176" height="94" rx="8"/>
  <text class="h" x="87" y="147">不可信内容</text>
  <text class="t" x="87" y="174">输入、网页、RAG</text>
  <text class="t" x="87" y="196">工具返回</text>
  <path class="arrow" d="M236 163 L278 163"/>

  <rect class="layer1" x="282" y="116" width="220" height="94" rx="8"/>
  <text class="h" x="305" y="145">1. 来源与信任标记</text>
  <text class="t" x="305" y="170">准入、租户、完整性、来源</text>
  <text class="assert" x="305" y="194">断言：未授权来源不得进入</text>
  <path class="arrow" d="M502 163 L544 163"/>

  <rect class="layer2" x="548" y="116" width="220" height="94" rx="8"/>
  <text class="h" x="571" y="145">2. 数据与指令隔离</text>
  <text class="t" x="571" y="170">结构化封装、边界、引用</text>
  <text class="assert" x="571" y="194">断言：外部数据无控制权</text>
  <path class="arrow" d="M768 163 L810 163"/>

  <rect class="layer3" x="814" y="116" width="220" height="94" rx="8"/>
  <text class="h" x="837" y="145">3. 策略与参数校验</text>
  <text class="t" x="837" y="170">白名单、Schema、业务前置</text>
  <text class="assert" x="837" y="194">断言：危险意图不能执行</text>
  <path class="arrow" d="M1034 163 L1076 163"/>

  <rect class="layer4" x="1080" y="116" width="150" height="94" rx="8"/>
  <text class="h" x="1100" y="145">4. 最小权限</text>
  <text class="t" x="1100" y="168">短期凭据</text>
  <text class="t" x="1100" y="187">租户隔离</text>
  <text class="assert" x="1100" y="204">越权必须失败</text>

  <path class="arrow" d="M1155 210 L1155 282"/>
  <rect class="layer5" x="946" y="286" width="284" height="94" rx="8"/>
  <text class="h" x="970" y="315">5. 高风险动作确认与限额</text>
  <text class="t" x="970" y="340">人工审批、额度、幂等、速率限制</text>
  <text class="assert" x="970" y="364">断言：副作用动作未经批准为零</text>
  <path class="arrow" d="M946 333 L894 333"/>

  <rect class="layer6" x="604" y="286" width="286" height="94" rx="8"/>
  <text class="h" x="628" y="315">6. 输出与数据流控制</text>
  <text class="t" x="628" y="340">脱敏、DLP、URL 约束、编码检查</text>
  <text class="assert" x="628" y="364">断言：秘密和敏感字段不得外流</text>
  <path class="arrow" d="M604 333 L552 333"/>

  <rect class="layer7" x="282" y="286" width="266" height="94" rx="8"/>
  <text class="h" x="306" y="315">7. 审计、告警与持续回归</text>
  <text class="t" x="306" y="340">完整 Trace、攻击语料、事件复盘</text>
  <text class="assert" x="306" y="364">断言：所有安全决策可追溯</text>

  <rect x="60" y="436" width="1170" height="244" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="h" x="88" y="474">对应的测试证据</text>
  <text class="t" x="88" y="510">输入证据</text><text class="t" x="250" y="510">来源 ID、信任等级、内容哈希、租户、解析后文本</text>
  <text class="t" x="88" y="546">决策证据</text><text class="t" x="250" y="546">策略版本、命中规则、拒绝原因、审批记录、风险评分</text>
  <text class="t" x="88" y="582">执行证据</text><text class="t" x="250" y="582">工具名、标准化参数、调用主体、权限范围、副作用结果</text>
  <text class="t" x="88" y="618">数据流证据</text><text class="t" x="250" y="618">读取字段、脱敏结果、外发目标、敏感标记、DLP 判定</text>
  <text class="t" x="88" y="654">回归证据</text><text class="t" x="250" y="654">攻击族、变体、重复次数、阻断层、最终安全性质与首错位置</text>
  <text class="sub" x="60" y="720">防御目标不是保证模型永不受影响，而是把可达权限、数据流和副作用收在可验证的系统边界内。</text>
</svg>
