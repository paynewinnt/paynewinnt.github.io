<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Prompt、RAG、微调、工具调用和 Agent 的组合架构</title>
  <desc id="desc">展示任务入口、确定性工作流或 Agent 编排、模型、RAG、工具网关、验证器、证据结果以及贯穿全链路的策略、评测和可观测性。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #475569; }
      .box-title { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #0f172a; }
      .box-text { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #334155; }
      .dark-title { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #ffffff; }
      .dark-text { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #e2e8f0; }
      .lane { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #1e3a8a; }
      .label { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect width="1280" height="800" fill="#f8fafc"/>
  <text x="50" y="56" class="title">组合架构：让每种能力只承担它擅长的责任</text>
  <text x="50" y="86" class="subtitle">模型负责受约束的理解与生成；外部知识、真实动作、流程状态、权限和证据由独立组件治理</text>

  <rect x="40" y="116" width="1200" height="82" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
  <text x="64" y="146" class="lane">策略与契约层</text>
  <text x="64" y="173" class="box-text">Prompt 模板版本　输出 Schema　工具白名单　风险等级　Token 预算　数据权限　模型路由规则</text>

  <line x1="185" y1="326" x2="240" y2="326" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="470" y1="326" x2="535" y2="326" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="745" y1="326" x2="810" y2="326" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1025" y1="326" x2="1080" y2="326" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="45" y="255" width="140" height="142" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="66" y="291" class="box-title">任务入口</text>
    <text x="66" y="320" class="box-text">目标与风险</text>
    <text x="66" y="346" class="box-text">用户与租户</text>
    <text x="66" y="372" class="box-text">验收条件</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="240" y="235" width="230" height="182" rx="8" fill="#334155"/>
    <text x="265" y="274" class="dark-title">编排层</text>
    <text x="265" y="306" class="dark-text">固定流程：已知步骤</text>
    <text x="265" y="334" class="dark-text">Agent：动态观察与规划</text>
    <text x="265" y="362" class="dark-text">状态、超时、重试、补偿</text>
    <text x="265" y="390" class="dark-text">高风险动作等待确认</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="535" y="235" width="210" height="182" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <text x="560" y="274" class="box-title">模型推理</text>
    <text x="560" y="306" class="box-text">Prompt 提供当前契约</text>
    <text x="560" y="334" class="box-text">基础或微调模型</text>
    <text x="560" y="362" class="box-text">结构化候选输出</text>
    <text x="560" y="390" class="box-text">不直接持有真实权限</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="810" y="235" width="215" height="182" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
    <text x="835" y="274" class="box-title">验证与收口</text>
    <text x="835" y="306" class="box-text">Schema 与业务规则</text>
    <text x="835" y="334" class="box-text">引用和版本校验</text>
    <text x="835" y="362" class="box-text">权限与副作用确认</text>
    <text x="835" y="390" class="box-text">成功、失败或不确定</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1080" y="255" width="155" height="142" rx="8" fill="#0f766e"/>
    <text x="1103" y="291" class="dark-title">结果与证据</text>
    <text x="1103" y="320" class="dark-text">业务结果</text>
    <text x="1103" y="346" class="dark-text">来源引用</text>
    <text x="1103" y="372" class="dark-text">执行轨迹</text>
  </g>

  <line x1="355" y1="417" x2="355" y2="495" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="417" x2="640" y2="495" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="918" y1="495" x2="918" y2="417" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="70" y="495" width="310" height="138" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
    <text x="95" y="530" class="box-title">RAG 知识通道</text>
    <text x="95" y="560" class="box-text">检索、过滤、重排、片段版本</text>
    <text x="95" y="586" class="box-text">返回证据，不直接执行动作</text>
    <text x="95" y="612" class="box-text">适合动态且需要溯源的知识</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="485" y="495" width="310" height="138" rx="8" fill="#eff6ff" stroke="#0284c7" stroke-width="2"/>
    <text x="510" y="530" class="box-title">工具网关</text>
    <text x="510" y="560" class="box-text">结构化 API、鉴权、幂等与审计</text>
    <text x="510" y="586" class="box-text">读取实时状态或执行真实副作用</text>
    <text x="510" y="612" class="box-text">模型只提出意图，执行器做裁决</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="900" y="495" width="310" height="138" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="925" y="530" class="box-title">业务系统与数据源</text>
    <text x="925" y="560" class="box-text">文档库、数据库、设备、工单系统</text>
    <text x="925" y="586" class="box-text">版本、权限、事务与事实真值</text>
    <text x="925" y="612" class="box-text">与模型上下文保持明确边界</text>
  </g>

  <line x1="380" y1="564" x2="485" y2="564" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="795" y1="564" x2="900" y2="564" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="675" width="1200" height="80" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="64" y="706" class="lane">贯穿全链路的质量控制</text>
  <text x="64" y="734" class="box-text">离线评测　在线观测　成本与时延　Prompt 与数据版本　模型升级回归　红队测试　人工接管　审计证据</text>

  <text x="196" y="224" class="label">结构化任务</text>
  <text x="478" y="224" class="label">受控上下文</text>
  <text x="758" y="224" class="label">候选结果</text>
  <text x="1035" y="224" class="label">已验证事实</text>
</svg>
