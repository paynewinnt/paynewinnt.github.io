<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">AI 质量工程能力地图</title>
  <desc id="desc">以工程底座支撑模型、数据、评测、Agent、LLMOps、安全和领域质量七个能力域，并通过解释、构建、评测、上线、治理形成证据链。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <style>
      .base { font-family: Arial, "Noto Sans SC", "Microsoft YaHei", sans-serif; }
      .title { font-size: 32px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 17px; fill: #475569; }
      .card-title { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .card-text { font-size: 17px; fill: #334155; }
      .small { font-size: 15px; fill: #475569; }
      .stage { font-size: 18px; font-weight: 700; fill: #ffffff; }
      .foundation { font-size: 19px; font-weight: 700; fill: #ffffff; }
      .line { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1280" height="800" fill="#f8fafc"/>
  <rect x="0" y="0" width="1280" height="8" fill="#0f766e"/>

  <g class="base">
    <text x="56" y="58" class="title">AI 质量工程能力地图</text>
    <text x="56" y="88" class="subtitle">能力不是工具清单，而是从系统认知到可信交付的可验证闭环</text>

    <g transform="translate(892,36)">
      <rect x="0" y="0" width="332" height="58" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <circle cx="22" cy="19" r="6" fill="#2563eb"/>
      <text x="36" y="24" class="small">认知与构建</text>
      <circle cx="152" cy="19" r="6" fill="#0f766e"/>
      <text x="166" y="24" class="small">验证与运行</text>
      <circle cx="22" cy="42" r="6" fill="#dc2626"/>
      <text x="36" y="47" class="small">风险控制</text>
      <circle cx="152" cy="42" r="6" fill="#d97706"/>
      <text x="166" y="47" class="small">领域收敛</text>
    </g>

    <path d="M326 237 L350 237" class="line"/>
    <path d="M616 237 L640 237" class="line"/>
    <path d="M906 237 L930 237" class="line"/>
    <path d="M1085 304 L1085 338 L1005 338 L1005 360" class="line"/>
    <path d="M870 431 L834 431" class="line"/>
    <path d="M505 431 L469 431" class="line"/>

    <g transform="translate(60,150)">
      <rect width="266" height="154" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
      <rect width="266" height="9" rx="6" fill="#2563eb"/>
      <text x="20" y="43" class="card-title">1. 模型认知</text>
      <text x="20" y="76" class="card-text">输入表示与推理边界</text>
      <text x="20" y="104" class="card-text">采样、不确定性、变更</text>
      <text x="20" y="133" class="small">证据：行为探针、性能拆解</text>
    </g>

    <g transform="translate(350,150)">
      <rect width="266" height="154" rx="6" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
      <rect width="266" height="9" rx="6" fill="#15803d"/>
      <text x="20" y="43" class="card-title">2. 数据与知识</text>
      <text x="20" y="76" class="card-text">准入、标注、版本、血缘</text>
      <text x="20" y="104" class="card-text">检索、引用、权限、有效期</text>
      <text x="20" y="133" class="small">证据：数据卡、知识快照</text>
    </g>

    <g transform="translate(640,150)">
      <rect width="266" height="154" rx="6" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
      <rect width="266" height="9" rx="6" fill="#0f766e"/>
      <text x="20" y="43" class="card-title">3. 评测与实验</text>
      <text x="20" y="76" class="card-text">数据集、断言、统计比较</text>
      <text x="20" y="104" class="card-text">回归门禁与失败归因</text>
      <text x="20" y="133" class="small">证据：基线、报告、缺陷集</text>
    </g>

    <g transform="translate(930,150)">
      <rect width="266" height="154" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
      <rect width="266" height="9" rx="6" fill="#7c3aed"/>
      <text x="20" y="43" class="card-title">4. Agent 与工具</text>
      <text x="20" y="76" class="card-text">契约、状态、幂等、恢复</text>
      <text x="20" y="104" class="card-text">轨迹、权限与人工接管</text>
      <text x="20" y="133" class="small">证据：工具契约、注入报告</text>
    </g>

    <g transform="translate(140,360)">
      <rect width="329" height="142" rx="6" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
      <rect width="329" height="9" rx="6" fill="#0891b2"/>
      <text x="20" y="43" class="card-title">5. LLMOps 与可靠性</text>
      <text x="20" y="76" class="card-text">追踪、SLO、容量、成本</text>
      <text x="20" y="104" class="card-text">灰度、降级、回滚、事故</text>
      <text x="20" y="130" class="small">证据：仪表盘、运行手册</text>
    </g>

    <g transform="translate(505,360)">
      <rect width="329" height="142" rx="6" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/>
      <rect width="329" height="9" rx="6" fill="#dc2626"/>
      <text x="20" y="43" class="card-title">6. 安全与治理</text>
      <text x="20" y="76" class="card-text">威胁、数据、权限、审计</text>
      <text x="20" y="104" class="card-text">风险分级与控制有效性</text>
      <text x="20" y="130" class="small">证据：威胁模型、风险登记册</text>
    </g>

    <g transform="translate(870,360)">
      <rect width="329" height="142" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
      <rect width="329" height="9" rx="6" fill="#d97706"/>
      <text x="20" y="43" class="card-title">7. 领域质量</text>
      <text x="20" y="76" class="card-text">Android、UI、语音、平台</text>
      <text x="20" y="104" class="card-text">领域事实与高风险边界</text>
      <text x="20" y="130" class="small">证据：领域基准、专家复核</text>
    </g>

    <text x="58" y="558" class="card-title">交付证据链</text>
    <line x1="172" y1="552" x2="1200" y2="552" stroke="#cbd5e1" stroke-width="2"/>

    <g transform="translate(70,580)">
      <rect x="0" y="0" width="190" height="54" rx="6" fill="#2563eb"/>
      <text x="64" y="34" class="stage">能解释</text>
      <path d="M198 27 L232 27" class="line"/>
      <rect x="240" y="0" width="190" height="54" rx="6" fill="#15803d"/>
      <text x="304" y="34" class="stage">能构建</text>
      <path d="M438 27 L472 27" class="line"/>
      <rect x="480" y="0" width="190" height="54" rx="6" fill="#0f766e"/>
      <text x="544" y="34" class="stage">能评测</text>
      <path d="M678 27 L712 27" class="line"/>
      <rect x="720" y="0" width="190" height="54" rx="6" fill="#7c3aed"/>
      <text x="784" y="34" class="stage">能上线</text>
      <path d="M918 27 L952 27" class="line"/>
      <rect x="960" y="0" width="190" height="54" rx="6" fill="#dc2626"/>
      <text x="1024" y="34" class="stage">能治理</text>
    </g>

    <g transform="translate(56,680)">
      <rect width="1168" height="74" rx="6" fill="#1e293b"/>
      <text x="28" y="31" class="foundation">工程底座</text>
      <text x="152" y="31" class="foundation">编程与自动化</text>
      <text x="330" y="31" class="foundation">系统与网络</text>
      <text x="485" y="31" class="foundation">数据与中间件</text>
      <text x="665" y="31" class="foundation">CI/CD</text>
      <text x="765" y="31" class="foundation">性能与稳定性</text>
      <text x="943" y="31" class="foundation">日志、指标、追踪</text>
      <text x="28" y="57" class="small" fill="#cbd5e1">底座不会被 AI 替代；它决定模型能力能否成为可靠、可恢复、可审计的生产系统。</text>
    </g>
  </g>
</svg>
