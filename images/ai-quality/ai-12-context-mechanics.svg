<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">从输入文本到模型输出的上下文机制</title>
  <desc id="desc">展示分词、向量与位置表示、自注意力计算、生成输出的处理链路，以及四类常见失真点。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #475569; }
      .box-title { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #0f172a; }
      .box-text { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #334155; }
      .step { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #ffffff; }
      .risk-title { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #7f1d1d; }
      .risk-text { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #7f1d1d; }
      .legend { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect width="1280" height="800" fill="#f8fafc"/>
  <text x="60" y="58" class="title">从输入文本到模型输出：上下文机制与失真点</text>
  <text x="60" y="88" class="subtitle">窗口容量只说明“能放入多少”，测试还必须验证分词边界、位置利用、冲突处理与实际截断行为</text>

  <circle cx="930" cy="56" r="7" fill="#2563eb"/>
  <text x="945" y="61" class="legend">处理阶段</text>
  <circle cx="1040" cy="56" r="7" fill="#dc2626"/>
  <text x="1055" y="61" class="legend">失真风险</text>

  <rect x="548" y="104" width="230" height="72" rx="7" fill="#eef2ff" stroke="#818cf8" stroke-dasharray="5 4"/>
  <text x="563" y="125" class="legend">独立检索向量链路</text>
  <text x="563" y="147" class="legend">相似不等于蕴含</text>
  <text x="563" y="168" class="legend">数字与否定需硬校验</text>

  <line x1="265" y1="320" x2="310" y2="320" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="515" y1="320" x2="560" y2="320" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="765" y1="320" x2="810" y2="320" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1015" y1="320" x2="1060" y2="320" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="60" y="190" width="205" height="260" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="60" y="190" width="205" height="42" rx="8" fill="#2563eb"/>
    <rect x="60" y="224" width="205" height="8" fill="#2563eb"/>
    <text x="78" y="217" class="step">阶段 1</text>
    <text x="78" y="268" class="box-title">上下文拼装</text>
    <text x="78" y="303" class="box-text">系统指令</text>
    <text x="78" y="331" class="box-text">用户问题</text>
    <text x="78" y="359" class="box-text">检索证据</text>
    <text x="78" y="387" class="box-text">工具定义与历史</text>
    <text x="78" y="421" class="box-text">先后顺序决定位置</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="310" y="190" width="205" height="260" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="310" y="190" width="205" height="42" rx="8" fill="#2563eb"/>
    <rect x="310" y="224" width="205" height="8" fill="#2563eb"/>
    <text x="328" y="217" class="step">阶段 2</text>
    <text x="328" y="268" class="box-title">Tokenizer</text>
    <text x="328" y="303" class="box-text">规范化与切分</text>
    <text x="328" y="331" class="box-text">子词或字节片段</text>
    <text x="328" y="359" class="box-text">映射为 Token ID</text>
    <text x="328" y="387" class="box-text">边界因模型而异</text>
    <text x="328" y="421" class="box-text">字符数不等于预算</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="560" y="190" width="205" height="260" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="560" y="190" width="205" height="42" rx="8" fill="#2563eb"/>
    <rect x="560" y="224" width="205" height="8" fill="#2563eb"/>
    <text x="578" y="217" class="step">阶段 3</text>
    <text x="578" y="268" class="box-title">Token 表示与位置</text>
    <text x="578" y="303" class="box-text">Token Embedding</text>
    <text x="578" y="331" class="box-text">位置编码或旋转</text>
    <text x="578" y="359" class="box-text">保留顺序关系</text>
    <text x="578" y="387" class="box-text">进入多层网络</text>
    <text x="578" y="421" class="box-text">不同于检索向量</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="810" y="190" width="205" height="260" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="810" y="190" width="205" height="42" rx="8" fill="#2563eb"/>
    <rect x="810" y="224" width="205" height="8" fill="#2563eb"/>
    <text x="828" y="217" class="step">阶段 4</text>
    <text x="828" y="268" class="box-title">多层自注意力</text>
    <text x="828" y="303" class="box-text">Q、K、V 交互</text>
    <text x="828" y="331" class="box-text">因果遮罩</text>
    <text x="828" y="359" class="box-text">多头与残差路径</text>
    <text x="828" y="387" class="box-text">逐层更新表示</text>
    <text x="828" y="421" class="box-text">注意力不是解释</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1060" y="190" width="170" height="260" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="1060" y="190" width="170" height="42" rx="8" fill="#2563eb"/>
    <rect x="1060" y="224" width="170" height="8" fill="#2563eb"/>
    <text x="1078" y="217" class="step">阶段 5</text>
    <text x="1078" y="268" class="box-title">自回归生成</text>
    <text x="1078" y="303" class="box-text">下一个 Token</text>
    <text x="1078" y="331" class="box-text">概率分布采样</text>
    <text x="1078" y="359" class="box-text">写回上下文</text>
    <text x="1078" y="387" class="box-text">循环直到停止</text>
    <text x="1078" y="421" class="box-text">输出也占预算</text>
  </g>

  <line x1="160" y1="450" x2="160" y2="505" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="412" y1="450" x2="412" y2="505" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="662" y1="450" x2="662" y2="505" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="912" y1="450" x2="912" y2="505" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5"/>

  <g>
    <rect x="40" y="505" width="275" height="190" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <text x="60" y="540" class="risk-title">F1 分词边界漂移</text>
    <text x="60" y="573" class="risk-text">空格、标点、大小写或中文混排</text>
    <text x="60" y="600" class="risk-text">改变 Token 数与切分方式</text>
    <text x="60" y="627" class="risk-text">影响预算、匹配与结构化输出</text>
    <text x="60" y="662" class="risk-text">验证：记录真实 Token 用量</text>
  </g>

  <g>
    <rect x="355" y="505" width="275" height="190" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
    <text x="375" y="540" class="risk-title">F2 截断与预算挤压</text>
    <text x="375" y="573" class="risk-text">客户端、网关或服务端均可能截断</text>
    <text x="375" y="600" class="risk-text">关键证据可能根本没有进入模型</text>
    <text x="375" y="627" class="risk-text">输出预留不足还会造成半截答案</text>
    <text x="375" y="662" class="risk-text">验证：哈希、边界哨兵与拒绝策略</text>
  </g>

  <g>
    <rect x="670" y="505" width="275" height="190" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
    <text x="690" y="540" class="risk-title">F3 中间信息弱化</text>
    <text x="690" y="573" class="risk-text">放得下不等于能稳定利用</text>
    <text x="690" y="600" class="risk-text">关键信息位置变化可能改变结果</text>
    <text x="690" y="627" class="risk-text">不同模型与任务表现不应类推</text>
    <text x="690" y="662" class="risk-text">验证：位置扫描与重复试验</text>
  </g>

  <g>
    <rect x="985" y="505" width="255" height="190" rx="8" fill="#fdf4ff" stroke="#c084fc" stroke-width="2"/>
    <text x="1005" y="540" class="risk-title">F4 上下文污染</text>
    <text x="1005" y="573" class="risk-text">过期、重复、矛盾或低信任内容</text>
    <text x="1005" y="600" class="risk-text">共同争夺模型的有限处理能力</text>
    <text x="1005" y="627" class="risk-text">长上下文会放大治理缺口</text>
    <text x="1005" y="662" class="risk-text">验证：冲突注入与来源追踪</text>
  </g>

  <text x="60" y="752" class="subtitle">测试结论必须绑定：模型快照、Tokenizer、完整输入顺序、实际 Token 用量、采样参数、重复次数与原始输出。</text>
</svg>
