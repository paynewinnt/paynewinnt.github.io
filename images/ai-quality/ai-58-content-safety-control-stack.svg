<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">内容安全控制栈与证据回路</title>
  <desc id="desc">从请求上下文、策略资格判定、多信号检测、校准裁决、响应控制到人工升级、申诉和持续监控的分层架构，基础设施无结果走独立通道。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}.title{font:700 28px sans-serif;fill:#0f172a}.sub{font:400 15px sans-serif;fill:#475569}
      .box{stroke-width:2;rx:6}.h{font:700 17px sans-serif;fill:#0f172a}.t{font:400 13px sans-serif;fill:#334155}
      .small{font:600 12px sans-serif;fill:#475569}.flow{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#64748b;stroke-width:1.8;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="54" y="52">内容安全不是一道分类器：控制栈必须同时守住安全、可用与一致性</text>
  <text class="sub" x="54" y="80">主链只处理可判定且执行成功的请求；策略不适用、人工升级和基础设施无结果各有独立状态与分母</text>

  <rect class="box" x="46" y="132" width="174" height="184" fill="#e0f2fe" stroke="#0284c7"/>
  <text class="h" x="64" y="164">1. 请求与上下文</text>
  <text class="t" x="64" y="194">• 内容与会话历史</text>
  <text class="t" x="64" y="220">• 受众 / 地区 / 语言</text>
  <text class="t" x="64" y="246">• 渠道 / 产品能力</text>
  <text class="t" x="64" y="272">• 编码 / 变形 manifest</text>
  <text class="small" x="64" y="298">保留原始摘要与规范化摘要</text>

  <rect class="box" x="254" y="132" width="184" height="184" fill="#ecfccb" stroke="#65a30d"/>
  <text class="h" x="272" y="164">2. 策略资格判定</text>
  <text class="t" x="272" y="194">• 生效版本与作用域</text>
  <text class="t" x="272" y="220">• 多标签与严重度</text>
  <text class="t" x="272" y="246">• 上下文 / 受众条件</text>
  <text class="t" x="272" y="272">• eligible / ineligible</text>
  <text class="small" x="272" y="298">不适用不等于安全通过</text>

  <rect class="box" x="472" y="132" width="190" height="184" fill="#fef3c7" stroke="#d97706"/>
  <text class="h" x="490" y="164">3. 多信号与校准</text>
  <text class="t" x="490" y="194">• 规则 / 分类器 / 模型</text>
  <text class="t" x="490" y="220">• 会话与变形检测</text>
  <text class="t" x="490" y="246">• 分标签阈值与迟疑区</text>
  <text class="t" x="490" y="272">• 分数、置信与缺失信号</text>
  <text class="small" x="490" y="298">校准集与发布集隔离</text>

  <rect class="box" x="696" y="132" width="194" height="184" fill="#f3e8ff" stroke="#9333ea"/>
  <text class="h" x="714" y="164">4. 策略裁决器</text>
  <text class="t" x="714" y="194">• ALLOW</text>
  <text class="t" x="714" y="220">• SAFE_REWRITE</text>
  <text class="t" x="714" y="246">• REFUSE</text>
  <text class="t" x="714" y="272">• ESCALATE</text>
  <text class="small" x="714" y="298">输出 reason 与 policy_version</text>

  <rect class="box" x="924" y="132" width="310" height="184" fill="#dcfce7" stroke="#16a34a"/>
  <text class="h" x="942" y="164">5. 响应控制与后置条件</text>
  <text class="t" x="942" y="194">允许：完成安全且有用的任务</text>
  <text class="t" x="942" y="220">改写：去除风险信息并保留安全意图</text>
  <text class="t" x="942" y="246">拒答：边界一致，不泄漏受限内容</text>
  <text class="t" x="942" y="272">升级：进入有容量约束的人工队列</text>
  <text class="small" x="942" y="298">动作正确仍需验证最终内容</text>

  <path class="flow" d="M220 224 H248"/>
  <path class="flow" d="M438 224 H466"/>
  <path class="flow" d="M662 224 H690"/>
  <path class="flow" d="M890 224 H918"/>

  <rect class="box" x="46" y="384" width="276" height="126" fill="#fee2e2" stroke="#dc2626"/>
  <text class="h" x="64" y="416">基础设施无结果通道</text>
  <text class="t" x="64" y="446">timeout / dependency_error / parse_error</text>
  <text class="t" x="64" y="472">单独统计可用性，不记成拒答或安全</text>
  <text class="small" x="64" y="496">按风险层执行显式降级策略</text>

  <rect class="box" x="362" y="384" width="258" height="126" fill="#fff7ed" stroke="#ea580c"/>
  <text class="h" x="380" y="416">人工复核与申诉</text>
  <text class="t" x="380" y="446">升级队列、SLA、盲化证据与仲裁</text>
  <text class="t" x="380" y="472">误拒答申诉、策略缺口、标签争议</text>
  <text class="small" x="380" y="496">裁决回灌必须经过版本评审</text>

  <rect class="box" x="660" y="384" width="574" height="126" fill="#e2e8f0" stroke="#475569"/>
  <text class="h" x="678" y="416">证据、监控与版本回路</text>
  <text class="t" x="678" y="446">case / attempt / policy / model / prompt / detector / threshold / trace 全量绑定</text>
  <text class="t" x="678" y="472">漏拦截、误拒答、改写成功、升级召回、无结果、最差切片、成对一致性</text>
  <text class="small" x="678" y="496">灰度止损、策略 diff、申诉采样和延迟真值共同触发重评测</text>

  <path class="dash" d="M346 316 V350 H184 V378"/>
  <path class="dash" d="M793 316 V350 H491 V378"/>
  <path class="dash" d="M1079 316 V378"/>
  <path class="dash" d="M620 447 H654"/>
  <path class="dash" d="M946 510 V558 H346 V322"/>

  <rect x="46" y="580" width="1188" height="92" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
  <text class="h" x="64" y="612">发布原则</text>
  <text class="t" x="178" y="612">critical miss 零容忍硬门 + 统计上界；安全请求误拒答与安全改写成功率是独立门禁；均值不得抵消高严重度失败</text>
  <text class="t" x="64" y="642">只有策略可判定、基础设施完成、Oracle 有效的样本进入语义分母；其他状态必须保留原始数量、原因和业务降级结果</text>
</svg>
