<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 供应商锁定面与退出准备度</title>
  <desc id="desc">左侧展示协议、数据、行为、工作流、运营和商务六层锁定，中央展示出口 SLO，右侧展示从文件导出到替代系统恢复的四级退出证明，并强调接口可移植不等于行为可替换。</desc>
  <defs>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="136%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#17212b" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#52606d"/>
    </marker>
    <style>
      .title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#17212b}
      .subtitle{font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#52606d}
      .head{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#17212b}
      .body{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#334155}
      .label{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#17212b}
      .white{fill:#fff}
    </style>
  </defs>
  <rect width="1280" height="720" fill="#f8fafb"/>
  <rect x="0" y="0" width="1280" height="8" fill="#a34d3e"/>
  <text x="60" y="57" class="title">锁定不是一个 SDK，退出也不是一次下载</text>
  <text x="60" y="87" class="subtitle">从六层依赖识别，到独立对象分母、删除面和替代业务门，退出能力必须在仍可选择时持续演练</text>

  <g filter="url(#shadow)">
    <rect x="60" y="126" width="350" height="490" rx="8" fill="#fff" stroke="#9aa9b6"/>
    <rect x="60" y="126" width="350" height="52" rx="8" fill="#e7edf2"/>
    <rect x="60" y="170" width="350" height="8" fill="#e7edf2"/>
    <text x="84" y="158" class="head">六层锁定面</text>
    <g>
      <rect x="84" y="198" width="302" height="54" rx="6" fill="#eaf3fb"/>
      <text x="102" y="221" class="label">协议</text><text x="164" y="221" class="body">SDK · 流式事件 · 错误语义</text>
      <text x="102" y="242" class="body">证据：契约测试与适配器差异</text>
      <rect x="84" y="264" width="302" height="54" rx="6" fill="#f4ecf7"/>
      <text x="102" y="287" class="label">数据</text><text x="164" y="287" class="body">切片 · ACL · 反馈 · 版本关系</text>
      <text x="102" y="308" class="body">证据：外部分母、导出与独立导入</text>
      <rect x="84" y="330" width="302" height="54" rx="6" fill="#f8efe6"/>
      <text x="102" y="353" class="label">行为</text><text x="164" y="353" class="body">拒答 · 引用 · 工具 · 长尾质量</text>
      <text x="102" y="374" class="body">证据：同一盲测与关键 slice</text>
      <rect x="84" y="396" width="302" height="54" rx="6" fill="#eaf4ed"/>
      <text x="102" y="419" class="label">工作流</text><text x="180" y="419" class="body">状态 · 审批 · 重试 · 接管</text>
      <text x="102" y="440" class="body">证据：中断、补偿与安全终止</text>
      <rect x="84" y="462" width="302" height="54" rx="6" fill="#f7eeee"/>
      <text x="102" y="485" class="label">运营</text><text x="164" y="485" class="body">Trace · 告警 · 支持 · 值班</text>
      <text x="102" y="506" class="body">证据：脱离原控制台仍能定位</text>
      <rect x="84" y="528" width="302" height="54" rx="6" fill="#f6f2e7"/>
      <text x="102" y="551" class="label">商务</text><text x="164" y="551" class="body">承诺 · 通知 · 双跑 · 取回费</text>
      <text x="102" y="572" class="body">证据：合同、报价快照与退出预算</text>
    </g>
  </g>

  <path d="M410 370 H466" stroke="#52606d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="482" y="148" width="288" height="442" rx="8" fill="#203b4d"/>
    <text x="626" y="186" text-anchor="middle" class="head white">出口 SLO 与证据账本</text>
    <line x1="514" y1="204" x2="738" y2="204" stroke="#78909d"/>
    <text x="514" y="240" class="label white">数据出口</text>
    <text x="514" y="267" class="body white">expected / exported / verified</text>
    <text x="514" y="290" class="body white">时钟起止、格式、关系和摘要</text>
    <text x="514" y="333" class="label white">删除处置</text>
    <text x="514" y="360" class="body white">primary / index / backup / support</text>
    <text x="514" y="383" class="body white">未知存储面必须进入限制声明</text>
    <text x="514" y="426" class="label white">关键恢复</text>
    <text x="514" y="453" class="body white">权限、引用、质量、安全、容量</text>
    <text x="514" y="476" class="body white">和 Trace 全部通过后停止 RTO</text>
    <rect x="514" y="510" width="224" height="52" rx="6" fill="#ffd37a"/>
    <text x="626" y="533" text-anchor="middle" class="label">合同写“可导出”</text>
    <text x="626" y="553" text-anchor="middle" class="body">仍需实际演练验证</text>
  </g>
  <path d="M770 370 H826" stroke="#52606d" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="842" y="126" width="378" height="490" rx="8" fill="#fff" stroke="#9aa9b6"/>
    <rect x="842" y="126" width="378" height="52" rx="8" fill="#dfeee9"/>
    <rect x="842" y="170" width="378" height="8" fill="#dfeee9"/>
    <text x="866" y="158" class="head">退出证明的四个等级</text>
    <g>
      <circle cx="892" cy="224" r="24" fill="#cfd8df"/><text x="892" y="230" text-anchor="middle" class="label">P0</text>
      <text x="934" y="219" class="label">文档声称可导出</text>
      <text x="934" y="242" class="body">尚未观察实际对象、时限和缺口</text>
      <line x1="892" y1="248" x2="892" y2="287" stroke="#9aa9b6" stroke-width="3"/>
      <circle cx="892" cy="312" r="24" fill="#b9cfdf"/><text x="892" y="318" text-anchor="middle" class="label">P1</text>
      <text x="934" y="307" class="label">文件成功导出并可解析</text>
      <text x="934" y="330" class="body">只证明文件移动，不证明完整关系</text>
      <line x1="892" y1="336" x2="892" y2="375" stroke="#9aa9b6" stroke-width="3"/>
      <circle cx="892" cy="400" r="24" fill="#a5c7b0"/><text x="892" y="406" text-anchor="middle" class="label">P2</text>
      <text x="934" y="395" class="label">独立导入且外部分母对账</text>
      <text x="934" y="418" class="body">对象、摘要、版本和关系均可验证</text>
      <line x1="892" y1="424" x2="892" y2="463" stroke="#9aa9b6" stroke-width="3"/>
      <circle cx="892" cy="488" r="24" fill="#4d9078"/><text x="892" y="494" text-anchor="middle" class="label white">P3</text>
      <text x="934" y="483" class="label">替代系统在 SLO 内恢复</text>
      <text x="934" y="506" class="body">同一业务、安全、可靠性门通过</text>
      <rect x="866" y="544" width="330" height="48" rx="6" fill="#f8e7df"/>
      <text x="1031" y="574" text-anchor="middle" class="label">OpenAPI 一致 ≠ 行为可替换</text>
    </g>
  </g>
  <text x="60" y="666" class="subtitle">演练闭环：发现差异 → 更新适配器/合同/成本 → 重跑关键门 → 记录未知与限制 → 安排下一次演练</text>
  <text x="60" y="696" class="subtitle">构造示意：P3 只对本次 bundle、数据范围、负载与观察窗口成立，不证明未来任何替代都可成功。</text>
</svg>
