<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 蜕变关系设计与失败注入矩阵</title>
  <desc id="desc">按置换、无关上下文、证据扩充、单位变换和随机改写五类关系，列出前置条件、输入变换、禁止与允许变化、度量和门禁动作；底部说明先验证变换有效性再判断系统关系。</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.title{font:700 31px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#17324d}.sub{font:400 17px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#526b7d}.head{font:700 17px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#fff}.h{font:700 16px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#17324d}.t{font:400 15px Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#334f63}.m{font:600 14px "SFMono-Regular",Consolas,monospace;fill:#405f73}.arrow{fill:none;stroke:#647f91;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto"><path d="M0,0 L0,7 L9,3.5 z" fill="#647f91"/></marker>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <rect width="1280" height="104" fill="#fff"/>
  <rect y="102" width="1280" height="2" fill="#dce6ed"/>
  <text class="title" x="42" y="45">关系不是一句“应该差不多”：每个 MR 都要写完整适用域</text>
  <text class="sub" x="42" y="77">表中均为构造示例；真实阈值必须由业务风险、人工标注和历史方差校准，不能跨任务复制。</text>

  <rect x="38" y="122" width="1204" height="48" rx="7" fill="#315d77"/>
  <text class="head" x="56" y="153">关系类型</text>
  <text class="head" x="226" y="153">前置条件 P(x)</text>
  <text class="head" x="464" y="153">输入变换 T(x)</text>
  <text class="head" x="690" y="153">禁止变化 / 允许变化</text>
  <text class="head" x="1000" y="153">度量与动作</text>

  <rect x="38" y="182" width="1204" height="88" rx="7" fill="#e8f3ff" stroke="#79a6c6"/>
  <rect x="38" y="182" width="166" height="88" rx="7" fill="#d5e8f6"/>
  <text class="h" x="56" y="214">MR-01 置换</text><text class="t" x="56" y="239">集合顺序无语义</text>
  <text class="t" x="222" y="211">输入字段被声明为集合</text><text class="t" x="222" y="236">无首项优先或时间顺序</text>
  <text class="t" x="460" y="211">确定性打乱证据顺序</text><text class="m" x="460" y="237">permute(ids, seed)</text>
  <text class="t" x="686" y="211">禁：结论、证据集合、权限</text><text class="t" x="686" y="236">允：措辞与引用展示顺序</text>
  <text class="t" x="996" y="211">硬字段差异立即失败</text><text class="t" x="996" y="236">注入“首项偏置”应被杀死</text>

  <rect x="38" y="280" width="1204" height="88" rx="7" fill="#f1ecfa" stroke="#9a84b7"/>
  <rect x="38" y="280" width="166" height="88" rx="7" fill="#e3d9f1"/>
  <text class="h" x="56" y="312">MR-02 无关信息</text><text class="t" x="56" y="337">结果应保持</text>
  <text class="t" x="222" y="309">已证明段落与任务无关</text><text class="t" x="222" y="334">不触发安全或长度边界</text>
  <text class="t" x="460" y="309">插入带唯一 ID 的中性句</text><text class="m" x="460" y="335">append(irrelevant_block)</text>
  <text class="t" x="686" y="309">禁：业务动作、事实与引用</text><text class="t" x="686" y="334">允：摘要长度小幅变化</text>
  <text class="t" x="996" y="309">先审计“无关”是否成立</text><text class="t" x="996" y="334">越界输入不得算模型失败</text>

  <rect x="38" y="378" width="1204" height="88" rx="7" fill="#e8f7ee" stroke="#76a889"/>
  <rect x="38" y="378" width="166" height="88" rx="7" fill="#d5ecde"/>
  <text class="h" x="56" y="410">MR-03 证据扩充</text><text class="t" x="56" y="435">单调或定向变化</text>
  <text class="t" x="222" y="407">新增证据可信且不冲突</text><text class="t" x="222" y="432">政策版本与权限一致</text>
  <text class="t" x="460" y="407">加入支持同一结论的证据</text><text class="m" x="460" y="433">evidence := evidence ∪ e+</text>
  <text class="t" x="686" y="407">禁：从允许跳为拒绝</text><text class="t" x="686" y="432">允：置信区间收窄、补引用</text>
  <text class="t" x="996" y="407">检查方向，不要求数值相等</text><text class="t" x="996" y="432">冲突证据另建关系合同</text>

  <rect x="38" y="476" width="1204" height="88" rx="7" fill="#fff4dc" stroke="#d0a05a"/>
  <rect x="38" y="476" width="166" height="88" rx="7" fill="#f8e5bb"/>
  <text class="h" x="56" y="508">MR-04 单位变换</text><text class="t" x="56" y="533">数值等价</text>
  <text class="t" x="222" y="505">换算公式、舍入与币种冻结</text><text class="t" x="222" y="530">文本中无其他同单位数字</text>
  <text class="t" x="460" y="505">元转分并改字段单位</text><text class="m" x="460" y="531">amount_cent = 100 × yuan</text>
  <text class="t" x="686" y="505">禁：资格与最终金额改变</text><text class="t" x="686" y="530">允：显示格式按合同变化</text>
  <text class="t" x="996" y="505">Decimal 归一后精确比较</text><text class="t" x="996" y="530">注入整数截断应触发失败</text>

  <rect x="38" y="574" width="1204" height="88" rx="7" fill="#fff0f1" stroke="#c77b7f"/>
  <rect x="38" y="574" width="166" height="88" rx="7" fill="#f5d9dc"/>
  <text class="h" x="56" y="606">MR-05 随机改写</text><text class="t" x="56" y="631">概率关系</text>
  <text class="t" x="222" y="603">改写保持意图与实体约束</text><text class="t" x="222" y="628">固定系统快照与采样预算</text>
  <text class="t" x="460" y="603">生成多种合法表述并配对</text><text class="m" x="460" y="629">K seeds × N source cases</text>
  <text class="t" x="686" y="603">禁：高风险动作违例率上升</text><text class="t" x="686" y="628">允：单次答案和措辞不同</text>
  <text class="t" x="996" y="603">比较配对违例率及区间</text><text class="t" x="996" y="628">边界重叠则 INCONCLUSIVE</text>

  <path class="arrow" d="M360 681 L500 681"/>
  <text class="h" x="52" y="688">执行顺序</text>
  <text class="t" x="514" y="688">变换有效性</text>
  <path class="arrow" d="M628 681 L742 681"/>
  <text class="t" x="756" y="688">关系观测</text>
  <path class="arrow" d="M858 681 L958 681"/>
  <text class="t" x="972" y="688">归因与发布决策</text>
</svg>
