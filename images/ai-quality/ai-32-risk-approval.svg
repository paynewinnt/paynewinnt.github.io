<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">Human-in-the-loop 风险分层与审批点</title>
  <desc id="desc">展示影响、可逆性、权限、金额与数据、证据和不确定性如何经过硬规则与风险策略，映射到计划审批、工具审批、结果复核、异常升级以及自动、单人、双人和拒绝决策。</desc>
  <style>
    .bg { fill: #f8fafc; }
    .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
    .sub { font: 400 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
    .h { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
    .t { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
    .label { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
    .blue { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .green { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .amber { fill: #fffbeb; stroke: #d97706; stroke-width: 2; }
    .violet { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
    .rose { fill: #fff1f2; stroke: #e11d48; stroke-width: 2; }
    .arrow { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
    .guard { fill: none; stroke: #e11d48; stroke-width: 3; marker-end: url(#red); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="3.5" orient="auto"><path d="M0,0 L0,7 L10,3.5 z" fill="#64748b"/></marker>
    <marker id="red" markerWidth="11" markerHeight="11" refX="10" refY="3.5" orient="auto"><path d="M0,0 L0,7 L10,3.5 z" fill="#e11d48"/></marker>
  </defs>
  <rect class="bg" width="1280" height="900"/>
  <text class="title" x="54" y="58">人工介入由风险和证据决定，不由一个置信度分数决定</text>
  <text class="sub" x="54" y="91">硬规则先守住不可越过的边界；风险策略再决定暂停位置、审核人数和允许的后续动作。</text>

  <text class="h" x="54" y="143">1. 六类输入</text>
  <rect class="blue" x="54" y="166" width="220" height="92" rx="8"/>
  <text class="h" x="76" y="199">影响</text><text class="t" x="76" y="229">对象数、持续时间、外部传播</text>
  <rect class="green" x="54" y="276" width="220" height="92" rx="8"/>
  <text class="h" x="76" y="309">可逆性</text><text class="t" x="76" y="339">撤销成本、补偿能力、时限</text>
  <rect class="violet" x="54" y="386" width="220" height="92" rx="8"/>
  <text class="h" x="76" y="419">权限</text><text class="t" x="76" y="449">生产写入、跨租户、管理员</text>
  <rect class="amber" x="54" y="496" width="220" height="92" rx="8"/>
  <text class="h" x="76" y="529">金额与数据</text><text class="t" x="76" y="559">额度、个人数据、秘密与外发</text>
  <rect class="blue" x="54" y="606" width="220" height="92" rx="8"/>
  <text class="h" x="76" y="639">证据完整度</text><text class="t" x="76" y="669">来源、版本、新鲜度、冲突</text>
  <rect class="violet" x="54" y="716" width="220" height="92" rx="8"/>
  <text class="h" x="76" y="749">不确定性</text><text class="t" x="76" y="779">校准分数、分布外、模型分歧</text>

  <path class="arrow" d="M286 486 L348 486"/>
  <text class="h" x="350" y="143">2. 决策控制面</text>
  <rect class="rose" x="350" y="166" width="352" height="150" rx="8"/>
  <text class="h" x="376" y="202">确定性硬规则</text>
  <text class="t" x="376" y="236">身份 · 租户 · 权限 · 工具清单</text>
  <text class="t" x="376" y="269">禁止目的地 · 业务上限 · 策略可用性</text>
  <text class="label" x="376" y="297" fill="#be123c">失败直接拒绝，不进入加权平均</text>
  <rect class="box" x="350" y="342" width="352" height="186" rx="8"/>
  <text class="h" x="376" y="379">证据资格检查</text>
  <text class="t" x="376" y="415">必需字段是否齐全、可信且足够新鲜</text>
  <text class="t" x="376" y="450">事实冲突时升级，不把空值当成否定</text>
  <text class="t" x="376" y="485">执行前再次读取资源版本与授权状态</text>
  <rect class="amber" x="350" y="554" width="352" height="176" rx="8"/>
  <text class="h" x="376" y="591">版本化风险策略</text>
  <text class="t" x="376" y="627">固有风险 + 不确定性 - 可验证控制</text>
  <text class="t" x="376" y="662">按场景、金额、数据和地区配置阈值</text>
  <text class="label" x="376" y="702" fill="#b45309">输出介入强度，不输出免责结论</text>
  <path class="guard" d="M702 239 C750 239 750 780 814 780"/>
  <text class="label" x="716" y="759" fill="#be123c">硬拒绝</text>

  <path class="arrow" d="M702 470 L760 470"/>
  <text class="h" x="764" y="143">3. 选择审批点</text>
  <rect class="blue" x="764" y="166" width="226" height="124" rx="8"/>
  <text class="h" x="788" y="202">Plan approval</text>
  <text class="t" x="788" y="234">批准目标、范围、工具和预算</text>
  <text class="t" x="788" y="263">重新规划后重新评估</text>
  <rect class="rose" x="764" y="310" width="226" height="124" rx="8"/>
  <text class="h" x="788" y="346">Tool approval</text>
  <text class="t" x="788" y="378">副作用前绑定规范化参数</text>
  <text class="t" x="788" y="407">快照变化立即失效</text>
  <rect class="green" x="764" y="454" width="226" height="124" rx="8"/>
  <text class="h" x="788" y="490">Result review</text>
  <text class="t" x="788" y="522">外发、发布和高影响结论</text>
  <text class="t" x="788" y="551">不能补救已发生的副作用</text>
  <rect class="violet" x="764" y="598" width="226" height="124" rx="8"/>
  <text class="h" x="788" y="634">Exception escalation</text>
  <text class="t" x="788" y="666">冲突、状态未知、超出策略</text>
  <text class="t" x="788" y="695">移交完整异常证据包</text>

  <path class="arrow" d="M990 444 L1040 444"/>
  <text class="h" x="1044" y="143">4. 执行动作</text>
  <rect class="green" x="1044" y="166" width="184" height="92" rx="8"/>
  <text class="h" x="1068" y="201">AUTO</text><text class="t" x="1068" y="232">自动 + 风险抽样</text>
  <rect class="amber" x="1044" y="278" width="184" height="92" rx="8"/>
  <text class="h" x="1068" y="313">单人审批</text><text class="t" x="1068" y="344">额度与领域匹配</text>
  <rect class="violet" x="1044" y="390" width="184" height="92" rx="8"/>
  <text class="h" x="1068" y="425">双人审批</text><text class="t" x="1068" y="456">独立主体、同一快照</text>
  <rect class="blue" x="1044" y="502" width="184" height="92" rx="8"/>
  <text class="h" x="1068" y="537">升级</text><text class="t" x="1068" y="568">领域队列或明确暂停</text>
  <rect class="rose" x="1044" y="742" width="184" height="76" rx="8"/>
  <text class="h" x="1068" y="776">DENY</text><text class="t" x="1068" y="804">不可绕过的拒绝</text>

  <rect x="350" y="774" width="640" height="70" rx="8" fill="#0f172a"/>
  <text x="378" y="805" style="font: 700 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #ffffff;">审批对象 = 规范化动作 + 资源版本 + 证据摘要 + 策略版本 + 有效期</text>
  <text x="378" y="832" style="font: 400 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #cbd5e1;">执行时重新鉴权与比较状态；“已批准”不等于永久授权。</text>
</svg>
