<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">AI 对话记忆层级与受控生命周期</title>
  <desc id="desc">展示当前会话状态、工作记忆、情节事实偏好长期记忆与模型参数知识的区别，以及写入策略、选择过滤、上下文注入和删除传播路径</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#496579"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#29475e" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 34px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #17354d; }
      .subtitle { font: 400 17px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #52697b; }
      .h2 { font: 700 21px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #17354d; }
      .h3 { font: 700 17px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #23455d; }
      .text { font: 400 15px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #38566b; }
      .small { font: 400 14px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #587083; }
      .mono { font: 600 14px 'SFMono-Regular', Consolas, monospace; fill: #294b63; }
      .white { fill: #ffffff; }
    </style>
  </defs>

  <rect width="1280" height="900" fill="#f7fafc"/>
  <rect width="1280" height="98" fill="#ffffff"/>
  <rect y="96" width="1280" height="2" fill="#d7e3eb"/>
  <text x="52" y="49" class="title">对话记忆不是一个向量库：先分层，再治理生命周期</text>
  <text x="52" y="78" class="subtitle">上下文内状态、持久记忆与模型参数知识属于不同边界；每次注入都要重新校验身份、目的、时间和来源</text>

  <g filter="url(#shadow)">
    <rect x="52" y="124" width="260" height="112" rx="8" fill="#eaf4ff" stroke="#6d9fca"/>
  </g>
  <text x="182" y="153" text-anchor="middle" class="h2">原始事件</text>
  <text x="182" y="181" text-anchor="middle" class="text">用户消息 · 系统事实</text>
  <text x="182" y="207" text-anchor="middle" class="text">工具结果 · 外部内容</text>
  <text x="182" y="226" text-anchor="middle" class="small">事件是证据，不自动等于记忆</text>

  <line x1="312" y1="180" x2="352" y2="180" stroke="#496579" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="362" y="124" width="402" height="112" rx="8" fill="#fff4e4" stroke="#d49a47"/>
  </g>
  <text x="563" y="153" text-anchor="middle" class="h2">Write Gate</text>
  <text x="390" y="183" class="text">身份 / 租户</text>
  <text x="510" y="183" class="text">来源 / 证据</text>
  <text x="636" y="183" class="text">目的 / 同意</text>
  <text x="390" y="211" class="text">敏感分类</text>
  <text x="510" y="211" class="text">冲突 / 去重</text>
  <text x="636" y="211" class="text">TTL / 有效期</text>

  <line x1="764" y1="180" x2="804" y2="180" stroke="#496579" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="814" y="124" width="414" height="112" rx="8" fill="#eaf7ee" stroke="#69a17a"/>
  </g>
  <text x="1021" y="153" text-anchor="middle" class="h2">Select / Read Gate</text>
  <text x="840" y="183" class="text">同租户、同用户、同目的</text>
  <text x="1050" y="183" class="text">active 且仍有效</text>
  <text x="840" y="211" class="text">来源权威与相关性排序</text>
  <text x="1050" y="211" class="text">最小 Token 预算</text>

  <text x="52" y="278" class="h2">应用侧可管理记忆</text>
  <g filter="url(#shadow)">
    <rect x="52" y="298" width="760" height="99" rx="8" fill="#e9f3ff" stroke="#72a3ce"/>
    <rect x="52" y="414" width="760" height="99" rx="8" fill="#eaf7ef" stroke="#6da27c"/>
    <rect x="52" y="530" width="760" height="178" rx="8" fill="#ffffff" stroke="#8a9eae"/>
  </g>

  <rect x="52" y="298" width="180" height="99" rx="8" fill="#3478a9"/>
  <rect x="52" y="414" width="180" height="99" rx="8" fill="#3d8662"/>
  <text x="142" y="338" text-anchor="middle" class="h2 white">当前会话状态</text>
  <text x="142" y="367" text-anchor="middle" class="small white">session / task</text>
  <text x="142" y="454" text-anchor="middle" class="h2 white">工作记忆</text>
  <text x="142" y="483" text-anchor="middle" class="small white">当前任务活跃视图</text>

  <text x="260" y="328" class="h3">表单步骤、附件 ID、待确认参数、一次性审批</text>
  <text x="260" y="356" class="text">短生命周期，关键状态由业务状态机维护</text>
  <text x="260" y="381" class="small">默认不跨会话，不自动提升为长期记忆</text>

  <text x="260" y="444" class="h3">排障假设、已排除原因、任务约束、候选事实</text>
  <text x="260" y="472" class="text">可以压缩，但必须能回到原始证据</text>
  <text x="260" y="497" class="small">任务结束后丢弃、归档或仅提升经确认条目</text>

  <text x="76" y="561" class="h2">长期记忆</text>
  <rect x="76" y="581" width="218" height="101" rx="7" fill="#fff1df" stroke="#d49b50"/>
  <rect x="323" y="581" width="218" height="101" rx="7" fill="#f1edfa" stroke="#927ab5"/>
  <rect x="570" y="581" width="218" height="101" rx="7" fill="#e8f6f4" stroke="#5a9c90"/>
  <text x="185" y="612" text-anchor="middle" class="h3">情节</text>
  <text x="185" y="639" text-anchor="middle" class="text">发生过什么、何时发生</text>
  <text x="185" y="663" text-anchor="middle" class="small">历史不等于当前状态</text>
  <text x="432" y="612" text-anchor="middle" class="h3">事实</text>
  <text x="432" y="639" text-anchor="middle" class="text">来源、置信度、有效期</text>
  <text x="432" y="663" text-anchor="middle" class="small">冲突需要版本与仲裁</text>
  <text x="679" y="612" text-anchor="middle" class="h3">偏好</text>
  <text x="679" y="639" text-anchor="middle" class="text">可查看、纠正、关闭</text>
  <text x="679" y="663" text-anchor="middle" class="small">偏好永远不是动作授权</text>

  <g filter="url(#shadow)">
    <rect x="844" y="298" width="384" height="205" rx="8" fill="#f4f1f8" stroke="#8b78a5" stroke-dasharray="8 6"/>
  </g>
  <text x="1036" y="332" text-anchor="middle" class="h2">模型参数知识</text>
  <text x="872" y="369" class="text">预训练 / 微调形成</text>
  <text x="872" y="400" class="text">不能按 memory_id 做精确 CRUD</text>
  <text x="872" y="431" class="text">不能稳定提供会话来源</text>
  <text x="872" y="462" class="text">需单独训练数据与模型治理</text>
  <rect x="872" y="476" width="328" height="2" fill="#b9adca"/>
  <text x="1036" y="493" text-anchor="middle" class="small">与应用侧记忆隔离，不混写删除承诺</text>

  <g filter="url(#shadow)">
    <rect x="844" y="530" width="384" height="178" rx="8" fill="#edf7fa" stroke="#68a0ad"/>
  </g>
  <text x="1036" y="561" text-anchor="middle" class="h2">本轮上下文注入</text>
  <text x="872" y="596" class="text">记忆 ID + 版本 + 来源 + 时间</text>
  <text x="872" y="625" class="text">冲突和不确定性保持可见</text>
  <text x="872" y="654" class="text">高风险事实执行前回查真值</text>
  <rect x="872" y="674" width="328" height="2" fill="#b6d5db"/>
  <text x="1036" y="697" text-anchor="middle" class="small">模型只能使用被授权注入的最小集合</text>

  <line x1="812" y1="620" x2="834" y2="620" stroke="#496579" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="52" y="755" class="h2">同一记录的受控状态机</text>
  <rect x="52" y="774" width="1176" height="70" rx="8" fill="#ffffff" stroke="#cfdde6"/>
  <text x="93" y="816" class="mono">write</text>
  <text x="250" y="816" class="mono">select</text>
  <text x="407" y="816" class="mono">read</text>
  <text x="554" y="816" class="mono">update</text>
  <text x="727" y="816" class="mono">expire</text>
  <text x="897" y="816" class="mono">delete</text>
  <text x="1071" y="816" class="mono">restore</text>
  <line x1="142" y1="809" x2="226" y2="809" stroke="#8aa0af" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="310" y1="809" x2="383" y2="809" stroke="#8aa0af" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="457" y1="809" x2="530" y2="809" stroke="#8aa0af" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="622" y1="809" x2="703" y2="809" stroke="#8aa0af" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="787" y1="809" x2="873" y2="809" stroke="#8aa0af" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="957" y1="809" x2="1047" y2="809" stroke="#8aa0af" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="52" y="858" width="1176" height="29" rx="7" fill="#17354d"/>
  <text x="640" y="878" text-anchor="middle" class="small white">删除与恢复必须沿数据血缘传播：主库、索引、缓存、摘要、队列和备份不能各自为政</text>
</svg>
