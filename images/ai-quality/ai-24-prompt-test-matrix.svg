<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">Prompt-as-code 测试矩阵与发布门禁</title>
  <desc id="desc">按照模板契约、渲染结构、模型行为、工具安全和发布恢复五层，展示静态检查、离线回归、集成验证和灰度观测的测试职责。</desc>
  <style>
    .bg { fill: #f8fafc; }
    .title { font: 700 32px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
    .sub { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
    .head { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #ffffff; }
    .rowh { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
    .t { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
    .small { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .line { stroke: #cbd5e1; stroke-width: 1.5; }
  </style>
  <rect class="bg" width="1280" height="820"/>
  <text class="title" x="54" y="58">Prompt 回归不是一批模型样本，而是覆盖五层边界的测试矩阵</text>
  <text class="sub" x="54" y="90">能由确定性检查发现的问题先在 PR 阶段阻断；模型、工具和真实流量验证逐层后移，但证据使用同一产物指纹。</text>

  <rect x="54" y="132" width="212" height="70" rx="8" fill="#0f172a"/>
  <text class="head" x="78" y="174">测试对象 / 执行阶段</text>
  <rect x="278" y="132" width="220" height="70" rx="8" fill="#2563eb"/>
  <text class="head" x="302" y="161">PR 静态与契约</text>
  <text x="302" y="184" class="small" fill="#dbeafe">秒级，零模型调用</text>
  <rect x="510" y="132" width="220" height="70" rx="8" fill="#7c3aed"/>
  <text class="head" x="534" y="161">离线行为回归</text>
  <text x="534" y="184" class="small" fill="#ede9fe">冻结依赖，样本级证据</text>
  <rect x="742" y="132" width="220" height="70" rx="8" fill="#ea580c"/>
  <text class="head" x="766" y="161">预发布集成</text>
  <text x="766" y="184" class="small" fill="#ffedd5">真实适配器，工具替身</text>
  <rect x="974" y="132" width="252" height="70" rx="8" fill="#059669"/>
  <text class="head" x="998" y="161">影子 / 金丝雀</text>
  <text x="998" y="184" class="small" fill="#d1fae5">真实分布，运行时护栏</text>

  <rect x="54" y="214" width="1172" height="96" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="54" y="214" width="212" height="96" rx="8" fill="#eff6ff"/>
  <text class="rowh" x="78" y="249">1. Prompt 包与变量</text>
  <text class="t" x="78" y="276">模板、Schema、示例、依赖</text>
  <text class="t" x="302" y="244">缺失 / 多余变量</text><text class="t" x="302" y="267">类型、枚举、秘密扫描</text><text class="t" x="302" y="290">两次构建指纹一致</text>
  <text class="t" x="534" y="244">代表性 fixture</text><text class="t" x="534" y="267">版本与基线冻结</text><text class="small" x="534" y="290" fill="#6d28d9">失败：阻断</text>
  <text class="t" x="766" y="244">API 参数与角色映射</text><text class="t" x="766" y="267">Token 预算 / 截断</text>
  <text class="t" x="998" y="244">请求记录 artifact SHA</text><text class="t" x="998" y="267">缓存与路由命中</text>

  <rect x="54" y="322" width="1172" height="96" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="54" y="322" width="212" height="96" rx="8" fill="#ecfeff"/>
  <text class="rowh" x="78" y="357">2. 渲染消息结构</text>
  <text class="t" x="78" y="384">角色、顺序、分隔与转义</text>
  <text class="t" x="302" y="352">空值 / 最长值</text><text class="t" x="302" y="375">XML、JSON 特殊字符</text><text class="t" x="302" y="398">无残留占位符</text>
  <text class="t" x="534" y="352">渲染快照 diff</text><text class="t" x="534" y="375">多语言与长上下文</text>
  <text class="t" x="766" y="352">SDK 序列化结果</text><text class="t" x="766" y="375">流式消息完整性</text>
  <text class="t" x="998" y="352">输入长度与截断切片</text><text class="small" x="998" y="383" fill="#047857">安全约束不得被截掉</text>

  <rect x="54" y="430" width="1172" height="96" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="54" y="430" width="212" height="96" rx="8" fill="#f5f3ff"/>
  <text class="rowh" x="78" y="465">3. 模型行为</text>
  <text class="t" x="78" y="492">任务、格式、拒答与证据</text>
  <text class="t" x="302" y="460">输出 Schema 可加载</text><text class="t" x="302" y="483">样本字段完整</text>
  <text class="t" x="534" y="460">核心 / 边界 / 历史集</text><text class="t" x="534" y="483">样本级基线差异</text><text class="small" x="534" y="506" fill="#6d28d9">关键性质独立门禁</text>
  <text class="t" x="766" y="460">目标模型合约冒烟</text><text class="t" x="766" y="483">拒答与错误终态</text>
  <text class="t" x="998" y="460">任务结果 / 人工改写</text><text class="t" x="998" y="483">成本、时延、升级率</text>

  <rect x="54" y="538" width="1172" height="96" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="54" y="538" width="212" height="96" rx="8" fill="#fff7ed"/>
  <text class="rowh" x="78" y="573">4. 工具与安全</text>
  <text class="t" x="78" y="600">权限、租户、参数、副作用</text>
  <text class="t" x="302" y="568">工具 revision 存在</text><text class="t" x="302" y="591">危险词与权限 diff</text><text class="t" x="302" y="614">Fixture 不含真实秘密</text>
  <text class="t" x="534" y="568">注入与合法对照</text><text class="t" x="534" y="591">禁止工具提议 / 执行</text>
  <text class="t" x="766" y="568">权限服务与工具替身</text><text class="t" x="766" y="591">故障注入 / 幂等</text>
  <text class="t" x="998" y="568">越权执行必须为零</text><text class="small" x="998" y="599" fill="#be123c">触发即回滚</text>

  <rect x="54" y="646" width="1172" height="96" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="54" y="646" width="212" height="96" rx="8" fill="#ecfdf5"/>
  <text class="rowh" x="78" y="681">5. 发布与恢复</text>
  <text class="t" x="78" y="708">路由、护栏、兼容与回滚</text>
  <text class="t" x="302" y="676">版本升级级别</text><text class="t" x="302" y="699">稳定回滚指纹存在</text>
  <text class="t" x="534" y="676">候选与稳定产物配对</text><text class="t" x="534" y="699">回滚后冒烟集</text>
  <text class="t" x="766" y="676">依赖双版本兼容</text><text class="t" x="766" y="699">会话与异步任务策略</text>
  <text class="t" x="998" y="676">稳定分桶 / 自动护栏</text><text class="t" x="998" y="699">首错、回滚完成证据</text>

  <line class="line" x1="266" y1="214" x2="266" y2="742"/>
  <line class="line" x1="504" y1="214" x2="504" y2="742"/>
  <line class="line" x1="736" y1="214" x2="736" y2="742"/>
  <line class="line" x1="968" y1="214" x2="968" y2="742"/>

  <rect x="54" y="770" width="1172" height="36" rx="8" fill="#0f172a"/>
  <text x="78" y="794" style="font: 600 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #ffffff;">门禁原则：确定性错误不进入模型阶段；高风险失败不被平均分抵消；没有完整证据时不发布。</text>
</svg>
