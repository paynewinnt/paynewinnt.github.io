<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">合成数据从种子到可用资产的证据流水线</title>
  <desc id="desc">展示训练、评测、红队和隐私型合成数据从用途契约、真实锚点与种子分类开始，经过版本化生成、独立验证、多层过滤、去重与泄漏检查，最终按用途发布，并持续维护血缘与删除传播。</desc>
  <defs>
    <style>
      .bg { fill: #f7fafc; }
      .title { font: 700 31px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #17324d; }
      .sub { font: 400 16px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #51697d; }
      .h { font: 700 18px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #17324d; }
      .t { font: 400 15px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334f63; }
      .small { font: 600 13px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .box { fill: #ffffff; stroke: #c9d7e2; stroke-width: 2; }
      .blue { fill: #eaf4ff; stroke: #4e8fbe; stroke-width: 2; }
      .green { fill: #eaf7ef; stroke: #5b9671; stroke-width: 2; }
      .amber { fill: #fff5df; stroke: #c58b35; stroke-width: 2; }
      .violet { fill: #f2edfa; stroke: #8a72ae; stroke-width: 2; }
      .rose { fill: #fff0f0; stroke: #bd6669; stroke-width: 2; }
      .arrow { fill: none; stroke: #667f91; stroke-width: 2.5; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #bd6669; stroke-width: 2.5; stroke-dasharray: 7 6; marker-end: url(#red); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#667f91"/></marker>
    <marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#bd6669"/></marker>
  </defs>

  <rect class="bg" width="1280" height="720"/>
  <rect width="1280" height="104" fill="#ffffff"/>
  <rect y="102" width="1280" height="2" fill="#dce6ed"/>
  <text class="title" x="48" y="47">合成数据流水线：每条样本都要带着来源、判断与用途边界</text>
  <text class="sub" x="48" y="78">生成数量只是过程指标；独立证据、真实锚点、风险门禁和可传播删除状态共同决定能否进入训练或测试资产。</text>

  <text class="h" x="48" y="138">主处理链</text>
  <rect class="blue" x="48" y="158" width="206" height="142" rx="8"/>
  <text class="h" x="68" y="191">1. 用途与种子</text>
  <text class="t" x="68" y="222">训练 / 评测 / 红队 / 隐私</text>
  <text class="t" x="68" y="248">种子类别 · 风险切片</text>
  <text class="t" x="68" y="274">真实锚点 · 禁止用途</text>
  <path class="arrow" d="M254 229 L278 229"/>

  <rect class="violet" x="282" y="158" width="206" height="142" rx="8"/>
  <text class="h" x="302" y="191">2. 版本化生成</text>
  <text class="t" x="302" y="222">生成器 · Prompt · 参数</text>
  <text class="t" x="302" y="248">种子 ID · 父记录 ID</text>
  <text class="t" x="302" y="274">原始输出不可覆盖</text>
  <path class="arrow" d="M488 229 L512 229"/>

  <rect class="green" x="516" y="158" width="206" height="142" rx="8"/>
  <text class="h" x="536" y="191">3. 独立验证</text>
  <text class="t" x="536" y="222">规则 Oracle 优先</text>
  <text class="t" x="536" y="248">异源模型交叉判断</text>
  <text class="t" x="536" y="274">分歧进入人工复核</text>
  <path class="arrow" d="M722 229 L746 229"/>

  <rect class="amber" x="750" y="158" width="206" height="142" rx="8"/>
  <text class="h" x="770" y="191">4. 风险过滤</text>
  <text class="t" x="770" y="222">规则 · 模型 · 人工</text>
  <text class="t" x="770" y="248">精确 / 语义重复候选</text>
  <text class="t" x="770" y="274">泄漏哨兵 · 偏差切片</text>
  <path class="arrow" d="M956 229 L980 229"/>

  <rect class="rose" x="984" y="158" width="248" height="142" rx="8"/>
  <text class="h" x="1004" y="191">5. 用途隔离发布</text>
  <text class="t" x="1004" y="222">训练池 ≠ 密封评测集</text>
  <text class="t" x="1004" y="248">版本清单 · 验收证据</text>
  <text class="t" x="1004" y="274">撤回与删除状态可追踪</text>

  <text class="h" x="48" y="347">四道不能由“生成得像”替代的证据门</text>
  <rect class="box" x="48" y="370" width="276" height="214" rx="8"/>
  <rect x="48" y="370" width="276" height="42" rx="8" fill="#dcecff"/>
  <text class="h" x="68" y="398">相关性隔离</text>
  <text class="t" x="68" y="442">生成器与验证器家族是否独立</text>
  <text class="t" x="68" y="470">标签是否来自可执行 Oracle</text>
  <text class="t" x="68" y="498">同模型自证是否被阻断</text>
  <text class="small" x="68" y="536" fill="#356e99">证据：validator_family</text>
  <text class="small" x="68" y="560" fill="#356e99">oracle_result · review_id</text>

  <rect class="box" x="346" y="370" width="276" height="214" rx="8"/>
  <rect x="346" y="370" width="276" height="42" rx="8" fill="#ddf1e4"/>
  <text class="h" x="366" y="398">隐私与泄漏</text>
  <text class="t" x="366" y="442">普通合成数据不自动匿名</text>
  <text class="t" x="366" y="470">逐字片段、标识符与哨兵扫描</text>
  <text class="t" x="366" y="498">DP 参数、隐私单位与预算另记</text>
  <text class="small" x="366" y="536" fill="#3f7956">证据：sentinel_hits</text>
  <text class="small" x="366" y="560" fill="#3f7956">epsilon · delta · unit</text>

  <rect class="box" x="644" y="370" width="276" height="214" rx="8"/>
  <rect x="644" y="370" width="276" height="42" rx="8" fill="#ffebc5"/>
  <text class="h" x="664" y="398">覆盖与偏差</text>
  <text class="t" x="664" y="442">槽位填满不等于行为已覆盖</text>
  <text class="t" x="664" y="470">锚点覆盖与合成覆盖分开报告</text>
  <text class="t" x="664" y="498">按群体比较生成前后偏移</text>
  <text class="small" x="664" y="536" fill="#946620">证据：anchor_coverage</text>
  <text class="small" x="664" y="560" fill="#946620">slice_delta · mutation_id</text>

  <rect class="box" x="942" y="370" width="290" height="214" rx="8"/>
  <rect x="942" y="370" width="290" height="42" rx="8" fill="#f6dddd"/>
  <text class="h" x="962" y="398">血缘与删除传播</text>
  <text class="t" x="962" y="442">锚点、种子、生成记录形成 DAG</text>
  <text class="t" x="962" y="470">撤回沿后代传播为不可用状态</text>
  <text class="t" x="962" y="498">历史报告保留删除原因与时间</text>
  <text class="small" x="962" y="536" fill="#985052">证据：parents[] · descendants[]</text>
  <text class="small" x="962" y="560" fill="#985052">tombstone_reason</text>

  <path class="dash" d="M1087 584 C1087 632 190 632 190 304"/>
  <text class="small" x="452" y="624" fill="#985052">真实锚点撤回或生成器失效：重新计算所有后代资格，不在原文件上静默修补</text>
  <rect x="48" y="656" width="1184" height="40" rx="8" fill="#17324d"/>
  <text x="68" y="682" style="font: 700 15px Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #ffffff;">发布结论 = 用途契约符合 + 独立验证通过 + 泄漏与偏差受控 + 真实锚点仍有效；任何单项相似度或模型置信度都不能替代该结论。</text>
</svg>
