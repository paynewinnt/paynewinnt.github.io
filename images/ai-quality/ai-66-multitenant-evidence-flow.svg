<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">多租户评测证据流与门禁状态</title>
  <desc id="desc">展示租户提交、任务租约、调用幂等、Trace 聚合、分母核对、门禁判定和审计导出的完整状态流。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .tenant-a { fill: #e8f1ff; stroke: #2f67a7; stroke-width: 2; }
      .tenant-b { fill: #f1eaff; stroke: #7048a8; stroke-width: 2; }
      .state { fill: #ffffff; stroke: #657383; stroke-width: 2; }
      .ok { fill: #e8f6ef; stroke: #267451; stroke-width: 2; }
      .warn { fill: #fff2d4; stroke: #a26600; stroke-width: 2; }
      .stop { fill: #fde8e7; stroke: #a43e37; stroke-width: 2; }
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17202a; }
      .subtitle { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b5563; }
      .box-title { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17202a; }
      .text { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #344054; }
      .small { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5f6670; }
      .arrow { stroke: #526273; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .reject { stroke: #a43e37; stroke-width: 2.5; fill: none; marker-end: url(#red-arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#526273"/>
    </marker>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#a43e37"/>
    </marker>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="52" y="52">多租户证据流：每次重试可重复，每个结论有分母</text>
  <text class="subtitle" x="52" y="82">同一 Run 内保持租户、Snapshot、调用键和策略版本不变；范围不明时进入 UNKNOWN</text>

  <rect class="tenant-a" x="54" y="126" width="205" height="112" rx="7"/>
  <text class="box-title" x="76" y="158">租户 A 提交</text>
  <text class="text" x="76" y="184">Snapshot A@digest</text>
  <text class="text" x="76" y="208">Principal + purpose</text>
  <rect class="tenant-b" x="54" y="488" width="205" height="112" rx="7"/>
  <text class="box-title" x="76" y="520">租户 B 提交</text>
  <text class="text" x="76" y="546">Snapshot B@digest</text>
  <text class="text" x="76" y="570">独立队列与密钥域</text>

  <rect class="state" x="319" y="126" width="210" height="112" rx="7"/>
  <text class="box-title" x="341" y="158">Admission</text>
  <text class="text" x="341" y="184">RBAC / Tenant / Quota</text>
  <text class="text" x="341" y="208">冻结 RunSpec</text>
  <rect class="stop" x="319" y="488" width="210" height="112" rx="7"/>
  <text class="box-title" x="341" y="520">跨租户请求</text>
  <text class="text" x="341" y="546">主体范围与对象不一致</text>
  <text class="text" x="341" y="570">拒绝并记录原因码</text>

  <rect class="state" x="589" y="126" width="210" height="112" rx="7"/>
  <text class="box-title" x="611" y="158">Lease + Attempt</text>
  <text class="text" x="611" y="184">case / provider / ordinal</text>
  <text class="text" x="611" y="208">稳定调用幂等键</text>
  <rect class="warn" x="589" y="306" width="210" height="112" rx="7"/>
  <text class="box-title" x="611" y="338">超时或未知提交</text>
  <text class="text" x="611" y="364">沿用原调用键重试</text>
  <text class="text" x="611" y="388">账本拒绝重复计费</text>

  <rect class="ok" x="859" y="126" width="210" height="112" rx="7"/>
  <text class="box-title" x="881" y="158">Result Commit</text>
  <text class="text" x="881" y="184">Candidate + Baseline</text>
  <text class="text" x="881" y="208">结果摘要与 Trace</text>
  <rect class="state" x="859" y="306" width="210" height="112" rx="7"/>
  <text class="box-title" x="881" y="338">Aggregate</text>
  <text class="text" x="881" y="364">expected / valid / missing</text>
  <text class="text" x="881" y="388">CI / paired delta / slice</text>

  <rect class="ok" x="859" y="488" width="210" height="112" rx="7"/>
  <text class="box-title" x="881" y="520">PASS</text>
  <text class="text" x="881" y="546">证据完整且硬门通过</text>
  <text class="text" x="881" y="570">签发有限证据包</text>
  <rect class="stop" x="589" y="488" width="210" height="112" rx="7"/>
  <text class="box-title" x="611" y="520">BLOCK</text>
  <text class="text" x="611" y="546">关键 Slice 或成本越界</text>
  <text class="text" x="611" y="570">保留失败证据</text>
  <rect class="warn" x="1129" y="306" width="120" height="112" rx="7"/>
  <text class="box-title" x="1145" y="338">UNKNOWN</text>
  <text class="text" x="1145" y="364">缺分母</text>
  <text class="text" x="1145" y="388">缺 Trace</text>

  <path class="arrow" d="M259 182 H313"/>
  <path class="arrow" d="M529 182 H583"/>
  <path class="arrow" d="M799 182 H853"/>
  <path class="arrow" d="M964 238 V300"/>
  <path class="arrow" d="M694 238 V300"/>
  <path class="arrow" d="M799 362 H853"/>
  <path class="arrow" d="M964 418 V482"/>
  <path class="reject" d="M859 384 C820 440 785 462 748 482"/>
  <path class="arrow" d="M1069 362 H1123"/>
  <path class="reject" d="M259 544 H313"/>
  <path class="reject" d="M424 488 C440 342 392 278 424 244"/>
  <text class="small" x="78" y="278">允许：主体范围、对象租户、队列和 Secret 域一致</text>
  <text class="small" x="78" y="635">拒绝：租户 B 不能借租户 A 的 Snapshot、结果、缓存或证据导出授权</text>
  <text class="subtitle" x="52" y="688">判断顺序：先核对完整性，再算统计区间；UNKNOWN 会阻断自动发布，但不伪装成质量失败</text>
</svg>
