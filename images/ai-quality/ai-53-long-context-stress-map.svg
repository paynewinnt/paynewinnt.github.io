<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="lcsm-title lcsm-desc">
  <title id="lcsm-title">长上下文压力测试分层架构与失败定位图</title>
  <desc id="lcsm-desc">从业务真值、文档片段和冲突规则出发，经过确定性用例编译、上下文组装、模型调用与判定，再由选择、可见、使用、生成四层观测定位失败；底部展示位置、长度、密度、多跳、冲突和压缩六个压力轴以及发布门禁。</desc>
  <defs>
    <linearGradient id="lcsm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#fffaf3"/>
    </linearGradient>
    <filter id="lcsm-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#26354a" flood-opacity="0.14"/>
    </filter>
    <marker id="lcsm-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#50647f"/>
    </marker>
    <style>
      .t { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#203047; }
      .h1 { font-size:27px; font-weight:700; }
      .sub { font-size:14px; fill:#56677f; }
      .box-title { font-size:18px; font-weight:700; }
      .label { font-size:15px; font-weight:650; }
      .small { font-size:13px; fill:#40516a; }
      .tiny { font-size:12px; fill:#4f6077; }
      .line { stroke:#50647f; stroke-width:2.2; fill:none; marker-end:url(#lcsm-arrow); }
      .dash { stroke:#8795a8; stroke-width:1.6; stroke-dasharray:6 5; fill:none; marker-end:url(#lcsm-arrow); }
    </style>
  </defs>
  <rect width="1280" height="720" rx="24" fill="url(#lcsm-bg)"/>
  <text x="48" y="48" class="t h1">长上下文质量压力图：从可控输入到首错层定位</text>
  <text x="48" y="73" class="t sub">窗口能接收 ≠ 信息能被选择、保留、使用并生成正确答案；每个结论都绑定可回放证据。</text>

  <g filter="url(#lcsm-shadow)">
    <rect x="42" y="105" width="190" height="334" rx="16" fill="#e7f2ff" stroke="#79aee8"/>
    <text x="60" y="136" class="t box-title">① 真值与素材层</text>
    <rect x="58" y="156" width="158" height="51" rx="10" fill="#fff" stroke="#9ec5ef"/>
    <text x="72" y="177" class="t label">业务问题与 Oracle</text>
    <text x="72" y="196" class="t tiny">答案、拒答、允许不确定</text>
    <rect x="58" y="219" width="158" height="51" rx="10" fill="#fff" stroke="#9ec5ef"/>
    <text x="72" y="240" class="t label">原子证据片段</text>
    <text x="72" y="259" class="t tiny">ID · 版本 · 生效区间</text>
    <rect x="58" y="282" width="158" height="51" rx="10" fill="#fff" stroke="#9ec5ef"/>
    <text x="72" y="303" class="t label">干扰与冲突片段</text>
    <text x="72" y="322" class="t tiny">近似 · 旧版 · 同级矛盾</text>
    <rect x="58" y="345" width="158" height="76" rx="10" fill="#fff" stroke="#9ec5ef"/>
    <text x="72" y="366" class="t label">用例契约</text>
    <text x="72" y="386" class="t tiny">required / forbidden</text>
    <text x="72" y="404" class="t tiny">hop graph / citation span</text>
  </g>

  <g filter="url(#lcsm-shadow)">
    <rect x="272" y="105" width="214" height="334" rx="16" fill="#fff0d8" stroke="#e5aa4c"/>
    <text x="290" y="136" class="t box-title">② 确定性编译层</text>
    <rect x="288" y="156" width="182" height="57" rx="10" fill="#fff" stroke="#efc47d"/>
    <text x="302" y="178" class="t label">长度与位置编译器</text>
    <text x="302" y="198" class="t tiny">实际 Token · 相对分位</text>
    <rect x="288" y="225" width="182" height="57" rx="10" fill="#fff" stroke="#efc47d"/>
    <text x="302" y="247" class="t label">密度与多跳编译器</text>
    <text x="302" y="267" class="t tiny">相关占比 · hop 拓扑</text>
    <rect x="288" y="294" width="182" height="57" rx="10" fill="#fff" stroke="#efc47d"/>
    <text x="302" y="316" class="t label">冲突与时效编译器</text>
    <text x="302" y="336" class="t tiny">authority · valid time</text>
    <rect x="288" y="363" width="182" height="58" rx="10" fill="#fff" stroke="#efc47d"/>
    <text x="302" y="385" class="t label">截断与压缩注入器</text>
    <text x="302" y="405" class="t tiny">边界哨兵 · 摘要代际</text>
  </g>

  <g filter="url(#lcsm-shadow)">
    <rect x="526" y="105" width="214" height="334" rx="16" fill="#e7f8ef" stroke="#6dbb8c"/>
    <text x="544" y="136" class="t box-title">③ 被测数据流</text>
    <rect x="542" y="156" width="182" height="48" rx="10" fill="#fff" stroke="#91cfaa"/>
    <text x="556" y="185" class="t label">召回候选集</text>
    <path d="M633 204 L633 222" class="line"/>
    <rect x="542" y="223" width="182" height="48" rx="10" fill="#fff" stroke="#91cfaa"/>
    <text x="556" y="252" class="t label">排序 / 组装 / 裁剪</text>
    <path d="M633 271 L633 289" class="line"/>
    <rect x="542" y="290" width="182" height="48" rx="10" fill="#fff" stroke="#91cfaa"/>
    <text x="556" y="319" class="t label">模型上下文与生成</text>
    <path d="M633 338 L633 356" class="line"/>
    <rect x="542" y="357" width="182" height="64" rx="10" fill="#fff" stroke="#91cfaa"/>
    <text x="556" y="380" class="t label">解析 / 引用 / 动作</text>
    <text x="556" y="402" class="t tiny">回答不是唯一后置条件</text>
  </g>

  <g filter="url(#lcsm-shadow)">
    <rect x="780" y="105" width="456" height="334" rx="16" fill="#f2eafd" stroke="#a88ad6"/>
    <text x="798" y="136" class="t box-title">④ 证据面：按首错层定位，不让告警冒充根因</text>
    <rect x="798" y="156" width="198" height="74" rx="10" fill="#fff" stroke="#c2aee3"/>
    <circle cx="820" cy="180" r="11" fill="#4f8fd8"/><text x="816" y="185" class="t small" fill="#fff">S</text>
    <text x="840" y="184" class="t label">Selection 选择</text>
    <text x="814" y="209" class="t tiny">必需项是否进入候选/组装？</text>
    <rect x="1020" y="156" width="198" height="74" rx="10" fill="#fff" stroke="#c2aee3"/>
    <circle cx="1042" cy="180" r="11" fill="#d29a39"/><text x="1038" y="185" class="t small" fill="#fff">V</text>
    <text x="1062" y="184" class="t label">Visibility 可见</text>
    <text x="1036" y="209" class="t tiny">是否被截断、压缩或序列化？</text>
    <rect x="798" y="246" width="198" height="74" rx="10" fill="#fff" stroke="#c2aee3"/>
    <circle cx="820" cy="270" r="11" fill="#55a878"/><text x="816" y="275" class="t small" fill="#fff">U</text>
    <text x="840" y="274" class="t label">Utilization 使用</text>
    <text x="814" y="299" class="t tiny">证据可见但模型是否正确整合？</text>
    <rect x="1020" y="246" width="198" height="74" rx="10" fill="#fff" stroke="#c2aee3"/>
    <circle cx="1042" cy="270" r="11" fill="#b86b77"/><text x="1037" y="275" class="t small" fill="#fff">G</text>
    <text x="1062" y="274" class="t label">Generation 生成</text>
    <text x="1036" y="299" class="t tiny">推理正确后，表达/引用是否错？</text>
    <rect x="798" y="337" width="420" height="84" rx="10" fill="#fff" stroke="#c2aee3"/>
    <text x="814" y="361" class="t label">统一 Trace：case → variant → item → span → output claim</text>
    <text x="814" y="383" class="t tiny">记录 assembler、tokenizer、压缩器、模型、Prompt、解码与判定器版本</text>
    <text x="814" y="403" class="t tiny">输出：OBSERVED 观测 / INFERRED 推断 / DECIDED 发布决策</text>
  </g>

  <path d="M232 272 L268 272" class="line"/>
  <path d="M486 272 L522 272" class="line"/>
  <path d="M740 272 L776 272" class="line"/>

  <g filter="url(#lcsm-shadow)">
    <rect x="42" y="474" width="1194" height="158" rx="16" fill="#ffffff" stroke="#b9c5d4"/>
    <text x="60" y="503" class="t box-title">⑤ 正交压力矩阵（每次保留基线对照；组合故障单独建组）</text>
    <g>
      <rect x="60" y="521" width="176" height="72" rx="10" fill="#e8f3ff" stroke="#82b4e8"/>
      <text x="74" y="545" class="t label">位置 Position</text><text x="74" y="567" class="t tiny">0/10/25/50/75/90/100%</text><text x="74" y="584" class="t tiny">证据与问题分别移动</text>
      <rect x="250" y="521" width="176" height="72" rx="10" fill="#fff0dc" stroke="#e8b25d"/>
      <text x="264" y="545" class="t label">长度 Length</text><text x="264" y="567" class="t tiny">业务分位 + 上限附近</text><text x="264" y="584" class="t tiny">按实际 tokenizer 计数</text>
      <rect x="440" y="521" width="176" height="72" rx="10" fill="#e8f8ef" stroke="#74be91"/>
      <text x="454" y="545" class="t label">密度 Density</text><text x="454" y="567" class="t tiny">相关 Token / 可见 Token</text><text x="454" y="584" class="t tiny">重复与硬干扰分开</text>
      <rect x="630" y="521" width="176" height="72" rx="10" fill="#f1eafd" stroke="#ad91d7"/>
      <text x="644" y="545" class="t label">多跳 Multi-hop</text><text x="644" y="567" class="t tiny">hop 数 · 跨距 · 分支</text><text x="644" y="584" class="t tiny">中间结论逐项判定</text>
      <rect x="820" y="521" width="176" height="72" rx="10" fill="#ffe9ed" stroke="#d88998"/>
      <text x="834" y="545" class="t label">冲突 Conflict</text><text x="834" y="567" class="t tiny">权威 · 时效 · 否定</text><text x="834" y="584" class="t tiny">同级未决不可猜测</text>
      <rect x="1010" y="521" width="208" height="72" rx="10" fill="#edf0f5" stroke="#9aa8bb"/>
      <text x="1024" y="545" class="t label">截断/压缩 Transform</text><text x="1024" y="567" class="t tiny">边界偏移 · 摘要遗漏</text><text x="1024" y="584" class="t tiny">原文、压缩、回源三轨对照</text>
    </g>
    <path d="M148 608 L1098 608" class="dash"/>
  </g>

  <g>
    <rect x="202" y="653" width="876" height="45" rx="22" fill="#203047"/>
    <text x="226" y="681" class="t label" fill="#fff">发布门禁：</text>
    <text x="318" y="681" class="t small" fill="#fff">关键切片有效上下文达标</text>
    <text x="507" y="681" class="t small" fill="#fff">→ 位置最差值达标</text>
    <text x="660" y="681" class="t small" fill="#fff">→ 冲突/时效零高危错选</text>
    <text x="862" y="681" class="t small" fill="#fff">→ 引用与回源完整</text>
  </g>
</svg>
