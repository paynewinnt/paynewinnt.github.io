<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 工具副作用隔离与故障注入矩阵</title>
  <desc id="desc">按读取、草稿、可逆写入、高风险不可逆写入四级副作用，展示授权、沙箱、网络出口、幂等、补偿、审批、观察和故障注入要求。</desc>
  <defs>
    <marker id="arrow4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <style>
      .h1{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#111827}
      .sub{font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#4b5563}
      .head{font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#fff}
      .row{font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#111827}
      .cell{font:400 12px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#374151}
      .small{font:600 11px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#4b5563}
      .flow{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow4)}
    </style>
  </defs>
  <rect width="1280" height="720" fill="#fafafa"/>
  <rect x="0" y="0" width="1280" height="8" fill="#b45309"/>
  <text x="48" y="55" class="h1">副作用隔离矩阵：风险越高，权限越窄，证据越强</text>
  <text x="48" y="82" class="sub">沙箱减少执行器能力，但不能替代业务授权；幂等减少重复提交，但不能把错误提交变成正确提交。</text>

  <rect x="44" y="116" width="1192" height="390" rx="8" fill="#fff" stroke="#d1d5db"/>
  <rect x="44" y="116" width="1192" height="54" rx="8" fill="#1f2937"/>
  <line x1="214" y1="116" x2="214" y2="506" stroke="#d1d5db"/><line x1="384" y1="116" x2="384" y2="506" stroke="#d1d5db"/>
  <line x1="554" y1="116" x2="554" y2="506" stroke="#d1d5db"/><line x1="724" y1="116" x2="724" y2="506" stroke="#d1d5db"/>
  <line x1="894" y1="116" x2="894" y2="506" stroke="#d1d5db"/><line x1="1064" y1="116" x2="1064" y2="506" stroke="#d1d5db"/>
  <text x="66" y="148" class="head">副作用等级</text><text x="234" y="148" class="head">授权与审批</text><text x="404" y="148" class="head">沙箱 / 出口</text>
  <text x="574" y="148" class="head">能力生命周期</text><text x="744" y="148" class="head">幂等 / 补偿</text><text x="914" y="148" class="head">观察与证据</text><text x="1084" y="148" class="head">必杀故障</text>

  <rect x="44" y="170" width="1192" height="84" fill="#f0fdf4"/>
  <line x1="44" y1="254" x2="1236" y2="254" stroke="#d1d5db"/>
  <text x="66" y="202" class="row">L0 纯读取</text><text x="66" y="225" class="small">查询已授权对象</text>
  <text x="234" y="202" class="cell">主体与资源检查</text><text x="234" y="224" class="cell">用途 / 字段级过滤</text>
  <text x="404" y="202" class="cell">只读文件系统</text><text x="404" y="224" class="cell">固定只读目标</text>
  <text x="574" y="202" class="cell">短时、窄 audience</text><text x="574" y="224" class="cell">允许有限复用</text>
  <text x="744" y="202" class="cell">请求去重</text><text x="744" y="224" class="cell">无业务补偿</text>
  <text x="914" y="202" class="cell">响应摘要、字段审计</text><text x="914" y="224" class="cell">拒绝率与越界尝试</text>
  <text x="1084" y="202" class="cell">跨租户读取</text><text x="1084" y="224" class="cell">出口改写</text>

  <rect x="44" y="254" width="1192" height="84" fill="#eff6ff"/>
  <line x1="44" y1="338" x2="1236" y2="338" stroke="#d1d5db"/>
  <text x="66" y="286" class="row">L1 本地草稿</text><text x="66" y="309" class="small">尚未发送外部</text>
  <text x="234" y="286" class="cell">动作和对象绑定</text><text x="234" y="308" class="cell">通常无需二次审批</text>
  <text x="404" y="286" class="cell">临时目录 / 配额</text><text x="404" y="308" class="cell">默认无网络</text>
  <text x="574" y="286" class="cell">单任务能力</text><text x="574" y="308" class="cell">任务结束即失效</text>
  <text x="744" y="286" class="cell">原子写 / 版本号</text><text x="744" y="308" class="cell">可丢弃草稿</text>
  <text x="914" y="286" class="cell">文件摘要、拥有者</text><text x="914" y="308" class="cell">未外发证明</text>
  <text x="1084" y="286" class="cell">路径穿越</text><text x="1084" y="308" class="cell">网络意外开启</text>

  <rect x="44" y="338" width="1192" height="84" fill="#fffbeb"/>
  <line x1="44" y1="422" x2="1236" y2="422" stroke="#d1d5db"/>
  <text x="66" y="370" class="row">L2 可逆写入</text><text x="66" y="393" class="small">状态可显式补偿</text>
  <text x="234" y="370" class="cell">逐次授权、参数摘要</text><text x="234" y="392" class="cell">风险条件触发审批</text>
  <text x="404" y="370" class="cell">目标 allowlist</text><text x="404" y="392" class="cell">方法 / 路径固定</text>
  <text x="574" y="370" class="cell">单次、短 TTL、可撤销</text><text x="574" y="392" class="cell">执行边界消费</text>
  <text x="744" y="370" class="cell">强制幂等键</text><text x="744" y="392" class="cell">补偿需新授权</text>
  <text x="914" y="370" class="cell">提交回执 + 读回</text><text x="914" y="392" class="cell">阶段时间线</text>
  <text x="1084" y="370" class="cell">回包前超时</text><text x="1084" y="392" class="cell">参数篡改 / 重放</text>

  <rect x="44" y="422" width="1192" height="84" fill="#fef2f2"/>
  <text x="66" y="454" class="row">L3 高风险提交</text><text x="66" y="477" class="small">资金、删除、发布</text>
  <text x="234" y="454" class="cell">明确人工审批</text><text x="234" y="476" class="cell">审批绑定最终摘要</text>
  <text x="404" y="454" class="cell">专用执行器</text><text x="404" y="476" class="cell">最窄出口与凭据</text>
  <text x="574" y="454" class="cell">一次能力、极短 TTL</text><text x="574" y="476" class="cell">不可委托 / 不可扩权</text>
  <text x="744" y="454" class="cell">业务唯一键、对账</text><text x="744" y="476" class="cell">补偿非等价回滚</text>
  <text x="914" y="454" class="cell">独立账本、双通道确认</text><text x="914" y="476" class="cell">unknown 立即冻结</text>
  <text x="1084" y="454" class="cell">审批后参数变化</text><text x="1084" y="476" class="cell">重复提交 / 假观察</text>

  <text x="48" y="550" style="font:700 18px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#111827">发布前故障注入链</text>
  <rect x="44" y="576" width="205" height="72" rx="8" fill="#e0e7ff" stroke="#4f46e5"/><text x="60" y="603" class="row">1 参数摘要篡改</text><text x="60" y="627" class="cell">能力必须在启动前拒绝</text>
  <rect x="286" y="576" width="205" height="72" rx="8" fill="#cffafe" stroke="#0891b2"/><text x="302" y="603" class="row">2 能力过期 / 重放</text><text x="302" y="627" class="cell">目标调用次数必须为 0</text>
  <rect x="528" y="576" width="205" height="72" rx="8" fill="#ffedd5" stroke="#ea580c"/><text x="544" y="603" class="row">3 出口策略失效</text><text x="544" y="627" class="cell">沙箱 deny 事件可审计</text>
  <rect x="770" y="576" width="205" height="72" rx="8" fill="#fee2e2" stroke="#dc2626"/><text x="786" y="603" class="row">4 提交后回包丢失</text><text x="786" y="627" class="cell">重试不得产生第二次提交</text>
  <rect x="1012" y="576" width="224" height="72" rx="8" fill="#f3e8ff" stroke="#7c3aed"/><text x="1028" y="603" class="row">5 观察器返回旧状态</text><text x="1028" y="627" class="cell">结果保持 unknown 并升级</text>
  <path d="M249 612 H278" class="flow"/><path d="M491 612 H520" class="flow"/><path d="M733 612 H762" class="flow"/><path d="M975 612 H1004" class="flow"/>
  <rect x="44" y="670" width="1192" height="28" rx="6" fill="#111827"/>
  <text x="60" y="689" style="font:400 12px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#e5e7eb">门禁要验证“故障真的杀死执行”，并核对 executor_started、target_accepted、business_committed、observed 四个独立事实。</text>
</svg>
