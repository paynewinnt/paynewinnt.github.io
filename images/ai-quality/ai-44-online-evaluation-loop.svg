<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 应用在线评测的证据闭环</title>
  <desc id="desc">展示生产事件经过评测契约、隐私最小化、抽样框与分层抽样，连接自动评测、人工反馈和延迟真值，再以覆盖率、业务验收率和延迟标签完整率驱动继续、灰度、暂停或回滚，并将事故样本回放到离线评测。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#be123c"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}.title{font:700 32px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.sub{font:400 17px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}.h{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.t{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#334155}.small{font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.arrow{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}.feedback{fill:none;stroke:#be123c;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#arrowRed)}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <rect width="1280" height="106" fill="#ffffff"/>
  <line x1="0" y1="105" x2="1280" y2="105" stroke="#dbe4ec" stroke-width="2"/>
  <text class="title" x="48" y="46">在线评测不是一张质量看板，而是一条可回放的证据闭环</text>
  <text class="sub" x="48" y="77">每个比例都绑定目标总体、纳入概率、成熟窗口和版本；观测先进入证据层，再由责任人作发布决策。</text>

  <rect x="48" y="136" width="188" height="332" rx="7" fill="#eaf4ff" stroke="#3b82f6" stroke-width="2"/>
  <text class="h" x="68" y="168">1. 生产事件</text>
  <rect class="box" x="68" y="190" width="148" height="58" rx="6"/>
  <text class="t" x="84" y="216">request / run</text><text class="small" x="84" y="237">attempt 不覆盖</text>
  <rect class="box" x="68" y="264" width="148" height="58" rx="6"/>
  <text class="t" x="84" y="290">task / outcome</text><text class="small" x="84" y="311">业务单位去重</text>
  <rect class="box" x="68" y="338" width="148" height="58" rx="6"/>
  <text class="t" x="84" y="364">版本与 Trace</text><text class="small" x="84" y="385">模型 · Prompt · 知识</text>
  <text class="small" x="68" y="428">先记入 admitted 总数</text>
  <text class="small" x="68" y="449">缺失事件也要显式计数</text>

  <path class="arrow" d="M236 302 L264 302"/>
  <rect x="268" y="136" width="206" height="332" rx="7" fill="#f2edfa" stroke="#8b5cf6" stroke-width="2"/>
  <text class="h" x="288" y="168">2. 契约与隐私</text>
  <rect class="box" x="288" y="190" width="166" height="74" rx="6"/>
  <text class="t" x="304" y="216">评测单位与总体</text><text class="small" x="304" y="239">窗口 · 分层 · 阈值</text><text class="small" x="304" y="257">owner · 决策动作</text>
  <rect class="box" x="288" y="280" width="166" height="74" rx="6"/>
  <text class="t" x="304" y="306">字段最小化</text><text class="small" x="304" y="329">用途 · 驻留 · TTL</text><text class="small" x="304" y="347">访问与删除传播</text>
  <rect class="box" x="288" y="370" width="166" height="58" rx="6"/>
  <text class="t" x="304" y="396">契约校验失败</text><text class="small" x="304" y="417">隔离，不静默丢弃</text>

  <path class="arrow" d="M474 302 L502 302"/>
  <rect x="506" y="136" width="238" height="332" rx="7" fill="#fff7df" stroke="#d97706" stroke-width="2"/>
  <text class="h" x="526" y="168">3. 抽样框与选择器</text>
  <rect class="box" x="526" y="190" width="198" height="58" rx="6"/>
  <text class="t" x="542" y="216">去重 sampling frame</text><text class="small" x="542" y="237">eligible 与 opt-out 分开</text>
  <rect class="box" x="526" y="264" width="198" height="74" rx="6"/>
  <text class="t" x="542" y="290">分层 + 保留样本</text><text class="small" x="542" y="313">风险 · 语言 · 租户 · 路由</text><text class="small" x="542" y="331">记录 inclusion probability</text>
  <rect class="box" x="526" y="354" width="198" height="74" rx="6"/>
  <text class="t" x="542" y="380">强制事故样本</text><text class="small" x="542" y="403">用于排查，不混入总体估计</text><text class="small" x="542" y="421">随机保留组持续存在</text>

  <path class="arrow" d="M744 302 L772 302"/>
  <rect x="776" y="136" width="218" height="332" rx="7" fill="#eaf8ef" stroke="#16a34a" stroke-width="2"/>
  <text class="h" x="796" y="168">4. 证据与联结</text>
  <rect class="box" x="796" y="190" width="178" height="58" rx="6"/>
  <text class="t" x="812" y="216">自动检查 / Judge</text><text class="small" x="812" y="237">弱标签必须标来源</text>
  <rect class="box" x="796" y="264" width="178" height="58" rx="6"/>
  <text class="t" x="812" y="290">盲审与反馈去噪</text><text class="small" x="812" y="311">冲突 · 申诉 · 裁决</text>
  <rect class="box" x="796" y="338" width="178" height="58" rx="6"/>
  <text class="t" x="812" y="364">延迟真值 Join</text><text class="small" x="812" y="385">due_at · as_of · revision</text>
  <text class="small" x="796" y="428">原始证据不可改写</text>
  <text class="small" x="796" y="449">结论允许版本化更正</text>

  <path class="arrow" d="M994 302 L1022 302"/>
  <rect x="1026" y="136" width="206" height="332" rx="7" fill="#fff0f2" stroke="#e11d48" stroke-width="2"/>
  <text class="h" x="1046" y="168">5. 门禁与行动</text>
  <rect class="box" x="1046" y="190" width="166" height="58" rx="6"/>
  <text class="t" x="1062" y="216">证据充分性</text><text class="small" x="1062" y="237">完整率与不确定性</text>
  <rect x="1046" y="264" width="78" height="54" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text class="t" x="1064" y="297">继续</text>
  <rect x="1134" y="264" width="78" height="54" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text class="t" x="1152" y="297">灰度</text>
  <rect x="1046" y="332" width="78" height="54" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text class="t" x="1064" y="365">暂停</text>
  <rect x="1134" y="332" width="78" height="54" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text class="t" x="1152" y="365">回滚</text>
  <text class="small" x="1046" y="416">观测 ≠ 根因</text>
  <text class="small" x="1046" y="439">推断需实验或回放补证</text>

  <path class="feedback" d="M1128 468 L1128 500 L370 500 L370 468"/>
  <text class="small" x="616" y="493" fill="#9f1239">事故与盲点回流：更新契约、离线集、分层和故障注入；保留原版本以便重算</text>

  <rect x="48" y="540" width="1184" height="132" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="h" x="70" y="570">三个必须分开报告的分母</text>
  <rect x="70" y="590" width="350" height="58" rx="6" fill="#eaf4ff" stroke="#3b82f6"/>
  <text class="t" x="88" y="614">Frame coverage = 有效唯一框记录 / 应纳入生产单位</text>
  <text class="small" x="88" y="638">回答“有没有看见目标总体”</text>
  <path class="arrow" d="M420 619 L446 619"/>
  <rect x="450" y="590" width="350" height="58" rx="6" fill="#eaf8ef" stroke="#16a34a"/>
  <text class="t" x="468" y="614">Acceptance = 加权验收通过 / 加权成熟且有真值</text>
  <text class="small" x="468" y="638">回答“已知真值的业务结果怎样”</text>
  <path class="arrow" d="M800 619 L826 619"/>
  <rect x="830" y="590" width="380" height="58" rx="6" fill="#fff7df" stroke="#d97706"/>
  <text class="t" x="848" y="614">Delayed-label completeness = 到达真值 / 截止时已到期样本</text>
  <text class="small" x="848" y="638">回答“成熟标签是否缺失”，未到期不进分母</text>
</svg>
