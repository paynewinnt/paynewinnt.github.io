<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img" aria-labelledby="title desc">
  <title id="title">Prompt 从源码到生产回滚的完整生命周期</title>
  <desc id="desc">展示 Prompt 包从源码、确定性构建、语义评审、离线回归、制品登记、灰度发布到生产观测和按指纹回滚的闭环。</desc>
  <style>
    .bg { fill: #f8fafc; }
    .title { font: 700 32px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
    .sub { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
    .h { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
    .t { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
    .small { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .source { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .build { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; }
    .review { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
    .test { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
    .artifact { fill: #fefce8; stroke: #ca8a04; stroke-width: 2; }
    .canary { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
    .prod { fill: #f0fdf4; stroke: #15803d; stroke-width: 2.5; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
    .arrow { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    .trace { stroke: #0f766e; stroke-width: 2.5; fill: none; stroke-dasharray: 7 5; marker-end: url(#trace); }
    .rollback { stroke: #e11d48; stroke-width: 3; fill: none; stroke-dasharray: 9 6; marker-end: url(#red); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <marker id="trace" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f766e"/></marker>
    <marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#e11d48"/></marker>
  </defs>
  <rect class="bg" width="1280" height="780"/>
  <text class="title" x="54" y="58">Prompt-as-code：测试对象、发布对象和回滚对象必须是同一份产物</text>
  <text class="sub" x="54" y="90">人类版本号用于沟通，源码修订用于追责，规范化内容指纹用于贯穿构建、测试、灰度与生产。</text>

  <rect class="source" x="54" y="156" width="146" height="128" rx="8"/>
  <text class="h" x="76" y="190">1. Prompt 源码</text>
  <text class="t" x="76" y="218">模板 / 变量契约</text>
  <text class="t" x="76" y="241">示例 / 工具 / 契约</text>
  <text class="small" x="76" y="266" fill="#1d4ed8">source revision</text>
  <path class="arrow" d="M200 220 L212 220"/>

  <rect class="build" x="216" y="156" width="146" height="128" rx="8"/>
  <text class="h" x="238" y="190">2. 确定性构建</text>
  <text class="t" x="238" y="218">严格渲染 / 规范化</text>
  <text class="t" x="238" y="241">静态扫描 / 预算检查</text>
  <text class="small" x="238" y="266" fill="#0e7490">build twice = same</text>
  <path class="arrow" d="M362 220 L374 220"/>

  <rect class="review" x="378" y="156" width="146" height="128" rx="8"/>
  <text class="h" x="400" y="190">3. 语义评审</text>
  <text class="t" x="400" y="218">文本与契约 diff</text>
  <text class="t" x="400" y="241">渲染快照 / 风险人</text>
  <text class="small" x="400" y="266" fill="#6d28d9">review evidence</text>
  <path class="arrow" d="M524 220 L536 220"/>

  <rect class="test" x="540" y="156" width="146" height="128" rx="8"/>
  <text class="h" x="562" y="190">4. 离线回归</text>
  <text class="t" x="562" y="218">契约 / 行为 / 安全</text>
  <text class="t" x="562" y="241">集成与历史事故集</text>
  <text class="small" x="562" y="266" fill="#c2410c">sample evidence</text>
  <path class="arrow" d="M686 220 L698 220"/>

  <rect class="artifact" x="702" y="156" width="146" height="128" rx="8"/>
  <text class="h" x="724" y="190">5. 制品登记</text>
  <text class="t" x="724" y="218">不可变内容与依赖</text>
  <text class="t" x="724" y="241">签名 / 审批 / 回滚点</text>
  <text class="small" x="724" y="266" fill="#a16207">artifact SHA-256</text>
  <path class="arrow" d="M848 220 L860 220"/>

  <rect class="canary" x="864" y="156" width="146" height="128" rx="8"/>
  <text class="h" x="886" y="190">6. 影子与灰度</text>
  <text class="t" x="886" y="218">稳定分桶 / 指纹路由</text>
  <text class="t" x="886" y="241">硬护栏 / 观察窗口</text>
  <text class="small" x="886" y="266" fill="#047857">基线 / 候选指纹</text>
  <path class="arrow" d="M1010 220 L1022 220"/>

  <rect class="prod" x="1026" y="156" width="200" height="128" rx="8"/>
  <text class="h" x="1048" y="190">7. 生产与持续观测</text>
  <text class="t" x="1048" y="218">质量 / 工具 / 成本 / 时延</text>
  <text class="t" x="1048" y="241">请求 Trace 记录产物指纹</text>
  <text class="small" x="1048" y="266" fill="#15803d">runtime evidence</text>

  <rect class="panel" x="54" y="356" width="556" height="230" rx="8"/>
  <text class="h" x="82" y="392">三个标识各自回答一个问题</text>
  <rect x="82" y="418" width="152" height="128" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text class="h" x="100" y="449">版本号</text>
  <text class="t" x="100" y="477">2.3.0</text>
  <text class="t" x="100" y="504">表达兼容性</text>
  <text class="small" x="100" y="529" fill="#1d4ed8">给人读</text>
  <rect x="254" y="418" width="152" height="128" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text class="h" x="272" y="449">源码修订</text>
  <text class="t" x="272" y="477">Git commit</text>
  <text class="t" x="272" y="504">追踪改动与作者</text>
  <text class="small" x="272" y="529" fill="#6d28d9">给评审读</text>
  <rect x="426" y="418" width="156" height="128" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text class="h" x="444" y="449">内容指纹</text>
  <text class="t" x="444" y="477">sha256:a97e...</text>
  <text class="t" x="444" y="504">核对真实产物</text>
  <text class="small" x="444" y="529" fill="#047857">给系统校验</text>

  <rect class="panel" x="642" y="356" width="584" height="230" rx="8"/>
  <text class="h" x="670" y="392">生产异常后的恢复闭环</text>
  <rect x="670" y="424" width="156" height="92" rx="8" fill="#fff1f2" stroke="#fda4af"/>
  <text class="h" x="690" y="455">护栏触发</text>
  <text class="t" x="690" y="482">保留首错与时间线</text>
  <path class="arrow" d="M826 470 L862 470"/>
  <rect x="866" y="424" width="156" height="92" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text class="h" x="886" y="455">停止候选分流</text>
  <text class="t" x="886" y="482">处理会话与异步任务</text>
  <path class="arrow" d="M1022 470 L1058 470"/>
  <rect x="1062" y="424" width="136" height="92" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text class="h" x="1082" y="455">恢复稳定指纹</text>
  <text class="t" x="1082" y="482">验证依赖兼容</text>
  <path class="trace" d="M1130 516 C1130 560 740 560 740 516"/>

  <path class="rollback" d="M1126 284 C1126 330 775 320 775 292"/>
  <text class="small" x="885" y="327" fill="#be123c">按已验证指纹回滚，不在现场手改文本</text>

  <rect x="54" y="632" width="1172" height="76" rx="8" fill="#0f172a"/>
  <text x="82" y="663" style="font: 700 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #ffffff;">不可变证据链</text>
  <text x="82" y="690" style="font: 400 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #dbeafe;">源码 revision → 规范化指纹 → 样本级测试 → 审批 → 灰度路由 → 请求 Trace → 回滚事件</text>
  <text class="sub" x="54" y="750">任何线上请求都应能反查：用的哪份 Prompt 包、依赖什么、经过哪些门禁、失败后回到哪里。</text>
</svg>
