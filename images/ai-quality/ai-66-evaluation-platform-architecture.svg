<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">企业级 AI 评测平台三平面架构</title>
  <desc id="desc">展示控制面、隔离执行面、证据与决策面之间的对象流、信任边界和发布门禁。</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fa; }
      .band { fill: #ffffff; stroke: #c7ced8; stroke-width: 2; }
      .control { fill: #e7f0ff; stroke: #3569a8; stroke-width: 2; }
      .run { fill: #e8f6ef; stroke: #287a57; stroke-width: 2; }
      .evidence { fill: #fff3d6; stroke: #a56a00; stroke-width: 2; }
      .guard { fill: #fde8e7; stroke: #a73e36; stroke-width: 2; }
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17202a; }
      .subtitle { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b5563; }
      .lane { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2937; }
      .box-title { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17202a; }
      .text { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #344054; }
      .small { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5b2d28; }
      .arrow { stroke: #526273; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #8a96a3; stroke-width: 2; stroke-dasharray: 7 6; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#526273"/>
    </marker>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="52" y="52">企业级 AI 评测平台：对象先冻结，任务再执行，证据后决策</text>
  <text class="subtitle" x="52" y="82">一次 Run 只引用不可变版本；Runner 不拥有发布权；Gate 不从临时查询结果猜结论</text>

  <rect class="band" x="40" y="112" width="1200" height="158" rx="8"/>
  <text class="lane" x="62" y="142">控制面</text>
  <rect class="control" x="170" y="132" width="210" height="108" rx="6"/>
  <text class="box-title" x="190" y="164">Dataset Registry</text>
  <text class="text" x="190" y="190">Snapshot / Split / ACL</text>
  <text class="text" x="190" y="214">内容摘要与血缘</text>
  <rect class="control" x="430" y="132" width="210" height="108" rx="6"/>
  <text class="box-title" x="450" y="164">Run API</text>
  <text class="text" x="450" y="190">版本组合与幂等键</text>
  <text class="text" x="450" y="214">租户配额与优先级</text>
  <rect class="control" x="690" y="132" width="210" height="108" rx="6"/>
  <text class="box-title" x="710" y="164">Policy Registry</text>
  <text class="text" x="710" y="190">指标、Slice、Gate</text>
  <text class="text" x="710" y="214">豁免与审批版本</text>
  <rect class="guard" x="950" y="132" width="240" height="108" rx="6"/>
  <text class="box-title" x="970" y="164">IAM / Secret Broker</text>
  <text class="text" x="970" y="190">RBAC + Tenant Scope</text>
  <text class="text" x="970" y="214">短期凭据，不进入 Trace</text>

  <rect class="band" x="40" y="292" width="1200" height="170" rx="8"/>
  <text class="lane" x="62" y="322">隔离执行面</text>
  <rect class="run" x="170" y="316" width="210" height="118" rx="6"/>
  <text class="box-title" x="190" y="348">Queue / Lease</text>
  <text class="text" x="190" y="374">公平队列与租户上限</text>
  <text class="text" x="190" y="398">超时回收，不复制任务</text>
  <rect class="run" x="430" y="316" width="210" height="118" rx="6"/>
  <text class="box-title" x="450" y="348">Sandbox Runner</text>
  <text class="text" x="450" y="374">只读 Snapshot</text>
  <text class="text" x="450" y="398">重试沿用调用幂等键</text>
  <rect class="run" x="690" y="316" width="210" height="118" rx="6"/>
  <text class="box-title" x="710" y="348">Provider Adapter</text>
  <text class="text" x="710" y="374">模型 / Judge / Tool</text>
  <text class="text" x="710" y="398">统一错误与用量口径</text>
  <rect class="guard" x="950" y="316" width="240" height="118" rx="6"/>
  <text class="box-title" x="970" y="348">网络与副作用边界</text>
  <text class="text" x="970" y="374">默认拒绝外连与写操作</text>
  <text class="text" x="970" y="398">CPU / 内存 / 时限配额</text>

  <rect class="band" x="40" y="484" width="1200" height="178" rx="8"/>
  <text class="lane" x="62" y="514">证据与决策面</text>
  <rect class="evidence" x="170" y="510" width="210" height="122" rx="6"/>
  <text class="box-title" x="190" y="542">Trace Store</text>
  <text class="text" x="190" y="568">Attempt / Span / 版本</text>
  <text class="text" x="190" y="592">内容引用，不默认存原文</text>
  <rect class="evidence" x="430" y="510" width="210" height="122" rx="6"/>
  <text class="box-title" x="450" y="542">Metric Aggregator</text>
  <text class="text" x="450" y="568">分母、区间、Slice</text>
  <text class="text" x="450" y="592">Candidate 与 Baseline 配对</text>
  <rect class="evidence" x="690" y="510" width="210" height="122" rx="6"/>
  <text class="box-title" x="710" y="542">Gate Engine</text>
  <text class="text" x="710" y="568">PASS / BLOCK / UNKNOWN</text>
  <text class="text" x="710" y="592">硬底线先于平均分</text>
  <rect class="evidence" x="950" y="510" width="240" height="122" rx="6"/>
  <text class="box-title" x="970" y="542">Signed Evidence Export</text>
  <text class="text" x="970" y="568">Manifest / 缺口 / 审批</text>
  <text class="text" x="970" y="592">供发布与调查独立复核</text>

  <path class="arrow" d="M380 186 H425"/>
  <path class="arrow" d="M640 186 H685"/>
  <path class="arrow" d="M535 240 V310"/>
  <path class="arrow" d="M380 375 H425"/>
  <path class="arrow" d="M640 375 H685"/>
  <path class="arrow" d="M900 375 H945"/>
  <path class="arrow" d="M535 434 V504"/>
  <path class="arrow" d="M380 571 H425"/>
  <path class="arrow" d="M640 571 H685"/>
  <path class="arrow" d="M900 571 H945"/>
  <path class="dash" d="M1070 240 V310"/>
  <text class="small" x="1000" y="286">身份与秘密按调用授权</text>
  <text class="subtitle" x="52" y="698">信任边界：Registry 证明“引用了什么”，Runner 证明“尝试了什么”，Gate 只对可验证分母作结论</text>
</svg>
